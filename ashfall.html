<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ashfall Prototype</title>
<style>
  :root{
    --bg:#111315; --panel:#1b1e22; --panel-2:#20242a; --line:#33383f;
    --ink:#e5e5e0; --ink-dim:#9a9fa6; --ink-faint:#888e97;
    --accent:#3b82f6; --accent-dim:#25508f; --warn:#d97b3f; --danger:#c76552; --good:#7a9463;
  }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:Georgia,'Times New Roman',serif; display:flex; flex-direction:column; }
  header{ display:flex; align-items:center; gap:14px; padding:12px 24px; border-bottom:1px solid var(--line); font-family:system-ui,sans-serif; }
  header h1{ font-size:13px; margin:0; letter-spacing:.04em; }
  #menuToggle{ background:var(--panel-2); border:1px solid var(--line); color:var(--ink); font-size:12px; padding:6px 10px; border-radius:3px; cursor:pointer; }
  #menuToggle:hover{ border-color:var(--accent-dim); }
  #menuBackdrop{ position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:15; display:none; }
  #menuBackdrop.show{ display:block; }
  #sideMenu{ position:fixed; top:0; left:0; height:100%; width:460px; max-width:92vw; background:var(--panel);
    border-right:1px solid var(--line); transform:translateX(-100%); transition:transform .22s ease;
    z-index:20; padding:20px 18px; display:flex; flex-direction:column; gap:16px; font-family:system-ui,sans-serif; overflow-y:auto; }
  #sideMenu.open{ transform:translateX(0); }
  #sideMenu h2{ font-size:14px; margin:0; display:flex; justify-content:space-between; align-items:center; }
  #closeMenu, .panel-close{ background:none; border:none; color:var(--ink-dim); font-size:16px; cursor:pointer; }
  /* The drawer's hub row: one button per sub-menu, built from HUB_BUTTONS.
     A placeholder is disabled and carries its "Not yet" hint on a second
     line, the way a blocked recipe carries its (needs …). */
  #hubRow{ display:flex; gap:6px; }
  #hubRow button{ flex:1; background:var(--panel-2); border:1px solid var(--line); color:var(--ink);
    font-size:12px; padding:7px 6px; border-radius:3px; cursor:pointer; }
  #hubRow button:hover:not(:disabled){ border-color:var(--accent-dim); }
  #hubRow button:disabled{ color:var(--ink-faint); cursor:not-allowed; opacity:.6; }
  #hubRow .hint{ display:block; font-size:11px; font-style:italic; margin-top:2px; }
  /* A full-screen panel (Crafting, Options) stacked over the
     drawer. Above #sideMenu's 20, so it covers the drawer and its backdrop. */
  .full-panel{ position:fixed; inset:0; z-index:30; background:var(--panel); padding:20px 18px;
    overflow-y:auto; font-family:system-ui,sans-serif; display:none; }
  .full-panel.open{ display:block; }
  .full-panel > h2{ font-size:14px; margin:0 0 16px; display:flex; justify-content:space-between; align-items:center; }
  .full-panel-body{ max-width:560px; display:flex; flex-direction:column; gap:16px; }
  #craftingList{ display:flex; flex-direction:column; align-items:flex-start; gap:8px; }
  /* The Crafting panel's search and filters, above the list. The group
     buttons wrap, so the row holds at phone width. */
  #craftFilters{ display:flex; flex-direction:column; gap:8px; }
  #craftSearch{ font:inherit; font-size:13px; background:var(--panel-2); border:1px solid var(--line); color:var(--ink);
    padding:6px 8px; border-radius:3px; width:100%; }
  #craftGroups{ display:flex; flex-wrap:wrap; gap:5px; }
  #craftGroups button{ font-size:12px; background:var(--panel-2); border:1px solid var(--line); color:var(--ink-dim);
    padding:4px 9px; min-height:24px; border-radius:3px; cursor:pointer; }
  #craftGroups button.active{ border-color:var(--accent); color:var(--accent); }
  #craftCanMakeLabel{ font-size:12px; color:var(--ink-dim); display:flex; align-items:center; gap:6px; cursor:pointer; }
  .craft-empty{ color:var(--ink-faint); font-size:12px; }
  /* A Dishes row: the dish and what it needs, with Add ingredients beside
     it when there is something to add. Wraps at phone width. */
  .dish-row{ display:flex; flex-wrap:wrap; align-items:center; gap:4px 8px; font-size:12px; color:var(--ink);
    padding:5px 9px; border:1px solid var(--line); border-radius:3px; background:var(--panel-2); }
  .dish-row .cost{ color:var(--ink-faint); font-size:11px; }
  /* A panel's result area (Crafting's #craftResult). The body face, which
     the panel's system-ui would otherwise replace: its lines are #log's,
     set as #log sets them. */
  .log-result{ display:flex; flex-direction:column; gap:5px; border-top:1px solid var(--line); padding-top:12px;
    font-family:Georgia,'Times New Roman',serif; }
  .log-result:empty{ display:none; }
  #seedRow{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--ink-dim); }
  .full-panel .menu-actions{ align-items:flex-start; }
  #seedValue{ color:var(--ink); user-select:all; -webkit-user-select:all; }
  /* A pop-up (the item pop-up, #itemPop, and the device pop-up, #devicePop)
     and the transparent layer behind each that takes an outside tap. Both
     sit below #menuBackdrop's 15: a pop-up belongs to the play area, and
     opening the drawer covers it rather than closing it. */
  .pop-backdrop{ position:fixed; inset:0; z-index:10; display:none; }
  .pop-backdrop.show{ display:block; }
  .pop{ position:fixed; z-index:11; display:none; background:var(--panel); border:1px solid var(--line);
    border-radius:4px; padding:11px 13px; font-family:system-ui,sans-serif; overflow-y:auto;
    box-shadow:0 6px 18px rgba(0,0,0,.45); }
  .pop.open{ display:block; }
  .pop-actions{ display:flex; flex-direction:column; align-items:stretch; gap:6px; }
  .pop-actions button.action{ text-align:left; }
  /* The stove timer's add buttons, side by side in the device pop-up,
     sharing the row evenly so all three fit it at phone width. */
  .timer-steps{ display:flex; gap:6px; }
  .timer-steps button.action{ flex:1 1 0; min-width:0; padding-left:0; padding-right:0; text-align:center; }
  /* Focus is drawn for keyboard use only, so a click or a tap looks as it
     always has even now that opening and closing a layer moves focus. A
     layer's own root is focusable only as the last place focus can land,
     and never draws a ring. */
  :focus:not(:focus-visible){ outline:none; }
  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  [tabindex="-1"]:focus{ outline:none; }
  .menu-section h3{ font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint); margin:0 0 8px; }
  .menu-actions{ display:flex; flex-direction:column; gap:6px; }
  .menu-actions button{ background:var(--panel-2); border:1px solid var(--line); color:var(--ink);
    font-size:12px; padding:7px 9px; border-radius:3px; cursor:pointer; text-align:left; }
  .menu-actions button:hover{ border-color:var(--accent-dim); }
  #statsBox{ font-size:13px; color:var(--ink-dim); line-height:1.9; }
  /* The heading row, not the heading: #mapZoomToggle is a <div> and is not
     legal inside an <h3>, so the flex row is a wrapper around both. The
     8px below the heading moves here with it — inside a flex row the h3's
     own margin no longer reaches the map. */
  .map-heading{ display:flex; justify-content:space-between; align-items:center; margin:0 0 8px; }
  .map-heading h3{ margin:0; }
  #mapZoomToggle{ display:flex; gap:5px; }
  #mapZoomToggle button{ font-family:system-ui,sans-serif; font-size:12px; background:var(--panel-2);
    border:1px solid var(--line); color:var(--ink-dim); padding:4px 9px; border-radius:3px; cursor:pointer; }
  #mapZoomToggle button.active{ border-color:var(--accent); color:var(--accent); }
  #mapZoomToggle button:disabled{ opacity:.4; cursor:not-allowed; }
  #mapSvg{ width:100%; height:auto; display:block; background:var(--panel-2); border-radius:3px; margin-top:8px; }
  .map-street{ stroke:var(--line); stroke-width:3; fill:none; }
  .map-street-thin{ stroke:var(--line); stroke-width:1.5; opacity:.6; fill:none; }
  .map-node-dot{ fill:var(--ink-faint); }
  .map-street-name{ fill:var(--ink-dim); font-size:15px; font-family:system-ui,sans-serif; letter-spacing:.5px; font-weight:600; }
  .map-bldg-dot{ fill:var(--panel-2); stroke:var(--accent-dim); stroke-width:1.5; }
  .map-bldg-label{ fill:var(--ink); font-size:10px; font-weight:600; font-family:system-ui,sans-serif; }
  .map-river{ fill:none; stroke:#2a4a5c; stroke-width:10; stroke-linecap:round; opacity:.5; }
  #mapPlayer{ fill:var(--accent); }
  #locBar{ padding:10px 24px; border-bottom:1px solid var(--line); font-family:system-ui,sans-serif;
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
  #locLabel{ font-size:12px; color:var(--accent); }
  #rightBar{ display:flex; gap:16px; align-items:center; }
  #clockLabel{ font-size:12px; color:var(--ink-dim); }
  #gaitBar{ display:flex; gap:6px; align-items:center; }
  #gaitBar span{ font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em; }
  #gaitBar button{ font-family:system-ui,sans-serif; font-size:12px; background:var(--panel-2);
    border:1px solid var(--line); color:var(--ink-dim); padding:4px 8px; min-height:24px; border-radius:3px; cursor:pointer; }
  #gaitBar button.active{ border-color:var(--accent); color:var(--accent); }
  #gaitBar button:disabled{ opacity:.4; cursor:not-allowed; }
  /* Landscape is three columns: the text takes the left half, and the
     sidebar's two panels share the right half, text | Inventory | Here in
     DOM order. The portrait query below overrides only what differs there.
     The 50 / 50 split of main, the sidebar's 8px gaps and the panels' 10px
     9px padding are judgment calls and retunable. */
  main{ flex:1; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); }
  #left{ padding:18px 26px; border-right:1px solid var(--line); display:flex; flex-direction:column; gap:14px; }
  #roomDesc{ color:var(--ink-dim); line-height:1.4; margin:0; font-size:12px; }
  #log{ display:flex; flex-direction:column; gap:5px; max-height:110px; overflow-y:auto; }
  /* A .log-result is a view of #log (see renderLogResult()), so its lines
     read exactly as they do there. */
  #log p, .log-result p{ margin:0; font-size:12px; line-height:1.35; color:var(--ink-dim); }
  #log p.fresh, .log-result p.fresh{ color:var(--ink); }
  #log p.sys, .log-result p.sys{ font-style:italic; color:var(--accent); font-family:system-ui,sans-serif; font-size:12px; }
  #log p.warn, .log-result p.warn{ color:var(--warn); font-family:system-ui,sans-serif; font-size:12px; }
  #log p.good, .log-result p.good{ color:var(--good); font-family:system-ui,sans-serif; font-size:12px; }
  .logcount{ color:var(--ink-faint); font-size:12px; margin-left:5px; }
  .actions-group h2{ font-family:system-ui,sans-serif; font-size:11px; text-transform:uppercase;
    letter-spacing:.08em; color:var(--ink-faint); margin:0 0 8px; }
  .actions{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:12px; }
  button.action{ font-family:system-ui,sans-serif; font-size:12px; background:var(--panel-2);
    border:1px solid var(--line); color:var(--ink); padding:5px 9px; min-height:24px; border-radius:3px; cursor:pointer; }
  button.action:hover{ border-color:var(--accent-dim); background:#232a33; }
  button.action .cost{ color:var(--ink-faint); font-size:11px; margin-left:3px; }
  button.action.locked{ border-color:var(--danger); color:var(--danger); }
  button.action.blocked{ border-color:var(--danger); color:var(--danger); cursor:not-allowed; }
  /* The control that opens item detail. It is a <button> because that is what
     it does; the weight and colour it used to inherit from
     `ul.itemlist .meta b` live here now, along with the reset a button needs
     to sit inline in a sentence. The padding/negative-margin pair is the tap
     target: the padded box overlaps the row's own padding instead of adding
     to it, so the row height is unchanged. Both it and the :active colour are
     judgment calls, retunable. */
  .itemname{ background:none; border:none; font:inherit; color:var(--ink); font-weight:600;
    padding:6px 2px; margin:-6px -2px; cursor:pointer; text-align:left; }
  .itemname:active{ color:var(--accent); }
  .detailBox{ font-size:12px; color:var(--ink-dim); margin-bottom:10px; line-height:1.7; }
  .detailBox b{ color:var(--ink); }
  #sidebar{ padding:10px 8px; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:8px; font-family:system-ui,sans-serif; overflow-y:auto; }
  /* The panels' min-width:0 is load-bearing: a grid item's automatic
     minimum width is its content's min-content width, and a tab row that
     doesn't wrap would widen its panel past its column. */
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:10px 9px;
    display:flex; flex-direction:column; min-width:0; }
  /* A panel's tabs are one row that scrolls sideways. The fade at the right
     edge is always on: it is the only sign that more tabs are off to the
     right. Its 80% stop is a judgment call, retunable. After every render
     the selected tab is scrolled fully into view (see revealActiveTab()). */
  .tabs{ display:flex; gap:5px; margin-bottom:9px; flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none;
    -webkit-mask-image:linear-gradient(to right, #000 80%, transparent); mask-image:linear-gradient(to right, #000 80%, transparent); }
  .tabs::-webkit-scrollbar{ display:none; }
  .tabs button{ font-size:12px; background:var(--panel-2); border:1px solid var(--line); color:var(--ink-dim);
    padding:4px 8px; min-height:24px; border-radius:3px; cursor:pointer; flex:none; white-space:nowrap; }
  .tabs button.active{ border-color:var(--accent); color:var(--accent); }
  /* An item panel's header holds its title and its weight, and nothing
     else, so the tabs under it never move when the tab changes (#229). The
     weight never breaks inside itself; on a narrow panel it wraps whole onto
     a second line. The header is always two lines tall, so a weight that
     wraps on one tab and fits on the next moves nothing: one line sits
     centred in the space two would take. The 15px line is set here rather
     than left to the font, so the height is exact. */
  .panel h2{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint);
    margin:0 0 8px; display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:2px 6px;
    line-height:15px; height:calc(2 * 15px + 2px); align-content:center; }
  .panel h2 .sub{ color:var(--ink-dim); text-transform:none; letter-spacing:0; font-size:12px; white-space:nowrap; }
  /* The strip under an item panel's tabs: what comes and goes with the
     selected tab, the stove's state and Device Options on the Here side,
     Unequip on the Inventory side. Hidden, it takes no space, so the list
     sits where it always has; shown, it moves the list down and never the
     tabs. */
  .tab-strip{ display:flex; flex-wrap:wrap; justify-content:flex-end; align-items:center; gap:4px 6px;
    margin-bottom:9px; font-size:12px; color:var(--ink-dim); }
  .tab-strip > span{ white-space:nowrap; }
  ul.itemlist{ list-style:none; margin:0; padding:0; }
  ul.itemlist li{ display:flex; justify-content:space-between; align-items:center; gap:6px;
    padding:6px 0; border-bottom:1px solid rgba(51,56,63,.6); font-size:12px; }
  ul.itemlist li:last-child{ border-bottom:none; }
  ul.itemlist .meta{ color:var(--ink-dim); flex:1; }
  ul.itemlist .cat{ color:var(--ink-faint); font-size:12px; }
  ul.itemlist .state{ color:var(--ink-dim); }
  ul.itemlist .empty{ color:var(--ink-faint); font-style:italic; }
  .btnrow{ display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
  button.mini{ background:#262a30; border:1px solid var(--line); color:var(--ink); font-size:12px;
    padding:4px 7px; min-height:24px; border-radius:3px; cursor:pointer; white-space:nowrap; }
  button.mini:hover{ border-color:var(--accent-dim); }
  button.mini.equip{ border-color:var(--good); color:var(--good); }
  button.mini.blocked{ border-color:var(--danger); color:var(--danger); cursor:not-allowed; }
  /* One column when the viewport is portrait, the way a phone is held: the
     text on top, the two panels side by side under it. Landscape keeps the
     base rules' three columns. A desktop window taller than it is wide takes
     the one column too, by design (#159). The second clause is a floor:
     below 480px the three landscape columns get too narrow, so a landscape
     window narrower than that takes the one column as well. 480 and the
     14px 16px padding, which fits two action buttons to a line on a ~390px
     screen, are judgment calls and retunable.
     The rows are auto 1fr, and that is what keeps the panels directly under
     the actions (#186): #left takes only the height it needs, and the panel
     row takes the rest and stretches to the bottom of the screen. A long
     list grows the page instead, and the page scrolls. Left to the default,
     the rows stretch and #left absorbs the spare height, which opens a gap
     between the last action and the panels.
     #left's border-right would read as a stray rule down the page once it
     spans the full width, so it becomes the seam between the text and the
     panels instead. Here sits beside Inventory rather than above it, and
     comes first, so the row reads Here | Inventory; any other sidebar panel
     follows the two in its existing order. Landscape keeps the DOM order. */
  @media (orientation: portrait), (max-width: 480px){
    main{ grid-template-columns:1fr; grid-template-rows:auto 1fr; }
    #left{ padding:14px 16px; border-right:none; border-bottom:1px solid var(--line); }
    #worldPanel{ order:-2; }
    #invPanel{ order:-1; }
  }
</style>
</head>
<body>
<header>
  <button id="menuToggle">☰ Menu</button>
  <h1 id="pageTitle">ASHFALL</h1>
</header>
<div id="itemPopBackdrop" class="pop-backdrop"></div>
<div id="itemPop" class="pop" tabindex="-1"></div>
<div id="devicePopBackdrop" class="pop-backdrop"></div>
<div id="devicePop" class="pop" tabindex="-1"></div>
<div id="menuBackdrop"></div>
<aside id="sideMenu">
  <h2>Menu <button id="closeMenu">✕</button></h2>
  <div id="hubRow"></div>
  <div class="menu-section">
    <h3>Save / Load</h3>
    <div class="menu-actions">
      <button id="saveLocalBtn">Save to this browser</button>
      <button id="loadLocalBtn">Load from this browser</button>
      <button id="exportBtn">Export save file</button>
      <button id="importBtn">Import save file</button>
      <input type="file" id="importInput" accept="application/json" style="display:none;">
    </div>
  </div>
  <div class="menu-section"><h3>Stats</h3><div id="statsBox"></div></div>
  <div class="menu-section">
    <div class="map-heading">
      <h3>Map</h3>
      <div id="mapZoomToggle">
        <button data-zoom="close" class="active">Close</button>
        <button data-zoom="wide">Wide</button>
        <button id="mapZoomIn">+</button>
        <button id="mapZoomOut">&minus;</button>
      </div>
    </div>
    <svg id="mapSvg" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
</aside>
<section id="craftingPanel" class="full-panel" tabindex="-1">
  <h2>Crafting <button class="panel-close">✕</button></h2>
  <div class="full-panel-body">
    <div id="craftFilters">
      <input id="craftSearch" type="search" placeholder="Search" aria-label="Search recipes" autocomplete="off">
      <div id="craftGroups"></div>
      <label id="craftCanMakeLabel"><input id="craftCanMake" type="checkbox"> Can make now</label>
    </div>
    <div id="craftingList"></div>
    <div id="craftResult" class="log-result"></div>
  </div>
</section>
<section id="optionsPanel" class="full-panel" tabindex="-1">
  <h2>Options <button class="panel-close">✕</button></h2>
  <div class="full-panel-body">
    <div id="seedRow">Seed: <span id="seedValue"></span><button id="copySeedBtn" class="mini">Copy</button></div>
    <div class="menu-actions"><button id="restartMenuBtn">Restart game</button></div>
  </div>
</section>
<div id="locBar">
  <div id="locLabel"></div>
  <div id="rightBar">
    <span id="clockLabel"></span>
    <div id="gaitBar">
      <span>Pace</span>
      <button data-gait="sneak">Sneak</button>
      <button data-gait="walk" class="active">Walk</button>
      <button data-gait="fast">Jog</button>
    </div>
  </div>
</div>
<main>
  <div id="left">
    <p id="roomDesc"></p>
    <div id="log"></div>
    <div class="actions-group" id="moveGroup"><h2>Move</h2><div class="actions" id="moveActions"></div></div>
    <div class="actions-group" id="hereGroup" style="display:none;"><h2>Here</h2><div class="actions" id="hereActions"></div></div>
  </div>
  <div id="sidebar">
    <div class="panel" id="invPanel">
      <h2>Inventory <span class="sub"><span id="invWeight"></span></span></h2>
      <div class="tabs" id="invTabs"></div>
      <div class="tab-strip" id="invStrip" style="display:none;"><button id="unequipBtn" class="mini">Unequip</button></div>
      <ul class="itemlist" id="invList"></ul>
    </div>
    <div class="panel" id="worldPanel">
      <h2>Here <span class="sub"><span id="worldWeight"></span></span></h2>
      <div class="tabs" id="worldTabs"></div>
      <div class="tab-strip" id="worldStrip" style="display:none;"><span id="worldDeviceState"></span><button id="deviceOptionsBtn" class="mini"></button></div>
      <ul class="itemlist" id="worldList"></ul>
    </div>
  </div>
</main>
<script>
(function(){
  "use strict";
  // ==================================================
  // ARCHITECTURE
  // ==================================================
  // Ashfall is data-driven. Content (rooms/items) and mechanics (rules that
  // act on that content) are kept apart on purpose so future passes can
  // touch one without reading the other.
  //
  //   WORLD DATA   defines rooms, room properties, containers, items,
  //                exits, doors/windows, and environmental interactions.
  //   PLAYER STATE defines player position, inventory, equipment, vitals,
  //                time, and progression.
  //   UTILITIES    provide small reusable operations (formatting, lookup).
  //   SIMULATION   owns time-dependent consequences (decay, fire burn-down,
  //                collapse from exhaustion, game-over checks). STAMINA/FATIGUE
  //                is a sub-section living inside SURVIVAL/TIME SIMULATION, not
  //                a separate top-level section.
  //   ACTIONS      perform gameplay operations (move, take, craft, etc.)
  //                and are grouped by the system they belong to:
  //                INVENTORY/ITEM SYSTEM, WORLD INTERACTION, CRAFTING,
  //                FIRE/COOKING.
  //   PERSISTENCE  serializes/restores game state.
  //   UI/RENDERING displays current state; it should never contain rules.
  //
  // IMPORTANT RULE: content additions should normally modify WORLD DATA
  // only. Mechanics additions should touch ACTIONS/SIMULATION only when a
  // genuinely new mechanic is required. Do not duplicate mechanics inside
  // world/item definitions — prefer tags/capabilities (see ITEM DATA SCHEMA
  // below) over hard-coded name checks like `it.name === "Something"`.
  //
  // CONTENT vs MECHANICS, for future passes (including AI-driven ones):
  //   CONTENT PASS (new rooms/items/containers/exits/doors/descriptions):
  //     modify makeDefaultWorld(), item definitions, room definitions,
  //     containers, exits, doors/windows, descriptions. Do not touch
  //     movement/inventory/simulation code unless the content genuinely
  //     introduces a new mechanic.
  //   MECHANICS PASS: modify the smallest relevant function/section —
  //     survival/time -> advanceTime()/runAwakeStep()/recoveryStep(); inventory transfer ->
  //     the INVENTORY/ITEM SYSTEM section (doTake/doStore/getItemAt/etc.);
  //     tools -> hasTool()/tags; fire -> FIRE/COOKING; crafting ->
  //     CRAFTING; persistence -> PERSISTENCE. UI changes are separate from
  //     both — see RENDERING.
  //   Do not read the entire file unless the requested feature requires a
  //   mechanics change. _uid is the stable identity of an item; array
  //   indexes are temporary and must never be treated as stable identity.
  //   doRestart lives in PERSISTENCE, not SIMULATION, since it performs a
  //   full state reset rather than a time-driven update.
  //
  // WORLD DATA also carries LOCATIONS — real integer (x,y,z) coordinates
  // (meters) for every street/mid-block node and building floor, keyed by
  // `locationId` on every room. LOCATIONS is read by both MAP rendering
  // and movement: exitMinutes()/locationDistance() compute
  // cross-Location travel distance, and applyComputedDirections() (run once
  // at world-build time) derives compass words for cross-Location exit
  // labels via computeDirection(). See the LOCATIONS comment below for the
  // coordinate convention.
  //
  // Item identity: every item that can appear in a UI detail view gets a
  // stable `_uid` (see ensureUid/findItemByUid below). Array indexes are
  // NOT stable identity — a list can be mutated (splice/merge) between the
  // moment a UI element is built and the moment its handler runs. Any code
  // that resolves "the item the user clicked on" must do so by _uid, not
  // by a previously-captured index. Indexes are fine only as a short-lived
  // lookup within a single already-validated operation.
  // ==================================================

  // ==================================================
  // CONFIG / CONSTANTS
  // ==================================================
  const GAME_CONFIG = { VERSION: "0.8.2" };
  function versionCompat(v){ const p = v.split("."); return p[0] + "." + p[1]; }
  const STACKABLE = new Set(["Food","Medical","Materials"]);
  const SAVE_KEY = "ashfall_save_v" + versionCompat(GAME_CONFIG.VERSION);
  // Floor on the cost of one movement, in game minutes — applied two ways,
  // and the two branches are not a redundancy to be tidied away.
  //
  // Grid travel (street/mid-block nodes, what isGridTravel() marks) is
  // floored in proportion to distance: MIN_MOVE_MIN per BLOCK_M. A flat
  // per-move floor priced the two routes across one block differently —
  // stopping at the mid-block node cost +44% at Walk and +100% at Jog against
  // the single 100 m move with the same endpoints — and the mid-block nodes
  // are where the trees, the parked cars, the building entrances and the
  // loose floor items hang, so the toll fell on looking around. The
  // proportional form was chosen, not stumbled into: both routes now cost the
  // same at every gait.
  //
  // Everything else keeps the flat floor, and that branch is load-bearing:
  // 22 of the 774 exits are building entrances whose two Locations sit at
  // identical coordinates, so their computed distance is 0. A proportional
  // floor would floor them at zero and make them free. They are non-grid
  // exits, so isGridTravel() already routes them to the flat branch.
  //
  // The floor also settles the pace question: pace is a journey-scale choice,
  // not a per-block one. With the floor at 1 minute per block, one 100 m
  // block costs 1.00 minute at Jog against Walk's 1.39 — a 28% saving, not
  // the 40% that Jog's 67%-higher speed implies. That is the intended
  // behaviour: the gait selector is meant to pay off over a route, not over
  // one step, which is why the floor is not lowered further.
  const MIN_MOVE_MIN = 1;
  // The grid pitch in metres, which moveMinutes() divides by to scale the
  // grid floor. A second statement of the figure the LOCATIONS comment gives
  // as "Block size 100m" and that every street coordinate embodies; it earns
  // a name because a formula, not a table, now depends on it.
  const BLOCK_M = 100;
  // Floor on any duration the UI prints, in game minutes. Equal to
  // MIN_MOVE_MIN today and a separate constant on purpose: retuning the
  // movement floor must not silently re-round Rest, Sleep, Search, fishing,
  // craft times and the fire's fuel readout along with it.
  //
  // The floor stays, and the gap it opens between the printed and the charged
  // time is accepted rounding rather than an oversight. It became visible
  // when grid travel's floor was made proportional to distance (see
  // MIN_MOVE_MIN): a 50 m half-move costs 0.694 min at Walk and 0.500 at Jog
  // and prints (0:01) for both, so two half-moves through a mid-block display
  // 2 minutes against ~1.39 actually spent at Walk. A button that printed
  // (0:00), or one that printed a fraction, would both be worse than being a
  // little generous about a figure the clock already shows to the minute.
  // Three callers can go sub-minute: the Move and Here exit buttons via
  // exitMinutes(), estimateSleepMinutes() — sleepAvailable() only requires
  // Energy below the ceiling, so the gap can be arbitrarily small — and
  // fmtDuration(room.fireMinutesLeft) in renderLocationPanel(), which
  // decrements continuously toward zero. Every other caller is fed a fixed
  // constant of 5 minutes or more and can never reach the floor.
  const MIN_DISPLAY_MIN = 1;
  const GAITS = { sneak:{speed:0.6}, walk:{speed:1.2}, fast:{speed:2.0} };
  // The length of a game day, in minutes. The clock, the day number and the
  // vital decay rates all derive from this one figure.
  const MINUTES_PER_DAY = 1440;
  // Points per game minute: hunger empties over three game days, thirst and
  // energy over one.
  const DECAY = { hunger:100/(3*MINUTES_PER_DAY), thirst:100/MINUTES_PER_DAY, energy:100/MINUTES_PER_DAY };
  const CAMPFIRE_KIT_COST = 3;
  // The collapse clock. A run starts START_DAYS_AFTER_COLLAPSE days after the
  // collapse; grid power and running water fail on their own day after it.
  // Nothing is stored: minutesSinceCollapse() derives the clock from
  // state.totalMinutes. Power and water are separate constants on purpose,
  // since they will be set separately (#149). All three are retunable; the
  // Day N clock still counts from the start of the run.
  const START_DAYS_AFTER_COLLAPSE = 2;
  const POWER_FAILS_DAY = 21;
  const WATER_FAILS_DAY = 21;
  // Spoilage rates, as multiples of the rate food ages at room temperature
  // (see spoilageRate()). A fridge slows ageing while powered, and for
  // FRIDGE_COAST_MIN after the power fails it still holds some cold; a
  // freezer stops it while powered and for FREEZER_COAST_MIN after. Balance
  // values, retunable.
  const FRIDGE_RATE_POWERED = 0.1;
  const FRIDGE_RATE_COASTING = 0.25;
  const FRIDGE_COAST_MIN = 2 * MINUTES_PER_DAY;
  const FREEZER_COAST_MIN = 5 * MINUTES_PER_DAY;
  // Rotten food restores this fraction of what it would fresh, and carries a
  // baseline food-poisoning chance combined with the food's own
  // (combinePoisoning()). POISONING_TRAIT_MULTIPLIER is a placeholder until
  // traits (#9) exist, and multiplies the rotten baseline only. Tainted
  // water's chance is for a full bottle's worth, scaled by the amount drunk.
  // Balance values, retunable.
  const ROTTEN_RESTORES_FACTOR = 0.35;
  const ROTTEN_POISONING_CHANCE = 0.35;
  const POISONING_TRAIT_MULTIPLIER = 1;
  const TAINTED_WATER_POISONING_CHANCE = 0.35;
  // Minutes tainted water must sit in a heated vessel to come out clean.
  // Retunable.
  const BOIL_MINUTES = 5;
  // A dish restores the sum of its ingredients' contributions times
  // (1 + this). Retunable.
  const DISH_RESTORES_BONUS = 0.25;
  // The stove timer's add buttons, in minutes, in the order they are shown.
  // Retunable.
  const STOVE_TIMER_STEPS = [5, 10, 30];
  // The roll source's constants (see chance() in CORE UTILITIES). FNV-1a's
  // published 32-bit offset basis and prime — fixed by the algorithm, not
  // tunable. KEY_SEP joins a roll's key parts: the unit separator, a character
  // that cannot occur in a room, container, pool or item id, so ("a","bc")
  // and ("ab","c") can never produce the same key. Any such character would
  // do; the point is that one exists.
  const FNV_OFFSET_BASIS = 2166136261;
  const FNV_PRIME = 16777619;
  const KEY_SEP = "\u001F";
  // ==================================================
  // STAMINA / FATIGUE SYSTEM CONSTANTS
  // ==================================================
  // See the v0.2.1 entry in CHANGELOG.md for the full rules.
  // Tasks declare Exertion; this system alone decides how Exertion affects
  // Stamina/Fatigue. Do not duplicate this logic inside tasks.
  // Each task's own Exertion figure is declared beside that task, not here —
  // chopping and fishing in FIRE / COOKING, jogging above doMove(). This
  // block owns only what Exertion *does*, which is why no task constant is
  // left in it.
  const STAMINA_RECOVERY_DELAY_MIN = 1;    // game minutes of non-exertion before recovery starts
  const BASELINE_STAMINA_RATE = 1;         // Stamina/minute, awake baseline
  const REST_STAMINA_RATE = 0.5;           // Stamina/minute during Rest
  const FATIGUE_RECOVERY_RATE = 0.5;       // Fatigue/minute
  const REST_DURATION_MIN = 60;
  const SLEEP_ENERGY_RATE = 10/60;         // Energy/minute (10/hour)
  const SLEEP_COOLDOWN_MIN = 8*60;         // must stay awake 8 game hours after waking
  // 30 is an initial balance value with no prior convention behind it —
  // retunable, and deliberately one knob per vital.
  const LOW_HUNGER_THRESHOLD = 30;
  const LOW_THIRST_THRESHOLD = 30;
  // The Fatigue at which the pace bar locks to Sneak. Not a balance knob in
  // the way the two above are — it is the top of the Fatigue scale, and
  // gaitLocked() is its only reader. Named here because the rule it states
  // was previously a bare 100 written at two call sites, neither of which
  // owns Fatigue.
  const FATIGUE_GAIT_LOCK = 100;
  // Every recipe, by group: "craft" makes things, "prep" prepares food. An
  // input may name the cook state a unit must be in (`cookState`); `tool` is
  // a capability tag the player must carry (hasTool()). `doneLog` is the line
  // a recipe logs when the default "You craft a …" would not read.
  const RECIPES = [
    { id:"bandage", label:"Craft a bandage", group:"craft",
      inputs:[ {id:"cloth",qty:2}, {id:"duct_tape",qty:1} ], minutes:5,
      output:{ id:"bandage" } },
    { id:"campfire_kit", label:"Craft a campfire kit", group:"craft",
      inputs:[ {id:"firewood",qty:CAMPFIRE_KIT_COST} ], minutes:15,
      output:{ id:"campfire_kit" } },
    { id:"fillet_fish", label:"Fillet the fish", group:"prep",
      inputs:[ {id:"fish",qty:1,cookState:"raw"} ], tool:"blade", minutes:10,
      output:{ id:"fish_fillets" }, doneLog:"You fillet the fish." }
  ];
  // Dishes. A vessel's contents and water decide the dish, and nothing else
  // does: the first template here that matches, in this order, is what forms
  // when the vessel heats (formDish()). A template names:
  //   item     the dish's registry entry, whose cooks.minutes is how long the
  //            dish takes once formed
  //   vessels  the vessel kinds it forms in
  //   water    true: the vessel holds clean water (tainted must boil first);
  //            false: it holds none
  //   allowed  what may be in it, by ingredient role or by item id
  //   counts   what counts toward `min` / `exactly`, when narrower than
  //            `allowed` (a stew may hold grain, but needs two meat or
  //            vegetables)
  //   min / exactly  how many units must count. A unit is one add: a quarter
  //            of rice is one unit.
  //   named    true: the dish is named for its main ingredients ("Fish
  //            stew"); false: it keeps the entry's name ("Boiled pasta").
  // Water and one fish matches nothing: the fish cooks alone, by its own
  // `cooks`, and the water boils.
  const DISH_TEMPLATES = [
    { id:"boiled_pasta", item:"dish_boiled_pasta", vessels:["pot","saucepan"], water:true,
      allowed:{ ids:["pasta"] }, min:1, named:false },
    { id:"boiled_rice", item:"dish_boiled_rice", vessels:["pot","saucepan"], water:true,
      allowed:{ ids:["rice_bag"] }, min:1, named:false },
    { id:"soup", item:"dish_soup", vessels:["pot","saucepan"], water:true,
      allowed:{ roles:["vegetable"] }, exactly:1, named:true },
    { id:"stew", item:"dish_stew", vessels:["pot","saucepan"], water:true,
      allowed:{ roles:["meat","vegetable","grain"] }, counts:{ roles:["meat","vegetable"] }, min:2, named:true },
    { id:"roast", item:"dish_roast", vessels:["roasting_pan"], water:false,
      allowed:{ roles:["meat","vegetable"] }, min:1, named:true },
    { id:"stir_fry", item:"dish_stir_fry", vessels:["frying_pan","saucepan"], water:false,
      allowed:{ roles:["meat","vegetable","grain"] }, min:1, named:true }
  ];
  function clamp(v){ return Math.max(0, Math.min(100, v)); }

  // ==================================================
  // WORLD DATA
  // ==================================================
  // ROOM SCHEMA (one entry per key in the object returned by
  // makeDefaultWorld()):
  //   id            (the object key itself) room identifier
  //   address       the street or intersection the room is at, as a display
  //                 string, e.g. "Poplar St" / "Dock St & 6th St". Required on
  //                 every room, never empty. THE ADDRESS RULE: a room's address
  //                 is the street it is on, and a building fronts a street,
  //                 never a corner. A street/mid-block node's address is its own
  //                 location — including an intersection node, which genuinely
  //                 is at a corner and keeps its "<Street> St & <N>th St"
  //                 string. A room *inside* a building takes the named street
  //                 that building fronts, even when the building sits on an
  //                 intersection node: the Police Station is entered from
  //                 maple3rd but its address is "Maple St", not
  //                 "Maple St & 3rd St".
  //   building      the NAME of the building this room is inside, e.g.
  //                 "Acorn Apartments". Absent when the room is not inside a
  //                 named building (every street/mid-block node, the alley, and
  //                 the three flats above the Main St shops — a flat over a shop
  //                 is not inside the shop). It holds a building's name and
  //                 nothing else, ever: not a street, not an address. Note that
  //                 doors[].building and master_key.building are a DIFFERENT
  //                 field holding a building *id* ("acorn"), unrelated to this.
  //   area          floor/apartment/street grouping, e.g. "2A"
  //   room          room type/name, e.g. "Kitchen"
  //   shelter       "none" | "partial" | "full" — whether the room is under
  //                 cover. Required on every room. "partial" is cover without
  //                 enclosure: a balcony under the building's roof overhang, a
  //                 street node under a conveyor bridge, a block with a bus
  //                 shelter in it. Nothing reads shelter today — it is laid
  //                 down ahead of its consumers (#58 weather, #6 rooftops) the
  //                 same way LOCATIONS' z is, so those passes need no retrofit
  //                 across every room. An unused field here is not a dead one.
  //                 It is also NOT cannotHaveFire and must never be derived
  //                 from it: the two are not coextensive, and the divergence
  //                 runs both ways — the two balconies and the 1A patio carry
  //                 cannotHaveFire without being fully under cover, and the two
  //                 partial street nodes are covered and can still host a fire.
  //                 They are different facts (a fire rule vs. being under
  //                 cover). The pass that adds the first consumer also inherits
  //                 shelter's save backfill — backfillRoomAddresses()
  //                 deliberately does not restore it, since nothing reads it.
  //   desc          description shown to the player
  //   floor         array of loose item objects (see ITEM DATA SCHEMA)
  //   floorCap      maximum loose-item capacity in kg
  //   containers    array of container objects (see CONTAINER SCHEMA)
  //   carContainers optional array of vehicle container objects
  //   exits         array of movement definitions (see EXIT SCHEMA)
  //   locationId    key into LOCATIONS (see below) — real (x,y,z) position.
  //                 Street/mid-block rooms use their own room id as their
  //                 locationId; every room on one building floor shares
  //                 that floor's locationId. Required on every room.
  // Optional environmental properties:
  //   sleepSpot      e.g. "couch"/"bed" — enables the Sleep action
  //   cannotHaveFire room may not host a campfire
  //   fishable       room supports the Go Fishing action
  //   hasTree        room has a choppable tree
  //   searched       whether the room's hidden search has been performed
  //   searchLabel    action label shown before searching
  //   searchMinutes  time cost of searching
  //   carLocked      whether a vehicle in the room is locked
  //   heatActive     a fire/stove is currently burning here
  //   fireMinutesLeft remaining fuel minutes for an active fire
  //   campfireBuilt  a campfire structure has been assembled here
  //   sink           the room has a sink: while the water runs
  //                  (waterRunning()), a water-holding item can be filled
  //                  at it (doFillAtSink())
  //
  // CONTAINER SCHEMA:
  //   { id, name, capacityKg, items: [] }
  //   Optional: locked, breakTag (tag required to force it open)
  //   Optional: tags — capability tags, with the same field, shape and
  //     vocabulary as an item's (see ITEM DATA SCHEMA): a tag means the same
  //     thing on a container as on an item. Read through hasTag(). Read by a
  //     mechanic today:
  //       heat    the container is a heat source's cooking space, a stove's
  //               or a campfire's. getHeatContainer() finds it by this tag,
  //               and what lies in it cooks while the room's heat is on
  //               (cookInHeat()).
  //       device  the container has controls beyond take and store, kept in
  //               its device pop-up (renderDevicePop()). The strip under the
  //               Here panel's tabs offers that pop-up while its tab is
  //               selected.
  //       fridge  food in it ages slower while the power is on, and for a
  //               while after (spoilageRate()).
  //       freezer food in it does not age while the power is on, nor for a
  //               while after; it reads "(Frozen)" meanwhile.
  //     A container carrying both heat and device is the room's stove
  //     (roomStove()).
  //   Optional: timerMinutes — a stove's analog timer, minutes left (absent
  //     = 0). Set from its device pop-up, counted down by
  //     tickStoveTimers() whether or not the stove is on.
  //     Authored containers carry their tags in WORLD DATA. The campfire's
  //     container is created by doBuildFire(), which gives it `heat`.
  //   Optional (spawn pools — see SPAWN_POOLS below):
  //     spawnPools       string[] of SPAWN_POOLS ids this container draws
  //                      from. Absence means the container is never
  //                      touched by the spawn system (purely hand-authored).
  //     spawnRolled      whether the initial roll has happened. Set true
  //                      at authoring time on any container that already
  //                      ships with hand-placed contents. The roll appends
  //                      (addToList), so it would never overwrite them —
  //                      what the flag prevents is hand-placed contents
  //                      being topped up with rolled loot.
  //     lastRolledMinute state.totalMinutes at the last roll. Not consumed
  //                      by any mechanic yet — reserved for a future
  //                      respawn cycle (#15). Perishables never respawn: that
  //                      cycle must skip any item whose registry entry has
  //                      `spoils`, or a fridge would restock with fresh food
  //                      weeks after the power failed.
  //
  // EXIT SCHEMA (one of):
  //   Same-Location:  { to, label, distanceM } — distanceM is hand-authored.
  //   Cross-Location: { to, label } — no distanceM/block/blockHalf; travel
  //                   time is computed from the two rooms' LOCATIONS entries
  //                   by exitMinutes()/locationDistance() (see WORLD
  //                   INTERACTION). Compass words inside `label`, if any,
  //                   are substituted at build time by computeDirection()
  //                   from the same LOCATIONS data.
  //   Optional (either kind): doorId (exit is gated by a door in `doors`)
  //
  // ITEM DATA SCHEMA:
  //   Shared item properties (name, category, unitWeight, tags, etc.) are
  //   defined ONCE per item in ITEM_REGISTRY below, keyed by a stable id.
  //   Rooms/containers place instances by reference — { id, qty } — via
  //   itemsFromRegistry(), never by repeating the full item definition.
  //   `overrides` on a placement ref is for genuine per-instance state only
  //   (e.g. a specific unit's current durability), never for properties
  //   that should be shared — those belong in the registry entry itself,
  //   so an item's definition is never duplicated across placements.
  //   An item's `tags` are definition data: `overrides` never sets them, and
  //   the load path resyncs them from the registry (backfillRegistryTags()),
  //   so a tag fix here reaches every save.
  //   Basic item: { name, category, qty, unitWeight }
  //   Optional properties:
  //     tags          capability tags used by mechanics instead of name
  //                   checks. Read by a mechanic today: blunt, cutting,
  //                   chopping, fishing, tackle, fire-starter, battery,
  //                   can-opening, disassemble, blade. `can-opening`
  //                   means "can get a can open", not "is a can opener" —
  //                   doOpen() asks hasTool() for it, so every item that
  //                   could work a lid off carries it, not just the
  //                   dedicated tool. An item's own controls, such as a
  //                   radio's, sit in its item pop-up, so `device` is a
  //                   container's tag only. `disassemble` offers
  //                   Disassemble, which gives back the inputs of the
  //                   RECIPES entry whose output the item is
  //                   (doDisassemble()); on an item no recipe makes, it
  //                   does nothing.
  //                   Containers carry tags too (see CONTAINER SCHEMA).
  //                   `blade` is the tool a recipe's `tool` asks for to
  //                   cut (Fillet the fish).
  //                   Declared, with no consumer yet: prying, heat — an
  //                   item carrying one of these makes a claim nothing
  //                   currently acts on, which is correct to write and not
  //                   yet load-bearing. `heat` sits in that second group
  //                   despite having a reader:
  //                   roomHasHeat() exists, but its only caller is
  //                   canCraft()'s needsHeat branch, which no recipe sets.
  //     durability    { current, max, mode } — mode is "uses" or "time"
  //     restores      { hunger, thirst } — consumable effect
  //     verb          display/use verb, e.g. "Eat", "Drink"
  //     sealed        packaged-item state. `true` on a registry entry means
  //                   every instance starts sealed; doOpen() flips it to
  //                   false on the one instance it opens. Absence is the
  //                   common case and means the item is not a packaged
  //                   thing at all, so all three states — undefined, true,
  //                   false — are distinguishable and meaningful. A sealed
  //                   item is not food yet: Eat is withheld until it is
  //                   opened, and addToList() will not merge a sealed stack
  //                   with an opened one.
  //     opensWith     capability tag required to open a sealed item (see
  //                   `tags`). Absent on a sealed item means it opens by
  //                   hand.
  //     slotType      equipment/container slot key, e.g. "backpack"
  //     slotLabel     inventory-tab label for that slot, when capitalizing
  //                   the slot key isn't good enough (e.g. "Fanny Pack")
  //     capacityKg    capacity of an equippable container item
  //     carryFactor   an equippable bag's factor against the player's carry
  //                   load, a number in (0,1]: while the bag is worn, its
  //                   own weight plus everything in it counts at this
  //                   fraction (see playerLoad()). A bag that is not worn
  //                   counts in full. Definition data: always read from the
  //                   registry by itemId (carryFactorOf()), never copied
  //                   onto an instance or a slot, so a retune reaches every
  //                   save.
  //     contents      stored contents when an equipped container is
  //                   unequipped back into a stowable item, and a vessel's
  //                   ingredients or its one dish. Its items count toward
  //                   the item's weight (itemUnitWeight()), bags may nest to
  //                   any depth, and every load-time scan reaches them
  //                   through forEachItemList()
  //     vessel        { kind, capacityKg, waterKg } — the item is a pot or
  //                   pan: `kind` is what DISH_TEMPLATES match on,
  //                   `capacityKg` bounds its contents' weight, and
  //                   `waterKg` is the water it holds when full (0 = none).
  //                   Definition data, read by itemId.
  //     ingredient    { role, label, restores?, addPortion? } — the item
  //                   can go in a vessel: `role` is meat, vegetable or grain,
  //                   `label` names a dish ("Fish stew"), `restores` is what
  //                   it contributes to a dish when that differs from eating
  //                   it, and `addPortion` means it goes in by that part of a
  //                   unit. Definition data, read by itemId.
  //     dish          true on a DISH_TEMPLATES template's entry. A dish
  //                   instance carries what its ingredients decided, genuine
  //                   per-instance state the `overrides` rule allows: its
  //                   `name`, `restores`, `foodPoisoning` ({ raw, cooked })
  //                   and `unitWeight` (buildDish()).
  //     boilMinutes   instance: how long a vessel's tainted water has boiled,
  //                   toward BOIL_MINUTES.
  //     on            powered-equipment on/off state
  //     hasBatteries  powered-equipment battery-installed state
  //     drainRate     durability loss per minute while `on`
  //     foodPoisoningChance chance that eating one unit of this item causes
  //                   food poisoning, as a fraction in [0,1] — the file's
  //                   one probability convention (see chance()). Definition
  //                   data: read from the registry by itemId
  //                   (foodEffects()), never copied onto an instance
  //                   (REGISTRY_ONLY_FIELDS). Saves before 0.8 carry an
  //                   instance copy named `illnessChance`, which
  //                   migrateCookingRelease() deletes on load.
  //     masterKey     key unlocks every door in `building`
  //     building      building association for a masterKey
  //     doorId        specific door a (non-master) key unlocks
  //     isWatch       grants access to the clock display
  //     cooks         { minutes, restores, foodPoisoningChance? } — the item
  //                   cooks: `minutes` in a lit heat container turn it from
  //                   Raw to Cooked (cookInHeat()), and `restores` /
  //                   `foodPoisoningChance` are the Cooked state's (absent
  //                   chance = 0). The entry's own `restores` and
  //                   `foodPoisoningChance` are the Raw state's. Definition
  //                   data, read by itemId (foodEffects()).
  //     cookState     instance: "raw" or "cooked" on a cookable item, absent
  //                   = raw.
  //     cookMinutes   instance: a raw cookable item's progress toward
  //                   cooks.minutes, absent = 0. Kept when the heat stops or
  //                   the item is taken out.
  //     spoils        { staleAfter, rottenAfter } — the item is perishable
  //                   once unsealed: Fresh below staleAfter minutes of
  //                   effective age, Stale below rottenAfter, Rotten from
  //                   there. Definition data, read by itemId.
  //     ages          instance: a perishable row's effective age per unit, in
  //                   minutes, oldest first, one per unit (see SPOILAGE in
  //                   SURVIVAL / TIME SIMULATION). A placement may set it
  //                   through `overrides`; otherwise the world's items are
  //                   aged from the collapse (stampMissingAges()) and an
  //                   action's are new (asNewlyMade()).
  //     holdsWater    { kg, restores } — the item holds water: `kg` when
  //                   full, and what drinking a full one restores. A bottle.
  //                   Definition data, read by itemId.
  //     water         instance: { kind, fill } — the water an item holds,
  //                   "clean" or "tainted", and a bottle's fill (1, 0.75,
  //                   0.5 or 0.25); absent when empty. Shown as its kind,
  //                   never its level; weighs holdsWater.kg × fill.
  //     portion       instance: how much of one unit of food is left — 1,
  //                   0.75, 0.5 or 0.25, absent = 1 — after Eat 1/2 or 1/4.
  //                   Never shown; a unit weighs its portion of unitWeight.
  //     disassembleLog the line Disassemble logs for a `disassemble`-tagged
  //                   item, with {qty} standing for the first recipe

  // itemFromRegistry/itemsFromRegistry expand a { id, qty, overrides? }
  // placement reference into a full runtime item object, deep-cloned from
  // ITEM_REGISTRY so no two placements ever share mutable state (tags
  // arrays, durability objects). `overrides` is for genuine per-instance
  // state only (e.g. a specific unit's current durability) — shared
  // properties belong in the registry, never repeated at the call site.
  function itemFromRegistry(ref){
    const def = ITEM_REGISTRY[ref.id];
    if(!def) throw new Error("Unknown item id: " + ref.id);
    const item = JSON.parse(JSON.stringify(def));
    REGISTRY_ONLY_FIELDS.forEach(f=> delete item[f]);
    item.itemId = ref.id;
    item.qty = ref.qty;
    if(ref.overrides) Object.assign(item, JSON.parse(JSON.stringify(ref.overrides)));
    return item;
  }
  function itemsFromRegistry(refs){
    return refs.map(itemFromRegistry);
  }
  // Registry fields that are definition data only: every reader looks them
  // up in ITEM_REGISTRY by itemId (registryEntryOf()), so itemFromRegistry()
  // leaves them off the instance. A retune then reaches every save, and no
  // stale copy on an instance is there to be read by mistake.
  const REGISTRY_ONLY_FIELDS = ["carryFactor", "foodPoisoningChance", "disassembleLog", "cooks", "spoils", "holdsWater",
    "vessel", "ingredient", "dish"];
  // An item's (or a slot's) registry entry, by its itemId, or null for
  // anything without one: the keychain, an item from a save the registry no
  // longer knows. The one lookup every registry-read field goes through.
  function registryEntryOf(thing){
    const id = thing && thing.itemId;
    return id && Object.prototype.hasOwnProperty.call(ITEM_REGISTRY, id) ? ITEM_REGISTRY[id] : null;
  }

  // CONTAINER_SLOTS / SLOT_LABELS: the equipment slots the player can
  // carry things in, derived from ITEM_REGISTRY rather than listed by hand,
  // so adding an equippable bag is a registry edit and nothing else —
  // PLAYER STATE, the inventory pools and RENDERING all read these instead
  // of naming slots individually. `keychain` is named explicitly because it
  // is the one slot
  // that isn't a found item: makeDefaultState() ships it populated, and
  // keychainAllows() restricts it to Key items. That restriction is specific
  // to the keychain and is deliberately not inherited by any other slot.
  const CONTAINER_SLOTS = ["keychain"].concat(
    Object.values(ITEM_REGISTRY).filter(d => d.slotType).map(d => d.slotType)
      .filter((s, i, all) => all.indexOf(s) === i));
  const SLOT_LABELS = (function(){
    const out = { keychain:"Keychain" };
    Object.values(ITEM_REGISTRY).forEach(d=>{
      if(d.slotType && !out[d.slotType]) {
        out[d.slotType] = d.slotLabel || d.slotType.charAt(0).toUpperCase() + d.slotType.slice(1);
      }
    });
    return out;
  })();

  // SPAWN_POOLS: per-entry-chance loot tables, sibling registry to
  // ITEM_REGISTRY. A container opts in via its `spawnPools` field (see
  // CONTAINER SCHEMA above); doOpenContainer() (WORLD INTERACTION) rolls
  // each pool independently the first time such a container is opened, via
  // rolledLootFor(), keyed on the run's seed and the container's identity —
  // so what a container holds is fixed by the world, not by when it is opened.
  //   emptyChance  0-1 chance the whole pool produces nothing. Rolled once,
  //                ahead of the entries, and gates all of them.
  //   entries    [{ itemId, chance, qtyMin, qtyMax, key?, state? }] — every
  //              entry is rolled once, independently of every other, in
  //              declaration order, so an entry contributes at most one
  //              stack per roll and items land in the order the pool lists
  //              them. `key` is the entry's identity within the pool
  //              (poolEntryKey()), its itemId when absent: an entry that
  //              lists an item a second time, in another state, needs one.
  //              `state` is instance fields applied to the rolled item after
  //              itemFromRegistry(), genuine per-instance state only, as a
  //              placement's `overrides` is (a cooked fish's cookState). A
  //              pool must not list one key twice, nor a container one pool
  //              id twice: the roll is keyed by those ids, so a repeat would
  //              roll identically (validateReachability() reports both).
  //              `chance` is a number in (0,1] and is CONDITIONAL: it is
  //              the probability this entry appears given the pool did not
  //              come up empty. The unconditional probability of the item
  //              being in the container is therefore
  //                  P(appears) = (1 - emptyChance) * chance

  //              many of that item spawn once the entry hits.

  // after this paragraph. The v0.5.1 conversion computed each one from the

  // entry by entry; that is why they read 0.245069 rather than 0.25. An ugly
  // six-decimal number here is still the signal that nobody has picked it —

  // Straight-line distance between two Locations, rounded to the nearest
  // whole meter. Computed on demand, never cached — LOCATIONS is the
  // single source of truth.
  function locationDistance(a, b){
    const A = LOCATIONS[a], B = LOCATIONS[b];
    return Math.round(Math.sqrt((B.x-A.x)**2 + (B.y-A.y)**2 + (B.z-A.z)**2));
  }
  // Compass direction from Location `a` to Location `b`, derived from real
  // coordinates. Two Locations at the same point have no direction between
  // them and resolve to `null` — that is a different case from pure vertical
  // movement, which resolves to up/down, and the two must not be collapsed:
  // a building floor shares its street node's (x,y) *and* its z, while a
  // rooftop or an upper floor differs in z and is genuinely above. Otherwise
  // the larger of |dx|/|dy| wins, and a true diagonal tie (not expected on
  // the current rectilinear grid) defaults to the north/south axis.
  function computeDirection(a, b){
    const A = LOCATIONS[a], B = LOCATIONS[b];
    const dx = B.x - A.x, dy = B.y - A.y, dz = B.z - A.z;
    if(dx === 0 && dy === 0 && dz === 0) return null;
    if(dx === 0 && dy === 0) return dz > 0 ? "up" : "down";
    if(Math.abs(dx) === Math.abs(dy)) return dy > 0 ? "north" : "south";
    if(Math.abs(dx) > Math.abs(dy)) return dx > 0 ? "east" : "west";
    return dy > 0 ? "north" : "south";
  }
  // Build-time pass: for every exit that crosses between two different
  // Locations and whose label already contains an explicit compass word,
  // replace that word with the one computed from real coordinates. Runs
  // once, right after the world is assembled.
  // Labels with no compass word (building entrances, floor transitions,
  // etc.) are left exactly as authored.
  // When the two Locations sit at the same point there is no direction to
  // substitute, so the label is left as authored there too — and because a
  // compass word on such an exit is an authoring mistake that reads as
  // perfectly good English ("Head east into the pharmacy"), that one case
  // warns. A same-point exit with no compass word is the ordinary building
  // entrance and stays silent.
  const COMPASS_WORD_RE = /\b(north|south|east|west)\b/i;
  function applyComputedDirections(world){
    for(const roomId in world){
      const room = world[roomId];
      if(!room.exits) continue;
      for(const exit of room.exits){
        const toRoom = world[exit.to];
        if(!toRoom || toRoom.locationId === room.locationId) continue;
        const match = exit.label.match(COMPASS_WORD_RE);
        if(!match) continue;
        const dir = computeDirection(room.locationId, toRoom.locationId);
        if(dir === null){
          console.warn(`applyComputedDirections: ${roomId} -> ${exit.to} label "${exit.label}" contains a compass word, but Locations ${room.locationId} and ${toRoom.locationId} are the same point — there is no direction between them. Label left as authored; rewrite it without the compass word.`);
          continue;
        }
        exit.label = exit.label.slice(0, match.index) + dir + exit.label.slice(match.index + match[0].length);
      }
    }
    return world;
  }
