  // What eating or drinking one whole unit of `it` does, or null when it is
  // nothing to eat or drink: { left, restores, poisoning, water }. Food is
  // unitFoodEffects() with its portion left. A bottle is drunk from, not
  // eaten: its holdsWater restores, tainted water carries
  // TAINTED_WATER_POISONING_CHANCE, and its fill is what is left. This is
  // the interim Drink rule, until fluid volumes (#47) replace it.
  function consumeProfile(it){
    if(it.sealed) return null;
    const def = registryEntryOf(it);
    if(def && def.holdsWater){
      if(!it.water) return null;
      return { left: it.water.fill, restores: def.holdsWater.restores, water:true,
        poisoning: it.water.kind === "tainted" ? TAINTED_WATER_POISONING_CHANCE : 0 };
    }
    const fx = unitFoodEffects(it);
    return fx.restores ? { left: portionOf(it), restores: fx.restores, poisoning: fx.poisoning, water:false } : null;
  }
  // Applies `change` to one unit of `row` rather than to the whole row. A
  // unit split out of a larger row goes back into the list changed; a lone
  // unit is changed where it is and keeps its row, and _uid. Either way it
  // then folds into a matching row if there is one. Returns the changed unit.
  function changeOneUnit(list, row, change){
    if(row.qty > 1){
      const unit = dropUnits(list, list.indexOf(row), 1);
      change(unit);
      return addToList(list, unit);
    }
    change(row);
    remergeRow(list, row);
    return row;
  }
  // Takes `amount` of one unit off `row`: food's portion, a bottle's fill.
  // Food eaten to nothing is gone; a bottle drunk dry stays, empty.
  function eatFromRow(list, row, amount){
    const water = !!consumeProfile(row).water;
    const rest = consumeProfile(row).left - amount;
    if(!water && rest <= 0){ dropUnits(list, list.indexOf(row), 1); return; }
    changeOneUnit(list, row, unit=>{
      if(!water) unit.portion = rest;
      else if(rest > 0) unit.water.fill = rest;
      else delete unit.water;
    });
  }
  // Sinks. A water-holding item — a bottle — can be filled at the sink of the
  // room it is in while the water runs, unless it is already full, of either
  // kind. One unit fills, to full; its water is clean unless it already held
  // tainted water, since any tainted water taints everything it mixes with.
  // Instant. After the water fails the sink gives nothing, and whatever was
  // left in the pipes is #47's. The line's wording is retunable.
  // A vessel fills too, while it holds no dish and no water.
  function canFillAtSink(it){
    const room = world[state.currentRoom];
    return !!room.sink && waterRunning() && canTakeWater(it);
  }
  // Whether an item can take more water: a bottle that is not full, or a
  // vessel holding none, since a vessel's water is all or nothing (#47).
  // Filling at the sink and pouring in both ask this.
  function canTakeWater(it){
    if(!holdsWaterAtAll(it)) return false;
    return !it.water || (!vesselDefOf(it) && it.water.fill < 1);
  }
  // Whether an item can take water right now: a bottle always, a vessel with
  // a waterKg while it holds no dish.
  function holdsWaterAtAll(it){
    const def = registryEntryOf(it);
    if(def && def.holdsWater) return true;
    return !!(def && def.vessel && def.vessel.waterKg > 0 && !dishIn(it));
  }
  // Puts water of `kind` into one unit: a bottle full to the top, a vessel
  // full. Any tainted water already there taints it, and new water in a
  // vessel starts its boil over.
  function addWater(unit, kind){
    const k = waterKindOf(unit) === "tainted" ? "tainted" : kind;
    unit.water = vesselDefOf(unit) ? { kind:k } : { kind:k, fill:1 };
    delete unit.boilMinutes;
  }
  function doFillAtSink(sourceKind, index){
    const room = world[state.currentRoom];
    const src = sourceKind === "world" ? worldSlot(room, worldTab) : invSlot(invTab);
    const it = getItemAt(src && src.items, index);
    if(!it || !canFillAtSink(it)) return;
    const filled = changeOneUnit(src.items, it, unit=> addWater(unit, "clean"));
    // The pop-up follows the filled bottle, as doOpen()'s follows the opened can.
    detailItem = { uid: ensureUid(filled), side: sourceKind };
    log(`You fill the ${it.name.toLowerCase()} at the sink.`);
    render();
  }
  // Vessels within reach of an item: every vessel in the lists crafting
  // reaches (nearbyLists()), and every vessel in the room's heat container,
  // once each. Each comes as { vessel, place }, the place being where it was
  // found: "carried" for the inventory pools, else the Here tab's label —
  // "Floor", or the container's name.
  function nearbyVessels(){
    const room = world[state.currentRoom];
    const heat = getHeatContainer(room);
    const pools = invPools();
    const containers = room.containers.concat(room.carContainers || []);
    const placeOf = list=> pools.includes(list) ? "carried"
      : list === room.floor ? "Floor" : containers.find(c=> c.items === list).name;
    const out = [];
    nearbyLists().concat(heat ? [heat.items] : []).forEach(list=> list.forEach(it=>{
      if(vesselDefOf(it) && !out.some(o=> o.vessel === it)) out.push({ vessel:it, place:placeOf(list) });
    }));
    return out;
  }
  // The vessel names one action's buttons show, over the nearbyVessels()
  // entries it is offered on. Vessels sharing a name and a place get one
  // button, on the fullest of them by contents' weight (a tie to the first),
  // since nothing yet tells them apart (#47). A name still on two or more
  // buttons shows each one's place, so no two buttons read the same. Returns
  // a Map of the vessels given a button to the name their label shows.
  function vesselButtonNames(offered){
    const picked = [];
    offered.forEach(o=>{
      const same = picked.find(p=> p.name === o.vessel.name.toLowerCase() && p.place === o.place);
      if(!same) picked.push({ vessel:o.vessel, place:o.place, name:o.vessel.name.toLowerCase() });
      else if(totalWeight(o.vessel.contents || []) > totalWeight(same.vessel.contents || [])) same.vessel = o.vessel;
    });
    return new Map(picked.map(p=>{
      const clash = picked.filter(q=> q.name === p.name).length > 1;
      return [p.vessel, clash ? `${p.name} (${p.place})` : p.name];
    }));
  }
  // The unit adding `it` to a vessel would move, and the row it comes from:
  // the row's oldest unit, or for an ingredient added by the part
  // (`addPortion`), that much of the unit with the least left, so one bag of
  // rice is used up before the next is opened.
  function ingredientAdd(list, it){
    const part = ingredientOf(it).addPortion;
    const source = part ? leastLeftRow(list, it, r=> r.sealed ? null : portionOf(r)) : it;
    const unit = unitsOf(source, 1);
    if(part) unit.portion = part;
    return { source, unit };
  }
  // Whether `vessel` can take `it` from `list`: an unsealed ingredient, a
  // vessel with no dish yet, and room for the unit (contents' weight plus
  // the unit's within capacityKg; water does not count).
  function canAddToVessel(list, it, vessel){
    if(it.sealed || !ingredientOf(it) || dishIn(vessel)) return false;
    const { unit } = ingredientAdd(list, it);
    return totalWeight(vessel.contents || []) + itemWeight(unit) <= vesselDefOf(vessel).capacityKg + TICK_EPSILON;
  }
  // Moves one unit of `it` (or its part) from `list` into `vessel`. The one
  // way an ingredient goes in, for the pop-up's Add and the Crafting panel's
  // Add ingredients alike. Returns whether it moved.
  function moveIntoVessel(list, it, vessel){
    if(!canAddToVessel(list, it, vessel)) return false;
    const { source, unit } = ingredientAdd(list, it);
    const part = ingredientOf(it).addPortion;
    const rest = part ? portionOf(source) - part : 0;
    if(rest > 0) changeOneUnit(list, source, u=>{ u.portion = rest; });
    else dropUnits(list, list.indexOf(source), 1);
    if(!Array.isArray(vessel.contents)) vessel.contents = [];
    addToList(vessel.contents, unit);
    return true;
  }
  // moveIntoVessel(), saying so. The line's wording is retunable.
  function addIngredientTo(list, it, vessel){
    if(!moveIntoVessel(list, it, vessel)) return false;
    log(`You add the ${it.name.toLowerCase()} to the ${vessel.name.toLowerCase()}.`);
    return true;
  }
  function doAddToVessel(list, index, vessel){
    const it = getItemAt(list, index);
    if(!it || !addIngredientTo(list, it, vessel)) return;
    render();
  }
  // Ingredient rows within reach that could go toward template `t`:
  // unsealed ones in its counting set, oldest perishable units first and
  // otherwise in the order crafting reaches lists (nearbyLists()).
  function templateCandidates(t){
    const rows = [];
    nearbyLists().forEach((list, li)=> list.forEach(row=>{
      if(!row.sealed && inIngredientSet(t.counts || t.allowed, row))
        rows.push({ list, row, li, age: isPerishable(row) ? unitAges(row)[0] : -1 });
    }));
    return rows.sort((a, b)=> b.age - a.age || a.li - b.li);
  }
  // Whether Add ingredients has anything to do for `t` in `vessel`: units
  // still missing, nothing ruling the dish out, and one within reach that
  // the vessel can take.
  function canAddMissing(t, vessel){
    const st = templateStatus(t, vesselDefOf(vessel).kind, vessel.contents || [], waterKindOf(vessel));
    return !st.blocked && st.need > 0 && templateCandidates(t).some(c=> canAddToVessel(c.list, c.row, vessel));
  }
  // Add ingredients: adds what `t` still needs to `vessel` from within reach,
  // one unit at a time, exactly as Add would. Water is never pulled. It
  // never chooses the dish: the contents do, when heated.
  function doAddMissingIngredients(t, vessel){
    const kind = vesselDefOf(vessel).kind;
    for(;;){
      const st = templateStatus(t, kind, vessel.contents || [], waterKindOf(vessel));
      if(st.blocked || st.need === 0) break;
      const c = templateCandidates(t).find(x=> canAddToVessel(x.list, x.row, vessel));
      if(!c || !addIngredientTo(c.list, c.row, vessel)) break;
    }
    render();
  }
  // Takes one row back out of a vessel that holds no dish yet. Silent, as
  // Take is: the row visibly leaves the vessel's pop-up.
  function doTakeOutOfVessel(vessel, row){
    if(dishIn(vessel) || !vessel.contents || !vessel.contents.includes(row)) return;
    vessel.contents.splice(vessel.contents.indexOf(row), 1);
    giveItem(row);
    render();
  }
  // Whether a bottle's water can go into `vessel`: while the vessel can take
  // water, and into its clean water when the bottle's is tainted, which only
  // taints it — kept, by choice, as the one pour into water already there.
  function canPourInto(bottle, vessel){
    if(!bottle.water || !holdsWaterAtAll(bottle) || !vesselDefOf(vessel)) return false;
    return canTakeWater(vessel)
      || (holdsWaterAtAll(vessel) && waterKindOf(vessel) === "clean" && waterKindOf(bottle) === "tainted");
  }
  // Empties a bottle into a vessel, whatever its fill: the vessel then holds
  // water, tainted if either was. Volumes are #47's. The line's wording is
  // retunable.
  function doPourIntoVessel(list, index, vessel){
    const bottle = getItemAt(list, index);
    if(!bottle || !canPourInto(bottle, vessel)) return;
    addWater(vessel, bottle.water.kind);
    changeOneUnit(list, bottle, u=>{ delete u.water; });
    log(`You pour the water into the ${vessel.name.toLowerCase()}.`);
    render();
  }
  // Silent: the vessel's label loses its water.
  function doPourOutWater(vessel){
    if(dishIn(vessel)) return;
    delete vessel.water;
    delete vessel.boilMinutes;
    render();
  }
  // A dish never leaves its vessel, so the pot is emptied of it. The line's
  // wording is retunable.
  function doPourOutDish(vessel){
    const dish = dishIn(vessel);
    if(!dish) return;
    vessel.contents = [];
    log(`You pour out the ${dish.name.toLowerCase()}.`);
    render();
  }
  // Eats `amount` of a unit (a fraction; null for whatever is left of it)
  // from the target eatTarget() picks. Restores and the poisoning chance
  // scale linearly with the amount, so eating in bites is slightly safer than
  // eating the whole — accepted. The part line's wording is retunable.
  function doConsume(sourceKind, index, amount){
    const room = world[state.currentRoom];
    const src = sourceKind === "world" ? worldSlot(room, worldTab) : invSlot(invTab);
    consumeFromList(src && src.items, index, amount);
  }
  // doConsume() on a list already resolved: the tab's list, or a vessel's
  // contents when its dish is eaten from the pot.
  function consumeFromList(list, index, amount){
    const clicked = getItemAt(list, index);
    if(!clicked || !consumeProfile(clicked)) return;
    const it = eatTarget(list, clicked);
    const fx = consumeProfile(it);
    const a = amount == null ? fx.left : Math.min(amount, fx.left);
    if(fx.restores.hunger) state.vitals.hunger = clamp(state.vitals.hunger + fx.restores.hunger * a);
    if(fx.restores.thirst) state.vitals.thirst = clamp(state.vitals.thirst + fx.restores.thirst * a);
    eatFromRow(list, it, a);
    // What is drunk from a bottle is the water, not the bottle.
    const verb = it.verb.toLowerCase(), name = fx.water ? "water" : it.name.toLowerCase();
    log(a === 1 ? `You ${verb} the ${name}.` : `You ${verb} some of the ${name}.`, "good", "consume:" + (it.itemId || it.name));
    // After the eating line, so the onset line reads as its consequence.
    rollFoodPoisoning(fx.poisoning * a);
    render();
  }
  // Opening is a transformation, not a gate on eating: a sealed can is not
  // food you may not eat yet, it is not food. Exactly one unit opens, so a
  // stack splits — `Canned soup x3` becomes x2 sealed plus x1 opened. No
  // capacity check is needed or wanted: the opened unit goes back into the
  // list the sealed one came from at the same unitWeight, so the list's
  // total is unchanged.
  function doOpen(sourceKind, index){
    const room = world[state.currentRoom];
    const src = sourceKind === "world" ? worldSlot(room, worldTab) : invSlot(invTab);
    const it = getItemAt(src && src.items, index);
    if(!it || !it.sealed) return;
    if(it.opensWith && !hasTool(it.opensWith)) return;
    const unit = dropUnits(src.items, index, 1);
    unit.sealed = false;
    // An opened perishable starts at age 0: sealed, it never aged.
    asNewlyMade(unit);
    // Through addToList() rather than a direct push, so the opened unit
    // merges into an opened stack of the same item where there is one.
    const opened = addToList(src.items, unit);
    // Follow the opened unit. Without this the detail view closes whenever
    // the last sealed unit is opened, since detailItem would still point at
    // a uid that was just spliced out.
    detailItem = { uid: ensureUid(opened), side: sourceKind };
    log(it.opensWith
      ? `You work the lid off the ${it.name.toLowerCase()}.`
      : `You break the seal on the ${it.name.toLowerCase()}.`,
      null, "open:" + (it.itemId || it.name));
    render();
  }
  function doEquip(sourceKind, index){
    const room = world[state.currentRoom];
    const src = sourceKind === "world" ? worldSlot(room, worldTab) : invSlot(invTab);
    const it = getItemAt(src && src.items, index);
    if(!it || !it.slotType) return;
    if(state[it.slotType]){ log("You're already carrying something in that slot.", "warn"); return; }
    // Refused only when it would raise the load past CARRY_HARD_LIMIT_KG.
    // What it adds is the bag's weight at its own factor less what it
    // already counts for where it sits: 0 in the world (worldSlot() has no
    // itemId, so carryFactorOf() would say 1), its source's factor in the
    // inventory. So a bag stowed in a lower-factor worn bag can add load.
    // A player already past the limit may still equip when it adds nothing.
    const srcFactor = sourceKind === "world" ? 0 : carryFactorOf(src);
    const added = itemUnitWeight(it) * (carryFactorOf(it) - srcFactor);
    if(added > 0 && playerLoad() + added > CARRY_HARD_LIMIT_KG){
      log("You can't carry any more.", "warn");
      return;
    }
    // itemId rides along so the slot stays traceable to its registry entry:
    // countInPools() can see a stowed bag by id, and doUnequip() rebuilds
    // the item from the registry rather than by hand.
    state[it.slotType] = { itemId: it.itemId, name:it.name, unitWeight:it.unitWeight,
      capacityKg:it.capacityKg, items: it.contents || [] };
    src.items.splice(index,1);
    // Silent: equipping makes a new inventory tab appear.
    invTab = it.slotType;
    render();
  }
  function doUnequip(slotKey){
    const slot = state[slotKey];
    if(!slot) return;
    // Every equippable bag takes the first branch — ITEM_REGISTRY owns what
    // a bag is, so category/slotType/capacityKg are never restated here.
    // The fallback is reached by exactly two things and is not dead code:
    // the keychain, which has no registry entry by design (see
    // CONTAINER_SLOTS), and a slot loaded from a save written before slots
    // carried itemId and not yet repaired by backfillSlotItemIds().
    const item = slot.itemId
      ? Object.assign(itemFromRegistry({ id: slot.itemId, qty:1 }), { contents: slot.items })
      : { name:slot.name, category:"Container", qty:1, unitWeight:slot.unitWeight,
          slotType:slotKey, capacityKg:slot.capacityKg, contents:slot.items };
    // No capacity or load check, by design: Unequip is always allowed, even
    // when it takes the load past CARRY_HARD_LIMIT_KG.
    addToList(state.inventory.items, item);
    state[slotKey] = null;
    if(invTab === slotKey) invTab = "inventory";
    // Silent: unequipping makes the tab disappear.
    render();
  }
  // ==================================================
  // INVENTORY / ITEM SYSTEM — item-detail action list
  // ==================================================
  // Called fresh on every render with a list/index pair that renderItemPop()
  // has already resolved via findItemByUid() for the *current* state, so the
  // resulting closures capture a correct index for this render. It still
  // validates defensively (getItemAt) so a future caller that passes a stale
  // pair fails safe instead of throwing on `undefined.qty`.
  function getItemActions(list, index, side){
    const it = getItemAt(list, index);
    if(!it) return [];
    const actions = [];
    // A stack can be transferred in parts when it merges by itemId and
    // carries no per-unit state — the same gate the single-unit button
    // already used. doTake()/doStore() accept and validate any quantity; All
    // / Half / 1 is the settled set of quantities the UI offers.
    //
    // Half rounds up (half of 7 takes 4 and leaves 3) and only appears from
    // qty 3: at qty 2 half is 1 and the button would duplicate "… 1". Both
    // are judgment calls and retunable.
    const splittable = STACKABLE.has(it.category) && !it.durability;
    if(side === "world"){
      // The Take family is disabled rather than hidden, and is a deliberate
      // exception to the rule below that an unperformable action is not
      // offered at all. Hiding Take with the keychain tab open would read as
      // "this item cannot be taken", which is false — it just cannot go
      // *there*. The greyed button says which of the two it is.
      const keychainBlocked = invTab==="keychain" && !keychainAllows(it);
      actions.push({ label:"Take All", disabled: keychainBlocked, onClick:()=>doTake(index) });
      if(splittable && it.qty>=3)
        actions.push({ label:"Take Half", disabled: keychainBlocked, onClick:()=>doTake(index, Math.ceil(it.qty/2)) });
      if(splittable && it.qty>1)
        actions.push({ label:"Take 1", disabled: keychainBlocked, onClick:()=>doTake(index,1) });
    } else {
      const verb = worldTab==="floor" ? "Place" : "Store";
      actions.push({ label: verb + " All", onClick:()=>doStore(index) });
      if(splittable && it.qty>=3)
        actions.push({ label: verb + " Half", onClick:()=>doStore(index, Math.ceil(it.qty/2)) });
      if(splittable && it.qty>1)
        actions.push({ label: verb + " 1", onClick:()=>doStore(index,1) });
    }
    // An action offered on an item you are inspecting appears only if you can
    // perform it — so Eat is absent while the item is still sealed, and Open
    // is absent when the tool it needs is not carried. The two exceptions are
    // the keychain-blocked Take above and the Crafting panel's recipe list
    // (renderCraftingPanel()), which is a catalogue and would become
    // undiscoverable if filtered.
    if(consumeProfile(it)){
      const verb = it.verb || "Use";
      const left = consumeProfile(eatTarget(list, it)).left;
      actions.push({ label: verb, onClick:()=>doConsume(side, index) });
      EAT_PARTS.forEach(part=>{
        if(part.amount < left) actions.push({ label: verb + " " + part.label, onClick:()=>doConsume(side, index, part.amount) });
      });
    }
    vesselActions(it).forEach(a=> actions.push(a));
    // An ingredient offers every vessel within reach that can take it, and a
    // bottle with water every one it can pour into, labelled per
    // vesselButtonNames().
    if(!vesselDefOf(it)){
      const near = nearbyVessels();
      const add = vesselButtonNames(near.filter(n=> canAddToVessel(list, it, n.vessel)));
      const pour = vesselButtonNames(near.filter(n=> canPourInto(it, n.vessel)));
      near.forEach(({ vessel:v })=>{
        if(add.has(v)) actions.push({ label:`Add to the ${add.get(v)}`, onClick:()=> doAddToVessel(list, index, v) });
        if(pour.has(v)) actions.push({ label:`Pour into the ${pour.get(v)}`, onClick:()=> doPourIntoVessel(list, index, v) });
      });
    }
    if(it.sealed && (!it.opensWith || hasTool(it.opensWith)))
      actions.push({ label:"Open", onClick:()=>doOpen(side, index) });
    if(canFillAtSink(it)) actions.push({ label:"Fill at the sink", onClick:()=>doFillAtSink(side, index) });
    if(it.category==="Container" && it.slotType && !state[it.slotType])
      actions.push({ label:"Equip", onClick:()=>doEquip(side, index) });
    if(it.category === "Key"){
      if(it.masterKey){
        doorsTouchingRoom(state.currentRoom).filter(doorId=>doors[doorId].building===it.building).forEach(doorId=>{
          const label = (doors[doorId].locked ? "Unlock the " : "Lock the ") + doorLabel(doorId, state.currentRoom) + " door";
          actions.push({ label, onClick:()=>doToggleLock(doorId) });
        });
      } else if(it.doorId && doors[it.doorId] && doorsTouchingRoom(state.currentRoom).includes(it.doorId)){
        const label = (doors[it.doorId].locked ? "Unlock the " : "Lock the ") + doorLabel(it.doorId, state.currentRoom) + " door";
        actions.push({ label, onClick:()=>doToggleLock(it.doorId) });
      }
    }
    // Anything that runs on batteries (the flashlight, the radio) keeps its
    // controls here.
    batteryActions(it).forEach(a=> actions.push(a));
    if(disassemblyRecipe(it)) actions.push({ label:"Disassemble", onClick:()=> doDisassemble(list, index) });
    return actions;
  }
  // The recipe a `disassemble`-tagged item takes apart by: the RECIPES entry
  // whose output it is. null when the item lacks the tag or no recipe makes
  // it, and Disassemble is offered only when this finds one.
  function disassemblyRecipe(it){
    return hasTag(it, "disassemble") && RECIPES.find(r=> r.output.id === it.itemId) || null;
  }
  // Takes one unit apart and gives back every input of its recipe at full
  // quantity, so what it returns follows the recipe. The line is the
  // registry's `disassembleLog`, read by itemId, with {qty} standing for the
  // first input's quantity; an item without one gets a plain line, whose
  // wording is retunable.
  function doDisassemble(list, index){
    const it = getItemAt(list, index);
    const recipe = it && disassemblyRecipe(it);
    if(!recipe) return;
    dropUnits(list, index, 1);
    recipe.inputs.forEach(inp=> giveItem(itemFromRegistry({ id:inp.id, qty:inp.qty })));
    const def = registryEntryOf(it);
    log(def.disassembleLog
      ? def.disassembleLog.replace("{qty}", recipe.inputs[0].qty)
      : `You take the ${it.name.toLowerCase()} apart.`, "good");
    render();
  }
  // A vessel's own actions. Holding a dish: eat it from the pot, by the
  // whole and the part, or pour it out. Otherwise: pour out its water, take
  // out any ingredient, or open the Crafting panel's Dishes on it. Fill at
  // the sink is getItemActions()'s, shared with bottles.
  function vesselActions(v){
    if(!vesselDefOf(v)) return [];
    const actions = [];
    const dish = dishIn(v);
    if(dish){

  // while after; anything else, and no container, is 1.
  function spoilageRate(container, m){
    const sinceFailure = m - POWER_FAILS_DAY * MINUTES_PER_DAY;
    if(hasTag(container, "freezer")) return sinceFailure < FREEZER_COAST_MIN ? 0 : 1;
    if(hasTag(container, "fridge")){
      if(powerOn(m)) return FRIDGE_RATE_POWERED;
      return sinceFailure < FRIDGE_COAST_MIN ? FRIDGE_RATE_COASTING : 1;
    }
    return 1;
  }
  // Whether a freezer is holding its contents frozen right now: the "(Frozen)"
  // label reads this.
  function isFrozenIn(container){
    return hasTag(container, "freezer") && spoilageRate(container, minutesSinceCollapse()) === 0;
  }
  // spoilageRate() integrated over [fromM, toM), minutes since the collapse:
  // the effective age an item gains there. The rate is constant between the
  // power failure and the ends of the two coasting windows, so the sum is
  // exact.
  function effectiveAge(container, fromM, toM){
    if(!(toM > fromM)) return 0;
    const fail = POWER_FAILS_DAY * MINUTES_PER_DAY;
    const cuts = [fail, fail + FRIDGE_COAST_MIN, fail + FREEZER_COAST_MIN]
      .filter(c=> c > fromM && c < toM).sort((x, y)=> x - y);
    let age = 0, at = fromM;
    cuts.concat([toM]).forEach(next=>{ age += spoilageRate(container, at) * (next - at); at = next; });
    return age;
  }
  // Gives a perishable without `ages` the age it would have if it had sat in
  // `container` since the collapse. A world item's starting age; an item an
  // action makes is new instead (asNewlyMade()), and a placement that sets
  // `ages` itself keeps them.
  function stampAges(it, container){
    (Array.isArray(it.contents) ? it.contents : []).forEach(c=> stampAges(c, container));
    if(!isPerishable(it) || Array.isArray(it.ages)) return;
    it.ages = new Array(it.qty).fill(effectiveAge(container, 0, minutesSinceCollapse()));
  }
  // stampAges() over every item list, each with its container. Run on a new
  // game, once the world is built — not inside makeDefaultWorld(), which
  // must stay free of state — and on load; doOpenContainer() stamps what a
  // roll adds.
  function stampMissingAges(){
    forEachItemList((list, roomId, container)=> list.forEach(it=> stampAges(it, container)));
  }
  // Keeps `ages` one per unit, oldest first, whatever wrote the row: a
  // missing age reads as new.
  function normalizeAges(row){
    const ages = (Array.isArray(row.ages) ? row.ages : []).slice(0, row.qty);
    while(ages.length < row.qty) ages.push(0);
    row.ages = ages.sort((x, y)=> y - x);
  }
  // Splits a row whose units have drifted into different freshness states
  // into one row per state, oldest first, in place. The row object keeps the
  // youngest units, so a pop-up open on it stays on the ones that did not
  // turn.
  function splitByFreshness(list, row){
    const def = registryEntryOf(row);
    while(rowFreshness(row) === "mixed"){
      const oldest = freshnessOfAge(def, row.ages[0]);
      const n = row.ages.filter(a=> freshnessOfAge(def, a) === oldest).length;
      list.splice(list.indexOf(row), 0, takeUnits(row, n));
    }

  // effective age over the step. A row that changes state is split where its
  // units now differ, and any row that changed folds into a matching row of
  // its list, so each list holds one row per item and state.
  function ageFood(dt){
    const to = minutesSinceCollapse(), from = to - dt;
    forEachItemList((list, roomId, container)=>{
      let grow = null, changed = false;
      list.slice().forEach(row=>{
        if(!isPerishable(row)) return;
        if(grow === null) grow = effectiveAge(container, from, to);
        if(!(grow > 0)) return;
        normalizeAges(row);
        const before = rowFreshness(row);
        row.ages = row.ages.map(a=> a + grow);
        if(rowFreshness(row) === before) return;
        splitByFreshness(list, row);
        changed = true;
      });
      if(changed) list.slice().forEach(row=>{ if(list.includes(row) && isPerishable(row)) remergeRow(list, row); });

  // applyHungerThirst/applyWorldTicking/applyEnergyBaseline are the pieces
  // applyDecay used to do in one shot. They're split out so Sleep (which
  // suspends the awake Energy/Stamina/Fatigue system) can run Hunger/Thirst
  // and world ticking without the awake Energy baseline, and so the
  // Stamina/Fatigue system can drive Energy's *recovery* multiplier without
  // duplicating the baseline-depletion math.
  function applyHungerThirst(min){
    state.vitals.hunger = clamp(state.vitals.hunger - DECAY.hunger*min);
    state.vitals.thirst = clamp(state.vitals.thirst - DECAY.thirst*min);
    if(state.vitals.hunger <= 0) state.vitals.health = clamp(state.vitals.health - min/STARVATION_MINUTES_PER_HEALTH);
    if(state.vitals.thirst <= 0) state.vitals.health = clamp(state.vitals.health - min/DEHYDRATION_MINUTES_PER_HEALTH);

    // id ILLNESSES does not know is left alone.
    Object.keys(state.illnesses).forEach(id=>{
      const def = ILLNESSES[id];
      const left = state.illnesses[id];
      if(!def || !(left > 0)) return;
      const tick = Math.min(min, left);
      state.vitals.health = clamp(state.vitals.health - tick/def.minutesPerHealth);
      state.illnesses[id] = left - tick;
    });
  }

  // on anywhere in the world. Where it is decides only who hears it die: a
  // carried one is "your", one in the room you are in is "the", and one
  // anywhere else shuts off silently, the way a fire elsewhere goes out.
  function applyWorldTicking(min){
    ageFood(min);
    forEachItemList((list, roomId)=>{
      list.forEach(it=>{
        if(it.on && it.durability){
          it.durability.current = Math.max(0, it.durability.current - it.drainRate*min);
          if(it.durability.current <= 0){
            it.on = false;
            const name = it.name.toLowerCase();
            if(roomId === null) log(`Your ${name} runs out of battery and shuts off.`, "warn");
            else if(roomId === state.currentRoom) log(`The ${name} runs out of battery and shuts off.`, "warn");
          }
        }
      });
    });
    tickStoveTimers(min);
    Object.keys(world).forEach(id=>{
      const r = world[id];

      if(r.heatActive) cookInHeat(r, min);

        r.fireMinutesLeft -= min;
        if(r.fireMinutesLeft <= 0){

          r.fireMinutesLeft = null;
          if(id === state.currentRoom) log("The fire burns down and goes out.", "warn");
        }
      }
    });
  }
  function applyEnergyBaseline(min, multiplier){
    state.vitals.energy = clamp(state.vitals.energy - DECAY.energy*min*multiplier);
  }
  function checkGameOver(){
    if(!gameOver && state.vitals.health <= 0){
      gameOver = true;
      log("Your body finally gives out. This is where it ends.", "warn");
    }
  }
  // ==================================================
  // STAMINA / FATIGUE SYSTEM
  // ==================================================
  // Tasks own their duration/execution/success; they only ever *declare*
  // Exertion. This module owns every rule about
  // what Exertion does to Stamina/Fatigue, and how Energy modifies or is
  // spent by recovery — keeping Stamina out of the task layer entirely.
  function applyExertion(exertion){
    if(exertion <= 0) return;
    const v = state.vitals;
    const staminaUsed = Math.min(v.stamina, exertion);
    v.stamina = Math.max(0, v.stamina - staminaUsed);
    const remainingExertion = exertion - staminaUsed;
    v.fatigue = Math.min(100, v.fatigue + remainingExertion);
    state.lastExertionMinute = state.totalMinutes;
  }
  function isExertionDelayActive(){
    return (state.totalMinutes - state.lastExertionMinute) < STAMINA_RECOVERY_DELAY_MIN;
  }
  function energyRecoveryMultiplier(){
    const e = state.vitals.energy;
    if(e >= 80) return 1.00;
    if(e >= 60) return 0.90;
    if(e >= 40) return 0.75;
    if(e >= 20) return 0.50;
    return 0.25;
  }
  function staminaMaxForEnergy(){
    const e = state.vitals.energy;
    if(e >= 40) return 100;
    if(e >= 20) return 80;
    return 50;
  }
  function hungerThirstRecoveryPenalty(){
    // Additive 15%-each penalty — never compounded multiplicatively.
    let penalty = 0;
    if(state.vitals.hunger < LOW_HUNGER_THRESHOLD) penalty += 0.15;
    if(state.vitals.thirst < LOW_THIRST_THRESHOLD) penalty += 0.15;
    return penalty;
  }
  function fatigueRecoveryAllowed(){
    // Fatigue only recovers once Stamina has reached its *current* cap —
    // this is deliberately staminaMaxForEnergy(), not a flat 100, so a
    // low-Energy Stamina cap can't be worked around.
    return state.vitals.fatigue > 0 && state.vitals.stamina >= staminaMaxForEnergy();
  }
  // The Fatigue gait lock. `state.gait` is the player's chosen pace and is
  // written in exactly one place — the pace-bar click handler. It is never
  // coerced: at FATIGUE_GAIT_LOCK the lock supplies an *effective* gait
  // instead, so the preference survives the lock and lights up again by
  // itself once Fatigue falls. Two predicates rather than one because they
  // answer different questions: gaitLocked() is what the click guard and the
  // button-disabling want, effectiveGait() is what movement pricing wants.
  // Everything that prices or charges movement must read effectiveGait() —
  // moveMinutes() and doMove()'s jog surcharge both do, which is what keeps
  // the two from disagreeing whatever order RENDERING happens to run in.
  function gaitLocked(){ return state.vitals.fatigue >= FATIGUE_GAIT_LOCK; }
  function effectiveGait(){ return gaitLocked() ? "sneak" : state.gait; }
  // One game-minute (or smaller remainder) of awake Stamina/Fatigue
  // recovery. mode "rest" uses Rest's flat rate and never adds the
  // recovery Energy surcharge; mode "normal" is the ordinary awake state.
  function recoveryStep(dt, mode){
    if(isExertionDelayActive()){ applyEnergyBaseline(dt, 1); return; }
    const cap = staminaMaxForEnergy();
    if(state.vitals.stamina < cap){
      const rate = mode === "rest"
        ? REST_STAMINA_RATE
        : BASELINE_STAMINA_RATE * energyRecoveryMultiplier() * (1 - hungerThirstRecoveryPenalty());
      state.vitals.stamina = Math.min(cap, state.vitals.stamina + rate*dt);
      applyEnergyBaseline(dt, mode === "rest" ? 1 : 2);
    } else if(fatigueRecoveryAllowed()){
      state.vitals.fatigue = Math.max(0, state.vitals.fatigue - FATIGUE_RECOVERY_RATE*dt);
      applyEnergyBaseline(dt, mode === "rest" ? 1 : 4);
    } else {
      applyEnergyBaseline(dt, 1);
    }
  }
  // The Energy ceiling this Sleep can reach: Fatigue caps how much rest is
  // worth. Read by doSleep(), estimateSleepMinutes() and sleepRestoresEnergy().
  function sleepEnergyCeiling(){ return clamp(100 - state.vitals.fatigue); }
  // Sleep is unavailable for two separate reasons, kept separate so
  // RENDERING can say which one applies. sleepRestoresEnergy() is false
  // whenever the Sleep would restore nothing — including at Fatigue 100,
  // where the ceiling is 0 and no Energy is ever below it. That state is
  // worked off through recoveryStep() instead, which is the intended price
  // of never handing out a free Fatigue wipe for a zero-length Sleep.
  function sleepOffCooldown(){ return state.totalMinutes >= state.lastWakeMinute + SLEEP_COOLDOWN_MIN; }
  function sleepRestoresEnergy(){ return state.vitals.energy < sleepEnergyCeiling(); }
  function sleepAvailable(){ return sleepOffCooldown() && sleepRestoresEnergy(); }
  function estimateSleepMinutes(){
    const missing = Math.max(0, sleepEnergyCeiling() - state.vitals.energy);
    return missing / SLEEP_ENERGY_RATE;
  }
  // Advances awake game time in <=1-minute steps so the Stamina/Fatigue
  // recovery delay (exactly 1 game minute) and the Energy-driven recovery
  // bands are evaluated at natural resolution instead
  // of being approximated over an arbitrarily long jump.
  function runAwakeStep(min){
    let remaining = min;
    while(remaining > 1e-9){
      const dt = Math.min(1, remaining);
      state.totalMinutes += dt;
      applyHungerThirst(dt);
      applyWorldTicking(dt);
      recoveryStep(dt, "normal");
      remaining -= dt;
    }
  }
  // Collapsing at zero Energy. Every COLLAPSE_BLACKOUT_EVERY-th collapse is
  // the long one; the others are a stumble. Balance values, retunable.
  const COLLAPSE_BLACKOUT_EVERY = 3;
  const COLLAPSE_BLACKOUT_MIN = 300;
  const COLLAPSE_BLACKOUT_ENERGY = 90;    // Energy set to, not added
  const COLLAPSE_STUMBLE_MIN = 20;
  const COLLAPSE_STUMBLE_ENERGY = 30;     // Energy added, not set
  function advanceTime(min){
    runAwakeStep(min);
    if(state.vitals.energy <= 0){
      state.collapseCount += 1;
      if(state.collapseCount % COLLAPSE_BLACKOUT_EVERY === 0){
        log("Your body gives out completely. You black out — hours pass before you come to, disoriented and vulnerable.", "warn");
        runAwakeStep(COLLAPSE_BLACKOUT_MIN); state.vitals.energy = clamp(COLLAPSE_BLACKOUT_ENERGY);
      } else {
        log("Exhaustion drops you where you stand. A few minutes pass before you can get up.", "warn");
        runAwakeStep(COLLAPSE_STUMBLE_MIN); state.vitals.energy = clamp(state.vitals.energy + COLLAPSE_STUMBLE_ENERGY);
      }
    }
    checkGameOver();
  }
  // ==================================================
  // CRAFTING
  // ==================================================
  // Crafting reaches the room, not only your pockets. The item lists it
  // reaches, in the order a non-perishable input is taken from them: the
  // inventory pools, then the room's floor, then the containers the Here
  // panel lists (listedContainers()), authored ones first. Never the inside
  // of a floor bag or of a vessel, and never a container that has not rolled
  // yet, which counts as empty: crafting does not trigger a roll.
  function nearbyLists(){
    const room = world[state.currentRoom];
    return invPools().concat([room.floor],
      listedContainers(room).filter(c=> !(c.spawnPools && !c.spawnRolled)).map(c=> c.items));
  }
  // Whether a row can serve as `input`: the same item, in the input's cook
  // state when it names one.
  function inputMatches(it, input){
    return it.itemId === input.id && (!input.cookState || cookStateOf(it) === input.cookState);
  }
  function countNearby(input){
    return nearbyLists().reduce((sum, list)=> sum + list.filter(it=> inputMatches(it, input)).reduce((s, it)=> s + it.qty, 0), 0);
  }
  // Takes `input`'s units from nearby and returns them. Perishable units go
  // oldest first across every list, and a tie goes to the list reached
  // first; units that do not age go in list order, the inventory's first.
  // One sort does both, since a unit that does not age sorts as the same age
  // as every other.
  function takeNearby(input){
    const units = [];
    nearbyLists().forEach((list, li)=> list.forEach(row=>{
      if(!inputMatches(row, input)) return;
      const ages = isPerishable(row) ? unitAges(row) : null;
      for(let u = 0; u < row.qty; u++) units.push({ list, row, li, age: ages ? ages[u] : -1 });
    }));
    units.sort((a, b)=> b.age - a.age || a.li - b.li);
    const perRow = new Map();
    units.slice(0, input.qty).forEach(u=>{ perRow.set(u.row, { list:u.list, n:(perRow.get(u.row) || { n:0 }).n + 1 }); });
    const taken = [];
    // A row's units are kept oldest first, so the n oldest picked from a row
    // are exactly the n dropUnits() takes.
    perRow.forEach((pick, row)=> taken.push(dropUnits(pick.list, pick.list.indexOf(row), pick.n)));
    return taken;
  }
  function canCraft(recipe){
    const hasAll = recipe.inputs.every(inp => countNearby(inp) >= inp.qty);
    if(!hasAll) return false;
    // The tool is carried, as every tool check is (hasTool()). The heat gate
    // is one no recipe sets today; it stays because it is the declared shape
    // a recipe uses to demand a heat source.
    if(recipe.tool && !hasTool(recipe.tool)) return false;
    if(recipe.needsHeat && !roomHasHeat(world[state.currentRoom])) return false;
    return true;
  }
  // What a recipe makes lands on the room's floor, always — over floorCap
  // too, with the heap warning. A perishable output is the same flesh as
  // what it was made from: it takes the age of the oldest perishable unit
  // used, and is new only when none was.
  function doCraft(recipeId){
    const recipe = RECIPES.find(r=>r.id===recipeId);
    if(!recipe || !canCraft(recipe)) return;
    const used = [];
    recipe.inputs.forEach(inp=> takeNearby(inp).forEach(u=> used.push(u)));
    advanceTime(recipe.minutes);
    const crafted = itemFromRegistry({ id: recipe.output.id, qty:1 });
    if(isPerishable(crafted)){
      const ages = used.filter(isPerishable).map(u=> unitAges(u)[0]);
      crafted.ages = [ages.length ? Math.max(...ages) : 0];
    }
    const room = world[state.currentRoom];
    if(room.floorCap && totalWeight(room.floor) + itemWeight(crafted) > room.floorCap) logHeap(crafted);
    addToList(room.floor, crafted);
    log(recipe.doneLog || `You craft a ${crafted.name.toLowerCase()}.`, "good", "craft:" + recipe.output.id);
    render();
  }
  // ==================================================
  // FIRE / COOKING
  // ==================================================
  // Action durations in game minutes. ACTIONS spends these and RENDERING
  // prints them on the buttons, so the two cannot drift apart.
  const FISH_DURATION_MIN = 20;
  // Fishing is deliberately net positive on Stamina at full Energy: 20 minutes
  // of baseline recovery against 8 spent. Not derived from its duration the
  // way chopping is — the margin is the point, and the number is a balance
  // value retunable on its own.
  const FISH_EXERTION = 8;
  const LIGHT_STOVE_MIN = 5;
  const BUILD_FIRE_MIN = 10;
  const DISMANTLE_CAMPFIRE_MIN = 10;      // shares a value with BUILD_FIRE_MIN; a separate fact
  const CHOP_TREE_MIN = 30;
  // Chopping is deliberately break-even on Stamina at full Energy: a chop
  // spends exactly what its own duration recovers at the awake baseline rate,
  // so it is sustainable while rested and bites only once low Energy or low
  // Hunger/Thirst pull the recovery multiplier down. Written as the product
  // rather than as a literal so the relationship survives a retune of either
  // input — the relationship is the rule, not the number.
  const CHOP_TREE_EXERTION = CHOP_TREE_MIN * BASELINE_STAMINA_RATE;
  // Fire fuel. A burn is its wood spent at the per-piece rate, so the two
  // stay in step when either is retuned. A first fire comes out of the
  // campfire kit and burns CAMPFIRE_KIT_COST pieces' worth, since that is
  // the wood the kit was crafted from; a rebuild in an already-built
  // campfire costs FIRE_BUILD_WOOD loose firewood. FIRE_MAX_MIN is its own
  // fact — a cap on banked burn time, not a wood count.
  const FIRE_BUILD_WOOD = 3;
  const FIRE_MINUTES_PER_WOOD = 60;
  const FIRE_MAX_MIN = 360;
  // Dismantling a campfire refunds this much firewood, plus every whole
  // piece's worth of fuel still in it (doDismantleCampfire()). Retunable, but
  // not freely: with today's values build → put out → dismantle breaks
  // exactly even, n firewood in and n out, only because doBuildFire() burns
  // the fire during BUILD_FIRE_MIN and this baseline is at most one piece of
  // fuel. Raising it, or making the build free, turns the cycle into a
  // firewood source.
  const CAMPFIRE_DISMANTLE_BASE_WOOD = 1;
  const HEAT_CONTAINER_CAPACITY_KG = 8;   // stove and campfire alike
  const CHOP_TREE_FIREWOOD = 6;
  const FISH_BITE_CHANCE = 0.55;          // balance value, retunable
  function doFish(){
    advanceTime(FISH_DURATION_MIN);
    applyExertion(FISH_EXERTION);
    // Keyed on game time *after* the cast, and that is the save-scum rule:
    // repeating the cast from a reloaded save lands on the same minute and
    // reproduces the bite, while spending any time first — walking, resting,
    // chopping — moves the minute and genuinely rerolls.
    if(chance(FISH_BITE_CHANCE, "fish", state.currentRoom, state.totalMinutes)){
      giveItem(asNewlyMade(itemFromRegistry({ id:"fish", qty:1 })));
      log("Something bites. You reel in a fish.", "good", "fish", "bite");
    } else {
      log("Nothing bites this time.", null, "fish", "miss");
    }
    render();
  }
  // Creates the container with `tags` when the room has none with this id.
  // One that already exists is returned as it is. Its only caller is
  // doBuildFire(): a stove's container is authored, and lighting it creates
  // nothing (see doLightStove()).
  function ensureHeatContainer(room, id, name, capacityKg, tags){
    let c = room.containers.find(x=>x.id===id);
    if(!c){ c = { id, name, capacityKg, tags, items:[] }; room.containers.push(c); }
    return c;
  }
  // Lights the room's stove, the authored container roomStove() finds. It
  // never creates a container: making one by id is how 1A's kitchen, whose
  // stove is `stove1a`, grew a second, empty "Stove" tab when lit (#177).
  // A gas stove lights itself, so it needs no fire-starter and spends none
  // (#234): only a campfire does.
  function doLightStove(){
    const room = world[state.currentRoom];
    if(!roomStove(room)) return;
    room.heatActive = true;
    advanceTime(LIGHT_STOVE_MIN);
    log("You light the stove.", "good");
    render();
  }
  function canBuildFire(room){
    if(room.campfireBuilt) return room.fireMinutesLeft > 0 || countInPools("firewood") >= FIRE_BUILD_WOOD;
    // A kit carries its own first load of wood, so a first fire needs nothing else.
    return countInPools("campfire_kit") >= 1;
  }
  function doBuildFire(){
    const room = world[state.currentRoom];
    if(!canBuildFire(room)) return;
    if(!consumeMatchUse()) return;
    const firstTime = !room.campfireBuilt;
    // banked is hoisted above the branch because the log ternary below
    // reads it. Same value as before: on a first build fireMinutesLeft is
    // undefined, and `undefined > 0` was already false.
    const banked = !firstTime && room.fireMinutesLeft > 0;
    if(firstTime){
      consumeFromPools("campfire_kit", 1);
      room.campfireBuilt = true;

      // wood — it costs no loose firewood on top.
      room.fireMinutesLeft = CAMPFIRE_KIT_COST * FIRE_MINUTES_PER_WOOD;
    } else if(!banked){
      consumeFromPools("firewood", FIRE_BUILD_WOOD);
      room.fireMinutesLeft = FIRE_BUILD_WOOD * FIRE_MINUTES_PER_WOOD;
    }
    ensureHeatContainer(room, "campfire", "Campfire", HEAT_CONTAINER_CAPACITY_KG, ["heat"]);
    room.heatActive = true;
    advanceTime(BUILD_FIRE_MIN);
    log(firstTime ? "You set up the campfire kit and get a fire going."
      : (banked ? "You relight the fire from what's left of the wood." : "You get a fire going."), "good");
    render();
  }
  function doAddFuel(){
    if(countInPools("firewood") < 1) return;
    const room = world[state.currentRoom];
    consumeFromPools("firewood", 1);
    room.fireMinutesLeft = Math.min((room.fireMinutesLeft || 0) + FIRE_MINUTES_PER_WOOD, FIRE_MAX_MIN);
    log("You feed the fire more wood.", "good", "fuel");
    render();
  }
  function doExtinguish(){
    const room = world[state.currentRoom];
    room.heatActive = false;
    log("You put it out.");
    render();
  }
  function doDismantleCampfire(){
    const room = world[state.currentRoom];
    if(!room.campfireBuilt || room.heatActive) return;

    const container = room.containers.find(c=>c.id==="campfire");

    giveItem(itemFromRegistry({ id:"firewood", qty:refund }));
    room.campfireBuilt = false;
    room.fireMinutesLeft = null;
    advanceTime(DISMANTLE_CAMPFIRE_MIN);
    log(`You break down the campfire, salvaging ${refund} firewood from it.`, "good");
    render();
  }
  // The room's cooking space: its first container tagged `heat`, a stove's
  // or a campfire's (see CONTAINER SCHEMA).
  function getHeatContainer(room){
    return room.containers.find(c=> hasTag(c, "heat"));
  }
  // The room's stove: its container tagged both `device` and `heat`, or null.
  // Every question about a stove asks this. A room has one exactly when this
  // finds it, since there is no room flag for it.
  function roomStove(room){
    return room.containers.find(c=> hasTag(c, "device") && hasTag(c, "heat")) || null;
  }
  // Cooking is passive: nothing is cooked by a button. Every tick the heat
  // is on, each raw cookable row lying directly in the room's heat
  // containers — or in a vessel there — gains `cookMinutes`, and at its
  // entry's `cooks.minutes` it turns Cooked, drops its progress and folds
  // into any matching cooked row.
  // The counter stops there in this release; burning (#179) will extend it.
  // Progress lives on the item, so it holds when the heat stops, and an item
  // taken out and put back continues from where it was. Nothing is logged,
  // anywhere: knowing is the player's job, through the stove timer or the
  // Wait button.
  // TICK_EPSILON absorbs the float left over when a duration is stepped in
  // fractional minutes, so a wait of exactly the remaining time finishes the
  // cooking, or runs a timer down, that it was sized for.
  const TICK_EPSILON = 1e-9;
  function cookInHeat(room, dt){
    room.containers.filter(c=> hasTag(c, "heat")).forEach(c=>{
      c.items.slice().forEach(it=>{
        if(vesselDefOf(it)) cookVessel(it, dt);
        else cookItem(c.items, it, dt);
      });
    });
  }
  function cookItem(list, it, dt){
    if(cookStateOf(it) !== "raw") return;
    it.cookMinutes = (it.cookMinutes || 0) + dt;
    if(it.cookMinutes < cookMinutesOf(it) - TICK_EPSILON) return;
    it.cookState = "cooked";
    delete it.cookMinutes;
    // Cooked food starts Fresh.
    if(isPerishable(it)) it.ages = new Array(it.qty).fill(0);
    remergeRow(list, it);
  }
  function cookMinutesOf(it){ return registryEntryOf(it).cooks.minutes; }
  function cookRemaining(it){ return Math.max(0, cookMinutesOf(it) - (it.cookMinutes || 0)); }
  // VESSELS AND DISHES. A vessel (registry `vessel`: kind, capacityKg,
  // waterKg) holds ingredients in its `contents` — or, once a dish has
  // formed, that one dish — and, when waterKg is above 0, water: `water:
  // { kind }` while full, absent when not. A vessel has no fill level.
  function vesselDefOf(it){ const def = registryEntryOf(it); return def && def.vessel || null; }
  function ingredientOf(it){ const def = registryEntryOf(it); return def && def.ingredient || null; }
  function isDish(it){ const def = registryEntryOf(it); return !!(def && def.dish); }
  // The dish a vessel holds, or null while it holds ingredients or nothing.
  function dishIn(v){
    const c = v.contents;
    return Array.isArray(c) && c.length === 1 && isDish(c[0]) ? c[0] : null;
  }
  // One entry per unit of `rows`, each the row it belongs to: a template
  // counts units, and a quarter of rice is one.
  function contentUnits(rows){
    const out = [];
    rows.forEach(r=>{ for(let i = 0; i < r.qty; i++) out.push(r); });
    return out;
  }
  // Whether an ingredient falls in a template's `allowed` or `counts` set.
  function inIngredientSet(set, it){
    const ing = ingredientOf(it);
    if(!ing) return false;
    return set.ids ? set.ids.includes(it.itemId) : set.roles.includes(ing.role);
  }
  // Where a vessel stands against a template: whether the template is for
  // this kind of vessel, whether something in it rules the dish out, how
  // many counting units it has of how many it needs, and whether its water
  // is right. `ready` is the three together: heat it and this dish forms,
  // unless an earlier template forms first. Tainted water is not ready — it
  // must boil first — but `waterBoils` says it will be.
  function templateStatus(t, kind, rows, water){
    const units = contentUnits(rows);
    const target = t.exactly != null ? t.exactly : t.min;
    const blocked = units.some(u=> !inIngredientSet(t.allowed, u))
      || (t.exactly != null && units.length > t.exactly);
    const have = units.filter(u=> inIngredientSet(t.counts || t.allowed, u)).length;
    const waterOk = t.water ? water === "clean" : !water;
    const applies = t.vessels.includes(kind);
    return { applies, blocked, have, target, need: Math.max(0, target - have), waterOk,
      waterBoils: t.water && water === "tainted",
      ready: applies && !blocked && have >= target && waterOk };
  }
  // The template a vessel's contents and water make, the first in order.
  function matchingTemplate(v){
    const kind = vesselDefOf(v).kind, rows = v.contents || [], water = waterKindOf(v);
    return DISH_TEMPLATES.find(t=> templateStatus(t, kind, rows, water).ready) || null;
  }
  // One unit's contribution to a dish, in restores: the ingredient's own
  // `restores` when it has them, else its Cooked restores for a cookable
  // item, else its restores — at ROTTEN_RESTORES_FACTOR when Rotten, and at
  // its portion.
  function ingredientContribution(it){
    const def = registryEntryOf(it);
    const base = def.ingredient.restores || (def.cooks && def.cooks.restores) || def.restores || {};
    const k = (unitFreshness(it) === "rotten" ? ROTTEN_RESTORES_FACTOR : 1) * portionOf(it);
    return scaleRestores(base, k);
  }
  // The one scalar measure of how much a food restores, used to rank and
  // share out a dish's ingredients.
  function restoresValue(r){ return (r && r.hunger || 0) + (r && r.thirst || 0); }
  // A food's own food-poisoning chance in a cook state: a cookable item's
  // Raw or Cooked chance, anything else's one chance.
  function ownPoisoning(def, cookState){
    return cookState === "cooked" && def.cooks ? (def.cooks.foodPoisoningChance || 0) : (def.foodPoisoningChance || 0);
  }
  // Builds a dish from `rows` for template `t`, with `waterKg` of water in it.
  // The one dish builder: formation and the world's spawned stews both come
  // through here (formDish(), dishFrom()).
  //   restores       the units' contributions summed, per vital, times
  //                  (1 + DISH_RESTORES_BONUS)
  //   foodPoisoning  { raw, cooked }: per state, the unit whose chance is
  //                  highest — its own for that state, combined with the
  //                  rotten baseline when Rotten — weighted by that unit's
  //                  share of what the dish restores
  //   unitWeight     the rows' weight plus the water's
  //   name           "<A> stew" or "<A> and <b> stew" from the two labels
  //                  that contribute most, or the entry's own name for a
  //                  template that is not `named`
  function buildDish(t, rows, waterKg){
    const dish = itemFromRegistry({ id:t.item, qty:1 });
    const units = contentUnits(rows).map(u=> ({ u, c: ingredientContribution(u) }));
    const restores = {};
    units.forEach(({ c })=> Object.keys(c).forEach(v=>{ restores[v] = (restores[v] || 0) + c[v]; }));
    Object.keys(restores).forEach(v=>{ restores[v] *= 1 + DISH_RESTORES_BONUS; });
    const total = restoresValue(restores);
    const chanceIn = (cookState)=>{
      let best = null;
      units.forEach(({ u, c })=>{
        const p = combinePoisoning(ownPoisoning(registryEntryOf(u), cookState), rottenPoisoningTerm(u));
        if(!best || p > best.p) best = { p, c };
      });
      return best && total > 0 ? best.p * restoresValue(best.c) / total : 0;
    };
    dish.restores = restores;
    dish.foodPoisoning = { raw: chanceIn("raw"), cooked: chanceIn("cooked") };
    dish.unitWeight = totalWeight(rows) + waterKg;
    dish.portion = 1;
    if(t.named) dish.name = dishName(t, units);
    return dish;
  }
  // Groups the units by ingredient label, summing what each label
  // contributes, so a label that repeats counts once; the top one or two
  // name the dish, first capitalised and second lowercase.
  function dishName(t, units){
    const byLabel = new Map();
    units.forEach(({ u, c })=>{
      const label = ingredientOf(u).label;
      byLabel.set(label, (byLabel.get(label) || 0) + restoresValue(c));
    });
    const top = Array.from(byLabel.entries()).sort((a, b)=> b[1] - a[1]).slice(0, 2).map(e=> e[0]);
    const words = top.map((l, i)=> i === 0 ? l.charAt(0).toUpperCase() + l.slice(1) : l.toLowerCase());
    return words.join(" and ") + " " + ITEM_REGISTRY[t.item].name.toLowerCase();
  }
  // A dish made from fresh units of `ids` for template `templateId`, in the
  // named vessel's water, in `cookState`: the world's pots of stew. It gets
  // its age like any world item, from stampMissingAges().
  function dishFrom(templateId, vesselId, ids, cookState){
    const t = DISH_TEMPLATES.find(x=> x.id === templateId);
    const dish = buildDish(t, ids.map(id=> itemFromRegistry({ id, qty:1 })),
      t.water ? ITEM_REGISTRY[vesselId].vessel.waterKg : 0);
    dish.cookState = cookState;
    if(cookState === "raw") dish.cookMinutes = 0;
    return dish;
  }
  // Formation: the contents and the water become one raw dish, the vessel's
  // only content, new and Fresh. From then on nothing can be taken out.
  function formDish(v, t){
    const dish = buildDish(t, v.contents || [], t.water ? vesselDefOf(v).waterKg : 0);
    dish.ages = [0];
    dish.cookState = "raw";
    dish.cookMinutes = 0;
    v.contents = [dish];
    delete v.water;
    delete v.boilMinutes;
  }
  // One tick of a vessel in a lit heat container. Tainted water boils:
  // BOIL_MINUTES make it clean, and the count holds when the heat stops. Then
  // a vessel still without a dish forms one if its contents now match a
  // template. Then whatever it holds cooks: the dish, or, when nothing
  // matched, each ingredient by its own `cooks`. Nothing is logged.
  function cookVessel(v, dt){
    if(!dishIn(v)){
      if(waterKindOf(v) === "tainted"){
        v.boilMinutes = (v.boilMinutes || 0) + dt;
        if(v.boilMinutes >= BOIL_MINUTES - TICK_EPSILON){ v.water.kind = "clean"; delete v.boilMinutes; }
      }
      const t = matchingTemplate(v);
      if(t) formDish(v, t);
    }
    const list = v.contents || [];
    list.slice().forEach(it=> cookItem(list, it, dt));
  }
  // What the room's heat is cooking that will finish soonest: { name,
  // remaining, water } for whatever has the least time left among everything
  // still progressing in its heat container — a raw cookable item, a vessel's
  // raw dish, one that will form, the ingredients cooking alone in a vessel
  // no dish matches, or tainted water boiling (`water` true) — or null when
  // nothing is.
  function soonestCooking(room){
    const heat = getHeatContainer(room);
    if(!heat) return null;
    let best = null;
    const consider = (name, remaining, water)=>{
      if(!best || remaining < best.remaining) best = { name, remaining, water:!!water };
    };
    const rawRows = (list)=> list.forEach(it=>{ if(cookStateOf(it) === "raw") consider(it.name.toLowerCase(), cookRemaining(it)); });
    heat.items.forEach(it=>{
      if(!vesselDefOf(it)){ rawRows([it]); return; }
      const dish = dishIn(it);
      if(dish){ rawRows([dish]); return; }
      if(waterKindOf(it) === "tainted") consider("water", Math.max(0, BOIL_MINUTES - (it.boilMinutes || 0)), true);
      const t = matchingTemplate(it);
      if(t){
        const water = t.water ? vesselDefOf(it).waterKg : 0;
        consider(buildDish(t, it.contents || [], water).name.toLowerCase(), cookMinutesOf({ itemId:t.item }));
      } else rawRows(it.contents || []);
    });
    return best;
  }
  // Whether the Wait can be offered: the heat is on, something is cooking,
  // and the heat will outlast it — always for a stove, which never runs out,
  // and for a fire only while its fuel covers the wait.
  function waitForCookingTarget(room){
    if(!room.heatActive) return null;
    const next = soonestCooking(room);
    if(!next) return null;
    if(room.fireMinutesLeft != null && room.fireMinutesLeft < next.remaining) return null;
    return next;
  }
  // The stove timer: an analog kitchen timer on the stove container, in
  // minutes (`timerMinutes`, absent = 0). Its device pop-up's buttons add
  // STOVE_TIMER_STEPS minutes a press, with no clear, no subtract and no cap.
  // It needs neither the stove on nor power, and turns nothing off. When it
  // runs down it rings, heard anywhere in the stove's building: the player's
  // room must have a `building`, and the same one. Otherwise it rings unheard.
  // The ring's wording is Tom's.
  function doAddStoveTimer(minutes){
    const stove = roomStove(world[state.currentRoom]);
    if(!stove) return;
    stove.timerMinutes = (stove.timerMinutes || 0) + minutes;
    // Silent: the timer readout shows the new time.
    render();
  }
  function tickStoveTimers(dt){
    const here = world[state.currentRoom];
    Object.keys(world).forEach(id=>{
      const room = world[id];
      room.containers.forEach(c=>{
        if(!(c.timerMinutes > 0)) return;
        c.timerMinutes -= dt;
        if(c.timerMinutes > TICK_EPSILON) return;
        c.timerMinutes = 0;
        if(here.building && here.building === room.building) log("You hear the ringing sound of the timer.");
      });
    });
  }
  // Waits out the soonest-finishing item. Not interruptible (#212). The log
  // line's wording is retunable.
  function doWaitForCooking(){
    const next = waitForCookingTarget(world[state.currentRoom]);
    if(!next) return;
    advanceTime(next.remaining);
    log("You keep an eye on it.", null, "wait");
    render();
  }
  function doChopTree(){
    if(!hasTool("chopping")) return;
    const room = world[state.currentRoom];
    advanceTime(CHOP_TREE_MIN);
    applyExertion(CHOP_TREE_EXERTION);
    room.hasTree = false;
    giveItem(itemFromRegistry({ id:"firewood", qty:CHOP_TREE_FIREWOOD }));
    log("You chop the tree down. It splits into a good stock of firewood.", "good", "chop");
    render();
  }
  // ==================================================
  // PERSISTENCE
  // ==================================================
  // Save format: { version, state, world, doors, windows }. _uid is not
  // persisted specially — resyncUidCounter() scans
  // every item location after a load so newly-created items during the next
  // session keep getting unique ids, and ensureUid() lazily assigns one to
  // any loaded item that predates the uid system.
  function serializeGame(){ return JSON.stringify({ version: GAME_CONFIG.VERSION, state, world, doors, windows }, null, 2); }
  // forEachItemList(): calls visit(list, roomId) once for every item array
  // reachable from the current `state` and `world` — the inventory pools,
  // every room's floor, containers and car containers, and the `contents` of
  // any item in any of those, to any depth. Every scan over item lists goes
  // through this rather than walking them by hand: a hand-rolled walk is how a
  // stowed bag's contents gets missed. It reads `state` and `world` at call
  // time. `roomId` says where the list is: the id of the room it is in, or
  // null when it is carried, and `contents` inherits its bag's answer. The
  // third argument, `container`, is the room container the list is in or
  // nested under — an authored or car container — or null for the floor, a
  // floor bag and anything carried. A caller that only needs the list
  // ignores both.
  function forEachItemList(visit){
    const walk = (list, roomId, container)=>{
      if(!Array.isArray(list)) return;
      visit(list, roomId, container);
      list.forEach(it=>{ if(it && Array.isArray(it.contents)) walk(it.contents, roomId, container); });
    };
    invPools().forEach(list=> walk(list, null, null));
    Object.keys(world).forEach(roomId=>{
      const room = world[roomId];
      walk(room.floor, roomId, null);
      (room.containers || []).forEach(c=>walk(c.items, roomId, c));
      (room.carContainers || []).forEach(c=>walk(c.items, roomId, c));
    });
  }
  function resyncUidCounter(){
    let maxSeen = 0;
    forEachItemList(list=> list.forEach(it=>{
      if(it && it._uid){
        const n = parseInt(String(it._uid).replace(/^u/, ""), 10);
        if(!isNaN(n) && n > maxSeen) maxSeen = n;
      }
    }));
    _uidCounter = maxSeen + 1;
  }
  // backfillItemIds(): companion to resyncUidCounter(), run alongside it on
  // every load. Older saves predate ITEM_REGISTRY's itemId field — this
  // assigns itemId to any loaded item missing it, by reverse name match
  // against ITEM_REGISTRY (current registry names are unique, so this is
  // unambiguous). Items with no registry match are left without itemId and
  // keep working exactly as before via _uid/list position.
  function backfillItemIds(){
    const nameToId = {};
    Object.keys(ITEM_REGISTRY).forEach(id=>{ nameToId[ITEM_REGISTRY[id].name] = id; });
    forEachItemList(list=> list.forEach(it=>{
      if(it && !it.itemId && nameToId[it.name]) it.itemId = nameToId[it.name];
    }));
  }
  // backfillLocationIds(): companion to backfillItemIds(), run alongside it
  // on every load. Older saves (pre-v0.2.9) predate the locationId field —
  // this assigns it to any loaded room missing it, by direct room-id lookup
  // against a freshly-built default world. Unlike backfillItemIds()'s name
  // matching, room ids are stable, so this is an unambiguous key lookup.
  function backfillLocationIds(){
    const defaults = makeDefaultWorld();
    Object.keys(world).forEach(roomId=>{
      const room = world[roomId];
      if(room && !room.locationId && defaults[roomId]){
        room.locationId = defaults[roomId].locationId;
      }
    });
  }
  // backfillContainerFields(): companion to backfillLocationIds(), run
  // alongside it on every load. Older saves (pre-v0.4.0) predate both
  // spawnPools and spawnRolled entirely — for any loaded container whose
  // matching default-world container has spawnPools, this copies
  // spawnPools (if missing) the same way backfillLocationIds() copies a
  // missing locationId, then copies spawnRolled (if missing) to match the
  // default. That ordering matters: without spawnPools also being
  // restored, doOpenContainer()'s `container.spawnPools && ...` guard
  // could never fire for anything loaded from an old save, silently
  // defeating the roll entirely rather than just mistiming it. The net
  // effect: an old save's already-populated container doesn't become
  // eligible for an auto-roll it was never meant to get, and a still-empty
  // one does get a chance to roll on next open.
  function backfillContainerFields(){
    const defaults = makeDefaultWorld();
    Object.keys(world).forEach(roomId=>{
      const room = world[roomId];
      const defaultRoom = defaults[roomId];
      if(!room || !defaultRoom) return;
      const scan = (containers, defaultContainers)=>{
        (containers || []).forEach(c=>{
          const dc = (defaultContainers || []).find(x=>x.id===c.id);
          if(!dc || !dc.spawnPools) return;
          if(c.spawnPools === undefined) c.spawnPools = dc.spawnPools;
          if(c.spawnRolled === undefined) c.spawnRolled = dc.spawnRolled;
        });
      };
      scan(room.containers, defaultRoom.containers);
      // No car container carries spawnPools today, so this second scan
      // can copy nothing — kept for a car container that gains one later,
      // since scan() already returns early when there is nothing to copy.
      scan(room.carContainers, defaultRoom.carContainers);
    });
  }
  // validateLoadedWorld(): the shape check a load must pass before anything
  // is committed. Unlike validateItemRegistry()/validateLocations() below,
  // which are dev-only console helpers, this is wired into a real code path
  // and runs on every load — hence its place here in PERSISTENCE beside the
  // backfills rather than in the dev-helper block.
  //
  // It covers exactly the shapes that make resyncUidCounter(), the load-time
  // backfills or render() throw, and no more. This is a shape check, not a
  // schema validator: a save that is merely out of date is the backfills'
  // problem, and they run only once this has passed. Returns an array of
  // problem strings, empty on success — the shape its two siblings use.
  function validateLoadedWorld(nextWorld, nextState){
    const problems = [];
    Object.keys(nextWorld).forEach(roomId=>{
      const room = nextWorld[roomId];
      if(!room){ problems.push(`${roomId}: room is missing`); return; }
      if(!Array.isArray(room.floor)) problems.push(`${roomId}: floor is not an array`);
      if(!Array.isArray(room.exits)) problems.push(`${roomId}: exits is not an array`);
      if(!Array.isArray(room.containers)) problems.push(`${roomId}: containers is not an array`);
      // carContainers is optional on a room and stays optional — only a
      // present one is checked.
      if(room.carContainers !== undefined && !Array.isArray(room.carContainers)){
        problems.push(`${roomId}: carContainers is present but not an array`);
      }
    });
    if(!nextState.inventory || !Array.isArray(nextState.inventory.items)){
      problems.push("state.inventory: no items array");
    }
    CONTAINER_SLOTS.forEach(slot=>{
      const bag = nextState[slot];
      if(bag && !Array.isArray(bag.items)) problems.push(`state.${slot}: no items array`);
    });
    return problems;
  }
  // A load is all-or-nothing: the four module bindings are assigned only
  // once the incoming data has passed validateLoadedWorld(). A save that
  // fails leaves the running session exactly as it was, so the player can
  // keep playing — the old order committed `world` first and a throw in a
  // backfill left a half-loaded world on screen with no way back but
  // Restart.
  // backfillRoomAddresses(): companion to backfillLocationIds(), run
  // alongside it on every load. roomLabel() now composes from `address`, a
  // field no save made before it shipped carries — without this, every room in
  // such a save renders "undefined, ...". It keys off `address === undefined`
  // rather than falsiness: an address is never empty, and `undefined` is what
  // distinguishes "this save predates the field" from any other state. It
  // copies all four label fields rather than just `address`, because this is
  // not a pure field addition — `building`'s meaning narrowed, and six rooms
  // moved their name out of `room`, so restoring `address` alone would leave
  // cornerstore reading "Main St, Corner Store, Corner Store". All four are
  // static content that nothing mutates at runtime (roomLabel() is their only
  // reader), so taking them wholesale from the defaults is both safe and the
  // only version that produces a correct label. `shelter` gets no backfill:
  // nothing reads it, so an old save's rooms lacking it changes nothing.
  function backfillRoomAddresses(){
    const defaults = makeDefaultWorld();
    Object.keys(world).forEach(roomId=>{
      const room = world[roomId];
      if(room && room.address === undefined && defaults[roomId]){
        room.address  = defaults[roomId].address;
        room.building = defaults[roomId].building;
        room.area     = defaults[roomId].area;
        room.room     = defaults[roomId].room;
      }
    });
  }
  // backfillSlotItemIds(): companion to backfillItemIds(), run
  // alongside it on every load. Saves written before equipment slots carried
  // itemId hold a slot object built by hand from an item's fields — so
  // countInPools() cannot see the equipped bag by id, and unequipping it
  // would take doUnequip()'s fallback branch and rebuild it by hand again.
  // This assigns itemId by reverse name match against ITEM_REGISTRY, the way
  // backfillItemIds() does for items and sound for the same reason: current
  // registry names are unique. The keychain matches nothing and is left
  // alone, which is correct — it is not a found item and has no registry
  // entry to point at.
  function backfillSlotItemIds(){
    const nameToId = {};
    Object.keys(ITEM_REGISTRY).forEach(id=>{ nameToId[ITEM_REGISTRY[id].name] = id; });
    CONTAINER_SLOTS.forEach(slotKey=>{
      const slot = state[slotKey];
      if(slot && !slot.itemId && nameToId[slot.name]) slot.itemId = nameToId[slot.name];
    });
  }
  // backfillRegistryTags(): companion to backfillItemIds(), run after it and
  // backfillSlotItemIds() on every load, since it keys off the itemId they
  // assign. itemFromRegistry() deep-copies `tags` onto every instance, so
  // without this a tag fixed in ITEM_REGISTRY would never reach an item
  // already in a save: the walkie-talkie would go on counting as a battery.
  // Every item forEachItemList() reaches, and every equipped slot object,
  // takes a fresh copy of its registry entry's `tags`, or loses the field when
  // the entry has none. An item with no itemId, or one the registry does not
  // know, is left as it is. A new game needs none of this: its items come
  // from the registry already.
  function backfillRegistryTags(){
    const resync = (it)=>{
      if(!it || !it.itemId || !Object.prototype.hasOwnProperty.call(ITEM_REGISTRY, it.itemId)) return;
      const def = ITEM_REGISTRY[it.itemId];
      if(def.tags) it.tags = def.tags.slice();
      else delete it.tags;

  function backfillIllnessScale(){

  const MIGRATED_ITEMS = {
    raw_fish:            it=> itemFromRegistry({ id:"fish", qty:it.qty }),
    cooked_fish:         it=> Object.assign(itemFromRegistry({ id:"fish", qty:it.qty }), { cookState:"cooked" }),
    spoiled_milk:        it=> rottenItem("milk", it.qty),
    moldy_bread:         it=> rottenItem("bread", it.qty),
    rotten_produce:      it=> rottenItem("vegetables", it.qty),
    rotten_leftovers:    it=> rottenItem("leftovers", it.qty),

  function migrateCookingRelease(){

      if(!it) return;

      const room = world[roomId], def = defaults[roomId];

  function sampleSeeds(n = 1000, start = 0){
    // One fresh world for every seed: everything evaluated against it is pure.
    const fresh = makeDefaultWorld();
    const rolling = rollingContainers(fresh);
    const hand = handPlacedRows(fresh, makeDefaultState(start >>> 0));
    const handIds = new Set(hand.map(r=> r.itemId));
    const handTags = tagStackCounts(hand);
    const tally = {}; // poolId -> { trials, empties, hits: entry key -> count }
    Object.keys(SPAWN_POOLS).forEach(poolId=>{ tally[poolId] = { trials:0, empties:0, hits:{} }; });
    const itemSeeds = {};
    Object.keys(ITEM_REGISTRY).forEach(id=>{ itemSeeds[id] = 0; });
    const tagMissing = {};
    REPORTED_TOOL_TAGS.forEach(tag=>{ tagMissing[tag] = 0; });
    for(let i = 0; i < n; i++){
      const seed = (start + i) >>> 0;
      const ids = new Set(handIds);
      const tags = Object.assign({}, handTags);
      // Pool by pool, which is rolledLootFor()'s yield split at the seams the
      // tallies need: the same stacks simulateSeed() lists as rolled.
      rolling.forEach(({ roomId, container })=>{
        container.spawnPools.forEach(poolId=>{
          const rolled = rolledPoolFor(seed, roomId, container.id, poolId);
          if(!rolled) return;
          const t = tally[poolId];
          t.trials += 1;
          if(rolled.empty) t.empties += 1;
          rolled.items.forEach((it, k)=>{
            const key = rolled.keys[k];
            t.hits[key] = (t.hits[key] || 0) + 1;
            ids.add(it.itemId);
            REPORTED_TOOL_TAGS.forEach(tag=>{ if(registryCarriesTag(it.itemId, tag)) tags[tag] += 1; });
          });
        });
      });
      ids.forEach(id=>{ itemSeeds[id] += 1; });
      REPORTED_TOOL_TAGS.forEach(tag=>{ if(tags[tag] === 0) tagMissing[tag] += 1; });
    }
    const judge = (count, expected, trials)=>{
      if(!trials) return { observed:null, flagged:false };
      const observed = count / trials;
      const tolerance = SAMPLE_TOLERANCE_SIGMA * Math.sqrt(expected * (1 - expected) / trials);
      return { observed, flagged: Math.abs(observed - expected) > tolerance };
    };
    const entries = [], pools = [];
    Object.keys(SPAWN_POOLS).forEach(poolId=>{
      const pool = SPAWN_POOLS[poolId], t = tally[poolId], rolled = t.trials > 0;
      const gate = judge(t.empties, pool.emptyChance, t.trials);
      pools.push({ poolId, rolled, trials:t.trials, empties:t.empties,
        observed:gate.observed, expected:pool.emptyChance, flagged:gate.flagged });
      pool.entries.forEach(e=>{
        const expected = (1 - pool.emptyChance) * e.chance;
        const hits = t.hits[poolEntryKey(e)] || 0;
        const r = judge(hits, expected, t.trials);
        entries.push({ poolId, key:poolEntryKey(e), itemId:e.itemId, rolled, trials:t.trials, hits,
          observed:r.observed, expected, flagged:r.flagged });
      });
    });
    const items = Object.keys(ITEM_REGISTRY).map(id=>
      ({ itemId:id, seeds:itemSeeds[id], fraction: n ? itemSeeds[id] / n : null }));
    const tags = REPORTED_TOOL_TAGS.map(tag=>
      ({ tag, seedsMissing:tagMissing[tag], fraction: n ? tagMissing[tag] / n : null }));
    const compared = pools.concat(entries).filter(r=> r.rolled);
    const flagged = compared.filter(r=> r.flagged);
    if(flagged.length) console.warn(`sampleSeeds: ${flagged.length} row${flagged.length === 1 ? "" : "s"} outside `
      + `${SAMPLE_TOLERANCE_SIGMA}σ — rerun with a larger n or another start before reading anything into it`, flagged);
    console.log(`sampleSeeds: n ${n}, start ${start}, ${compared.length} rows compared, ${flagged.length} flagged`);
    return { n, start, entries, pools, items, tags };
  }

  function layerOpen(el){ return layerStack.some(l => l.el === el); }
  // The enabled, rendered controls in a layer, in document order.
  function focusablesIn(el){
    return Array.from(el.querySelectorAll("button, input, select, textarea, a[href], [tabindex]:not([tabindex='-1'])"))
      .filter(x => !x.disabled && x.getClientRects().length > 0);

  // The .itemname control for an item. Rows are rebuilt on every render(),

    return Array.from(document.querySelectorAll(".itemname")).find(b => b.dataset.uid === uid) || null;
  }
  // Where focus goes back to: the element focused when the layer opened, and
  // if that is an item's name, the item's uid, so a rebuilt row still counts.
  function focusReturnPoint(){
    const el = document.activeElement && document.activeElement !== document.body ? document.activeElement : null;
    return { el, uid: el && el.classList.contains("itemname") ? el.dataset.uid : null };
  }
  // Opening moves focus to the layer's first control. `back` defaults to
  // whatever is focused now; a caller that has already lost that element to
  // a render passes its own.
  function openLayer(el, show, hide, back){
    if(layerOpen(el)) return;
    layerStack.push({ el, hide, back: back || focusReturnPoint() });
    show();
    (focusablesIn(el)[0] || el).focus({ preventScroll:true });
