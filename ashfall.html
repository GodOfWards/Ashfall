    // own weight.
    if(invTab === "inventory"){
      const load = playerLoad();
      invWeight.textContent = load.toFixed(2) + " / " + CARRY_LIMIT_KG + " kg";
      invWeight.style.color = load >= OVERLOAD_HARM_START_KG ? "var(--danger)"
        : load > CARRY_LIMIT_KG ? "var(--warn)" : "";
    } else {
      invWeight.textContent =
        totalWeight(currentInv.items).toFixed(2) + (currentInv.capacityKg ? " / " + currentInv.capacityKg + " kg" : " kg");
      invWeight.style.color = "";
    }
    // Unequip, in the strip under the tabs, while the tab is a slot's.
    const invStrip = document.getElementById("invStrip");
    if(CONTAINER_SLOTS.indexOf(invTab) >= 0){
      invStrip.style.display = "";
      document.getElementById("unequipBtn").onclick = ()=> doUnequip(invTab);
    } else { invStrip.style.display = "none"; }
    // No Store while the Here tab is a panel's or a board's, or a circuit's:
    // none holds items. The Electrical view's Here tabs are only those.
    // The Electrical view lists only what is tagged `electrical`, each row
    // acting on the tab's own list by the item's own index there.
    const invList = document.getElementById("invList");
    const shown = electricalView ? currentInv.items.filter(it=> hasTag(it, "electrical")) : currentInv.items;
    renderItemList(invList, shown, [
      { label: worldTab === "floor" ? "Place" : "Store", onClick:(i)=> doStore(currentInv.items.indexOf(shown[i])),
        test:()=> !electricalView && !!worldSlot(world[state.currentRoom], worldTab) }
    ], "inv", { container:null });
    if(electricalView && !shown.length) invList.innerHTML = `<li class="empty">${ELECTRICAL_EMPTY_INV}</li>`;
  }
  // The Electrical view's notes, where a list would be: an Inventory tab
  // with nothing electrical in it, and a room with no panel, board or
  // circuit to show. The room's says nothing of its wiring: a room no panel
  // names still takes its power from the grid. Functional UI text,
  // retunable.
  const ELECTRICAL_EMPTY_INV = "Nothing electrical.";
  const ELECTRICAL_EMPTY_HERE = "Nothing electrical to show here.";
  function renderWorldItemsPanel(){
    const room = world[state.currentRoom];
    const worldTabsEl = document.getElementById("worldTabs");
    if(electricalView){ renderElectricalHere(room, worldTabsEl); return; }
    const worldTabDefs = [["floor","Floor"]];
    // Floor bags straight after Floor, in floor order, searched or not: the
    // bag is on the floor, and Floor is never gated. Bags sharing a name are
    // numbered from the second on — "Purse", "Purse 2".
    const nameCount = new Map();
    floorBags(room).forEach(bag=>{
      const n = (nameCount.get(bag.name) || 0) + 1;
      nameCount.set(bag.name, n);
      worldTabDefs.push([floorBagTab(bag), n > 1 ? bag.name + " " + n : bag.name]);
    });
    listedContainers(room).forEach(c=> worldTabDefs.push([c.id, c.name]));
    // Then a tab for each panel or board hanging here, after the containers.
    const deviceName = deviceNamesFor(state.currentRoom);
    powerDevicesIn(state.currentRoom).forEach(d=> worldTabDefs.push([powerTab(d.id), deviceName(d)]));
    // Before the buttons are built, so the render that drops the open tab
    // also marks Floor active.
    if(!worldTabDefs.find(d=>d[0]===worldTab)) worldTab = "floor";
    // Rebuilt keeping focus, as the Inventory strip is. Labels are unique
    // within the strip (bags are numbered), so focus follows its tab by label,
    // and a tab that is gone, a bag taken with Take All, hands focus to the
    // tab now at its position.
    rebuildKeepingFocus(worldTabsEl, ()=>{
      worldTabsEl.innerHTML = "";
      worldTabDefs.forEach(([key,label])=>{
        const btn = document.createElement("button");
        btn.textContent = label;
        if(worldTab === key) btn.classList.add("active");
        btn.addEventListener("click", ()=>{
          const c = room.containers.find(x=>x.id===key) || (room.carContainers && room.carContainers.find(x=>x.id===key));
          if(c) doOpenContainer(room, c);
          else { worldTab = key; render(); }
        });
        worldTabsEl.appendChild(btn);
      });
    }, false);
    revealActiveTab(worldTabsEl);
    // A panel's or board's tab holds no items: no weight, no list.
    const currentWorld = worldSlot(room, worldTab);
    document.getElementById("worldWeight").textContent = currentWorld
      ? totalWeight(currentWorld.items).toFixed(2) + " / " + currentWorld.capacityKg + " kg" : "";
    // A room fixture's strip, under the tabs: the selected tab is the focus,
    // the way the Inventory strip's Unequip follows its tab. Shown only while
    // that tab is a container with a device pop-up (hasDevicePop()), or a
    // panel's or board's. It holds the stove's state, while the stove's tab
    // is selected, a switchable load's (loadStatusText()), or the panel's or
    // board's (deviceStripText()), then Device Options, which opens the
    // device pop-up (renderDevicePop()).
    const worldStrip = document.getElementById("worldStrip");
    const tabContainer = room.containers.find(c=> c.id === worldTab);
    const tabDevice = powerDevicesIn(state.currentRoom).find(d=> powerTab(d.id) === worldTab);
    const tabLoad = tabContainer && switchableLoad(state.currentRoom, tabContainer);
    if(tabContainer && hasDevicePop(state.currentRoom, tabContainer)){
      worldStrip.style.display = "";
      deviceOptionsBtn.onclick = ()=>{ deviceTarget = { kind:"container", id:tabContainer.id }; render(); };
    } else if(tabDevice){
      worldStrip.style.display = "";
      deviceOptionsBtn.onclick = ()=>{ deviceTarget = { kind:tabDevice.kind, id:tabDevice.id }; render(); };
    } else { worldStrip.style.display = "none"; }
    // Hidden when empty, so it adds no gap to the strip.
    const deviceState = document.getElementById("worldDeviceState");
    deviceState.textContent = tabContainer && tabContainer === roomStove(room)
      ? stoveOnText(room) + " · " + stoveTimerText(tabContainer)
      : tabLoad ? loadStatusText(tabLoad)
      : tabDevice ? deviceStripText(tabDevice) : "";
    deviceState.style.display = deviceState.textContent ? "" : "none";
    if(!currentWorld){ document.getElementById("worldList").innerHTML = ""; return; }
    renderItemList(document.getElementById("worldList"), currentWorld.items, [
      // Disabled rather than hidden, for the reason given at the detail
      // view's Take family in getItemActions(): the item can be taken, just
      // not into the keychain.
      { label:"Take", disabled:(it)=> invTab === "keychain" && !keychainAllows(it), onClick:(i)=> doTake(i) }
    ], "world", { container: worldTabContainer(room, worldTab), roomId: state.currentRoom });
  }
  // A circuit's Here tab key in the Electrical view, prefixed as a device's
  // is (powerTab()).
  function circuitTab(breakerId){ return "circuit:" + breakerId; }
  const NO_ELECTRICAL_TAB = "circuit:none";
  // The circuits that serve a room: every circuit breaker whose roles include
  // a role its panel maps to the room, panel by panel in wiring order, each
  // panel's in breaker order. Under either rules: simplified rules ignore
  // the circuit breakers, but the circuits are still how a room's loads are
  // listed.
  function circuitsServing(roomId){
    const out = [];
    Object.values(POWER_NET.panels).forEach(p=> p.circuits.forEach(id=>{
      if(POWER_NET.breakers[id].roles.some(r=> p.roles[r] === roomId)) out.push(id);
    }));
    return out;
  }
  // The Here panel in the Electrical view (#242). Its tabs run upstream
  // first: the panels and boards hanging here (powerDevicesIn()), each with
  // the strip and Device Options it has in the normal view, then the circuits
  // serving the room (circuitsServing()), by their hand-written labels. No
  // Floor, bag or container tab. A room with none of either shows no tabs,
  // only ELECTRICAL_EMPTY_HERE. Nothing here changes the simulation: a
  // switch goes through doSwitchLoad(), a breaker through the device pop-up.
  function renderElectricalHere(room, worldTabsEl){
    const devices = powerDevicesIn(state.currentRoom);
    const circuits = circuitsServing(state.currentRoom);
    const deviceName = deviceNamesFor(state.currentRoom);
    const defs = devices.map(d=> [powerTab(d.id), deviceName(d)])
      .concat(circuits.map(id=> [circuitTab(id), POWER_NET.breakers[id].label]));
    // With no tab to show, the Here tab is none at all, never Floor, so no
    // item pop-up offers Place onto a floor this view does not show.
    if(!defs.find(d=> d[0] === worldTab)) worldTab = defs.length ? defs[0][0] : NO_ELECTRICAL_TAB;
    rebuildKeepingFocus(worldTabsEl, ()=>{
      worldTabsEl.innerHTML = "";
      defs.forEach(([key, label])=>{
        const btn = document.createElement("button");
        btn.textContent = label;
        if(worldTab === key) btn.classList.add("active");
        btn.addEventListener("click", ()=>{ worldTab = key; render(); });
        worldTabsEl.appendChild(btn);
      });
    }, false);
    revealActiveTab(worldTabsEl);
    document.getElementById("worldWeight").textContent = "";
    const worldStrip = document.getElementById("worldStrip");
    const deviceState = document.getElementById("worldDeviceState");
    const tabDevice = devices.find(d=> powerTab(d.id) === worldTab);
    if(tabDevice){
      worldStrip.style.display = "";
      deviceOptionsBtn.onclick = ()=>{ deviceTarget = { kind:tabDevice.kind, id:tabDevice.id }; render(); };
      deviceState.textContent = deviceStripText(tabDevice);
      deviceState.style.display = "";
    } else {
      worldStrip.style.display = "none";
      deviceState.textContent = "";
    }
    const list = document.getElementById("worldList");
    list.innerHTML = "";
    if(!defs.length){ list.innerHTML = `<li class="empty">${ELECTRICAL_EMPTY_HERE}</li>`; return; }
    const circuitId = circuits.find(id=> circuitTab(id) === worldTab);
    if(circuitId) renderCircuitTab(list, circuitId, state.currentRoom);
  }
  // A circuit tab: one row per load on the circuit in this room, then the
  // loads it feeds elsewhere, by appliance name and the room they are in
  // (roomLabel()), with no status and no control: they can't be seen from
  // here. A row here shows the appliance's name and, for a load with a
  // switch of its own, its readout (loadStatusText()) and one Switch on /
  // Switch off (doSwitchLoad()). A switchless one (the smoke alarm, the gas
  // range) shows neither. Every row here shows its nameplate
  // (nameplateText()) and, while a meter is carried, Test (meterButtons()).
  // Watts appear nowhere but on a nameplate. Functional UI text,
  // retunable.
  function renderCircuitTab(list, circuitId, roomId){
    const loads = POWER_NET.breakers[circuitId].loads.map(id=> POWER_NET.loads[id]);
    const line = (parent, text)=>{
      const span = document.createElement("span");
      span.className = "line";
      span.textContent = text;
      parent.appendChild(span);
    };
    loads.filter(l=> l.room === roomId).forEach(l=>{
      const a = APPLIANCES[l.appliance];
      const li = document.createElement("li");
      const meta = document.createElement("span");
      meta.className = "meta";
      const name = document.createElement("b");
      name.textContent = a.name;
      meta.appendChild(name);
      if(!a.switchless) line(meta, loadStatusText(l.id));
      line(meta, nameplateText(a));
      li.appendChild(meta);
      const row = document.createElement("span");
      row.className = "btnrow";
      const mini = (label, onClick, cost)=>{
        const btn = document.createElement("button");
        btn.className = "mini";
        btn.textContent = cost ? `${label} ${cost}` : label;
        btn.addEventListener("click", onClick);
        return btn;
      };
      if(!a.switchless){
        const on = switchOnIn(state.power, state.seed, l.id, a);
        row.appendChild(mini(on ? "Switch off" : "Switch on", ()=> doSwitchLoad(l.id, !on)));
      }
      meterButtons({ load:l.id }, mini).forEach(b=> row.appendChild(b));
      li.appendChild(row);
      list.appendChild(li);
    });
    const elsewhere = loads.filter(l=> l.room !== roomId);
    if(!elsewhere.length) return;
    const head = document.createElement("li");
    head.className = "subhead";
    head.textContent = "Elsewhere on this circuit";
    list.appendChild(head);
    elsewhere.forEach(l=>{
      const li = document.createElement("li");
      const meta = document.createElement("span");
      meta.className = "meta";
      const name = document.createElement("b");
      name.textContent = APPLIANCES[l.appliance].name;
      meta.appendChild(name);
      line(meta, world[l.room] ? roomLabel(world[l.room]) : l.room);
      li.appendChild(meta);
      list.appendChild(li);
    });
  }
  // The seed, as its canonical uint32 — what a typed word hashed to, which is
  // what reproduces the run; a word is lossy, the number is the seed. It lives
  // in Options rather than as a line in Stats, and is drawn ahead of
  // render()'s game-over branch, because that branch wipes #statsBox and
  // returns early, and the seed is exactly what a player wants after dying.
  function renderOptionsPanel(){
    document.getElementById("seedValue").textContent = state.seed;
    // The current run's rules never change mid-run (#243): this line only
    // reads them. The toggle below it is the next run's.
    document.getElementById("rulesNow").textContent = "Electrical rules: " + ELECTRICAL_RULES_LABELS[state.electricalRules];
    document.querySelectorAll("#rulesNext button[data-rules]").forEach(b=>{
      b.classList.toggle("active", b.dataset.rules === nextElectricalRules());
    });
  }
  function render(){
    renderOptionsPanel();
    renderHubToggles();
    // Crafting is unavailable once the run is over, and available again the
    // moment it isn't: set on every render, so Restart, Replay this seed and
    // a load after death all re-enable it. No hint line: "You did not
    // survive." already says why.
    hubButtonFor.crafting.disabled = gameOver;
    if(gameOver){
      document.getElementById("locLabel").textContent = "";
      document.getElementById("clockLabel").textContent = "";
      document.getElementById("roomDesc").textContent = "You did not survive.";
      document.getElementById("statsBox").innerHTML = "Hunger: —<br>Thirst: —<br>Energy: —<br>Health: 0";
      const moveBox = document.getElementById("moveActions");
      moveBox.innerHTML = "";
      moveBox.appendChild(actionButton("Restart", ()=> doRestart()));
      moveBox.appendChild(actionButton("Replay this seed", ()=> doRestart(state.seed)));
      document.getElementById("moveGroup").style.display = "";
      document.getElementById("hereGroup").style.display = "none";
      document.getElementById("invTabs").innerHTML = "";
      document.getElementById("invList").innerHTML = "";
      document.getElementById("invWeight").textContent = "";
      document.getElementById("invStrip").style.display = "none";
      document.getElementById("worldTabs").innerHTML = "";
      document.getElementById("worldList").innerHTML = "";
      document.getElementById("worldWeight").textContent = "";
      document.getElementById("worldStrip").style.display = "none";
      // The catalogue goes blank with the rest, even though the Crafting
      // button is disabled above and the panel cannot be opened. The blanking
      // stays because doCraft() has no gameOver guard: a live recipe button
      // must never survive into the game-over screen.
      document.getElementById("craftingList").innerHTML = "";
      // Game over closes every layer, so "You did not survive." is what the
      // player sees. It does so once, on the render that first draws this
      // screen: the drawer and Options can still be opened afterwards, and the
      // map's zoom toggle calls render() from inside the drawer, so closing
      // on every game-over render would shut the drawer under the player.
      if(!gameOverRendered) closeAllLayers();
      gameOverRendered = true;
      return;
    }
    gameOverRendered = false;
    renderLocationPanel();
    renderStatsPanel();
    renderMoveActionsPanel();
    renderHereActionsPanel();
    renderInventoryPanel();
    renderWorldItemsPanel();
    // After both item lists: the pop-up anchors to a row they just drew, and
    // the device pop-up to the Here strip.
    renderItemPop();
    renderDevicePop();
    renderWalkPop();
    renderCraftingPanel();
    renderMap();
    renderMapCard();
  }

  document.title = "Ashfall — v" + GAME_CONFIG.VERSION;
  document.getElementById("pageTitle").textContent = "ASHFALL — v" + GAME_CONFIG.VERSION;
  // The initial boot's world, like doRestart()'s, needs its food aged once
  // state exists, and its network resolved.
  refreshPower();
  stampMissingAges();
  log("You wake up at home. Everything's exactly where you left it — for now.");
  mapSetZoomSpan(mapZoomSpan);
  render();
  if(benchMode) benchBootMs = performance.now();

  // Dev seam. The six validators, the two seed reports and the power
  // simulation above are local bindings inside this IIFE, so
  // `validateReachability()` typed into devtools is a ReferenceError. This is
  // the one deliberate hole in the closure: read-only reporting helpers,
  // nothing that writes game state, and nothing else belongs on it. The
  // benchmark writes game state, and so runs only on a `?bench` page
  // (runBenchmark()), never from here.
  window.ashfallDev = { validateItemRegistry, validateLocations, validateRoomSchema, validateReachability,
    validateWiring, validateBuildings, simulateSeed, sampleSeeds, simulatePower };
  // After the boot's first paint, so the bench page shows something while
  // the benchmark runs.
  if(benchMode) setTimeout(runBenchmark, 0);
})();
</script>
</body>
</html>
