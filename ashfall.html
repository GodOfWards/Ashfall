  // Closing hands focus back, but only if focus was in the layer or had
  // nowhere else to be. Focus the player has moved elsewhere is left alone,
  // and so is focus in a layer above one that closes underneath it, as the
  // pop-up does when a Load from the drawer clears detailItem.
  function closeLayer(el){
    const i = layerStack.findIndex(l => l.el === el);
    if(i < 0) return;
    const layer = layerStack.splice(i, 1)[0];
    const wasTop = i === layerStack.length;
    const active = document.activeElement;
    const lost = !active || active === document.body;
    layer.hide();
    if(el.contains(active) || (wasTop && lost)) restoreFocus(layer.back);

  // The same element if it is still there; otherwise the rebuilt .itemname
  // for the same item; otherwise whatever `back.find()` finds, for a return
  // point that is neither (a pop-up button rebuilt while a layer covered it);
  // otherwise nowhere, without error.
  function restoreFocus(back){
    let target = back.el && back.el.isConnected && !back.el.disabled ? back.el : null;
    if(!target && back.uid) target = itemNameButton(back.uid);
    if(!target && back.find) target = back.find();
    if(target) target.focus({ preventScroll:true });

  // A render() that rebuilds a layer's contents would drop focus out of it:
  // the focused button is removed and focus falls to <body>. This puts it
  // back inside, on the control with the same label if the rebuild made one,
  // else on the one at the same position, else on the layer itself.
  // `isLayer` is false for a root that is not a layer, the two panels' tab
  // strips: the open-layer guard is a layer's alone, since a strip is never
  // opened or closed, and a strip that ends up empty takes no focus.
  function rebuildKeepingFocus(root, rebuild, isLayer = true){
    const had = root.contains(document.activeElement) ? document.activeElement : null;

    const label = had && had.textContent;

    if(!had || (isLayer && !layerOpen(root)) || (had.isConnected && document.activeElement === had)) return;
    const after = focusablesIn(root);
    (after.find(x => x.textContent === label) || after[Math.min(index, after.length - 1)] || root).focus({ preventScroll:true });

  // detached node, a pool that never got layout, a browser that throws — so

      // zoom ladder's ranges are what keep them readable. The multipliers are

      tiers: [

        { minVisible: 3 * w, count: 2 },

        top: lines[0].dy - MAP_BLDG_LINE_H,
        bot: lines[lines.length-1].dy

      : numberWord(st.need) + " more " + ingredientWords(t.counts || t.allowed, st.need));
    if(t.water && !water) needs.push("water");
    if(!t.water && water) needs.push("the water poured out");
    return `holds ${st.have} of ${st.target}` + (needs.length ? " · needs " + needs.join(", and ") : "")

  // What an action wrote to #log. The actions a panel runs (doCraft(), Add
  // ingredients) don't report what they wrote, so this reads #log on
  // either side of one. What it wrote is every <p> that wasn't there before,
  // plus the last one if its text changed: log() updates the last entry in
  // place rather than appending when its key repeats, as a second identical
  // craft does with its ×2. The Crafting panel captures its result area
  // through here.
  function logWrittenBy(action){
    const logDiv = document.getElementById("log");
    const before = new Set(logDiv.children);
    const last = logDiv.lastElementChild;
    const lastText = last ? last.textContent : null;
    action();
    return Array.from(logDiv.children).filter(p => !before.has(p) || (p === last && p.textContent !== lastText));
  }

  // updated form, and one #log has since dropped isn't shown. Replaced by the
  // panel's next action; cleared when the panel closes.
  function renderLogResult(box, entries){

  function resolveDeviceTarget(){

  const MOVE_DIRECTION_RANK = { north:0, east:1, west:2, south:3 };
  function moveDirectionRank(fromId, toId){
    const rank = MOVE_DIRECTION_RANK[computeDirection(world[fromId].locationId, world[toId].locationId)];

  function renderMoveActionsPanel(){

    getExitsForRoom(room, state.currentRoom)
      .filter(exit => isGridTravel(state.currentRoom, exit.to))

  // A tab strip scrolls sideways (see .tabs), and a rebuild keeps its old
  // scroll offset, clamped to the new row: move from a room whose Here strip
  // was scrolled to its last tab, and the next room's Floor can start off the
  // strip's left edge. So after each rebuild the selected tab is scrolled
  // fully into view, by the least distance that does it: a tab already in
  // view leaves the strip where it is. Only the strip scrolls, never the
  // page, which is why this is not scrollIntoView().
  function revealActiveTab(strip){
    const tab = strip.querySelector(".active");
    if(!tab) return;

    const left = t.left - s.left + strip.scrollLeft, right = t.right - s.left + strip.scrollLeft;
    strip.scrollLeft = Math.min(Math.max(strip.scrollLeft, Math.ceil(right) - strip.clientWidth), Math.floor(left));

  // The seed, as its canonical uint32 — what a typed word hashed to, which is

  }
  function render(){
    renderOptionsPanel();
    // Crafting is unavailable once the run is over, and available again the
    // moment it isn't: set on every render, so Restart, Replay this seed and
    // a load after death all re-enable it. No hint line: "You did not
    // survive." already says why.
    hubButtonFor.crafting.disabled = gameOver;
    if(gameOver){
      document.getElementById("locLabel").textContent = "";
      document.getElementById("clockLabel").textContent = "";
      document.getElementById("roomDesc").textContent = "You did not survive.";
      document.getElementById("statsBox").innerHTML = "Hunger: —<br>Thirst: —<br>Energy: —<br>Health: 0";
      const moveBox = document.getElementById("moveActions");
      moveBox.innerHTML = "";
      moveBox.appendChild(actionButton("Restart", ()=> doRestart()));
      moveBox.appendChild(actionButton("Replay this seed", ()=> doRestart(state.seed)));
      document.getElementById("moveGroup").style.display = "";
      document.getElementById("hereGroup").style.display = "none";
      document.getElementById("invTabs").innerHTML = "";
      document.getElementById("invList").innerHTML = "";
      document.getElementById("invWeight").textContent = "";
      document.getElementById("invStrip").style.display = "none";
      document.getElementById("worldTabs").innerHTML = "";
      document.getElementById("worldList").innerHTML = "";
      document.getElementById("worldWeight").textContent = "";
      document.getElementById("worldStrip").style.display = "none";
      // The catalogue goes blank with the rest, even though the Crafting
      // button is disabled above and the panel cannot be opened. The blanking
      // stays because doCraft() has no gameOver guard: a live recipe button
      // must never survive into the game-over screen.
      document.getElementById("craftingList").innerHTML = "";
      // Game over closes every layer, so "You did not survive." is what the
      // player sees. It does so once, on the render that first draws this
      // screen: the drawer and Options can still be opened afterwards, and the
      // map's zoom toggle calls render() from inside the drawer, so closing
      // on every game-over render would shut the drawer under the player.
      if(!gameOverRendered) closeAllLayers();
      gameOverRendered = true;
      return;
    }
    gameOverRendered = false;
    renderLocationPanel();
    renderStatsPanel();
    renderMoveActionsPanel();
    renderHereActionsPanel();
    renderInventoryPanel();
    renderWorldItemsPanel();
    // After both item lists: the pop-up anchors to a row they just drew, and
    // the device pop-up to the Here strip.
    renderItemPop();
    renderDevicePop();
    renderCraftingPanel();
    renderMap();
  }

  document.title = "Ashfall — v" + GAME_CONFIG.VERSION;
  document.getElementById("pageTitle").textContent = "ASHFALL — v" + GAME_CONFIG.VERSION;
  // The initial boot's world, like doRestart()'s, needs its food aged once
  // state exists.
  stampMissingAges();
  log("You wake up in your apartment. Everything's exactly where you left it — for now.");
  mapSetZoomStep(mapZoomStep);
  render();

  // Dev seam. The four validators and the two seed reports above are local
  // bindings inside this IIFE, so `validateReachability()` typed into devtools
  // is a ReferenceError. This is the one deliberate hole in the closure:
  // read-only reporting helpers, nothing that writes game state, and nothing
  // else belongs on it.
  window.ashfallDev = { validateItemRegistry, validateLocations, validateRoomSchema, validateReachability,
    simulateSeed, sampleSeeds };
})();
</script>
</body>
</html>
