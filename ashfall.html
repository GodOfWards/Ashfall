  }
  // Items an action produces rather than a container holding them. Written
  // down because validateReachability() cannot derive it: each grant lives
  // inside an action's body, not in any table the helper could walk.
  //   firewood         doChopTree(), doDismantleCampfire(), and the campfire
  //                    kit's Disassemble
  //   raw_fish         doFish()
  //   spare_batteries  the powered-equipment "Remove batteries" action
  const ACTION_GRANTED_ITEM_IDS = ["firewood", "raw_fish", "spare_batteries"];
  // The tool tags validateReachability() counts, written down for the same
  // reason. The first seven are what hasTool()/hasMatchUses() actually gate
  // an action on, and they include the `breakTag` values windows (blunt) and
  // locked storage units (cutting) carry. `heat` is listed because
  // roomHasHeat() reads it, though its only caller is canCraft()'s needsHeat
  // branch and no recipe sets that. `prying` gates nothing at all and is
  // counted precisely for that reason: renderHereActionsPanel() records that
  // forcing a vehicle was deliberately NOT gated on it because one item
  // carries it, and #111 is the standing question of whether to gate on it
  // once that stops being true. The count is the evidence that question wants.
  const REPORTED_TOOL_TAGS = ["fire-starter", "fishing", "tackle", "chopping",
    "cutting", "blunt", "can-opening", "heat", "prying"];
  // validateReachability(): dev-only console helper (not wired to any button
  // or UI, runs nothing automatically), sibling to the three above. Reports
  // what a fresh world can actually hand the player:
  //   1. dead pools — a SPAWN_POOLS id no container that still rolls draws
  //      from, so nothing it lists can ever spawn;
  //   2. unreachable items — an ITEM_REGISTRY id that is not hand-placed, not
  //      an entry in a live pool, not a RECIPES/HEAT_RECIPES output and not
  //      in ACTION_GRANTED_ITEM_IDS;
  //   3. per tag in REPORTED_TOOL_TAGS, how many hand-placed instances carry
  //      it and which live pools can yield one, so a content pass can see
  //      when a verb is down to a single item.
  // It also flags any pool entry whose `chance` is outside (0,1] — an
  // authoring guard the old integer `weight` could not have, since any
  // positive integer was legal there — and any pool whose `emptyChance` is
  // outside [0,1]. And two collision hazards the keyed loot roll creates (see
  // rolledLootFor()): a pool listing the same itemId twice, and a container
  // listing the same pool id twice. Either pair would share a key and so
  // always roll alike. Neither occurs today.
  //
  // It reports the current state; it does not assert the state is good. Ten
  // dead pools and twelve unreachable items are the expected output at
  // v0.5.1, and driving them to zero is the balance pass's job (#66, #67).
  // Call it as `ashfallDev.validateReachability()` from the browser console
  // when auditing.
  function validateReachability(){
    const report = [];
    Object.keys(SPAWN_POOLS).forEach(poolId=>{
      const pool = SPAWN_POOLS[poolId];
      if(!(Number.isFinite(pool.emptyChance) && pool.emptyChance >= 0 && pool.emptyChance <= 1))
        report.push(`illegal emptyChance: SPAWN_POOLS.${poolId} has emptyChance ${pool.emptyChance}, which is not a number in [0,1]`);
      const seenItems = new Set();
      pool.entries.forEach(entry=>{
        if(!(Number.isFinite(entry.chance) && entry.chance > 0 && entry.chance <= 1))
          report.push(`illegal chance: SPAWN_POOLS.${poolId} entry ${entry.itemId} has chance ${entry.chance}, which is not a number in (0,1]`);
        if(seenItems.has(entry.itemId))
          report.push(`duplicate entry: SPAWN_POOLS.${poolId} lists ${entry.itemId} twice — both share one roll key`);
        seenItems.add(entry.itemId);
      });
    });
    // Walk a freshly-built default world, never the live one: a loaded save
    // has already flipped spawnRolled on every container the player opened,
    // so `world` would report those containers' pools as dead.
    const fresh = makeDefaultWorld();
    Object.keys(fresh).forEach(roomId=>{
      (fresh[roomId].containers || []).concat(fresh[roomId].carContainers || []).forEach(c=>{
        (c.spawnPools || []).forEach((poolId, i, all)=>{
          if(all.indexOf(poolId) === i && all.lastIndexOf(poolId) !== i)
            report.push(`duplicate pool: ${roomId}/${c.id} lists ${poolId} twice — both share one roll key`);
        });
      });
    });
    const badAuthoring = report.length;
    const freshState = makeDefaultState();
    const livePools = new Set();
    const placed = {}; // itemId -> how many hand-placed instances exist
    const place = (it)=>{ placed[it.itemId] = (placed[it.itemId] || 0) + 1; };
    Object.keys(fresh).forEach(roomId=>{
      const room = fresh[roomId];
      (room.floor || []).forEach(place);
      (room.containers || []).concat(room.carContainers || []).forEach(c=>{
        (c.items || []).forEach(place);
        if(c.spawnPools && !c.spawnRolled) c.spawnPools.forEach(id=> livePools.add(id));
      });
    });
    [freshState.inventory].concat(CONTAINER_SLOTS.map(slot=> freshState[slot])).forEach(slot=>{
      if(slot && slot.items) slot.items.forEach(place);
    });
    Object.keys(SPAWN_POOLS).forEach(poolId=>{
      if(!livePools.has(poolId)) report.push(`dead pool: ${poolId} — no container that still rolls draws from it`);
    });
    const reachable = new Set(Object.keys(placed));
    livePools.forEach(poolId=> SPAWN_POOLS[poolId].entries.forEach(e=> reachable.add(e.itemId)));
    RECIPES.forEach(r=> reachable.add(r.output.id));
    HEAT_RECIPES.forEach(r=> reachable.add(r.output.id));
    ACTION_GRANTED_ITEM_IDS.forEach(id=> reachable.add(id));
    Object.keys(ITEM_REGISTRY).forEach(id=>{
      if(!reachable.has(id)) report.push(`unreachable item: ${id} — not hand-placed, not in a live pool, not crafted, not action-granted`);
    });
    REPORTED_TOOL_TAGS.forEach(tag=>{
      const carries = (id)=>{ const def = ITEM_REGISTRY[id]; return !!(def && def.tags && def.tags.includes(tag)); };
      const hand = Object.keys(placed).filter(carries).reduce((s,id)=> s + placed[id], 0);
      const pools = Array.from(livePools).filter(id=> SPAWN_POOLS[id].entries.some(e=> carries(e.itemId))).sort();
      report.push(`tool tag "${tag}": ${hand} hand-placed instance${hand === 1 ? "" : "s"}, `
        + (pools.length ? `live pools: ${pools.join(", ")}` : "no live pool"));
    });
    if(badAuthoring) console.warn("validateReachability: pool authoring problems", report.slice(0, badAuthoring));
    console.log(`validateReachability: ${report.length} lines`, report);
    return report;
  }
  // `seed` is optional: undefined starts a fresh world, a uint32 replays that

  function doSaveLocal(){

  // ==================================================

  const MAP_SPACING = 130;
  const MAP_MARGIN = 55;
  // Grid extents (see LOCATIONS above) — col -1..6, row -4..3.
  // MAP_MIN_COL/MAP_MIN_ROW exist because the southern and western streets
  // give the grid negative coordinates: mapToSvg() offsets by MAP_MIN_COL

  const MAP_MIN_COL = -1;

  // whole number of blocks — span = zoomStep * MAP_SPACING — so one step moves
  // the view by one block and every view sits on the grid's own pitch. Each
  // mode owns the range of steps it allows and the step it opens at. The
  // ranges overlap at 3, so switching mode there changes the content without
  // changing the box. Close's ceiling is where its 10-unit building labels
  // fall under ~10 CSS px (the map renders ~420px wide, so a label's apparent
  // size is 10 * 420 / span); Wide's base is the widest step that still leaves
  // the town's 910 units of content something to pan within. Ranges and bases
  // are retunable, with no prior convention behind them.
  const MAP_ZOOM_RANGE = {
    close: { min: 1, max: 3, base: 2 },  // 130 / 260 / 390 units across

  const MAP_PLAYER_R_WIDE = 12;

  // Street runs (Wide view) — one continuous named path per street.
  const MAP_STREETS = [
    { name:"DOCK ST",   chain:["dock6th","mid_dock_4_6","dock4th","mid_dock_2_4","dock2nd","mid_dock_1_2","dock1st","mid_dock_1_3","dock3rd","mid_dock_3_5","dock5th","mid_dock_5_7","dock7th","mid_dock_7_9","dock9th"] },
    { name:"MILL ST",   chain:["mill6th","mid_mill_4_6","mill4th","mid_mill_2_4","mill2nd","mid_mill_1_2","mill1st","mid_mill_1_3","mill3rd","mid_mill_3_5","mill5th","mid_mill_5_7","mill7th","mid_mill_7_9","mill9th"] },

    { name:"6TH ST",    chain:["dock6th","mid_6th_d_mi","mill6th","mid_6th_mi_c","cedar6th","mid_6th_c_e","elm6th","mid_6th_e_mp","maple6th","mid_6th_mp_p","poplar6th","mid_6th_p_m","main6th","mid_6th_m_w","water6th"] },

    { name:"2ND ST",    chain:["dock2nd","mid_2nd_d_mi","mill2nd","mid_2nd_mi_c","cedar2nd","mid_2nd_c_e","elm2nd","mid_2nd_e_mp","maple2nd","mid_2nd_mp_p","poplar2nd","mid_2nd_p_m","main2nd","mid_2nd_m_w","water2nd"] },
    { name:"1ST ST",    chain:["dock1st","mid_1st_d_mi","mill1st","mid_1st_mi_c","cedar1st","mid_1st_c_e","elm1st","mid_1st_e_mp","maple1st","mid_1st_mp_p","outside","mid_1st_o_m","main1st","mid_1st_m_w","water1st"] },
    { name:"3RD ST",    chain:["dock3rd","mid_3rd_d_mi","mill3rd","mid_3rd_mi_c","cedar3rd","mid_3rd_c_e","elm3rd","mid_3rd_e_mp","maple3rd","mid_3rd_mp_p","poplar3rd","mid_3rd_p_m","main3rd","mid_3rd_m_w","water3rd"] },
    { name:"5TH ST",    chain:["dock5th","mid_5th_d_mi","mill5th","mid_5th_mi_c","cedar5th","mid_5th_c_e","elm5th","mid_5th_e_mp","maple5th","mid_5th_mp_p","poplar5th","mid_5th_p_m","main5th","mid_5th_m_w","water5th"] },
    { name:"7TH ST",    chain:["dock7th","mid_7th_d_mi","mill7th","mid_7th_mi_c","cedar7th","mid_7th_c_e","elm7th","mid_7th_e_mp","maple7th","mid_7th_mp_p","poplar7th","mid_7th_p_m","main7th","mid_7th_m_w","water7th"] },
    { name:"9TH ST",    chain:["dock9th","mid_9th_d_mi","mill9th","mid_9th_mi_c","cedar9th","mid_9th_c_e","elm9th","mid_9th_e_mp","maple9th","mid_9th_mp_p","poplar9th","mid_9th_p_m","main9th","mid_9th_m_w","water9th"] }
  ];
  // Every street/mid-block Location id, derived from MAP_STREETS above
  // (every such id appears in some chain) rather than hand-duplicated —
  // used by renderMapClose() to draw the node dots.
  const MAP_STREET_NODE_IDS = Array.from(new Set(MAP_STREETS.flatMap(s => s.chain)));
  // Building markers (Close view only) — the label's offset from its
  // building's anchor, in grid units, keyed by BUILDINGS id. Membership is
  // the point as much as the numbers: a BUILDINGS entry with no offsets
  // here is a building the map does not name, and renderMapClose() never
  // reaches it. Every building has one today, but where two sit close
  // enough that only one can carry a label, this is where that is said.
  // Pharmacy/Hardware Store deliberately share an anchor (both entered
  // from the same mid-block) — the offset, not a second coordinate, is
  // what keeps them legible as two separate markers.
  const MAP_BUILDING_OFFSETS = {
    acorn:       { dx:-0.05, dy:-0.28 },
    alley:       { dx: 0.32, dy:-0.05 },
    cornerstore: { dx:-0.32, dy:-0.05 },
    pharmacy:    { dx:-0.05, dy:-0.28 },
    hardware:    { dx:-0.05, dy: 0.28 },
    storage:     { dx: 0.32, dy: 0.05 },
    riverbank:   { dx: 0.05, dy: 0.32 },
    oak:         { dx: 0.3,  dy: 0.05 },
    auto_shop:   { dx:-0.05, dy: 0.28 },
    police:      { dx: 0.32, dy:-0.05 },
    industrial:  { dx: 0.32, dy: 0.05 }
  };

  let mapZoomMode = "close";
  let mapZoomStep = MAP_ZOOM_RANGE.close.base; // blocks across; like mapZoomMode, deliberately outside `state`
  let mapRenderedZoom = null;   // zoom mode the current SVG content was built for
  let mapLastNode = null;       // last resolved player map node
  let mapCurrentViewBox = null; // {x,y,w,h} of the viewBox, animated toward its target
  let mapStreetLabels = [];     // Wide's label pool: one entry per street
  let mapBuildingLabels = [];   // Close's label pool: one entry per marked building

  // The one way this file measures rendered text. Both label pools bind by
  // measuring rather than by consulting a table, so both read through here
  // and both degrade the same way: a node with no layout, or a browser that
  // refuses the call, reads as zero and the caller decides what zero means.
  // A measurement failure must never throw out of a bind — a bind that
  // throws leaves the map half-placed, which is worse than a map placed on
  // stale numbers. With `from` given it measures that substring instead of
  // the whole string, which is how a name is split without text thrash.
  function mapTextWidth(el, from, count){
    try {
      return from === undefined ? el.getComputedTextLength() : el.getSubStringLength(from, count);
    } catch(e){ return 0; }
  }

  function mapToSvg(col, row){
    // row MAP_MIN_ROW (Dock) at bottom, row MAP_MAX_ROW (Water) at top;
    // col MAP_MIN_COL (6th) at the left margin — the offset is what lets the
    // grid carry negative coordinates without drawing off-canvas.
    return { x: MAP_MARGIN + (col - MAP_MIN_COL) * MAP_SPACING, y: MAP_MARGIN + (MAP_MAX_ROW - row) * MAP_SPACING };
  }
  function mapPathD(chain){
    return chain.map((id,i)=>{
      const p = mapToSvg(LOCATIONS[id].x / 100, LOCATIONS[id].y / 100);
      return (i===0 ? "M " : "L ") + p.x + " " + p.y;
    }).join(" ");
  }
  // Street names (Wide view). They are placed against the portion of each
  // street currently on screen rather than once per block: the view moves,
  // so a build-time position would stop meaning anything.
  // Each street owns a fixed pool of MAP_LABELS_PER_STREET <text> nodes,
  // created once by renderMapWide() and thereafter only moved, shown or
  // hidden — never created or destroyed during a pan.
  // MAP_LABEL_OFFSET nudges a name off its own street line; the label is
  // rotated onto the street's heading (always 0 or +/-90 on this grid),
  // folded into (-90, 90] so vertical streets read bottom-to-top.
  const MAP_LABEL_OFFSET = 5;
  const MAP_LABELS_PER_STREET = 3;
  // The rendered size of a street name at the 15px .map-street-name face, in
  // user units: a name's width, and the cap height. Every name is upper case
  // with no descender, so the cap height is the whole ink band. The inset,
  // the label tiers and the crossing clearance all derive from them, so
  // retuning the face or the names retunes the three together.
  //
  // Each street's width is measured at bind time off its own pooled node
  // rather than written down here: `system-ui` is not one font, so a literal
  // is only correct on the machine it was measured on — it resolves to Segoe
  // UI, SF Pro, Roboto or Cantarell depending on where the page is opened,
  // and those differ by more than the placement arithmetic tolerates. The
  // constant below is the last known good Chromium measurement of "POPLAR
  // ST", the widest of the sixteen, kept only as what a street falls back to
  // if its own measurement fails. It is not any street's live width;
  // street.metrics.w is.
  const MAP_LABEL_W_FALLBACK = 99.1;
  // The cap height is deliberately *not* measured. getComputedTextLength()
  // gives width only, and getBBox().height reports the em box — 17.83 at this
  // face, against a cap band nearer 11 — so there is no cheap correct reading
  // to take. This stays a chosen number until there is one.
  const MAP_LABEL_CAP = 12;
  // Breathing room between a name and the end of the stretch it is inset
  // from. Retunable.
  const MAP_LABEL_EDGE_GAP = 5;
  // One width and the three values derived from it, as a plain object per
  // street. Every street is measured at bind time and keeps its own set: a
  // single map-wide width reserved "POPLAR ST"'s 99 units for "1ST ST" too,
  // which over-reserves it by 63% and costs the shorter streets names they
  // had room for. Returns null on a measurement that cannot be trusted — a
  // detached node, a pool that never got layout, a browser that throws — so
  // the caller falls back rather than taking a zero. Zero collapses every
  // tier to `hi - lo >= 0`, which is always true, so the street would
  // silently jump to three names.
  function mapLabelMetrics(w){
    if(!Number.isFinite(w) || w <= 0) return null;
    return {
      w,
      inset: w / 2 + MAP_LABEL_EDGE_GAP,
      // How many names one street gets, by the length of it currently
      // visible, in multiples of its own name's width — longest tier first.
      // Under a single width the street gets none, since a name wider than
      // its visible stretch would read as floating loose. This is a crowding
      // rule, not a legibility one: a name's width in user units is the same
      // at every span, so what the tiers measure is how many fit, and the
      // zoom ladder's ranges are what keep them readable. The multipliers are
      // retunable.
      tiers: [
        { minVisible: 6 * w, count: 3 },
        { minVisible: 3 * w, count: 2 },
        { minVisible: 1 * w, count: 1 }
      ],
      // How close to a crossing a name may sit before it can touch that
      // crossing's own name. A name reaches its own w/2 along its street, and
      // the crossing's name occupies a band from MAP_LABEL_OFFSET to
      // MAP_LABEL_OFFSET + MAP_LABEL_CAP off the crossing line, so this is
      // how far past an intersection a name's box can still reach one.
      // A mid-block sits MAP_SPACING/2 away. Under per-street widths the
      // limit is a name wider than
      // MAP_SPACING - 2 * (MAP_LABEL_OFFSET + MAP_LABEL_CAP) = 96 units, and
      // the widest north-south name is "2ND ST" at ~65 — clear by ~31 units
      // by construction, rather than by the coincidence that the one
      // over-wide name happens to run east-west.
      clearance: w / 2 + MAP_LABEL_OFFSET + MAP_LABEL_CAP
    };
  }
  // What a street keeps when its own measurement fails. Computed once here so
  // the fallback is the same object every bind, and so the game has valid
  // metrics before the first Wide bind ever runs.
  const MAP_LABEL_METRICS_FALLBACK = mapLabelMetrics(MAP_LABEL_W_FALLBACK);
  // Positions along a street's visible stretch [lo, hi], in that street's
  // own axis, against that street's own metrics `m`. Two or three labels sit
  // m.inset in from each end; one sits at the midpoint. Whatever the tier, a
  // position that would land on a crossing is slid clear of it before it is
  // returned.
  function mapLabelPositions(lo, hi, m){
    const tier = m.tiers.find(t => hi - lo >= t.minVisible);
    if(!tier) return [];
    if(tier.count === 1) return mapClearCrossings([(lo + hi) / 2], lo, hi, m);
    if(tier.count === 2) return mapClearCrossings([lo + m.inset, hi - m.inset], lo, hi, m);
    return mapClearCrossings([lo + m.inset, (lo + hi) / 2, hi - m.inset], lo, hi, m);
  }
  // Intersections fall on the grid pitch along both axes, since mapToSvg()
  // offsets every coordinate by MAP_MARGIN — so where a position sits
  // relative to one is arithmetic, not a walk through the street's chain.
  // A position within m.clearance of a crossing slides to the
  // mid-block beside it, toward the centre of the visible stretch: sliding
  // outward risks leaving the stretch. A name with no mid-block left inside
  // the stretch is dropped rather than slid again — a second slide can
  // cascade, and a street that loses one of its two or three names still
  // reads. Two names converging on one mid-block is the same case: the one
  // nearer the centre of the stretch keeps it.
  function mapClearCrossings(positions, lo, hi, m){
    const mid = (lo + hi) / 2;
    const room = m.w / 2;  // a slid name still has to fit inside the stretch
    const cleared = [];
    positions.forEach(p=>{
      const cross = MAP_MARGIN + Math.round((p - MAP_MARGIN) / MAP_SPACING) * MAP_SPACING;
      if(Math.abs(p - cross) >= m.clearance){ cleared.push(p); return; }
      const inward = p <= mid ? 1 : -1;
      const slid = [cross + inward * MAP_SPACING / 2, cross - inward * MAP_SPACING / 2]
        .find(q => q >= lo + room && q <= hi - room);
      if(slid !== undefined) cleared.push(slid);
    });
    const kept = [];
    cleared.slice().sort((q, r) => Math.abs(q - mid) - Math.abs(r - mid)).forEach(p=>{
      if(kept.every(q => Math.abs(p - q) >= m.w)) kept.push(p);
    });
    return kept.sort((q, r) => q - r);
  }
  // Caches the Wide label pool as element references plus each street's
  // fixed geometry, so a pan touches no DOM queries — mirrors how
  // mapPositionPlayer() resolves #mapPlayer. Cleared for Close, which emits
  // no street names at all.
  //
  // This is also where each street's name is measured, for the same
  // reason the widths in mapBindBuildingLabels() are: bind is the one moment
  // the names are in the DOM and are about to be placed. Each street keeps
  // its own metrics, so one reading per street — the three pooled nodes of a
  // street all carry the same string.
  function mapBindStreetLabels(){
    mapStreetLabels = [];
    if(mapZoomMode !== "wide") return;
    const svg = document.getElementById("mapSvg");
    MAP_STREETS.forEach((street, i)=>{
      const first = LOCATIONS[street.chain[0]], last = LOCATIONS[street.chain[street.chain.length-1]];
      const a = mapToSvg(first.x / 100, first.y / 100);
      const b = mapToSvg(last.x / 100, last.y / 100);
      let angle = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
      if(angle > 90) angle -= 180;
      else if(angle <= -90) angle += 180;
      const els = Array.prototype.slice.call(svg.querySelectorAll(`text.map-street-name[data-street="${i}"]`));
      els.forEach(el=> el.textContent = street.name);
      // The pool ships hidden and a hidden node has no layout, so it would
      // measure zero. Show the one node being read and leave it shown: the
      // snap that follows this bind sets `display` on every pooled node
      // anyway, and shipping the whole pool visible instead would paint
      // sixteen names at the origin first — the flash Close's build-order
      // comment exists to avoid.
      let metrics = null;
      if(els.length){
        els[0].style.display = "";
        metrics = mapLabelMetrics(mapTextWidth(els[0]));
      }
      mapStreetLabels.push({ a, b, angle, horizontal: a.y === b.y, els,

    });
  }
  // The box a name occupies: this street's own measured width along its
  // street and MAP_LABEL_CAP across, sitting MAP_LABEL_OFFSET off the street
  // line — above a horizontal street, right of a vertical one, which is where
  // the rotation in mapBindStreetLabels() puts it. Centre and extents, so a
  // hit test reads the same for either heading.
  function mapLabelBox(street, p){
    const band = MAP_LABEL_OFFSET + MAP_LABEL_CAP / 2;
    const w = street.metrics.w;
    if(street.horizontal) return { x: p, y: street.a.y - band, w, h: MAP_LABEL_CAP };
    return { x: street.a.x + band, y: p, w: MAP_LABEL_CAP, h: w };
  }
  // The player marker is drawn over the same streets and nothing else in the
  // placement knows it is there, so a name that would sit under it is dropped
  // — suppressed rather than slid, since a slide can cascade. Where it was
  // the street's only name, #locBar already says where the player is.
  function mapLabelHitsPlayer(street, p, player){
    const box = mapLabelBox(street, p);
    const reach = MAP_PLAYER_R_WIDE + street.metrics.clearance;
    const dx = Math.max(Math.abs(player.x - box.x) - box.w / 2, 0);
    const dy = Math.max(Math.abs(player.y - box.y) - box.h / 2, 0);
    return dx * dx + dy * dy < reach * reach;
  }
  // Moves every pooled label to match the viewBox `box`. Called wherever the
  // viewBox is set — the snap branch and every animation frame — since the
  // placement is relative to the window, not to the street. `node` is the map
  // node the player is on, passed in rather than read from mapLastNode, which
  // renderMap() has not updated yet when the snap branch runs.
  function mapPositionStreetLabels(box, node){
    const p0 = LOCATIONS[node];
    const player = mapToSvg(p0.x / 100, p0.y / 100);
    mapStreetLabels.forEach(street=>{
      let positions = [];
      if(street.horizontal){
        // A horizontal street is on screen only if its single y is
        if(street.a.y >= box.y && street.a.y <= box.y + box.h){
          positions = mapLabelPositions(
            Math.max(Math.min(street.a.x, street.b.x), box.x),
            Math.min(Math.max(street.a.x, street.b.x), box.x + box.w),
            street.metrics);
        }
      } else if(street.a.x >= box.x && street.a.x <= box.x + box.w){
        positions = mapLabelPositions(
          Math.max(Math.min(street.a.y, street.b.y), box.y),
          Math.min(Math.max(street.a.y, street.b.y), box.y + box.h),
          street.metrics);
      }
      positions = positions.filter(p => !mapLabelHitsPlayer(street, p, player));
      street.els.forEach((el, i)=>{
        if(i >= positions.length){ el.style.display = "none"; return; }
        const x = street.horizontal ? positions[i] : street.a.x;
        const y = street.horizontal ? street.a.y : positions[i];
        el.setAttribute("transform", `translate(${x} ${y}) rotate(${street.angle})`);
        el.style.display = "";
      });
    });
  }
  // Building markers and their names (Close view). The marker circle's
  // radius is read twice — by the circle itself and by the visibility test
  // in mapPositionBuildingLabels() — so it is one fact with one name.
  const MAP_BLDG_DOT_R = 6;
  const MAP_BLDG_LINE_H = 11;

  // A judgment call with no prior convention behind it; retunable. Anything
  // from about 4 to 10 behaves the same, and the bound on how far a name can
  // be dragged from its own dot moves with it.
  const MAP_BLDG_LABEL_PAD = 6;

  // Which space in a two-line name is the line break: the one that leaves
  // the two sides closest in rendered width. The widest line is what `half`
  // feeds to the edge clamp below, so the balanced break is the one that
  // keeps the block narrowest and least able to drag itself off its own dot.
  // `el` carries the whole name, so every candidate is one getSubStringLength
  // against a layout that already exists — no text is written and re-read.
  //
  // Measured rather than character-counted: the two agree on most names and
  // disagree where letter widths do. "Sunoco Gas Station" balances by
  // characters at the second space and by width at the first, and the width
  // answer has the narrower widest line — 65.25 against 65.42, so the margin
  // is a hair, and the case for measuring is that it is already being
  // measured for `half`, not that it wins big. On an exact tie the earliest
  // space wins, so the choice never depends on iteration order. If
  // measurement fails every score is zero, the earliest space wins, and the
  // split degrades to the first-space rule this replaced.
  function mapSplitName(el, name){
    let best = -1, bestScore = Infinity;
    for(let i = name.indexOf(" "); i !== -1; i = name.indexOf(" ", i + 1)){
      const score = Math.abs(mapTextWidth(el, 0, i) - mapTextWidth(el, i + 1, name.length - i - 1));
      if(score < bestScore){ bestScore = score; best = i; }
    }
    return best === -1 ? [name] : [name.slice(0, best), name.slice(best + 1)];

  // Caches the Close label pool the way mapBindStreetLabels() caches Wide's:
  // element references plus the geometry a pan needs, so moving the box
  // touches no DOM queries and no layout reads. Widths are measured off the
  // bound nodes rather than tabulated — a table would need re-measuring
  // every time a building is renamed, and would not survive new buildings
  // being added. Bind only runs when the zoom mode changed, which is the
  // moment that already rebuilds the whole SVG. Cleared for Wide, which
  // draws no building markers at all.
  function mapBindBuildingLabels(){
    mapBuildingLabels = [];
    if(mapZoomMode !== "close") return;
    const svg = document.getElementById("mapSvg");
    Object.keys(MAP_BUILDING_OFFSETS).forEach(id=>{
      const off = MAP_BUILDING_OFFSETS[id];
      const anchor = LOCATIONS[BUILDINGS[id].anchor];
      const dot = mapToSvg(anchor.x / 100 + off.dx, anchor.y / 100 + off.dy);
      const els = Array.prototype.slice.call(svg.querySelectorAll(`text.map-bldg-label[data-bldg="${id}"]`));
      // Split first: `half` below reads the nodes, so it has to run against
      // the text they finally carry, not the whole name sitting in the first
      // one. A one-node pool is a one-word name and needs no split.
      const parts = els.length > 1 ? mapSplitName(els[0], BUILDINGS[id].name) : [BUILDINGS[id].name];
      els.forEach((el, i)=> el.textContent = parts[i] || "");
      // A negative dy puts the block above its dot, otherwise below — the
      // rule renderMapClose() used to apply at build time, with the same
      // gaps. The two are not symmetric: below the dot a baseline has to
      // clear the circle, above it only the cap height has to.
      const first = off.dy < 0 ? -10 - MAP_BLDG_LINE_H : 16;
      const lines = els.map((el, i)=> ({ el, dy: first + i * MAP_BLDG_LINE_H }));

  function mapUpdateViewBox(node, snap){

    }
    if(room.hasTree && hasTool("chopping")){
      hereBox.appendChild(actionButton("Chop down the tree " + fmtDuration(CHOP_TREE_MIN), doChopTree));
    }
    if(!room.searchLabel || room.searched){
      room.containers.forEach(c=>{
        if(c.locked && hasTool(c.breakTag)){
          hereBox.appendChild(actionButton("Cut the lock on " + c.name, ()=> doUnlockContainer(c.id), "locked"));
        }
      });
    }
    hereGroup.style.display = hereBox.children.length ? "" : "none";
  }
  function renderInventoryPanel(){
    const invTabsEl = document.getElementById("invTabs");
    invTabsEl.innerHTML = "";
    // One tab per populated container slot, in CONTAINER_SLOTS order
    // (keychain, then ITEM_REGISTRY order), so a new equippable bag shows up
    // here with no RENDERING edit at all.
    const invTabDefs = [["inventory","Inventory"]];
    CONTAINER_SLOTS.forEach(slot=>{
      if(state[slot]) invTabDefs.push([slot, SLOT_LABELS[slot]]);
    });
    if(invTab !== "inventory" && !state[invTab]) invTab = "inventory";
    invTabDefs.forEach(([key,label])=>{
      const btn = document.createElement("button");
      btn.textContent = label;
      if(invTab === key) btn.classList.add("active");
      btn.addEventListener("click", ()=>{ invTab = key; render(); });
      invTabsEl.appendChild(btn);
    });
    const currentInv = invSlot(invTab);
    document.getElementById("invWeight").textContent =
      totalWeight(currentInv.items).toFixed(2) + (currentInv.capacityKg ? " / " + currentInv.capacityKg + " kg" : " kg");
    const unequipBtn = document.getElementById("unequipBtn");
    if(CONTAINER_SLOTS.indexOf(invTab) >= 0){
      unequipBtn.style.display = "";
      unequipBtn.onclick = ()=> doUnequip(invTab);
    } else { unequipBtn.style.display = "none"; }
    renderItemList(document.getElementById("invList"), currentInv.items, [
      { label: worldTab === "floor" ? "Place" : "Store", onClick:(i)=> doStore(i) }
    ], "inv");
  }
  function renderWorldItemsPanel(){
    const room = world[state.currentRoom];
    const worldTabsEl = document.getElementById("worldTabs");
    worldTabsEl.innerHTML = "";
    const worldTabDefs = [["floor","Floor"]];
    if(!room.searchLabel || room.searched){
      room.containers.forEach(c=>{ if(!c.locked) worldTabDefs.push([c.id, c.name]); });
    }
    if(room.carContainers && !room.carLocked) room.carContainers.forEach(c=> worldTabDefs.push([c.id, c.name]));
    worldTabDefs.forEach(([key,label])=>{
      const btn = document.createElement("button");
      btn.textContent = label;
      if(worldTab === key) btn.classList.add("active");
      btn.addEventListener("click", ()=>{
        const c = room.containers.find(x=>x.id===key) || (room.carContainers && room.carContainers.find(x=>x.id===key));
        if(c) doOpenContainer(room, c);
        else { worldTab = key; render(); }
      });
      worldTabsEl.appendChild(btn);
    });
    if(!worldTabDefs.find(d=>d[0]===worldTab)) worldTab = "floor";
    const currentWorld = worldSlot(room, worldTab);
    document.getElementById("worldWeight").textContent =
      totalWeight(currentWorld.items).toFixed(2) + " / " + currentWorld.capacityKg + " kg";
    renderItemList(document.getElementById("worldList"), currentWorld.items, [
      // Disabled rather than hidden, for the reason given at the detail
      // view's Take family in getItemActions(): the item can be taken, just
      // not into the keychain.
      { label:"Take", disabled:(it)=> invTab === "keychain" && !keychainAllows(it), onClick:(i)=> doTake(i) }
    ], "world");
  }
  // The seed, as its canonical uint32 — what a typed word hashed to, which is
  // what reproduces the run; a word is lossy, the number is the seed. Its own
  // menu section rather than a line in Stats, and drawn ahead of render()'s
  // game-over branch, because that branch wipes #statsBox and the seed is
  // exactly what a player wants after dying.
  function renderRunPanel(){
    document.getElementById("runBox").textContent = "Seed: " + state.seed;
  }
  function render(){
    renderRunPanel();
    if(gameOver){
      document.getElementById("locLabel").textContent = "";
      document.getElementById("clockLabel").textContent = "";
      document.getElementById("roomDesc").textContent = "You did not survive.";
      document.getElementById("statsBox").innerHTML = "Hunger: —<br>Thirst: —<br>Energy: —<br>Health: 0";
      const moveBox = document.getElementById("moveActions");
      moveBox.innerHTML = "";
      moveBox.appendChild(actionButton("Restart", ()=> doRestart()));
      document.getElementById("moveGroup").style.display = "";
      document.getElementById("hereGroup").style.display = "none";
      document.getElementById("invTabs").innerHTML = "";
      document.getElementById("invList").innerHTML = "";
      document.getElementById("invWeight").textContent = "";
      document.getElementById("unequipBtn").style.display = "none";
      document.getElementById("worldTabs").innerHTML = "";
      document.getElementById("worldList").innerHTML = "";
      document.getElementById("worldWeight").textContent = "";
      document.getElementById("craftBackBtn").style.display = "none";
      document.getElementById("craftBody").innerHTML = "";
      return;
    }
    renderLocationPanel();
    renderStatsPanel();
    renderMoveActionsPanel();
    renderHereActionsPanel();
    renderInventoryPanel();
    renderWorldItemsPanel();
    renderCraftPanel();
    renderMap();
  }

  document.title = "Ashfall — v" + GAME_CONFIG.VERSION;
  document.getElementById("pageTitle").textContent = "ASHFALL — v" + GAME_CONFIG.VERSION;
  log("You wake up in your apartment. Everything's exactly where you left it — for now.");
  mapSetZoomStep(mapZoomStep);
  render();

  // Dev seam. The four validators above are local bindings inside this IIFE, so
  // `validateReachability()` typed into devtools is a ReferenceError. This is the
  // one deliberate hole in the closure: read-only reporting helpers, nothing that
  // writes game state, and nothing else belongs on it.
  window.ashfallDev = { validateItemRegistry, validateLocations, validateRoomSchema, validateReachability };
})();
</script>
</body>
</html>
