  // is resolved from the first step after anything touches it. The trippers
  // are kept per rules and seed, the network being fixed. The floats are
  // read as the step starts, before this step's refill.
  function stepPower(dt){
    const before = powerNow;
    const r = powerStep(POWER_INDEX, state.power, state.electricalRules, gridUp(),
      minutesSinceCollapse(), dt, before, state.seed, tankFloatsNow());
    state.power = r.power;
    powerNow = r;
    logGridChange(dt, before, r);
    logTrips(r.trips);
  }
  // What the player notices when something in their room stops or starts:
  // a trip's quiet (logTrips()) and the grid going down (logGridChange())
  // share one line.
  const ROOM_GOES_QUIET = "Everything in here goes quiet.";
  // The grid itself logs nothing. When it goes down (the failure, and the end
  // of the recovery), the room goes quiet if a load in it was drawing the
  // step before; when it comes back, something starts up if a load in it is
  // drawing this step. Only wired loads count, and neither line wakes a
  // sleeper. One line per transition at most. Wording retunable.
  function logGridChange(dt, before, after){
    const now = minutesSinceCollapse(), up = gridUp(now);
    if(up === gridUp(now - dt)) return;
    const drewHere = (r)=> !!r && (POWER_INDEX.roomLoads[state.currentRoom] || []).some(id=> powerRead(r, "drawing", id));
    if(!up && drewHere(before)) log(ROOM_GOES_QUIET, "warn");
    if(up && drewHere(after)) log("Something in here starts up again.");
  }
  // A trip is heard where its panel or board hangs, and noticed where
  // something it fed was running; anywhere else it passes unremarked. A fuse
  // blowing is heard as its own line, in place of the panel's (#358). The
  // grid going down or coming back is logGridChange()'s. One line of each
  // kind per step. Wording retunable.
  function logTrips(trips){
    let atPanel = false, atFuse = false, quiet = false;
    trips.forEach(t=>{
      const br = POWER_NET.breakers[t.id];
      if(br.room === state.currentRoom){ if(br.fuse) atFuse = true; else atPanel = true; }
      else if(t.running.some(id=> POWER_NET.loads[id].room === state.currentRoom)) quiet = true;
    });
    if(atPanel) log("The panel on the wall snaps. A breaker has tripped.", "warn");
    if(atFuse) log("Something pops in the fuse box.", "warn");
    if(quiet) log(ROOM_GOES_QUIET, "warn");
  }
  // Whether a load has power: its switch is on and its path is live.
  function isPowered(loadId){
    if(!powerNow) refreshPower();
    return !!powerRead(powerNow, "powered", loadId);
  }
  // Whether a load has power, and whether it is drawing, on state.power as
  // it stands, before the next step resolves it: a hand on the load's own
  // switch shows at once in the load's own readout, where isPowered() and
  // spoilage see it from the next step, as they see a breaker. A fresh look,
  // stored nowhere and starting nothing, so it is render-safe. Buildings
  // share nothing but the grid, so the look is the load's own building's.
  // Its step before is the last step's (powerNow, priorDrawing()), so a pump
  // that started below its float's start level keeps drawing until its tank
  // is full, as the resolver has it. Before the first step there is none.
  function loadLookNow(loadId){
    const b = POWER_INDEX.of[loadId];
    if(b === undefined) return { powered:false, drawing:false };
    const snap = powerSnapshot(POWER_INDEX.sub[b], APPLIANCES, state.power, state.electricalRules, gridUp(),
      minutesSinceCollapse(), priorDrawing(POWER_INDEX, priorOf(powerNow), b), state.seed, tankFloatsNow());
    return { powered:!!snap.powered[loadId], drawing:!!snap.drawing[loadId] };
  }
  function loadPoweredNow(loadId){ return loadLookNow(loadId).powered; }
  // What a meter reads, from the last step (powerNow). They add no rule to
  // the resolver: each is a look at what it already worked out (#249).
  //   A load's supply, up to its own switch: its circuit's volts while the
  //   circuit is live (simplified rules: its panel, unless the circuit is a
  //   fuse), else 0.
  function loadSupplyVolts(loadId){
    if(!powerNow) refreshPower();
    const l = POWER_NET.loads[loadId];
    const live = powerRead(powerNow, "live", circuitSkipped(POWER_NET.breakers[l.circuit], state.electricalRules) ? l.panel : l.circuit);
    return live ? POWER_NET.breakers[l.circuit].volts : 0;
  }
  //   A breaker's load side, at its volts: a circuit's own liveness, a panel
  //   main's its panel's, a feeder's its panel's supply, the board main's
  //   its board's.
  function breakerLoadSideVolts(id){
    if(!powerNow) refreshPower();
    const br = POWER_NET.breakers[id];
    const live = br.layer === "circuit" ? powerRead(powerNow, "live", id)
      : br.layer === "panel" ? powerRead(powerNow, "live", br.device)
      : br.layer === "feeder" ? powerRead(powerNow, "supplied", Object.values(POWER_NET.panels).find(p=> p.feeder === id).id)
      : powerRead(powerNow, "live", br.device);
    return live ? br.volts : 0;
  }
  //   The current through a breaker, in amps: one conductor clamped at the
  //   panel. A main or a feeder reads its total, since a panel is
  //   single-phase. A cycling load reads whatever it is doing this minute.
  function breakerCurrent(id){
    if(!powerNow) refreshPower();
    return powerRead(powerNow, "running", id) || 0;
  }
  // ==================================================
  // STAMINA / FATIGUE SYSTEM
  // ==================================================
  // Tasks own their duration/execution/success; they only ever *declare*
  // Exertion. This module owns every rule about
  // what Exertion does to Stamina/Fatigue, and how Energy modifies or is
  // spent by recovery — keeping Stamina out of the task layer entirely.
  function applyExertion(exertion){
    if(exertion <= 0) return;
    const v = state.vitals;
    const staminaUsed = Math.min(v.stamina, exertion);
    v.stamina = Math.max(0, v.stamina - staminaUsed);
    const remainingExertion = exertion - staminaUsed;
    v.fatigue = Math.min(100, v.fatigue + remainingExertion);
    state.lastExertionMinute = state.totalMinutes;
  }
  function isExertionDelayActive(){
    return (state.totalMinutes - state.lastExertionMinute) < STAMINA_RECOVERY_DELAY_MIN;
  }
  function energyRecoveryMultiplier(){
    const e = state.vitals.energy;
    if(e >= 80) return 1.00;
    if(e >= 60) return 0.90;
    if(e >= 40) return 0.75;
    if(e >= 20) return 0.50;
    return 0.25;
  }
  function staminaMaxForEnergy(){
    const e = state.vitals.energy;
    if(e >= 40) return 100;
    if(e >= 20) return 80;
    return 50;
  }
  function hungerThirstRecoveryPenalty(){
    // Additive 15%-each penalty — never compounded multiplicatively.
    let penalty = 0;
    if(state.vitals.hunger < LOW_HUNGER_THRESHOLD) penalty += 0.15;
    if(state.vitals.thirst < LOW_THIRST_THRESHOLD) penalty += 0.15;
    return penalty;
  }
  function fatigueRecoveryAllowed(){
    // Fatigue only recovers once Stamina has reached its *current* cap —
    // this is deliberately staminaMaxForEnergy(), not a flat 100, so a
    // low-Energy Stamina cap can't be worked around.
    return state.vitals.fatigue > 0 && state.vitals.stamina >= staminaMaxForEnergy();
  }
  // The Fatigue gait lock. `state.gait` is the player's chosen pace and is
  // written in exactly one place — the pace-bar click handler. It is never
  // coerced: at FATIGUE_GAIT_LOCK the lock supplies an *effective* gait
  // instead, so the preference survives the lock and lights up again by
  // itself once Fatigue falls. Two predicates rather than one because they
  // answer different questions: gaitLocked() is what the click guard and the
  // button-disabling want, effectiveGait() is what movement pricing wants.
  // Everything that prices or charges movement must read effectiveGait() —
  // moveMinutes() and doMove()'s jog surcharge both do, which is what keeps
  // the two from disagreeing whatever order RENDERING happens to run in.
  function gaitLocked(){ return state.vitals.fatigue >= FATIGUE_GAIT_LOCK; }
  function effectiveGait(){ return gaitLocked() ? "sneak" : state.gait; }
  // One game-minute (or smaller remainder) of awake Stamina/Fatigue
  // recovery. mode "rest" uses Rest's flat rate and never adds the
  // recovery Energy surcharge; mode "normal" is the ordinary awake state.
  function recoveryStep(dt, mode){
    if(isExertionDelayActive()){ applyEnergyBaseline(dt, 1); return; }
    const cap = staminaMaxForEnergy();
    if(state.vitals.stamina < cap){
      const rate = mode === "rest"
        ? REST_STAMINA_RATE
        : BASELINE_STAMINA_RATE * energyRecoveryMultiplier() * (1 - hungerThirstRecoveryPenalty());
      state.vitals.stamina = Math.min(cap, state.vitals.stamina + rate*dt);
      applyEnergyBaseline(dt, mode === "rest" ? 1 : 2);
    } else if(fatigueRecoveryAllowed()){
      state.vitals.fatigue = Math.max(0, state.vitals.fatigue - FATIGUE_RECOVERY_RATE*dt);
      applyEnergyBaseline(dt, mode === "rest" ? 1 : 4);
    } else {
      applyEnergyBaseline(dt, 1);
    }
  }
  // The Energy ceiling this Sleep can reach: Fatigue caps how much rest is
  // worth. Read by doSleep(), estimateSleepMinutes() and sleepRestoresEnergy().
  function sleepEnergyCeiling(){ return clamp(100 - state.vitals.fatigue); }
  // Sleep is unavailable for two separate reasons, kept separate so
  // RENDERING can say which one applies. sleepRestoresEnergy() is false
  // whenever the Sleep would restore nothing — including at Fatigue 100,
  // where the ceiling is 0 and no Energy is ever below it. That state is
  // worked off through recoveryStep() instead, which is the intended price
  // of never handing out a free Fatigue wipe for a zero-length Sleep.
  function sleepOffCooldown(){ return state.totalMinutes >= state.lastWakeMinute + SLEEP_COOLDOWN_MIN; }
  function sleepRestoresEnergy(){ return state.vitals.energy < sleepEnergyCeiling(); }
  function sleepAvailable(){ return sleepOffCooldown() && sleepRestoresEnergy(); }
  function estimateSleepMinutes(){
    const missing = Math.max(0, sleepEnergyCeiling() - state.vitals.energy);
    return missing / SLEEP_ENERGY_RATE;
  }
  // Advances awake game time in <=1-minute steps so the Stamina/Fatigue
  // recovery delay (exactly 1 game minute) and the Energy-driven recovery
  // bands are evaluated at natural resolution instead
  // of being approximated over an arbitrarily long jump. `untilWoken`: stop
  // after the step in which a waking event sets `wokenUp`, as doSleep()'s
  // loop does (the blackout, advanceTime()). Returns the minutes left unrun,
  // 0 when it ran them all.
  function runAwakeStep(min, untilWoken){
    let remaining = min;
    while(remaining > 1e-9 && !(untilWoken && wokenUp)){
      const dt = Math.min(1, remaining);
      state.totalMinutes += dt;
      applyHungerThirst(dt);
      applyWorldTicking(dt);
      recoveryStep(dt, "normal");
      remaining -= dt;
    }
    return remaining;
  }
  // Collapsing at zero Energy. Every COLLAPSE_BLACKOUT_EVERY-th collapse is
  // the long one; the others are a stumble. Balance values, retunable.
  //
  // The blackout counts as asleep for clock events (`asleep`), so a waking
  // one (the siren) wakes you and ends it after that step. Woken early,
  // Energy is set to COLLAPSE_BLACKOUT_ENERGY's share for the minutes taken
  // (120 of 300 gives 36), a balance choice, retunable, and the waking
  // event's own line is the record, as for sleep. A waking event in the last
  // step leaves the blackout complete. The stumble stays awake.
  const COLLAPSE_BLACKOUT_EVERY = 3;
  const COLLAPSE_BLACKOUT_MIN = 300;
  const COLLAPSE_BLACKOUT_ENERGY = 90;    // Energy set to, not added
  const COLLAPSE_STUMBLE_MIN = 20;
  const COLLAPSE_STUMBLE_ENERGY = 30;     // Energy added, not set
  function advanceTime(min){
    runAwakeStep(min);
    if(state.vitals.energy <= 0){
      state.collapseCount += 1;
      if(state.collapseCount % COLLAPSE_BLACKOUT_EVERY === 0){
        log("Your body gives out completely. You black out.", "warn");
        let left = COLLAPSE_BLACKOUT_MIN, woken = false;
        asleep = true;
        wokenUp = false;
        try {
          left = runAwakeStep(COLLAPSE_BLACKOUT_MIN, true);
        } finally {
          woken = wokenUp;
          asleep = false;
          wokenUp = false;
        }
        if(woken && left > 1e-9){
          const taken = COLLAPSE_BLACKOUT_MIN - left;
          state.vitals.energy = clamp(COLLAPSE_BLACKOUT_ENERGY * taken / COLLAPSE_BLACKOUT_MIN);
        } else {
          state.vitals.energy = clamp(COLLAPSE_BLACKOUT_ENERGY);
          log("Hours pass before you come to, disoriented and vulnerable.", "warn");
        }
      } else {
        log("Exhaustion drops you where you stand. A few minutes pass before you can get up.", "warn");
        runAwakeStep(COLLAPSE_STUMBLE_MIN); state.vitals.energy = clamp(state.vitals.energy + COLLAPSE_STUMBLE_ENERGY);
      }
    }
    checkGameOver();
  }
  // ==================================================
  // CRAFTING
  // ==================================================
  // Crafting reaches the room, not only your pockets. The item lists it
  // reaches, in the order a non-perishable input is taken from them: the
  // inventory pools, then the room's floor, then the containers the Here
  // panel lists (listedContainers()), authored ones first. Never the inside
  // of a floor bag or of a vessel, and never a container that has not rolled
  // yet, which counts as empty: crafting does not trigger a roll.
  function nearbyLists(){
    const room = world[state.currentRoom];
    return invPools().concat([room.floor],
      listedContainers(room).filter(c=> !(c.spawnPools && !c.spawnRolled)).map(c=> c.items));
  }
  // Whether a row can serve as `input`: the same item, in the input's cook
  // state when it names one.
  function inputMatches(it, input){
    return it.itemId === input.id && (!input.cookState || cookStateOf(it) === input.cookState);
  }
  function countNearby(input){
    return nearbyLists().reduce((sum, list)=> sum + list.filter(it=> inputMatches(it, input)).reduce((s, it)=> s + it.qty, 0), 0);
  }
  // Takes `input`'s units from nearby and returns them. Perishable units go
  // oldest first across every list, and a tie goes to the list reached
  // first; units that do not age go in list order, the inventory's first.
  // One sort does both, since a unit that does not age sorts as the same age
  // as every other.
  function takeNearby(input){
    const units = [];
    nearbyLists().forEach((list, li)=> list.forEach(row=>{
      if(!inputMatches(row, input)) return;
      const ages = isPerishable(row) ? unitAges(row) : null;
      for(let u = 0; u < row.qty; u++) units.push({ list, row, li, age: ages ? ages[u] : -1 });
    }));
    units.sort((a, b)=> b.age - a.age || a.li - b.li);
    const perRow = new Map();
    units.slice(0, input.qty).forEach(u=>{ perRow.set(u.row, { list:u.list, n:(perRow.get(u.row) || { n:0 }).n + 1 }); });
    const taken = [];
    // A row's units are kept oldest first, so the n oldest picked from a row
    // are exactly the n dropUnits() takes.
    perRow.forEach((pick, row)=> taken.push(dropUnits(pick.list, pick.list.indexOf(row), pick.n)));
    return taken;
  }
  function canCraft(recipe){
    const hasAll = recipe.inputs.every(inp => countNearby(inp) >= inp.qty);
    if(!hasAll) return false;
    // The tool is carried, as every tool check is (hasTool()). The heat gate
    // is one no recipe sets today; it stays because it is the declared shape
    // a recipe uses to demand a heat source.
    if(recipe.tool && !hasTool(recipe.tool)) return false;
    if(recipe.needsHeat && !roomHasHeat(world[state.currentRoom])) return false;
    return true;
  }
  // What a recipe makes lands on the room's floor, always — over floorCap
  // too, with the heap warning. A perishable output is the same flesh as
  // what it was made from: it takes the age of the oldest perishable unit
  // used, and is new only when none was.
  function doCraft(recipeId){
    const recipe = RECIPES.find(r=>r.id===recipeId);
    if(!recipe || !canCraft(recipe)) return;
    const used = [];
    recipe.inputs.forEach(inp=> takeNearby(inp).forEach(u=> used.push(u)));
    advanceTime(recipe.minutes);
    const crafted = itemFromRegistry({ id: recipe.output.id, qty:1 });
    if(isPerishable(crafted)){
      const ages = used.filter(isPerishable).map(u=> unitAges(u)[0]);
      crafted.ages = [ages.length ? Math.max(...ages) : 0];
    }
    const room = world[state.currentRoom];
    if(room.floorCap && totalWeight(room.floor) + itemWeight(crafted) > room.floorCap) logHeap(crafted);
    addToList(room.floor, crafted);
    log(recipe.doneLog || `You craft a ${crafted.name.toLowerCase()}.`, "good", "craft:" + recipe.output.id);
    render();
  }
  // ==================================================
  // FIRE / COOKING
  // ==================================================
  // Action durations in game minutes. ACTIONS spends these and RENDERING
  // prints them on the buttons, so the two cannot drift apart.
  const FISH_DURATION_MIN = 20;
  // Fishing is deliberately net positive on Stamina at full Energy: 20 minutes
  // of baseline recovery against 8 spent. Not derived from its duration the
  // way chopping is — the margin is the point, and the number is a balance
  // value retunable on its own.
  const FISH_EXERTION = 8;
  const LIGHT_STOVE_MIN = 5;
  const BUILD_FIRE_MIN = 10;
  const DISMANTLE_CAMPFIRE_MIN = 10;      // shares a value with BUILD_FIRE_MIN; a separate fact
  const CHOP_TREE_MIN = 30;
  // Chopping is deliberately break-even on Stamina at full Energy: a chop
  // spends exactly what its own duration recovers at the awake baseline rate,
  // so it is sustainable while rested and bites only once low Energy or low
  // Hunger/Thirst pull the recovery multiplier down. Written as the product
  // rather than as a literal so the relationship survives a retune of either
  // input — the relationship is the rule, not the number.
  const CHOP_TREE_EXERTION = CHOP_TREE_MIN * BASELINE_STAMINA_RATE;
  // Fire fuel. A burn is its wood spent at the per-piece rate, so the two
  // stay in step when either is retuned. A first fire comes out of the
  // campfire kit and burns CAMPFIRE_KIT_COST pieces' worth, since that is
  // the wood the kit was crafted from; a rebuild in an already-built
  // campfire costs FIRE_BUILD_WOOD loose firewood. FIRE_MAX_MIN is its own
  // fact — a cap on banked burn time, not a wood count.
  const FIRE_BUILD_WOOD = 3;
  const FIRE_MINUTES_PER_WOOD = 60;
  const FIRE_MAX_MIN = 360;
  // Dismantling a campfire refunds this much firewood, plus every whole
  // piece's worth of fuel still in it (doDismantleCampfire()). Retunable, but
  // not freely: with today's values build → put out → dismantle breaks
  // exactly even, n firewood in and n out, only because doBuildFire() burns
  // the fire during BUILD_FIRE_MIN and this baseline is at most one piece of
  // fuel. Raising it, or making the build free, turns the cycle into a
  // firewood source.
  const CAMPFIRE_DISMANTLE_BASE_WOOD = 1;
  const HEAT_CONTAINER_CAPACITY_KG = 8;   // stove and campfire alike
  const CHOP_TREE_FIREWOOD = 6;
  const FISH_BITE_CHANCE = 0.55;          // balance value, retunable
  function doFish(){
    advanceTime(FISH_DURATION_MIN);
    applyExertion(FISH_EXERTION);
    // Keyed on game time *after* the cast, and that is the save-scum rule:
    // repeating the cast from a reloaded save lands on the same minute and
    // reproduces the bite, while spending any time first — walking, resting,
    // chopping — moves the minute and genuinely rerolls.
    if(chance(FISH_BITE_CHANCE, "fish", state.currentRoom, state.totalMinutes)){
      giveItem(asNewlyMade(itemFromRegistry({ id:"fish", qty:1 })));
      log("Something bites. You reel in a fish.", "good", "fish", "bite");
    } else {
      log("Nothing bites this time.", null, "fish", "miss");
    }
    render();
  }
  // Creates the container with `tags` when the room has none with this id.
  // One that already exists is returned as it is. Its only caller is
  // doBuildFire(): a stove's container is authored, and lighting it creates
  // nothing (see doLightStove()).
  function ensureHeatContainer(room, id, name, capacityKg, tags){
    let c = room.containers.find(x=>x.id===id);
    if(!c){ c = { id, name, capacityKg, tags, items:[] }; room.containers.push(c); }
    return c;
  }
  // How the stove in `roomId` would light now: "self" with power, its
  // igniter sparking; "hand" without, when a flame is carried, a `heat` tool
  // (the propane torch) or a fire-starter with uses; null when nothing
  // carried will light it. Power matters only here, at the lighting: a lit
  // burner holds its own flame on a manual gas valve, so losing power never
  // puts it out. The device pop-up and doLightStove() both ask this.
  function stoveLighting(roomId, stove){
    if(containerPowered(roomId, stove)) return "self";
    return hasTool("heat") || hasMatchUses() ? "hand" : null;
  }
  // Lights the room's stove, the authored container roomStove() finds. It
  // never creates a container: making one by id is how a kitchen whose
  // stove's id was not the one asked for grew a second, empty "Stove" tab
  // when lit (#177). With power the stove lights itself and spends nothing
  // (#234). Without, a burner is lit by hand (#259): the torch first, which
  // has no fuel to spend, so a player carrying both keeps their matches, and
  // otherwise one use of a fire-starter.
  function doLightStove(){
    const room = world[state.currentRoom];
    const stove = roomStove(room);
    if(!stove) return;
    const how = stoveLighting(state.currentRoom, stove);
    if(!how) return;
    if(how === "hand" && !hasTool("heat")) consumeMatchUse();
    room.heatActive = true;
    advanceTime(LIGHT_STOVE_MIN);
    log(how === "self" ? "You light the stove." : "You light a burner by hand.", "good");
    render();
  }
  function canBuildFire(room){
    if(room.campfireBuilt) return room.fireMinutesLeft > 0 || countInPools("firewood") >= FIRE_BUILD_WOOD;
    // A kit carries its own first load of wood, so a first fire needs nothing else.
    return countInPools("campfire_kit") >= 1;
  }
  function doBuildFire(){
    const room = world[state.currentRoom];
    if(!canBuildFire(room)) return;
    if(!consumeMatchUse()) return;
    const firstTime = !room.campfireBuilt;
    // banked is hoisted above the branch because the log ternary below
    // reads it. Same value as before: on a first build fireMinutesLeft is
    // undefined, and `undefined > 0` was already false.
    const banked = !firstTime && room.fireMinutesLeft > 0;
    if(firstTime){
      consumeFromPools("campfire_kit", 1);
      room.campfireBuilt = true;
      // The kit was crafted from CAMPFIRE_KIT_COST firewood and burns that
      // wood — it costs no loose firewood on top.
      room.fireMinutesLeft = CAMPFIRE_KIT_COST * FIRE_MINUTES_PER_WOOD;
    } else if(!banked){
      consumeFromPools("firewood", FIRE_BUILD_WOOD);
      room.fireMinutesLeft = FIRE_BUILD_WOOD * FIRE_MINUTES_PER_WOOD;
    }
    ensureHeatContainer(room, "campfire", "Campfire", HEAT_CONTAINER_CAPACITY_KG, ["heat"]);
    room.heatActive = true;
    advanceTime(BUILD_FIRE_MIN);
    log(firstTime ? "You set up the campfire kit and get a fire going."
      : (banked ? "You relight the fire from what's left of the wood." : "You get a fire going."), "good");
    render();
  }
  function doAddFuel(){
    if(countInPools("firewood") < 1) return;
    const room = world[state.currentRoom];
    consumeFromPools("firewood", 1);
    room.fireMinutesLeft = Math.min((room.fireMinutesLeft || 0) + FIRE_MINUTES_PER_WOOD, FIRE_MAX_MIN);
    log("You feed the fire more wood.", "good", "fuel");
    render();
  }
  function doExtinguish(){
    const room = world[state.currentRoom];
    room.heatActive = false;
    log("You put it out.");
    render();
  }
  function doDismantleCampfire(){
    const room = world[state.currentRoom];
    if(!room.campfireBuilt || room.heatActive) return;
    // By id, not by tag: "campfire" is the id doBuildFire() gives the
    // container it creates. Code assigns it, nothing authors it, so this is
    // not a name check.
    const container = room.containers.find(c=>c.id==="campfire");
    if(container){
      container.items.forEach(it=> addToList(room.floor, it));
      room.containers = room.containers.filter(c=>c.id!=="campfire");
    }
    const refund = CAMPFIRE_DISMANTLE_BASE_WOOD + Math.floor((room.fireMinutesLeft || 0) / FIRE_MINUTES_PER_WOOD);
    giveItem(itemFromRegistry({ id:"firewood", qty:refund }));
    room.campfireBuilt = false;

  // The room's cooking space: its first container tagged `heat`, a stove's

  const TICK_EPSILON = 1e-9;

  function cookItem(list, it, dt){

  // must boil first — but `waterBoils` says it will be.
  function templateStatus(t, kind, rows, water){

  // its portion.
  function ingredientContribution(it){
    const def = registryEntryOf(it);
    const base = def.ingredient.restores || (def.cooks && def.cooks.restores) || def.restores || {};
    const k = (unitFreshness(it) === "rotten" ? ROTTEN_RESTORES_FACTOR : 1) * portionOf(it);
    return scaleRestores(base, k);

  // The one scalar measure of how much a food restores, used to rank and

  function restoresValue(r){ return (r && r.hunger || 0) + (r && r.thirst || 0); }

  // Raw or Cooked chance, anything else's one chance.
  function ownPoisoning(def, cookState){
    return cookState === "cooked" && def.cooks ? (def.cooks.foodPoisoningChance || 0) : (def.foodPoisoningChance || 0);
  }
  // Builds a dish from `rows` for template `t`, with `waterKg` of water in it.
  // The one dish builder: formation and the world's spawned stews both come

  //   restores       the units' contributions summed, per vital, times
  //                  (1 + DISH_RESTORES_BONUS)
  //   foodPoisoning  { raw, cooked }: per state, the unit whose chance is
  //                  highest — its own for that state, combined with the
  //                  rotten baseline when Rotten — weighted by that unit's
  //                  share of what the dish restores

  //   name           "<A> stew" or "<A> and <b> stew" from the two labels

  function buildDish(t, rows, waterKg){

    const units = contentUnits(rows).map(u=> ({ u, c: ingredientContribution(u) }));
    const restores = {};

  function dishName(t, units){

  function dishFrom(templateId, vesselId, ids, cookState){

    render();

  // ==================================================
  // PERSISTENCE
  // ==================================================
  // Save format: { version, state, rooms, doors, windows }. `state` is
  // written whole. The world's definitions are never saved: they are rebuilt
  // from WORLD DATA on every load, and the save carries only what play
  // changed on top of them. `rooms` holds, per room id, the fields of
  // ROOM_STATE_FIELDS and CONTAINER_STATE_FIELDS that differ from a freshly
  // built world (savedRoomState(), applied back by buildWorld()); `doors` and
  // `windows` hold only the ids whose state differs from a new game's,
  // `{ locked, open, broken }` per door and `{ state }` per window

  function doorSaveFields(d){ return { locked: d.locked, open: d.open, broken: d.broken }; }

  let openingBaselineCache = null;

      openingBaselineCache = { doors:{}, windows:{} };
      Object.keys(d).forEach(id=>{ openingBaselineCache.doors[id] = doorSaveFields(d[id]); });
      Object.keys(w).forEach(id=>{ openingBaselineCache.windows[id] = w[id].state; });
    }

  function savedDoorState(){

  }

    const base = openingBaseline().windows, out = {};

    return out;
  }
  // What a room's saved state is made of: the fields play writes on a room
  // (every write site: doSearch(), doBreakCar(), FIRE / COOKING, the fire's
  // burn-down in applyWorldTicking(), doChopTree(), every take and drop), and
  // on a container, in `containers` and `carContainers` alike

  // else on a room is definition, rebuilt on every load.
  const ROOM_STATE_FIELDS = ["floor", "searched", "carLocked", "heatActive", "fireMinutesLeft", "campfireBuilt", "hasTree"];
  const CONTAINER_STATE_FIELDS = ["items", "spawnRolled", "lastRolledMinute", "locked", "timerMinutes"];

  function savedRoomState(){

  // The runtime world: the definitions, rebuilt fresh, with a save's `rooms`

  function buildWorld(saved){

  // forEachItemList(): calls visit(list, roomId) once for every non-empty item array

  // any item in any of those, to any depth. Every scan over item lists goes

  // stowed bag's contents gets missed. It reads `state` and `world` at call

  let roomIdsWorld = null, roomIdsList = [];

  function resyncUidCounter(){

  // backfillItemIds(): companion to resyncUidCounter(), run alongside it on

  // assigns itemId to any loaded item missing it, by reverse name match
  // against ITEM_REGISTRY (current registry names are unique, so this is
  // unambiguous). Items with no registry match are left without itemId and
  // keep working exactly as before via _uid/list position.
  function backfillItemIds(){
    const nameToId = {};
    Object.keys(ITEM_REGISTRY).forEach(id=>{ nameToId[ITEM_REGISTRY[id].name] = id; });
    forEachItemList(list=> list.forEach(it=>{
      if(it && !it.itemId && nameToId[it.name]) it.itemId = nameToId[it.name];
    }));
  }
  // validateLoadedWorld(): the shape check a load must pass before anything
  // is committed. Unlike validateItemRegistry()/validateLocations() below,
  // which are dev-only console helpers, this is wired into a real code path
  // and runs on every load — hence its place here in PERSISTENCE beside the
  // backfills rather than in the dev-helper block.
  //
  // It covers exactly the shapes that make buildWorld(), resyncUidCounter(),
  // the load-time backfills or render() throw, and no more: `rooms` is an
  // object, each saved room's `floor` and each saved container's `items`
  // (or a made container's) is an array, and the player's room exists in the
  // world rebuilt from the definitions. This is a shape check, not a schema
  // validator: a save that is merely out of date is the backfills' problem,
  // and they run only once this has passed. Returns an array of problem
  // strings, empty on success — the shape its two siblings use.
  function validateLoadedWorld(savedRooms, nextWorld, nextState){
    const problems = [];
    if(!savedRooms || typeof savedRooms !== "object" || Array.isArray(savedRooms)) problems.push("rooms: not an object");
    else Object.keys(savedRooms).forEach(roomId=>{
      const s = savedRooms[roomId];
      if(!s || typeof s !== "object"){ problems.push(`${roomId}: saved room is not an object`); return; }
      if("floor" in s && !Array.isArray(s.floor)) problems.push(`${roomId}: floor is not an array`);
      ROOM_CONTAINER_KINDS.forEach(kind=>{
        const byId = s[kind];
        if(byId === undefined) return;
        if(!byId || typeof byId !== "object"){ problems.push(`${roomId}: ${kind} is not an object`); return; }
        Object.keys(byId).forEach(cid=>{
          const cs = byId[cid];
          if(!cs || typeof cs !== "object") problems.push(`${roomId}/${cid}: saved container is not an object`);
          else if(cs.made ? !Array.isArray(cs.made.items) : ("items" in cs && !Array.isArray(cs.items)))
            problems.push(`${roomId}/${cid}: items is not an array`);
        });
      });
    });
    if(!nextWorld[nextState.currentRoom]) problems.push(`state.currentRoom: "${nextState.currentRoom}" is not in the world`);
    if(!nextState.inventory || !Array.isArray(nextState.inventory.items)){
      problems.push("state.inventory: no items array");
    }
    CONTAINER_SLOTS.forEach(slot=>{
      const bag = nextState[slot];
      if(bag && !Array.isArray(bag.items)) problems.push(`state.${slot}: no items array`);
    });
    return problems;
  }
  // A load is all-or-nothing: the four module bindings are assigned only
  // once the incoming data has passed validateLoadedWorld(). A save that
  // fails leaves the running session exactly as it was, so the player can
  // keep playing — the old order committed `world` first and a throw in a
  // backfill left a half-loaded world on screen with no way back but
  // Restart.
  // backfillSlotItemIds(): companion to backfillItemIds(), run
  // alongside it on every load. Saves written before equipment slots carried
  // itemId hold a slot object built by hand from an item's fields — so
  // countInPools() cannot see the equipped bag by id, and unequipping it
  // would take doUnequip()'s fallback branch and rebuild it by hand again.
  // This assigns itemId by reverse name match against ITEM_REGISTRY, the way
  // backfillItemIds() does for items and sound for the same reason: current
  // registry names are unique. The keychain matches nothing and is left
  // alone, which is correct — it is not a found item and has no registry
  // entry to point at.
  function backfillSlotItemIds(){
    const nameToId = {};
    Object.keys(ITEM_REGISTRY).forEach(id=>{ nameToId[ITEM_REGISTRY[id].name] = id; });
    CONTAINER_SLOTS.forEach(slotKey=>{
      const slot = state[slotKey];
      if(slot && !slot.itemId && nameToId[slot.name]) slot.itemId = nameToId[slot.name];
    });
  }
  // backfillRegistryFields(): companion to backfillItemIds(), run after it
  // and backfillSlotItemIds() on every load, since it keys off the itemId
  // they assign. itemFromRegistry() deep-copies `tags` and `name` onto every
  // instance, so without this a tag fixed in ITEM_REGISTRY would never reach
  // an item already in a save (the walkie-talkie would go on counting as a
  // battery), and nor would a rename (a Pack of galletitas would stay one,
  // and stack under either name with a new Pack of biscuits).
  // Every item forEachItemList() reaches, and every equipped slot object,
  // takes a fresh copy of its registry entry's `tags`, or loses the field when
  // the entry has none, and takes the entry's `name` — unless it is a named
  // dish, whose name dishName() built from its ingredients (NAMED_DISH_ITEMS).
  // An item with no itemId, or one the registry does not know, is left as it
  // is. A new game needs none of this: its items come from the registry
  // already.
  const NAMED_DISH_ITEMS = new Set(DISH_TEMPLATES.filter(t=> t.named).map(t=> t.item));
  function backfillRegistryFields(){
    const resync = (it)=>{
      if(!it || !it.itemId || !Object.prototype.hasOwnProperty.call(ITEM_REGISTRY, it.itemId)) return;
      const def = ITEM_REGISTRY[it.itemId];
      if(def.tags) it.tags = def.tags.slice();
      else delete it.tags;
      if(!NAMED_DISH_ITEMS.has(it.itemId)) it.name = def.name;
    };
    forEachItemList(list=> list.forEach(resync));
    CONTAINER_SLOTS.forEach(slotKey=> resync(state[slotKey]));
  }
  // backfillIllnessScale(): companion to backfillItemIds(), run
  // alongside it on every load. Instances written before illnessChance became
  // a fraction carry it as a percent (the raw fish shipped 35). A value above
  // 1 is a percent by construction — a legal fraction can never exceed 1 — so
  // the test is unambiguous and dividing by 100 is exact. forEachItemList()
  // carries it into `contents`, where an unequipped bag holds its items.
  // Since 0.8 nothing reads the instance field — food poisoning is read from
  // the registry — and migrateCookingRelease() deletes it right after this
  // runs; the repair stays first in that order, as the migration specifies.
  function backfillIllnessScale(){
    forEachItemList(list=> list.forEach(it=>{
      if(it && typeof it.illnessChance === "number" && it.illnessChance > 1){
        it.illnessChance /= 100;
      }
    }));
  }
  // backfillInventoryCap(): companion to backfillItemIds(), run alongside it
  // on every load. The loose inventory has no weight cap of its own — weight
  // answers to the player's load (playerLoad()) instead — but a save written
  // while it had one carries `inventory.capacityKg`, and applyLoadedData()'s
  // spread brings the saved inventory back wholesale over the default. This
  // deletes the field, so no old save keeps its cap and nothing reads a
  // capacity off the inventory.
  function backfillInventoryCap(){
    delete state.inventory.capacityKg;
  }
  // backfillPowerState(): the power release's state, repaired in place on
  // every load, before the loaded network is first resolved. A save from
  // before it (0.8) has no `power` or `electricalRules` and takes them from
  // makeDefaultState()'s spread in applyLoadedData(): an empty power state,
  // so every switch reads its rolled default, and "detailed". This makes
  // sure a present one has the shape the resolver reads, three plain
  // objects and a known rules value, dropping anything else. Idempotent.
  function backfillPowerState(){
    const obj = (v)=> v && typeof v === "object" && !Array.isArray(v) ? v : {};
    const p = obj(state.power);
    state.power = { switches:obj(p.switches), breakers:obj(p.breakers), heat:obj(p.heat) };
    if(!ELECTRICAL_RULES.includes(state.electricalRules)) state.electricalRules = "detailed";
  }
  // migrateCookingRelease(): brings a 0.7 save into the cooking release,
  // run on every load after the backfills above. A browser save from 0.7
  // never reaches it — SAVE_KEY rotated with the MINOR bump — but an
  // imported 0.7 file does, and must load. Idempotent: a save it has already
  // migrated passes through unchanged.
  //   Items with a retired id are rebuilt from the registry as what they
  //   became, keeping qty and _uid (MIGRATED_ITEMS). The spoiled foods come
  //   back Rotten, and the pot of spoiled stew as a cooking pot of rotten
  //   stew.
  //   An instance's `illnessChance`, the copy food poisoning used to be read
  //   from, is deleted: poisoning is read from the registry now. It runs
  //   after backfillIllnessScale(), which repairs that same field first.
  //   The illness timer moves into state.illnesses.
  //   Last, every perishable still without ages is aged from the collapse,
  //   as a new game's world is (stampMissingAges()).
  // Its other half, which gave a loaded room the containers, tags and `sink`
  // the release authored, went when room definitions stopped being saved:
  // every load rebuilds them (buildWorld()).
  const MIGRATED_ITEMS = {
    raw_fish:            it=> itemFromRegistry({ id:"fish", qty:it.qty }),
    cooked_fish:         it=> Object.assign(itemFromRegistry({ id:"fish", qty:it.qty }), { cookState:"cooked" }),
    spoiled_milk:        it=> rottenItem("milk", it.qty),
    moldy_bread:         it=> rottenItem("bread", it.qty),
    rotten_produce:      it=> rottenItem("vegetables", it.qty),
    rotten_leftovers:    it=> rottenItem("leftovers", it.qty),
    pot_of_spoiled_stew: it=>{
      const dish = dishFrom("stew", "cooking_pot", ["meat", "vegetables"], "cooked");
      dish.ages = [ITEM_REGISTRY[dish.itemId].spoils.rottenAfter];
      return Object.assign(itemFromRegistry({ id:"cooking_pot", qty:it.qty }), { contents:[dish] });
    },
    bottled_water:       it=> Object.assign(itemFromRegistry({ id:"plastic_bottle", qty:it.qty }), { water:{ kind:"clean", fill:1 } })
  };
  // `qty` units of `id`, every one of them exactly Rotten.
  function rottenItem(id, qty){
    return Object.assign(itemFromRegistry({ id, qty }), { ages: new Array(qty).fill(ITEM_REGISTRY[id].spoils.rottenAfter) });
  }
  function migrateCookingRelease(){
    forEachItemList(list=> list.forEach((it, i)=>{
      if(!it) return;
      delete it.illnessChance;
      const rebuild = it.itemId && MIGRATED_ITEMS[it.itemId];
      if(!rebuild) return;
      const next = rebuild(it);
      if(it._uid) next._uid = it._uid;
      list[i] = next;
    }));
    if(!state.illnesses || typeof state.illnesses !== "object") state.illnesses = {};
    if(state.illnessMinutesLeft > 0 && !(state.illnesses.food_poisoning > 0))
      state.illnesses.food_poisoning = state.illnessMinutesLeft;
    delete state.illnessMinutesLeft;
    stampMissingAges();
    resyncUidCounter();
  }
  // A save from before room definitions and saved state split (every save
  // before 0.10) carries `world` and no `rooms`. Its rooms can't be mapped
  // onto the rebuilt world, so it is refused, whole, with its own line.
  function applyLoadedData(data){
    if(!data || !data.state){
      log("That save doesn't look valid — nothing was loaded.", "warn");
      return false;
    }
    if(!data.rooms){
      log("This save is from an older version of Ashfall and can't be loaded.", "warn");
      return false;
    }
    if(!data.version){
      log("This save has no version tag (from an older build) — it may not load correctly.", "warn");
    } else if(versionCompat(data.version) !== versionCompat(GAME_CONFIG.VERSION)){
      log(`This save is from v${data.version}, this build is v${GAME_CONFIG.VERSION} — it may not load correctly.`, "warn");
    }
    // A save predating a state field inherits its default here — which is
    // how a pre-0.6 save gets `seed` (a fresh one: its unopened containers
    // roll from it) and `rollSeq`.
    const base = makeDefaultState();
    const nextState = { ...base, ...data.state, vitals: { ...base.vitals, ...(data.state.vitals || {}) } };
    if(!Array.isArray(nextState.enteredBuildings)) nextState.enteredBuildings = [];
    if(!nextState.tankDrawn || typeof nextState.tankDrawn !== "object" || Array.isArray(nextState.tankDrawn)) nextState.tankDrawn = {};
    // Rebuilt from the definitions, with the save's fields applied.
    const nextWorld = buildWorld(data.rooms);
    const nextDoors = buildDoors(data.doors);
    const nextWindows = buildWindows(data.windows);
    const problems = validateLoadedWorld(data.rooms, nextWorld, nextState);
    if(problems.length){
      console.warn("applyLoadedData: save rejected", problems);
      log("That save doesn't look valid — nothing was loaded.", "warn");
      return false;
    }
    state = nextState;
    world = nextWorld;
    doors = nextDoors; windows = nextWindows;
    // The loaded run's network, before anything reads it.
    backfillPowerState();
    refreshPower();
    detailItem = null;
    deviceTarget = null;
    nextRulesChoice = null;
    gameOver = false;
    invTab = "inventory";
    worldTab = "floor";
    // An old save's own invTab/worldTab arrive in `state` through the spread
    // above and are left there: nothing reads them, and deleting two named
    // keys would imply a schema check this load path deliberately does not
    // perform — validateLoadedWorld() validates only the shapes that would
    // throw.
    // The backfills are repair passes for old-but-well-formed saves. They
    // run after validation, never before: they are not what makes a
    // malformed save safe.
    resyncUidCounter();
    backfillItemIds();
    backfillSlotItemIds();
    backfillRegistryFields();
    backfillIllnessScale();
    backfillInventoryCap();
    migrateCookingRelease();
    render();
    return true;
  }
  // validateItemRegistry(): dev-only console helper (not wired to any
  // button or UI, runs nothing automatically). Walks RECIPES
  // inputs/outputs and confirms every id they reference resolves in
  // ITEM_REGISTRY, logging any that don't. Call it as
  // `ashfallDev.validateItemRegistry()` from the browser console when
  // auditing recipe/registry consistency (see the dev seam at the foot of
  // this file).
  //
  // It also flags any ITEM_REGISTRY entry whose `foodPoisoningChance`, or
  // whose `cooks.foodPoisoningChance`, is not a fraction in [0,1], and any
  // `cooks.minutes` that is not above 0 — registry facts, so the registry's
  // validator checks them. chance() would clamp a bad chance at runtime,
  // loudly; this catches it before anyone eats one.
  //
  // And any equippable bag (an entry with a slotType) whose `carryFactor` is
  // missing or not in (0,1]. carryFactorOf() would count such a bag at 1,
  // silently; this makes it loud.
  //
  // And the cooking release's shapes: a `spoils` whose staleAfter is not
  // below its rottenAfter, an `ingredient.role` outside INGREDIENT_ROLES, and
  // a DISH_TEMPLATES template whose `item` is not a dish entry with `cooks`.
  const INGREDIENT_ROLES = ["meat", "vegetable", "grain"];
  function validateItemRegistry(){
    const missing = [];
    Object.keys(ITEM_REGISTRY).forEach(id=>{
      const def = ITEM_REGISTRY[id];
      const fraction = (v, field)=>{
        if(v !== undefined && !(Number.isFinite(v) && v >= 0 && v <= 1))
          missing.push(`ITEM_REGISTRY.${id}.${field}: ${v} is not a number in [0,1]`);
      };
      fraction(def.foodPoisoningChance, "foodPoisoningChance");
      if(def.cooks){
        fraction(def.cooks.foodPoisoningChance, "cooks.foodPoisoningChance");
        if(!(Number.isFinite(def.cooks.minutes) && def.cooks.minutes > 0))
          missing.push(`ITEM_REGISTRY.${id}.cooks.minutes: ${def.cooks.minutes} is not a number above 0`);
      }
      const f = def.carryFactor;
      if(def.slotType && !(Number.isFinite(f) && f > 0 && f <= 1))
        missing.push(`ITEM_REGISTRY.${id}.carryFactor: ${f} is not a number in (0,1]`);
      if(def.spoils && !(def.spoils.staleAfter < def.spoils.rottenAfter))
        missing.push(`ITEM_REGISTRY.${id}.spoils: staleAfter ${def.spoils.staleAfter} is not below rottenAfter ${def.spoils.rottenAfter}`);
      if(def.ingredient && !INGREDIENT_ROLES.includes(def.ingredient.role))
        missing.push(`ITEM_REGISTRY.${id}.ingredient.role: "${def.ingredient.role}" is not one of ${INGREDIENT_ROLES.join("/")}`);
    });
    RECIPES.forEach(r=>{
      r.inputs.forEach(inp=>{ if(!ITEM_REGISTRY[inp.id]) missing.push(`RECIPES[${r.id}].inputs: ${inp.id}`); });
      if(!ITEM_REGISTRY[r.output.id]) missing.push(`RECIPES[${r.id}].output: ${r.output.id}`);
    });
    DISH_TEMPLATES.forEach(t=>{
      const def = ITEM_REGISTRY[t.item];
      if(!def || !def.dish || !def.cooks) missing.push(`DISH_TEMPLATES[${t.id}].item: ${t.item} is not a dish entry with cooks`);
    });
    if(missing.length) console.warn("validateItemRegistry: problems", missing);
    else console.log("validateItemRegistry: all recipe and dish ids resolve in ITEM_REGISTRY, every foodPoisoningChance is in [0,1], every cooks.minutes is above 0, every spoils is ordered, every ingredient role is known, every bag's carryFactor is in (0,1]");
    return missing;
  }
  // validateLocations(): dev-only console helper (not wired to any button
  // or UI, runs nothing automatically), modeled on validateItemRegistry().
  // Walks every room in world, confirms locationId is set and resolves in
  // LOCATIONS. Call it as `ashfallDev.validateLocations()` from the browser
  // console when auditing.
  function validateLocations(){
    const missing = [];
    Object.keys(world).forEach(roomId=>{
      const room = world[roomId];
      if(!room.locationId) missing.push(`${roomId}: no locationId set`);
      else if(!LOCATIONS[room.locationId]) missing.push(`${roomId}: locationId "${room.locationId}" does not resolve in LOCATIONS`);
    });
    if(missing.length) console.warn("validateLocations: unresolved rooms", missing);
    else console.log("validateLocations: every room resolves a locationId");
    return missing;
  }
  // validateRoomSchema(): dev-only console helper (not wired to any button or
  // UI, runs nothing automatically), sibling to validateLocations(). Walks
  // every room in world and reports a missing `address`, a missing `shelter`,
  // or a `shelter` outside the three legal values, and a `desc` that is
  // neither a string nor well-formed state variants (ROOM SCHEMA): a reader
  // DESC_READERS lacks, a state with no text, a load that does not exist. A helper is enough here
  // because both failures are loud: a missing address renders "undefined" in
  // the location bar of the room you are standing in, on the first frame.
  // Call it as `ashfallDev.validateRoomSchema()` from the browser console
  // when auditing.
  function validateRoomSchema(){
    const legalShelter = ["none", "partial", "full"];
    const problems = [];
    Object.keys(world).forEach(roomId=>{
      const room = world[roomId];
      if(!room.address) problems.push(`${roomId}: no address set`);
      if(room.shelter === undefined) problems.push(`${roomId}: no shelter set`);
      if(room.desc && typeof room.desc === "object"){
        const reader = DESC_READERS[room.desc.reads && room.desc.reads.kind];
        if(!reader) problems.push(`${roomId}: desc reads an unknown kind`);
        else reader.states.forEach(st=>{
          if(typeof (room.desc.variants || {})[st] !== "string") problems.push(`${roomId}: desc has no text for "${st}"`);
        });
        if(room.desc.reads && room.desc.reads.kind === "load" && !POWER_NET.loads[room.desc.reads.id])
          problems.push(`${roomId}: desc reads load "${room.desc.reads.id}", which does not exist`);
      } else if(typeof room.desc !== "string") problems.push(`${roomId}: no desc set`);
      else if(!legalShelter.includes(room.shelter)) problems.push(`${roomId}: shelter "${room.shelter}" is not one of ${legalShelter.join("/")}`);
    });
    if(problems.length) console.warn("validateRoomSchema: rooms with schema problems", problems);
    else console.log("validateRoomSchema: every room has an address, a legal shelter and a well-formed desc");
    return problems;
  }
  // validateWiring(): dev-only console helper (not wired to any button or
  // UI, runs nothing automatically), sibling to validateRoomSchema(). Checks
  // that every wiring reference resolves (`wiring` and `templates` default
  // to the game's, GAME_WIRING, the building types' included; pass a test
  // network to check that instead):
  //   the expansion's own problems (expandWiring()): unknown templates,
  //     circuits and roles, a panel without a feeder (but on a direct
  //     board), a direct board listing feeders, a feeder without a panel,
  //     clashing ids, a main both `rcd` and `cutoff`, and `fuse` anywhere
  //     but a template circuit;
  //   the templates' doors and windows (expandOpenings()): a role with no
  //     room, an override key the template lacks, and an id that clashes with
  //     another template one or with an authored one;
  //   every room a board, panel or role names exists, and every container a
  //     fixture names is in its room;
  //   every appliance id is in APPLIANCES, every APPLIANCES entry carries
  //     exactly one of leftOnChance and switchless, a readout with non-empty
  //     on and off words unless it is switchless, an `idle` word only when
  //     it is non-empty and the appliance can stand powered and idle
  //     (dutyCycle or flowLph), and a nameplate in exactly
  //     one of its forms, rated at no less than its own watts
  //     (nameplateWatts()), every circuit's volts is 220, and every
  //     circuit's roles are in its panel's rooms;
  //   every breaker's rating is an IEC 60898-1 preferred rating
  //     (STANDARD_BREAKER_RATINGS), its curve is in BREAKER_CURVES, and it
  //     does not trip at BREAKER_F_NO_TRIP × its rating within
  //     BREAKER_NO_TRIP_MIN (tripMinutes()), a guard for a later retune. An
  //     RCD has no curve and never trips on overcurrent, so only its rating
  //     is checked. A cut-off switch has neither rating nor curve, so
  //     nothing is. A fuse's rating is over 0 and at most EDISON_FUSE_MAX_A,
  //     not an IEC breaker rating, and its curve (fuseBlowMinutes()) does
  //     not blow at FUSE_F_NO_BLOW × its rating within FUSE_NO_BLOW_MIN;
  //   every tank has one pump (tankPumpsOf()): a wired building with a tank
  //     (BUILDING_INFO's tankL) and no `flowLph` load, or with two, and a
  //     `flowLph` load in a building with no tank, which never draws.
  // It also lists every room with shelter "full" that no panel's rooms
  // include. That list is a warning while buildings are being wired (#250),
  // and becomes an error in #258. Returns { problems, unwired }. Call it as
  // `ashfallDev.validateWiring()` from the browser console when auditing.
  function validateWiring(wiring = GAME_WIRING, templates = WIRING_TEMPLATES){
    const net = expandWiring(wiring, templates);
    const openings = expandOpenings(wiring, templates);
    const rooms = makeDefaultWorld();
    const problems = net.problems.concat(openings.problems);
    const authored = { doors:authoredDoors(), windows:authoredWindows() };
    ["doors", "windows"].forEach(kind=> Object.keys(openings[kind]).forEach(id=>{
      if(authored[kind][id]) problems.push(`template ${kind.slice(0, -1)} "${id}" clashes with an authored one`);
    }));
    const roomExists = (id, what)=>{ if(!rooms[id]) problems.push(`${what}: room "${id}" does not exist`); };
    Object.keys(APPLIANCES).forEach(id=>{
      const a = APPLIANCES[id];
      if(("leftOnChance" in a) === !!a.switchless) problems.push(`appliance ${id}: needs exactly one of leftOnChance and switchless`);
      const worded = w=> typeof w === "string" && w.length > 0;
      if(!a.switchless && !(a.readout && worded(a.readout.on) && worded(a.readout.off)))
        problems.push(`appliance ${id}: needs a readout with non-empty on and off`);
      if(a.readout && "idle" in a.readout){
        if(!worded(a.readout.idle)) problems.push(`appliance ${id}: readout's idle is not a non-empty string`);
        if(a.dutyCycle === undefined && a.flowLph === undefined)
          problems.push(`appliance ${id}: readout has an idle word, but it never stands powered and idle (no dutyCycle or flowLph)`);
      }
      const rated = nameplateWatts(a);
      if(rated === null) problems.push(`appliance ${id}: no nameplate`);
      else if(rated < a.watts) problems.push(`appliance ${id}: nameplate rated ${rated} W, below its own ${a.watts} W`);
      const forms = ["amps", "printsWatts", "watts"].filter(k=> a.nameplate && k in a.nameplate);
      if(forms.length > 1) problems.push(`appliance ${id}: nameplate carries more than one form (${forms.join(", ")})`);
    });
    Object.values(net.boards).forEach(b=> roomExists(b.room, b.id));
    Object.values(net.panels).forEach(p=>{
      roomExists(p.room, p.id);
      p.rooms.forEach(id=> roomExists(id, `${p.id} rooms`));
    });
    if(fuseBlowMinutes(FUSE_F_NO_BLOW) < FUSE_NO_BLOW_MIN)
      problems.push(`fuses blow at ${FUSE_F_NO_BLOW} × their rating within ${FUSE_NO_BLOW_MIN} min`);
    Object.values(net.breakers).forEach(br=>{

      } else if(!br.cutoff && !STANDARD_BREAKER_RATINGS.includes(br.rating))

  // validateBuildings(): dev-only console helper (not wired to any button or

  // window or entry naming a role with no room, a clashing id, a wired
  // instance whose id WIRING already names; and every

  // Items an action produces rather than a container holding them. Written
  // down because validateReachability() cannot derive it: each grant lives

  //   firewood         doChopTree(), doDismantleCampfire(), and
  //                    Disassemble, which returns a `disassemble`-tagged
  //                    item's recipe inputs
  //   fish             doFish(), raw
  //   spare_batteries  the powered-equipment "Remove batteries" action
  const ACTION_GRANTED_ITEM_IDS = ["firewood", "fish", "spare_batteries"];
  // The tool tags validateReachability() counts, written down for the same
  // reason. Every one is what hasTool()/hasMatchUses() actually gate
  // an action on, and they include the `breakTag` values windows (blunt) and
  // locked storage units (cutting) carry, the `tool` a recipe asks for
  // (blade), `heat`, which lights an unpowered stove by hand
  // (stoveLighting()), the meters' two (doMeterTest(), doMeterClamp()),
  // `prying`, which gates forcing a locked latch door (doForceDoor()), and
  // `screwdriving`, which gates rewiring a blown fuse (doRewireFuse()).
  // Forcing a vehicle is still deliberately not gated on it, because one
  // item carries it (renderHereActionsPanel()), and #111 is the standing
  // question of whether to gate that too once that stops being true. The
  // count is the evidence that question wants.
  const REPORTED_TOOL_TAGS = ["fire-starter", "fishing", "tackle", "chopping",

  function registryCarriesTag(id, tag){ return hasTag(ITEM_REGISTRY[id], tag); }

  // not had spawnRolled set — as [{ roomId, container }], car containers
  // included, in room order. The one definition of "a container that still
  // rolls" the dev helpers share; doOpenContainer() applies the same test to
  // the one container it is opening.
  function rollingContainers(world){
    const out = [];
    Object.keys(world).forEach(roomId=>{
      const room = world[roomId];
      (room.containers || []).concat(room.carContainers || []).forEach(c=>{
        if(c.spawnPools && !c.spawnRolled) out.push({ roomId, container:c });
      });
    });

  // validateReachability(): dev-only console helper (not wired to any button

  //   2. unreachable items — an ITEM_REGISTRY id that is not hand-placed, not

  // positive integer was legal there — and any pool whose `emptyChance` is
  // outside [0,1]. And two collision hazards the keyed loot roll creates (see
  // rolledLootFor()): a pool listing the same entry key twice, and a container
  // listing the same pool id twice. Either pair would share a key and so
  // always roll alike. Neither occurs today.
  //

  // pools and unreachable items are expected until the spawn balance is done,

  function validateReachability(){

      if(!(Number.isFinite(pool.emptyChance) && pool.emptyChance >= 0 && pool.emptyChance <= 1))
        report.push(`illegal emptyChance: SPAWN_POOLS.${poolId} has emptyChance ${pool.emptyChance}, which is not a number in [0,1]`);
      const seenKeys = new Set();
      pool.entries.forEach(entry=>{
        const key = poolEntryKey(entry);
        if(!(Number.isFinite(entry.chance) && entry.chance > 0 && entry.chance <= 1))
          report.push(`illegal chance: SPAWN_POOLS.${poolId} entry ${key} has chance ${entry.chance}, which is not a number in (0,1]`);
        if(seenKeys.has(key))
          report.push(`duplicate entry: SPAWN_POOLS.${poolId} lists key ${key} twice — both share one roll key`);
        seenKeys.add(key);
      });
    });

    // has already flipped spawnRolled on every container the player opened,
    // so `world` would report those containers' pools as dead.
    const fresh = makeDefaultWorld();
    Object.keys(fresh).forEach(roomId=>{
      (fresh[roomId].containers || []).concat(fresh[roomId].carContainers || []).forEach(c=>{
        (c.spawnPools || []).forEach((poolId, i, all)=>{
          if(all.indexOf(poolId) === i && all.lastIndexOf(poolId) !== i)

        });
      });
    });
    const badAuthoring = report.length;
    const freshState = makeDefaultState();
    const livePools = new Set();
    const placed = {}; // itemId -> how many hand-placed instances exist
    const place = (it)=>{ placed[it.itemId] = (placed[it.itemId] || 0) + 1; };
    Object.keys(fresh).forEach(roomId=>{
      const room = fresh[roomId];
      (room.floor || []).forEach(place);
      (room.containers || []).concat(room.carContainers || []).forEach(c=>{
        (c.items || []).forEach(place);
      });
    });
    rollingContainers(fresh).forEach(({ container })=> container.spawnPools.forEach(id=> livePools.add(id)));

      if(slot && slot.items) slot.items.forEach(place);
    });
    Object.keys(SPAWN_POOLS).forEach(poolId=>{
      if(!livePools.has(poolId)) report.push(`dead pool: ${poolId} — no container that still rolls draws from it`);
    });
    const reachable = new Set(Object.keys(placed));
    livePools.forEach(poolId=> SPAWN_POOLS[poolId].entries.forEach(e=> reachable.add(e.itemId)));
    RECIPES.forEach(r=> reachable.add(r.output.id));
    DISH_TEMPLATES.forEach(t=> reachable.add(t.item));
    ACTION_GRANTED_ITEM_IDS.forEach(id=> reachable.add(id));
    Object.keys(ITEM_REGISTRY).forEach(id=>{
      if(!reachable.has(id)) report.push(`unreachable item: ${id} — not hand-placed, not in a live pool, not crafted, not action-granted`);
    });
    REPORTED_TOOL_TAGS.forEach(tag=>{
      const carries = (id)=> registryCarriesTag(id, tag);
      const hand = Object.keys(placed).filter(carries).reduce((s,id)=> s + placed[id], 0);
      const pools = Array.from(livePools).filter(id=> SPAWN_POOLS[id].entries.some(e=> carries(e.itemId))).sort();
      report.push(`tool tag "${tag}": ${hand} hand-placed instance${hand === 1 ? "" : "s"}, `
        + (pools.length ? `live pools: ${pools.join(", ")}` : "no live pool"));
    });
    if(badAuthoring) console.warn("validateReachability: pool authoring problems", report.slice(0, badAuthoring));
    console.log(`validateReachability: ${report.length} lines`, report);
    return report;
  }
  // simulateSeed() and sampleSeeds(): dev-only console helpers (not wired to
  // any button or UI, run nothing automatically), siblings to
  // validateReachability(). That one reports what a fresh world can hold;
  // these report what a given seed's world does hold. Existence only: neither
  // asks whether the player can get past a lock, a window or a search to it.
  //
  // simulateSeed(seed) is the manifest of one seed's world, one row per item
  // stack, hand-placed or rolled, without playing the seed. `seed` is a
  // number (taken >>> 0), a string (through seedFromInput(), so a typed word
  // gives exactly the world Restart would give it), or omitted for the
  // current run — the helper's only read of game state. It builds its own
  // makeDefaultWorld() and makeDefaultState(seed) and never reads the live
  // world, which a played run has already rolled and rearranged. A row is
  // { roomId, place, source, itemId, qty }: roomId is "(start)" for the
  // starting inventory and slots; place is "floor", a container id,
  // "inventory" or a slot key; source is "hand-placed" or "rolled". Per tag in
  // REPORTED_TOOL_TAGS it counts the stacks carrying it — stacks, not units,
  // validateReachability()'s convention, so the two reports compare directly.
  // Call it as `ashfallDev.simulateSeed(12345)` or
  // `ashfallDev.simulateSeed("some word")`.
  //
  // sampleSeeds(n = 1000, start = 0) runs seeds start … start + n − 1 and sets
  // what the loot rolls actually yield against what SPAWN_POOLS says they
  // should: per pool entry, its hit rate against (1 − emptyChance) × chance;
  // per pool, its empty rate against emptyChance. A trial is one seed of one
  // rolling container that draws the pool. It also reports, per item, the
  // fraction of seeds whose world holds it anywhere (hand-placed items read 1,
  // unreachable ones 0), and per tag, the fraction of seeds with no stack
  // carrying it. A dead pool has trials 0 and is listed as not rolled, never
  // as flagged. Call it as `ashfallDev.sampleSeeds()` or
  // `ashfallDev.sampleSeeds(20000, 5000)`.
  //
  // A pool or entry row is flagged when its observed rate strays from the
  // expected one by more than SAMPLE_TOLERANCE_SIGMA standard errors. At 3σ
  // over the hundred-odd rows compared, one flag in a clean run is to be
  // expected: a flag is a prompt to rerun with a larger n or another start,
  // not a verdict. One that survives the rerun is a finding about the derived
  // `chance` figures. The 3 is a judgment call, retunable.
  //
  // Both are read-only. Every roll they make takes its seed as an argument;
  // neither reads state.seed to evaluate another seed nor writes it at all.
  const SAMPLE_TOLERANCE_SIGMA = 3;
  function seedReportRow(roomId, place, source, it){
    return { roomId, place, source, itemId:it.itemId, qty:it.qty };

  function handPlacedRows(fresh, start){

      const room = fresh[roomId];

      (room.containers || []).concat(room.carContainers || []).forEach(c=>{
        (c.items || []).forEach(it=> rows.push(seedReportRow(roomId, c.id, "hand-placed", it)));
      });
    });
    [["inventory", start.inventory]].concat(CONTAINER_SLOTS.map(slot=> [slot, start[slot]])).forEach(([place, slot])=>{
      if(slot && slot.items) slot.items.forEach(it=> rows.push(seedReportRow("(start)", place, "hand-placed", it)));

  function sampleSeeds(n = 1000, start = 0){

    const fresh = makeDefaultWorld();
    const rolling = rollingContainers(fresh);
    const hand = handPlacedRows(fresh, makeDefaultState(start >>> 0));
    const handIds = new Set(hand.map(r=> r.itemId));
    const handTags = tagStackCounts(hand);
    const tally = {}; // poolId -> { trials, empties, hits: entry key -> count }
    Object.keys(SPAWN_POOLS).forEach(poolId=>{ tally[poolId] = { trials:0, empties:0, hits:{} }; });
    const itemSeeds = {};
    Object.keys(ITEM_REGISTRY).forEach(id=>{ itemSeeds[id] = 0; });
    const tagMissing = {};
    REPORTED_TOOL_TAGS.forEach(tag=>{ tagMissing[tag] = 0; });
    for(let i = 0; i < n; i++){
      const seed = (start + i) >>> 0;
      const ids = new Set(handIds);
      const tags = Object.assign({}, handTags);
      // Pool by pool, which is rolledLootFor()'s yield split at the seams the
      // tallies need: the same stacks simulateSeed() lists as rolled.
      rolling.forEach(({ roomId, container })=>{
        container.spawnPools.forEach(poolId=>{
          const rolled = rolledPoolFor(seed, roomId, container.id, poolId);
          if(!rolled) return;
          const t = tally[poolId];
          t.trials += 1;
          if(rolled.empty) t.empties += 1;
          rolled.items.forEach((it, k)=>{
            const key = rolled.keys[k];
            t.hits[key] = (t.hits[key] || 0) + 1;
            ids.add(it.itemId);
            REPORTED_TOOL_TAGS.forEach(tag=>{ if(registryCarriesTag(it.itemId, tag)) tags[tag] += 1; });
          });
        });

      ids.forEach(id=>{ itemSeeds[id] += 1; });

      if(!trials) return { observed:null, flagged:false };
      const observed = count / trials;
      const tolerance = SAMPLE_TOLERANCE_SIGMA * Math.sqrt(expected * (1 - expected) / trials);
      return { observed, flagged: Math.abs(observed - expected) > tolerance };

    Object.keys(SPAWN_POOLS).forEach(poolId=>{
      const pool = SPAWN_POOLS[poolId], t = tally[poolId], rolled = t.trials > 0;
      const gate = judge(t.empties, pool.emptyChance, t.trials);
      pools.push({ poolId, rolled, trials:t.trials, empties:t.empties,
        observed:gate.observed, expected:pool.emptyChance, flagged:gate.flagged });
      pool.entries.forEach(e=>{

      });
    });

      ({ itemId:id, seeds:itemSeeds[id], fraction: n ? itemSeeds[id] / n : null }));
    const tags = REPORTED_TOOL_TAGS.map(tag=>
      ({ tag, seedsMissing:tagMissing[tag], fraction: n ? tagMissing[tag] / n : null }));
    const compared = pools.concat(entries).filter(r=> r.rolled);
    const flagged = compared.filter(r=> r.flagged);
    if(flagged.length) console.warn(`sampleSeeds: ${flagged.length} row${flagged.length === 1 ? "" : "s"} outside `
      + `${SAMPLE_TOLERANCE_SIGMA}σ — rerun with a larger n or another start before reading anything into it`, flagged);
    console.log(`sampleSeeds: n ${n}, start ${start}, ${compared.length} rows compared, ${flagged.length} flagged`);
    return { n, start, entries, pools, items, tags };
  }
  // simulatePower(network, minutes, options): dev-only console helper (not
  // wired to any button or UI, runs nothing automatically). Runs the power
  // resolver on a SUPPLIED test network, never the game's, and never touches
  // game state: its power state is its own copy. What the power release's
  // resolver, spoilage and device checks are run with.
  //   network  { wiring, templates?, appliances? }: a WIRING-shaped object,
  //            the templates it names (WIRING_TEMPLATES when absent), and
  //            appliances to add to APPLIANCES.

  //                     false: everything drawing then starts.

  function simulatePower(network, minutes = 60, options = {}){

    const appliances = Object.assign({}, APPLIANCES, nw.appliances || {});
    const rules = options.rules || "detailed";
    const seed = options.seed === undefined ? state.seed : options.seed >>> 0;
    const start = options.start || 0;
    const grid = typeof options.grid === "boolean" ? ()=> options.grid : (options.grid || ((m)=> gridUp(m)));
    const mains = typeof options.mains === "boolean" ? ()=> options.mains : (options.mains || ((m)=> mainsWaterUp(m)));
    let power = JSON.parse(JSON.stringify(options.power || { switches:{}, breakers:{}, heat:{} }));
