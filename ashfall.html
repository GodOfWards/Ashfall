  // One instance expanded: { rooms, doors, windows, streetExit, problems }.
  // `streetExit` is the exit makeDefaultWorld() hangs on the site stop.
  function buildBuilding(inst){
    const problems = [];
    const type = inst.layout || BUILDING_TYPES[inst.type];
    if(!type){ problems.push(`building ${inst.id}: unknown type "${inst.type}"`); return { rooms:{}, doors:{}, windows:{}, streetExit:null, problems }; }
    const ov = inst.overrides || {};
    const locationId = inst.id + "_f0";
    const name = inst.name || type.label.charAt(0).toUpperCase() + type.label.slice(1);
    const roomId = role=> role === "street" ? inst.site : `${inst.id}_${role}`;
    const specs = type.rooms.map(r=> Object.assign({}, r, (ov.rooms || {})[r.role] || {})).concat(ov.addRooms || []);
    const rooms = {};
    specs.forEach(r=>{
      const desc = Array.isArray(r.desc) ? r.desc[(inst.seed || 0) % r.desc.length] : r.desc;
      const room = { locationId, address:inst.address, building:name, buildingId:inst.id, area:null, room:r.room || null,
        shelter:r.shelter, desc, floorCap:r.floorCap, floor:itemsFromRegistry(r.floor || []),
        containers:(r.containers || []).map(c=>{
          const out = Object.assign({}, c, { items:itemsFromRegistry(c.items || []) });
          if(c.tags) out.tags = c.tags.slice();
          if(c.spawnPools) out.spawnPools = c.spawnPools.slice();
          if(c.spawnRolled === undefined && c.items && c.items.length) out.spawnRolled = true;
          return out;
        }),
        exits:[] };
      ["sink", "sleepSpot", "cannotHaveFire", "searchLabel", "searchMinutes"].forEach(f=>{ if(r[f] !== undefined) room[f] = r[f]; });
      if(room.searchLabel) room.searched = false;
      rooms[roomId(r.role)] = room;
    });
    const doorSpecs = {};
    type.doors.forEach(d=>{
      const o = (ov.doors || {})[d.key];
      if(o === null) return;
      doorSpecs[d.key] = Object.assign({}, d, o || {});
    });
    Object.keys(ov.doors || {}).forEach(k=>{ if(ov.doors[k] && !doorSpecs[k]) doorSpecs[k] = Object.assign({ key:k }, ov.doors[k]); });
    const doors = {};
    Object.keys(doorSpecs).forEach(k=>{
      const d = doorSpecs[k];
      const sides = d.between.map(roomId);
      const def = { locked:!!d.locked, sides, buildingId:inst.id };
      if(d.lockable === false) def.lockable = false;
      if(d.label) def.label = d.label;
      if(d.lock && d.lock !== "key"){ def.lock = d.lock; def.inside = sides[1]; }
      doors[`${inst.id}-${k}`] = def;
    });
    const doorOf = key=> key && doorSpecs[key] ? `${inst.id}-${key}` : null;
    const exit = (to, label, distanceM, doorId)=>{
      const e = { to, label };
      if(distanceM !== undefined) e.distanceM = distanceM;
      if(doorId) e.doorId = doorId;
      return e;
    };
    type.links.concat(ov.links || []).forEach(l=>{
      const [a, b] = l.between.map(roomId);
      if(!rooms[a] || !rooms[b]){ problems.push(`building ${inst.id}: link ${l.between.join("-")} names a role with no room`); return; }
      rooms[a].exits.push(exit(b, l.label[0], l.distanceM, doorOf(l.door)));
      rooms[b].exits.push(exit(a, l.label[1], l.distanceM, doorOf(l.door)));
    });
    const entry = roomId(type.entry);
    const frontKey = Object.keys(doorSpecs).find(k=> doorSpecs[k].between.includes("street"));
    const front = doorOf(frontKey);
    if(!rooms[entry]) problems.push(`building ${inst.id}: entry "${type.entry}" has no room`);
    else rooms[entry].exits.push(exit(inst.site, inst.leave || "Go out to the street", undefined, front));
    const streetExit = exit(entry, inst.enter || `Enter the ${type.label}`, undefined, front);
    const windows = {};
    (type.windows || []).forEach(w=>{
      if(!rooms[roomId(w.role)]){ problems.push(`building ${inst.id}: window in role "${w.role}", which has no room`); return; }
      windows[`${inst.id}-${w.role}-window`] = { state:"closed", rooms:[roomId(w.role)], breakTag:w.breakTag, label:w.label };
    });
    const wiring = mergeWiring(type.wiring, ov.wiring, inst.id, problems);
    return { rooms, doors, windows, streetExit, wiring:buildWiring(wiring, roomId, specs.map(r=> r.role)), problems };
  }
  // A type's `wiring` with an instance's `overrides.wiring` laid over it:
  // each panel it names by id takes its fields over the type's. A panel id
  // the type lacks, or an override on a type with no wiring, is reported in
  // `problems`, and nothing is laid.
  function mergeWiring(w, ov, instId, problems){
    if(!ov) return w;
    if(!w){ problems.push(`building ${instId}: a wiring override, but its type has no wiring`); return w; }
    const byId = ov.panels || {};
    Object.keys(byId).forEach(id=>{
      if(!(w.panels || []).some(p=> p.id === id)) problems.push(`building ${instId}: wiring override for panel "${id}", which its type does not have`);
    });
    return Object.assign({}, w, { panels:(w.panels || []).map(p=> Object.assign({}, p, byId[p.id] || {})) });
  }
  // A type's `wiring` for one instance, as a WIRING entry, or null when the
  // type has none: each device's role becomes the instance's room, and each
  // panel's `rooms` maps every role the building has (`roles`) to its room.
  // A role with no room, or a device in one, is left for expandWiring() and
  // validateWiring() to report, so nothing is checked here.
  function buildWiring(w, roomId, roles){
    if(!w) return null;
    const rooms = Object.fromEntries(roles.map(role=> [role, roomId(role)]));
    const board = Object.assign({}, w.board, { room:roomId(w.board.role) });
    delete board.role;
    const panels = (w.panels || []).map(p=>{
      const panel = Object.assign({}, p, { room:roomId(p.role), rooms:Object.assign({}, rooms) });
      delete panel.role;
      return panel;
    });
    return { board, panels };
  }
  // Every instance expanded, merged: { rooms, doors, windows, streetExits:
  // [{ site, exit }], wiring, problems }. `wiring` holds a WIRING entry per
  // instance of a wired type, keyed by the instance id (buildWiring()). A
  // clashing id keeps the first and is reported, as expandOpenings() does;
  // so is an instance whose id the authored WIRING already names, which
  // keeps the authored entry.
  function expandBuildings(){
    const out = { rooms:{}, doors:{}, windows:{}, streetExits:[], wiring:{}, problems:[] };
    buildingInstances().forEach(inst=>{
      const b = buildBuilding(inst);
      out.problems.push(...b.problems);
      ["rooms", "doors", "windows"].forEach(kind=> Object.keys(b[kind]).forEach(id=>{
        if(out[kind][id]) out.problems.push(`building ${inst.id}: ${kind.slice(0, -1)} id "${id}" clashes`);
        else out[kind][id] = b[kind][id];
      }));
      if(b.streetExit) out.streetExits.push({ site:inst.site, exit:b.streetExit });
      if(b.wiring){
        if(WIRING[inst.id]) out.problems.push(`building ${inst.id}: its type's wiring clashes with WIRING's entry of the same id`);
        else out.wiring[inst.id] = b.wiring;
      }
    });
    return out;
  }
  // Each building's one Location, <id>_f0: its `at`, or its site's. Run once,
  // at startup, once the stops' Locations exist.
  function registerBuildingLocations(){
    buildingInstances().forEach(inst=>{
      const site = LOCATIONS[inst.site];
      const at = inst.at ? { x:inst.at[0], y:inst.at[1] } : site;
      if(at) LOCATIONS[inst.id + "_f0"] = { x:at.x, y:at.y, z:0 };
    });
  }

  // DOOR SCHEMA (one entry per key in the object makeDefaultDoors() returns):
  //   Definitions come from two places: the building's own doors, authored
  //   below (authoredDoors()), and a wired unit's interior doors, which its
  //   panel's WIRING_TEMPLATES entry carries by role (`doors`, expanded by
  //   expandOpenings(); see POWER SCHEMA). An exit through a template door
  //   gets its doorId when the world is built (stampTemplateDoorIds()), so no
  //   room definition names one. Definitions are never saved: a save carries
  //   only what changes in play, `{ locked, open, broken }` per door id, for
  //   the doors whose state differs from a new game's (see savedDoorState()
  //   in PERSISTENCE). The runtime `doors` object is the two merged
  //   (buildDoors()), so every reader sees one shape.
  //   Definition fields:
  //     sides     the two rooms the door physically separates
  //     buildingId a building instance's id ("pharmacy"): which master key
  //               opens it (a master key's `buildingId`, ITEM DATA SCHEMA).
  //     locked    the authored starting lock state
  //     lockable  optional, default true. false: an interior door with no
  //               lock, which never locks, offers no key action and never
  //               shows the locked note.
  //     lock      optional, how it locks, default "key":
  //                 "key"    a key locks and unlocks it from either side
  //                 "latch"  from outside only a key does; from inside it
  //                          locks and unlocks by hand. Every home's and
  //                          shop's street door. A locked one can be forced
  //                          from outside with a `prying` tool
  //                          (doForceDoor()).
  //                 "bolt"   from outside it can't be opened at all; from
  //                          inside it bolts and unbolts by hand. The row
  //                          house's back door.
  //     inside    the room on the inside, required when `lock` is "latch"
  //               or "bolt". The building builder sets it from its type's
  //               `between` (buildBuilding()).
  //     label     optional, what the door is called ("front", "back"):
  //               doorLabel() uses it first when present.
  //   Saved fields:
  //     locked    whether it is locked now; only `locked` gates an exit
  //     open      whether it stands open, default false. A locked door is
  //               always closed. Nothing reads `open` yet besides its own
  //               Open / Close actions: it is laid down ahead of its consumer,
  //               carbon monoxide (#248), the way ROOM SCHEMA's `shelter` was.
  //               Movement ignores it: passing through a closed, unlocked
  //               door leaves it closed.
  //     broken    whether its lock has been forced, default false. A broken
  //               door is unlocked and never locks again (doorLocks()).
  // Doors authored by hand, for a building no type or wiring template
  // builds. None today: the building types supply every opening
  // (buildBuilding()). Kept for the hand-authored buildings to come.
  function authoredDoors(){
    return {};
  }
  // Every door: the authored ones, the templates' and the building types'
  // together, lockable doors
  // ahead of lockless ones, each group in the order it was built. That is the
  // order doorsForRoom() walks, and so the order the Here panel offers Open
  // and Close in.
  function makeDefaultDoors(){
    const all = Object.assign(authoredDoors(), expandOpenings(GAME_WIRING, WIRING_TEMPLATES).doors, expandBuildings().doors);
    const out = {};
    [true, false].forEach(lockable=> Object.keys(all).forEach(id=>{
      if(doorLockable(all[id]) === lockable) out[id] = all[id];
    }));
    return out;
  }
  // WINDOW SCHEMA (one entry per key in the object makeDefaultWindows()
  // returns): definitions and saved state split as the doors' do, and come
  // from the same two places: the building's own windows (authoredWindows())
  // and a wired unit's, by role, from its template (`windows`). A save
  // carries `{ state }` per window id, for the windows whose state differs
  // from a new game's; the runtime `windows` object is the two merged
  // (buildWindows()).
  //   Definition fields:
  //     rooms      one room id, a window to the outside, or two, a window
  //                between two rooms
  //     label      what the actions call it ("transom window")
  //     breakTag   the tool tag Break asks for
  //     climbable  optional, default false. true: an open or broken window
  //                with two rooms is a route between them ("Climb through
  //                the …"). A window that is not climbable, or has one room,
  //                is never a route, broken or not.
  //   Saved field:
  //     state      "closed", "open" or "broken". Open, Close and Break are
  //                offered on every window, climbable or not.
  // Windows authored by hand, as authoredDoors() is: none today.
  function authoredWindows(){
    return {};
  }
  function makeDefaultWindows(){
    return Object.assign(authoredWindows(), expandOpenings(GAME_WIRING, WIRING_TEMPLATES).windows, expandBuildings().windows);
  }
  const WINDOW_STATES = ["closed", "open", "broken"];
  function doorLockable(door){ return door.lockable !== false; }
  // Whether a door can be locked now: it has a lock, and nobody has forced
  // it. Every lock action, by key or by hand, asks this.
  function doorLocks(door){ return doorLockable(door) && !door.broken; }
  // How a door locks (DOOR SCHEMA's `lock`), "key" when it doesn't say.
  function doorLockKind(door){ return door.lock || "key"; }
  // The runtime doors and windows: the definitions, rebuilt fresh, with the
  // saved fields of `saved` (a save's `doors` / `windows`, or null for a new
  // game) applied to the ids the definitions still have. A saved id the
  // definitions no longer have is dropped; a definition the save lacks keeps
  // its authored default. A save from before the split (0.8) carries whole
  // door and window objects, whose `locked` and `state` read the same way; a
  // missing `open` is false. Only well-typed fields are taken, so a bad value
  // falls back to the default rather than breaking a door.
  function buildDoors(saved){
    const out = makeDefaultDoors();
    Object.keys(out).forEach(id=>{
      const d = out[id], s = saved && saved[id];
      d.open = false;
      d.broken = false;
      if(s && typeof s === "object"){
        if(typeof s.locked === "boolean") d.locked = s.locked;
        if(typeof s.open === "boolean") d.open = s.open;
        if(typeof s.broken === "boolean") d.broken = s.broken;
      }
      if(!doorLocks(d)) d.locked = false;
      if(d.locked) d.open = false;
    });
    return out;
  }
  function buildWindows(saved){
    const out = makeDefaultWindows();
    Object.keys(out).forEach(id=>{
      const s = saved && saved[id];
      if(s && typeof s === "object" && WINDOW_STATES.includes(s.state)) out[id].state = s.state;
    });
    return out;
  }

  // POWER SCHEMA. The power network's definitions: never saved, expanded once
  // at startup into the node table the resolver runs on (expandWiring(), in
  // POWER under SURVIVAL / TIME SIMULATION). What changes in play is
  // state.power (see PLAYER STATE).
  //
  // APPLIANCES, keyed by id: what a load is.
  //   { name, watts, volts, leftOnChance | switchless, nameplate, readout?,
  //     startWatts?, dutyCycle?, cycleMinutes?, flowLph? }
  //   watts        running draw
  //   volts        220: single-phase, the only voltage a load uses
  //   leftOnChance 0–1: how likely its own switch is to be found on, rolled
  //                per load (switchOnIn()). Every figure is a judgment call,
  //                retunable.
  //   switchless   true: it has no user switch. It is always on, and no
  //                control is offered for it. Every entry carries exactly
  //                one of leftOnChance and switchless (validateWiring()).
  //   readout      { on, idle?, off }: the words for its state
  //                (loadStatusText()): `off` while it has no power, with its
  //                switch's position after it; `idle` while it has power but
  //                isn't drawing (between a cycle's on parts, or while a
  //                pump's float isn't calling); `on` otherwise. Without
  //                `idle`, `on` shows whenever it has power. `idle` is only
  //                for a load that can stand powered and idle, one with
  //                dutyCycle or flowLph (validateWiring()). The readout is
  //                present exactly when leftOnChance is (validateWiring()):
  //                a switchless load's readout is never shown. Functional
  //                UI text, retunable.
  //   startWatts   the total draw at a start; present on a motor load
  //   dutyCycle, cycleMinutes  present on a cycling load: it draws for
  //                dutyCycle × cycleMinutes of every cycleMinutes
  //   flowLph      a pump's flow in L/h; present on a load that fills its
  //                building's tank, drawing only while the tank's float calls
  //                (powerSnapshot(), refillTanks())
  //   nameplate    what its rating label prints (#249), in one of three
  //                forms: { amps }, printed as "<volts> V · <amps> A" at the
  //                entry's own `volts`; { printsWatts:true }, printed as its
  //                own `watts` ("10 W"), as a bulb's base is; or { watts },
  //                a rating printed in watts that isn't the draw ("16 W"),
  //                as a cooker's plate is. Never a second copy of either
  //                figure: `{ watts }` is a different one from the draw. A
  //                nameplate reads above the running draw, as a real one
  //                does. Every entry carries one, rated at no less than its
  //                `watts` (validateWiring()). Shown only in the Electrical
  //                view's circuit tabs (nameplateText()). Picking one real
  //                model per appliance is a judgment call, retunable; each
  //                figure's source is given below.
  //   No watts are shown anywhere, but on a nameplate (#242, #249).
  // Every figure is a pick inside a sourced range, and retunable.
  //   fridge_freezer  the appliance behind every kitchen's Fridge and Freezer
  //                   pair. Running 100 W: at the 0.35 duty cycle that is
  //                   about 307 kWh a year, matching the 310 kWh of a 264 L
  //                   class-A model (Patrick's manual, primary; its range is
  //                   310–419 kWh across 264–389 L). Starting 1,300 W: 6 A at
  //                   220 V, the middle of the 3.7–8.2 A locked-rotor current
  //                   of household R600a compressors at 200–220 V, 50 Hz
  //                   (Embraco's catalogue, primary for Embraco; which
  //                   compressor Argentine fridges carry is unconfirmed). The
  //                   duty cycle and the 60-minute cycle are judgment calls,
  //                   not sourced.
  //   led_light       LED_BULB_WATTS.
  //   hall_light      a common-area light, with led_light's bulb. Switchless
  //                   as a design choice, not a sourced fact: a hall or stair
  //                   light in a shared building is treated as always on, so
  //                   it is lit whenever power reaches it. Retunable.
  //   range_hood      200 W: an extractor hood draws 130–250 W at most
  //                   (Longvie, primary: "Potencia máxima 200 Watt").
  //   gas_range       0 W: a basic cooker has no clock or display, so
  //                   nothing draws while it is idle (#327). Its maximum
  //                   electrical power at 220 V, 50 Hz is 15 W with an oven
  //                   light, 16 W with light and ignition, 1 W for a hob
  //                   with ignition only (Domec's manual, Tabla 3, primary
  //                   for Domec), so the spark draws about 1 W, only while
  //                   the button is held: too brief to model, and not a
  //                   motor's start, so no `startWatts`. Switchless: it is
  //                   plugged in and has no power switch. The oven and its
  //                   lamp (15–25 W while lit; Orbis's C9500 lists 25 W,
  //                   primary) aren't modelled (#259).
  //   kettle          2,200 W: a 1.7 L kettle's most common figure (the
  //                   range is 1,850–2,200 W; secondary).
  //   toaster         700 W: a two-slot toaster (Atma's TO8020i and TO2180;
  //                   the range is 700–850 W; secondary).
  //   microwave       1,150 W: the input of a small 20 L microwave sold as
  //                   "700 W", which is its output (BGH's B120M16, dial, 10 A
  //                   plug; the range is 1,050–1,150 W; secondary). Its
  //                   standby draw is unconfirmed (#332), so it has none.
  //   water_heater    WATER_HEATER_WATTS, the element of Rheem's 85 L
  //                   TEC085RH (primary). Cycling on its thermostat to make
  //                   up its standing loss (WATER_HEATER_LOSS_KWH_DAY): its
  //                   duty cycle is that loss over what its element gives in
  //                   a day. No hot-water use is modelled. Left on, as a
  //                   heater nobody switches off is: 0.95 is a judgment call.

  //   house_pump      370 W: a 0.5 hp peripheral pump, Rowa's RW-PR60, 0.37
  //                   kW (secondary). It fills its building's tank at
  //                   HOUSE_PUMP_FLOW_LPH, on an automatic float switch (Tom,
  //                   first-hand): it starts when the tank drops below
  //                   TANK_FLOAT_START and fills it to full, drawing only
  //                   while it fills. Starting 3,300 W: 2.7 A × about 5.5 ×
  //                   220 V, inside the 1,900–3,600 W a start of 5–6× the
  //                   running current gives for these pumps (derived from
  //                   WEG's 60 Hz motors; secondary). Found switched on, as
  //                   the fridge is: 0.99 is a judgment call.
  // The kettle, the toaster and the microwave are found switched off
  // (leftOnChance 0), and once switched on, draw until switched off:
  // switching themselves off, and being used, are #334's.
  // The hood is a motor, but its start surge is left unmodelled: it carries
  // no `startWatts`. Lima homes have no smoke alarm, and usually no bathroom
  // extractor fan (Tom, first-hand), so neither is an appliance.
  // Nameplates, one real model each:
  //   fridge_freezer  1.0 A: Vondom's freezer at 220–240 V (primary for
  //                   Vondom; its fridge prints 0.75 A).
  //   led_light, hall_light  its own `watts`, printed on the base.
  //   range_hood      its own `watts`: Longvie prints its hoods in watts.
  //   gas_range       16 W, printed in watts: Domec's cooker with oven light

  //   house_pump      2.7 A: Rowa's RW-PR60 at 220 V (secondary).
  // One LED bulb's draw, for every appliance that is one: an E27 LED bulb
  // sold for 220 V draws 9–12 W (12 W gives about 840 lm, a 60 W
  // incandescent's light; secondary).
  const LED_BULB_WATTS = 10;
  // An electric water heater's element, in W, and what a termotanque loses
  // a day keeping its water hot, in kWh: 1.5–9 kWh a day (Gil 2020, primary;
  // not split by fuel). 2.4 is a pick inside it, a judgment call, retunable.
  const WATER_HEATER_WATTS = 2000;
  const WATER_HEATER_LOSS_KWH_DAY = 2.4;
  const APPLIANCES = {
    fridge_freezer: { name:"Fridge-freezer", watts:100, startWatts:1300, volts:220, dutyCycle:0.35, cycleMinutes:60, leftOnChance:0.99,
      nameplate:{ amps:1.0 }, readout:{ on:"Light on", off:"Dark" } },
    led_light:      { name:"Light",          watts:LED_BULB_WATTS, volts:220, leftOnChance:0.3, nameplate:{ printsWatts:true },

    kettle:         { name:"Electric kettle", watts:2200, volts:220, leftOnChance:0, nameplate:{ printsWatts:true },

      readout:{ on:"Running", off:"Stopped" } },
    microwave:      { name:"Microwave",      watts:1150, volts:220, leftOnChance:0, nameplate:{ printsWatts:true },
      readout:{ on:"Running", off:"Stopped" } },
    water_heater:   { name:"Water heater",   watts:WATER_HEATER_WATTS, volts:220, leftOnChance:0.95,
      dutyCycle:WATER_HEATER_LOSS_KWH_DAY * 1000 / (WATER_HEATER_WATTS * MINUTES_PER_DAY / 60), cycleMinutes:120,
      nameplate:{ printsWatts:true }, readout:{ on:"Running", idle:"Standing by", off:"Stopped" } },
    house_pump:     { name:"Water pump",     watts:370,  startWatts:3300, volts:220, flowLph:HOUSE_PUMP_FLOW_LPH, leftOnChance:0.99,

  // What an appliance's nameplate is rated at, in watts, or null when it has
  // no usable one. The one reading of `nameplate`'s three forms besides the
  // printed line (nameplateText()).
  function nameplateWatts(a){
    const n = a && a.nameplate;
    if(!n) return null;
    if(n.printsWatts) return a.watts;
    if(n.watts !== undefined) return Number.isFinite(n.watts) ? n.watts : null;
    return Number.isFinite(n.amps) ? a.volts * n.amps : null;
  }
  // WIRING_TEMPLATES, keyed by id: one unit's layout by room role, so every
  // unit wired the same way shares it.
  //   { main:{ rating, volts?, curve?, rcd? }, circuits:[…], fixtures:[…],
  //     doors?:[…], windows?:[…] }
  //   main      the unit panel's head device, its main breaker: rating in
  //             A, and `volts` (PANEL_DEFAULT_VOLTS when absent)
  //   rcd       on a main, optional: true makes the head device a
  //             diferencial (an RCD), labelled "RCD", in place of a main
  //             breaker. Power passes it only while it is closed, and it is
  //             switched by hand like a breaker, but it never trips on
  //             overcurrent: neither the instant trip nor the heat trip
  //             touches it (resolvePowerStep()), under either rules, and it
  //             has no curve. Its leakage trip is #247's. Its rating is
  //             still an IEC preferred one (validateWiring()).
  //   cutoff    on a main, optional: true makes the head device an old
  //             board's bipolar cut-off switch, labelled "Cut-off switch", in
  //             place of a main breaker. It has no rating and no curve. It is
  //             switched by hand like a breaker, power passes it only while it
  //             is closed, and it never trips, under either rules, as an RCD
  //             never does. A main is never both `rcd` and `cutoff`
  //             (validateWiring()).
  //   circuits  in panel order: { key, label, rating, volts, curve?, fuse?,
  //             roles:[role] }. `label` is the hand-written one on the panel

  // modern casa's; it is built from them below the table, never repeated.
  const WIRING_TEMPLATES = {

    if(cookStateOf(it) === "cooked")
      return { restores: def.cooks.restores || null, poisoning: def.cooks.foodPoisoningChance || 0 };
    return { restores: def.restores || null, poisoning: def.foodPoisoningChance || 0 };
  }
  // foodEffects() for the unit that would be eaten next, the row's oldest,
  // with its freshness applied: Fresh and Stale as they are, Rotten restoring
  // ROTTEN_RESTORES_FACTOR of it and adding the rotten baseline chance to the
  // food's own.
  function unitFoodEffects(it){
    const fx = foodEffects(it);
    if(unitFreshness(it) !== "rotten") return fx;
    return { restores: scaleRestores(fx.restores, ROTTEN_RESTORES_FACTOR),
      poisoning: combinePoisoning(fx.poisoning, rottenPoisoningTerm(it)) };
  }
  // The rotten baseline a unit adds to its own food-poisoning chance: the
  // baseline when it is Rotten, 0 otherwise.
  function rottenPoisoningTerm(it){
    return unitFreshness(it) === "rotten" ? ROTTEN_POISONING_CHANCE * POISONING_TRAIT_MULTIPLIER : 0;
  }
  function scaleRestores(restores, k){
    if(!restores) return null;
    const out = {};
    Object.keys(restores).forEach(v=>{ out[v] = restores[v] * k; });
    return out;
  }
  // Marks an item an action has just made as new: a perishable one starts
  // every unit at age 0. What distinguishes it from a world item, which
  // stampMissingAges() ages as if it had sat there since the collapse.
  function asNewlyMade(item){
    if(isPerishable(item)) item.ages = new Array(item.qty).fill(0);
    return item;
  }
  // Rationing. A unit can be eaten whole or by the half and the quarter;
  // what is left of it is its `portion`. EAT_PARTS are the part buttons, each
  // offered only while it is less than what is left, so a whole unit offers
  // all three, a half offers Eat and Eat 1/4, and a quarter only Eat.
  const EAT_PARTS = [ { label:"1/2", amount:0.5 }, { label:"1/4", amount:0.25 } ];
  // The unit Eat takes from, clicked on row `it` of `list`: among the rows of
  // the same food — itemId, cook state and freshness — the one with the
  // least left, and among equals the oldest. So a half-eaten can is finished
  // before a new one is started, whichever row was clicked.
  // For a bottle, the water plays the food's part: which kind it is joins
  // the match, and its fill is what is left.
  function eatTarget(list, it){
    return leastLeftRow(list, it, r=>{ const p = consumeProfile(r); return p ? p.left : null; });
  }
  // Among the rows of `list` holding the same thing as `it` — itemId, cook
  // state, freshness and water kind — the one whose `leftOf` is least, and
  // among equals the oldest; `it` itself when none qualifies. A row whose
  // `leftOf` is null does not qualify. Eating and adding an ingredient by
  // the part both pick their unit here.
  function leastLeftRow(list, it, leftOf){
    const same = list.filter(r=> r.itemId === it.itemId && leftOf(r) != null
      && cookStateOf(r) === cookStateOf(it) && rowFreshness(r) === rowFreshness(it)
      && waterKindOf(r) === waterKindOf(it));
    return same.sort((a, b)=> leftOf(a) - leftOf(b) || unitAges(b)[0] - unitAges(a)[0])[0] || it;
  }
  // What eating or drinking one whole unit of `it` does, or null when it is
  // nothing to eat or drink: { left, restores, poisoning, water }. Food is
  // unitFoodEffects() with its portion left. A bottle is drunk from, not
  // eaten: its holdsWater restores, tainted water carries
  // TAINTED_WATER_POISONING_CHANCE, and its fill is what is left. This is
  // the interim Drink rule, until fluid volumes (#47) replace it.
  function consumeProfile(it){
    if(it.sealed) return null;
    const def = registryEntryOf(it);
    if(def && def.holdsWater){
      if(!it.water) return null;
      return { left: it.water.fill, restores: def.holdsWater.restores, water:true,
        poisoning: it.water.kind === "tainted" ? TAINTED_WATER_POISONING_CHANCE : 0 };
    }
    const fx = unitFoodEffects(it);
    return fx.restores ? { left: portionOf(it), restores: fx.restores, poisoning: fx.poisoning, water:false } : null;
  }
  // Applies `change` to one unit of `row` rather than to the whole row. A
  // unit split out of a larger row goes back into the list changed; a lone
  // unit is changed where it is and keeps its row, and _uid. Either way it
  // then folds into a matching row if there is one. Returns the changed unit.
  function changeOneUnit(list, row, change){
    if(row.qty > 1){
      const unit = dropUnits(list, list.indexOf(row), 1);
      change(unit);
      return addToList(list, unit);
    }
    change(row);
    remergeRow(list, row);
    return row;
  }
  // Takes `amount` of one unit off `row`: food's portion, a bottle's fill.
  // Food eaten to nothing is gone; a bottle drunk dry stays, empty.
  function eatFromRow(list, row, amount){
    const water = !!consumeProfile(row).water;
    const rest = consumeProfile(row).left - amount;
    if(!water && rest <= 0){ dropUnits(list, list.indexOf(row), 1); return; }
    changeOneUnit(list, row, unit=>{
      if(!water) unit.portion = rest;
      else if(rest > 0) unit.water.fill = rest;
      else delete unit.water;
    });
  }
  // Sinks. A water-holding item — a bottle — can be filled at the sink of the
  // room it is in while the water runs (waterRunningIn()), unless it is
  // already full, of either kind. One unit fills, to full; its water is clean
  // unless it already held tainted water, since any tainted water taints
  // everything it mixes with. Instant. After the water fails the sink gives
  // nothing, and whatever was left in the pipes is #47's.
  // A vessel fills too, while it holds no dish and no water.
  // Off a tank, at any time, a fill draws the litres it adds (1 kg of water
  // is 1 L) and takes only what the tank has left: a bottle fills part way on
  // the last of it, and a vessel, whose water is all or nothing, needs its
  // whole waterKg. A sink without a tank draws on the mains, and draws
  // nothing down. The lines are functional, retunable.
  function canFillAtSink(it){
    const room = world[state.currentRoom];
    if(!room.sink || !waterRunningIn(state.currentRoom) || !canTakeWater(it)) return false;
    return !tankOf(state.currentRoom) || !vesselDefOf(it) || tankLeft(state.currentRoom) >= sinkLitresFor(it);
  }
  // Whether the room's sink is dry for an item that could take water: its
  // tank drawn too low for it, whether or not the grid is up. What the pop-up
  // says in the fill action's place.
  function tapDryFor(it){
    const room = world[state.currentRoom];
    return !!room.sink && canTakeWater(it) && tankOf(state.currentRoom) > 0 && !canFillAtSink(it);
  }
  // The litres filling one unit of `it` to full would add.
  function sinkLitresFor(it){
    const def = registryEntryOf(it);
    if(def && def.holdsWater) return def.holdsWater.kg * (1 - (it.water ? it.water.fill : 0));
    return def && def.vessel ? def.vessel.waterKg : 0;
  }
  // Whether an item can take more water: a bottle that is not full, or a
  // vessel holding none, since a vessel's water is all or nothing (#47).
  // Filling at the sink and pouring in both ask this.
  function canTakeWater(it){
    if(!holdsWaterAtAll(it)) return false;
    return !it.water || (!vesselDefOf(it) && it.water.fill < 1);
  }
  // Whether an item can take water right now: a bottle always, a vessel with
  // a waterKg while it holds no dish.
  function holdsWaterAtAll(it){
    const def = registryEntryOf(it);
    if(def && def.holdsWater) return true;
    return !!(def && def.vessel && def.vessel.waterKg > 0 && !dishIn(it));
  }
  // Puts water of `kind` into one unit: a bottle full to the top, a vessel
  // full. Any tainted water already there taints it, and new water in a
  // vessel starts its boil over.
  // A bottle can be filled to `fill` short of the top (a tank's last litres).
  function addWater(unit, kind, fill = 1){
    const k = waterKindOf(unit) === "tainted" ? "tainted" : kind;
    unit.water = vesselDefOf(unit) ? { kind:k } : { kind:k, fill };
    delete unit.boilMinutes;
  }
  function doFillAtSink(sourceKind, index){
    const room = world[state.currentRoom];
    const src = sourceKind === "world" ? worldSlot(room, worldTab) : invSlot(invTab);
    const it = getItemAt(src && src.items, index);
    if(!it || !canFillAtSink(it)) return;
    const need = sinkLitresFor(it);
    const fromTank = tankOf(state.currentRoom) > 0;
    // Rounded to the millilitre, so a tank's running total and a bottle's
    // part fill don't carry float noise.
    const litres = Math.round((fromTank ? Math.min(need, tankLeft(state.currentRoom)) : need) * 1000) / 1000;
    const def = registryEntryOf(it);
    const fill = def && def.holdsWater ? Math.round(((it.water ? it.water.fill : 0) + litres / def.holdsWater.kg) * 1000) / 1000 : 1;
    const filled = changeOneUnit(src.items, it, unit=> addWater(unit, "clean", Math.min(1, fill)));
    if(fromTank){
      const b = world[state.currentRoom].buildingId;
      state.tankDrawn[b] = Math.round(((state.tankDrawn[b] || 0) + litres) * 1000) / 1000;
    }
    // The pop-up follows the filled bottle, as doOpen()'s follows the opened can.
    detailItem = { uid: ensureUid(filled), side: sourceKind };
    log(fromTank && tankLeft(state.currentRoom) <= 0 ? "The tap coughs, spits, and runs dry."
      : `You fill the ${it.name.toLowerCase()} at the sink.`);
    render();
  }
  // Vessels within reach of an item: every vessel in the lists crafting
  // reaches (nearbyLists()), and every vessel in the room's heat container,
  // once each. Each comes as { vessel, place }, the place being where it was
  // found: "carried" for the inventory pools, else the Here tab's label —
  // "Floor", or the container's name.
  function nearbyVessels(){
    const room = world[state.currentRoom];
    const heat = getHeatContainer(room);
    const pools = invPools();
    const containers = room.containers.concat(room.carContainers || []);
    const placeOf = list=> pools.includes(list) ? "carried"
      : list === room.floor ? "Floor" : containers.find(c=> c.items === list).name;
    const out = [];
    nearbyLists().concat(heat ? [heat.items] : []).forEach(list=> list.forEach(it=>{
      if(vesselDefOf(it) && !out.some(o=> o.vessel === it)) out.push({ vessel:it, place:placeOf(list) });
    }));
    return out;
  }
  // The vessel names one action's buttons show, over the nearbyVessels()
  // entries it is offered on. Vessels sharing a name and a place get one
  // button, on the fullest of them by contents' weight (a tie to the first),
  // since nothing yet tells them apart (#47). A name still on two or more
  // buttons shows each one's place, so no two buttons read the same. Returns
  // a Map of the vessels given a button to the name their label shows.
  function vesselButtonNames(offered){
    const picked = [];
    offered.forEach(o=>{
      const same = picked.find(p=> p.name === o.vessel.name.toLowerCase() && p.place === o.place);
      if(!same) picked.push({ vessel:o.vessel, place:o.place, name:o.vessel.name.toLowerCase() });
      else if(totalWeight(o.vessel.contents || []) > totalWeight(same.vessel.contents || [])) same.vessel = o.vessel;
    });
    return new Map(picked.map(p=>{
      const clash = picked.filter(q=> q.name === p.name).length > 1;
      return [p.vessel, clash ? `${p.name} (${p.place})` : p.name];
    }));
  }
  // The unit adding `it` to a vessel would move, and the row it comes from:
  // the row's oldest unit, or for an ingredient added by the part
  // (`addPortion`), that much of the unit with the least left, so one bag of
  // rice is used up before the next is opened.
  function ingredientAdd(list, it){
    const part = ingredientOf(it).addPortion;
    const source = part ? leastLeftRow(list, it, r=> r.sealed ? null : portionOf(r)) : it;
    const unit = unitsOf(source, 1);
    if(part) unit.portion = part;
    return { source, unit };
  }
  // Whether `vessel` can take `it` from `list`: an unsealed ingredient, a
  // vessel with no dish yet, and room for the unit (contents' weight plus
  // the unit's within capacityKg; water does not count).
  function canAddToVessel(list, it, vessel){
    if(it.sealed || !ingredientOf(it) || dishIn(vessel)) return false;
    const { unit } = ingredientAdd(list, it);
    return totalWeight(vessel.contents || []) + itemWeight(unit) <= vesselDefOf(vessel).capacityKg + TICK_EPSILON;
  }
  // Moves one unit of `it` (or its part) from `list` into `vessel`. The one
  // way an ingredient goes in, for the pop-up's Add and the Crafting panel's
  // Add ingredients alike. Returns whether it moved.
  function moveIntoVessel(list, it, vessel){
    if(!canAddToVessel(list, it, vessel)) return false;
    const { source, unit } = ingredientAdd(list, it);
    const part = ingredientOf(it).addPortion;
    const rest = part ? portionOf(source) - part : 0;
    if(rest > 0) changeOneUnit(list, source, u=>{ u.portion = rest; });
    else dropUnits(list, list.indexOf(source), 1);
    if(!Array.isArray(vessel.contents)) vessel.contents = [];
    addToList(vessel.contents, unit);
    return true;
  }
  // moveIntoVessel(), saying so. The line's wording is retunable.
  function addIngredientTo(list, it, vessel){
    if(!moveIntoVessel(list, it, vessel)) return false;
    log(`You add the ${it.name.toLowerCase()} to the ${vessel.name.toLowerCase()}.`);
    return true;
  }
  function doAddToVessel(list, index, vessel){
    const it = getItemAt(list, index);
    if(!it || !addIngredientTo(list, it, vessel)) return;
    render();
  }
  // Ingredient rows within reach that could go toward template `t`:
  // unsealed ones in its counting set, oldest perishable units first and
  // otherwise in the order crafting reaches lists (nearbyLists()).
  function templateCandidates(t){
    const rows = [];
    nearbyLists().forEach((list, li)=> list.forEach(row=>{
      if(!row.sealed && inIngredientSet(t.counts || t.allowed, row))
        rows.push({ list, row, li, age: isPerishable(row) ? unitAges(row)[0] : -1 });
    }));
    return rows.sort((a, b)=> b.age - a.age || a.li - b.li);
  }
  // Whether Add ingredients has anything to do for `t` in `vessel`: units
  // still missing, nothing ruling the dish out, and one within reach that
  // the vessel can take.
  function canAddMissing(t, vessel){
    const st = templateStatus(t, vesselDefOf(vessel).kind, vessel.contents || [], waterKindOf(vessel));
    return !st.blocked && st.need > 0 && templateCandidates(t).some(c=> canAddToVessel(c.list, c.row, vessel));
  }
  // Add ingredients: adds what `t` still needs to `vessel` from within reach,
  // one unit at a time, exactly as Add would. Water is never pulled. It
  // never chooses the dish: the contents do, when heated.
  function doAddMissingIngredients(t, vessel){
    const kind = vesselDefOf(vessel).kind;
    for(;;){
      const st = templateStatus(t, kind, vessel.contents || [], waterKindOf(vessel));
      if(st.blocked || st.need === 0) break;
      const c = templateCandidates(t).find(x=> canAddToVessel(x.list, x.row, vessel));
      if(!c || !addIngredientTo(c.list, c.row, vessel)) break;
    }
    render();
  }
  // Takes one row back out of a vessel that holds no dish yet. Silent, as
  // Take is: the row visibly leaves the vessel's pop-up.
  function doTakeOutOfVessel(vessel, row){
    if(dishIn(vessel) || !vessel.contents || !vessel.contents.includes(row)) return;
    vessel.contents.splice(vessel.contents.indexOf(row), 1);
    giveItem(row);
    render();
  }
  // Whether a bottle's water can go into `vessel`: while the vessel can take
  // water, and into its clean water when the bottle's is tainted, which only
  // taints it — kept, by choice, as the one pour into water already there.
  function canPourInto(bottle, vessel){
    if(!bottle.water || !holdsWaterAtAll(bottle) || !vesselDefOf(vessel)) return false;
    return canTakeWater(vessel)
      || (holdsWaterAtAll(vessel) && waterKindOf(vessel) === "clean" && waterKindOf(bottle) === "tainted");
  }
  // Empties a bottle into a vessel, whatever its fill: the vessel then holds
  // water, tainted if either was. Volumes are #47's. The line's wording is
  // retunable.
  function doPourIntoVessel(list, index, vessel){
    const bottle = getItemAt(list, index);
    if(!bottle || !canPourInto(bottle, vessel)) return;
    addWater(vessel, bottle.water.kind);
    changeOneUnit(list, bottle, u=>{ delete u.water; });
    log(`You pour the water into the ${vessel.name.toLowerCase()}.`);
    render();
  }
  // Silent: the vessel's label loses its water.
  function doPourOutWater(vessel){
    if(dishIn(vessel)) return;
    delete vessel.water;
    delete vessel.boilMinutes;
    render();
  }
  // A dish never leaves its vessel, so the pot is emptied of it. The line's
  // wording is retunable.
  function doPourOutDish(vessel){
    const dish = dishIn(vessel);
    if(!dish) return;
    vessel.contents = [];
    log(`You pour out the ${dish.name.toLowerCase()}.`);
    render();
  }
  // Eats `amount` of a unit (a fraction; null for whatever is left of it)
  // from the target eatTarget() picks. Restores and the poisoning chance
  // scale linearly with the amount, so eating in bites is slightly safer than
  // eating the whole — accepted. The part line's wording is retunable.
  function doConsume(sourceKind, index, amount){
    const room = world[state.currentRoom];
    const src = sourceKind === "world" ? worldSlot(room, worldTab) : invSlot(invTab);
    consumeFromList(src && src.items, index, amount);
  }
  // doConsume() on a list already resolved: the tab's list, or a vessel's
  // contents when its dish is eaten from the pot.
  function consumeFromList(list, index, amount){
    const clicked = getItemAt(list, index);
    if(!clicked || !consumeProfile(clicked)) return;
    const it = eatTarget(list, clicked);
    const fx = consumeProfile(it);
    const a = amount == null ? fx.left : Math.min(amount, fx.left);
    if(fx.restores.hunger) state.vitals.hunger = clamp(state.vitals.hunger + fx.restores.hunger * a);
    if(fx.restores.thirst) state.vitals.thirst = clamp(state.vitals.thirst + fx.restores.thirst * a);
    eatFromRow(list, it, a);
    // What is drunk from a bottle is the water, not the bottle.
    const verb = it.verb.toLowerCase(), name = fx.water ? "water" : it.name.toLowerCase();
    log(a === 1 ? `You ${verb} the ${name}.` : `You ${verb} some of the ${name}.`, "good", "consume:" + (it.itemId || it.name));
    // After the eating line, so the onset line reads as its consequence.
    rollFoodPoisoning(fx.poisoning * a);
    render();
  }
  // Opening is a transformation, not a gate on eating: a sealed can is not
  // food you may not eat yet, it is not food. Exactly one unit opens, so a
  // stack splits — `Canned soup x3` becomes x2 sealed plus x1 opened. No
  // capacity check is needed or wanted: the opened unit goes back into the
  // list the sealed one came from at the same unitWeight, so the list's
  // total is unchanged.
  function doOpen(sourceKind, index){
    const room = world[state.currentRoom];
    const src = sourceKind === "world" ? worldSlot(room, worldTab) : invSlot(invTab);
    const it = getItemAt(src && src.items, index);
    if(!it || !it.sealed) return;
    if(it.opensWith && !hasTool(it.opensWith)) return;
    const unit = dropUnits(src.items, index, 1);
    unit.sealed = false;
    // An opened perishable starts at age 0: sealed, it never aged.
    asNewlyMade(unit);
    // Through addToList() rather than a direct push, so the opened unit
    // merges into an opened stack of the same item where there is one.
    const opened = addToList(src.items, unit);
    // Follow the opened unit. Without this the detail view closes whenever
    // the last sealed unit is opened, since detailItem would still point at
    // a uid that was just spliced out.
    detailItem = { uid: ensureUid(opened), side: sourceKind };
    log(it.opensWith
      ? `You work the lid off the ${it.name.toLowerCase()}.`
      : `You break the seal on the ${it.name.toLowerCase()}.`,
      null, "open:" + (it.itemId || it.name));
    render();
  }
  function doEquip(sourceKind, index){
    const room = world[state.currentRoom];
    const src = sourceKind === "world" ? worldSlot(room, worldTab) : invSlot(invTab);
    const it = getItemAt(src && src.items, index);
    if(!it || !it.slotType) return;
    if(state[it.slotType]){ log("You're already carrying something in that slot.", "warn"); return; }
    // Refused only when it would raise the load past CARRY_HARD_LIMIT_KG.
    // What it adds is the bag's weight at its own factor less what it
    // already counts for where it sits: 0 in the world (worldSlot() has no
    // itemId, so carryFactorOf() would say 1), its source's factor in the
    // inventory. So a bag stowed in a lower-factor worn bag can add load.
    // A player already past the limit may still equip when it adds nothing.
    const srcFactor = sourceKind === "world" ? 0 : carryFactorOf(src);
    const added = itemUnitWeight(it) * (carryFactorOf(it) - srcFactor);
    if(added > 0 && playerLoad() + added > CARRY_HARD_LIMIT_KG){
      log("You can't carry any more.", "warn");
      return;
    }
    // itemId rides along so the slot stays traceable to its registry entry:
    // countInPools() can see a stowed bag by id, and doUnequip() rebuilds
    // the item from the registry rather than by hand.
    state[it.slotType] = { itemId: it.itemId, name:it.name, unitWeight:it.unitWeight,
      capacityKg:it.capacityKg, items: it.contents || [] };
    src.items.splice(index,1);
    // Silent: equipping makes a new inventory tab appear.
    invTab = it.slotType;
    render();
  }
  function doUnequip(slotKey){
    const slot = state[slotKey];
    if(!slot) return;
    // Every equippable bag takes the first branch — ITEM_REGISTRY owns what
    // a bag is, so category/slotType/capacityKg are never restated here.
    // The fallback is reached by exactly two things and is not dead code:
    // the keychain, which has no registry entry by design (see
    // CONTAINER_SLOTS), and a slot loaded from a save written before slots
    // carried itemId and not yet repaired by backfillSlotItemIds().
    const item = slot.itemId
      ? Object.assign(itemFromRegistry({ id: slot.itemId, qty:1 }), { contents: slot.items })
      : { name:slot.name, category:"Container", qty:1, unitWeight:slot.unitWeight,
          slotType:slotKey, capacityKg:slot.capacityKg, contents:slot.items };
    // No capacity or load check, by design: Unequip is always allowed, even
    // when it takes the load past CARRY_HARD_LIMIT_KG.
    addToList(state.inventory.items, item);
    state[slotKey] = null;
    if(invTab === slotKey) invTab = "inventory";
    // Silent: unequipping makes the tab disappear.
    render();
  }
  // ==================================================
  // INVENTORY / ITEM SYSTEM — item-detail action list
  // ==================================================

  // has already resolved via findItemByUid() for the *current* state, so the
  // resulting closures capture a correct index for this render. It still
  // validates defensively (getItemAt) so a future caller that passes a stale
  // pair fails safe instead of throwing on `undefined.qty`. An entry with
  // `note` is not an action: a line shown in one's place, as "The tap is
  // dry." stands where Fill at the sink would.
  function getItemActions(list, index, side){
    const it = getItemAt(list, index);
    if(!it) return [];

    // A stack can be transferred in parts when it merges by itemId and
    // carries no per-unit state — the same gate the single-unit button
    // already used. doTake()/doStore() accept and validate any quantity; All
    // / Half / 1 is the settled set of quantities the UI offers.
    //
    // Half rounds up (half of 7 takes 4 and leaves 3) and only appears from
    // qty 3: at qty 2 half is 1 and the button would duplicate "… 1". Both
    // are judgment calls and retunable.
    const splittable = STACKABLE.has(it.category) && !it.durability;
    if(side === "world"){

      // exception to the rule below that an unperformable action is not
      // offered at all. Hiding Take with the keychain tab open would read as

        actions.push({ label: verb + " Half", onClick:()=>doStore(index, Math.ceil(it.qty/2)) });

  function disassemblyRecipe(it){
    return hasTag(it, "disassemble") && RECIPES.find(r=> r.output.id === it.itemId) || null;

  function doDisassemble(list, index){

  // WORLD INTERACTION

  function doorsForRoom(roomId){
    return Object.keys(doors).filter(id => doors[id].sides.includes(roomId));

  // rooms a door physically separates; `doorId` on an exit names the exits that
  // door actually blocks, and the two need not be the same set: a room can
  // leave through a door without being one of its sides (a flat's kitchen
  // through its front door, in the flats this world first had). Anything the
  // player is told about a shut door is driven from
  // here, so the rooms that lose an exit are the rooms that explain it. Reads
  // raw `room.exits` on purpose: `getExitsForRoom()` is what drops a locked
  // exit, which is exactly what has to be reported. Deduped by door, so a
  // future room with two exits through one door says it once.
  function gatedExitsForRoom(roomId){
    const room = world[roomId];
    if(!room || !room.exits) return [];
    const seen = [];
    const gated = [];
    room.exits.forEach(e=>{
      if(!e.doorId || !doors[e.doorId] || seen.includes(e.doorId)) return;
      seen.push(e.doorId);
      gated.push({ doorId:e.doorId, to:e.to });

  }
  // Every door a room touches: the ones it adjoins as a `sides` member, then
  // the ones only its exits pass through. The union, not either half — a room
  // can leave through a door without being one of its sides, and a room a
  // door adjoins keeps its key actions even if one of its exits through that
  // door is authored without a doorId. `doorsForRoom()` first keeps every
  // key panel's existing label order intact.
  function doorsTouchingRoom(roomId){
    const ids = doorsForRoom(roomId);
    gatedExitsForRoom(roomId).forEach(e=>{ if(!ids.includes(e.doorId)) ids.push(e.doorId); });
    return ids;
  }
  // A door with a `label` (DOOR SCHEMA) is called that from both sides:
  // "front", "back". Any other is named by the side the player is not
  // standing on, so the same door reads correctly from both of its rooms.
  // The composition is area-then-room because neither field alone is enough
  // in a building of flats: two rooms sharing an area would name their door
  // by that area from inside it, and two doors off one hallway into two
  // living rooms would read alike by room. Area first, room only when the two
  // sides share an area, separates both.

  // capitals ("2A", "2nd Floor"); a room is a common noun and is lowercased
  // ("patio", "living room"). Callers supply the article — "the <label> door".

  // door, and otherwise the destination of the near room's exit through it —

  // same from every room it shuts.
  function doorLabel(doorId, fromRoomId){

    if(!door || !near) return doorId;
    if(door.label) return door.label;

      ? door.sides.find(id => id !== fromRoomId)
      : (gatedExitsForRoom(fromRoomId).find(e => e.doorId === doorId) || {}).to;
    const far = world[farId];
    if(!far) return doorId;
    if(far.area && far.area !== near.area) return far.area;
    if(far.room) return far.room.toLowerCase();
    if(far.area) return far.area;
    return doorId;
  }
  function findKeyForDoor(doorId){
    const door = doors[doorId];
    for(const list of invPools()){
      for(const it of list){
        if(it.category !== "Key") continue;

        if(!it.masterKey && it.doorId === doorId) return it;

  // The game opens at 08:00 on Day 1; state.totalMinutes counts from there.

  // repeating the arithmetic.
  function absoluteMinute(){ return Math.round(DAY_START_MIN + state.totalMinutes); }
  function dayNumber(){ return 1 + Math.floor(absoluteMinute()/MINUTES_PER_DAY); }
  function minutesIntoDay(){ const a = absoluteMinute(); return ((a % MINUTES_PER_DAY) + MINUTES_PER_DAY) % MINUTES_PER_DAY; }

  //
  // The boundaries are a judgment call with nothing behind them yet and are
  // retunable. They are set to be plausible as *light* boundaries, because a
  // later light-and-darkness layer is meant to read this table rather than
  // pick its own: two opinions about when evening starts is exactly the
  // duplicated fact this table exists to prevent.
  const TIME_OF_DAY_BANDS = [
    { from: 0,     label:"late night" },
    { from: 5*60,  label:"dawn" },
    { from: 7*60,  label:"morning" },
    { from: 12*60, label:"midday" },
    { from: 14*60, label:"afternoon" },
    { from: 18*60, label:"evening" },
    { from: 21*60, label:"night" }
  ];
  function timeOfDayBand(){
    const tod = minutesIntoDay();
    return TIME_OF_DAY_BANDS.filter(b => tod >= b.from).pop().label;
  }
  function getClockText(){
    const tod = minutesIntoDay();
    return "Day " + dayNumber() + ", " + String(Math.floor(tod/60)).padStart(2,"0") + ":" + String(tod%60).padStart(2,"0");
  }
  // What you know without a watch: the day, and roughly where in it you are.
  // Precision is what the watch buys, not all sense of time.
  function getVagueClockText(){ return "Day " + dayNumber() + ", " + timeOfDayBand(); }
  // How long ago the collapse was, in game minutes: the run's start offset
  // plus the time played. Derived, never stored. Everything that asks whether
  // the grid or the mains are still on reads this, through the two predicates
  // below (gridUp(), mainsWaterUp()); `m` defaults to now so a caller integrating over time can ask
  // about any other minute.
  // gridUp() is the grid source's state, the one source the power network
  // has (see POWER in SURVIVAL / TIME SIMULATION).
  function minutesSinceCollapse(){ return START_DAYS_AFTER_COLLAPSE * MINUTES_PER_DAY + state.totalMinutes; }
  // The minute since the collapse the grid fails at: POWER_FAILS_HOUR on
  // POWER_FAILS_DAY, where minute 0 is DAY_START_MIN on the collapse day.
  const POWER_FAILS_MIN = POWER_FAILS_DAY * MINUTES_PER_DAY + (POWER_FAILS_HOUR * 60 - DAY_START_MIN);
  // The grid's up-time, the one definition gridUp() and gridUpMinutes() read:
  // half-open [from, to) spans of minutes since the collapse. Up until the
  // failure, and again for the false recovery, once.
  const GRID_UP_SPANS = [
    [-Infinity, POWER_FAILS_MIN],

  }
  // mainsWaterUp() is whether the town's water network runs: the mains a
  // sink without a tank draws on, and what a house pump draws from to fill
  // its tank (refillTanks()). The town's own pumps run on the grid, so today

  function mainsWaterUp(m = minutesSinceCollapse()){ return gridUp(m); }

  // tankOf() is the room's building's tank in litres, or 0 for none;
  // tankLeft() what it holds now.
  function tankOf(roomId){
    const room = world[roomId];

  }
  function tankLeft(roomId){
    const size = tankOf(roomId);

    return Math.max(0, size - (state.tankDrawn[world[roomId].buildingId] || 0));
  }
  function waterRunningIn(roomId){
    return tankOf(roomId) > 0 ? tankLeft(roomId) > 0 : mainsWaterUp();
  }
  // A tank's float switch, from its size and the litres drawn from it: `low`

  function tankFloat(tankL, drawn){

  function refilledDrawn(drawn, flowLph, dt){

  function refillTanks(dt){

  function getWindowsInRoom(roomId){
    return Object.keys(windows).filter(id=>windows[id].rooms.includes(roomId)).map(id=>Object.assign({id}, windows[id]));
  }

  function isGridTravel(fromId, toId){
    const from = world[fromId], to = world[toId];

  }
  // ==================================================
  // WORLD INTERACTION (continued) — movement, doors, windows, containers
  // ==================================================
  // Jogging's Exertion, per game minute spent moving. Declared beside its one

  // movement, unlike those two, has no fixed duration to scale from.
  const JOG_EXERTION_PER_MIN = 0.5;

  // retunable. Two fractions of the way along, each clamped to [0,1] so they
  // hold at 1 past the hard limit, which only Unequip reaches: overload runs
  // from the carry limit to the hard limit, harm from OVERLOAD_HARM_START_KG
  // to the hard limit. Every cost is linear in one of them.

  //   Exertion adds up to OVERLOAD_MAX_EXERTION_PER_MIN per minute moved, at
  //            every gait, on top of Jog's own — one more jogging's rate.
  //   Health   from OVERLOAD_HARM_START_KG only, one point per

  const OVERLOAD_HARM_START_KG = CARRY_LIMIT_KG * 2;

  function harmFraction(load){ return loadFraction(load, OVERLOAD_HARM_START_KG, CARRY_HARD_LIMIT_KG); }
  function overloadSpeedFactor(load){ return 1 - overloadFraction(load) * (1 - OVERLOAD_MIN_SPEED_FACTOR); }

    const start = 1 / OVERLOAD_HARM_MINUTES_PER_HEALTH_START, end = 1 / OVERLOAD_HARM_MINUTES_PER_HEALTH_END;
    return start + harmFraction(load) * (end - start);

    // keeping. Sampled here, before advanceTime(), because it must be the

    // distance covered at Sneak speed.
    const gait = effectiveGait();

    // priced and charged from one reading. `minutes` already carries the
    // slowdown, so the per-minute costs below grow with it.
    const load = playerLoad();

  function stopPlaceName(id){

  function walkRoutes(){

  function effectiveAge(container, roomId, fromM, toM){

  // placement that sets `ages` itself keeps them.
  function stampAges(it, container, roomId){
    (Array.isArray(it.contents) ? it.contents : []).forEach(c=> stampAges(c, container, roomId));
    if(!isPerishable(it) || Array.isArray(it.ages)) return;
    it.ages = new Array(it.qty).fill(effectiveAge(container, roomId, 0, minutesSinceCollapse()));

  function stampMissingAges(){

    outside: {
      awake: "Far off, a siren starts up. It sounds for a while, then stops, and nothing follows it.",
