    Object.keys(tankDefs).forEach(id=>{ drawn[id] = tankDefs[id].drawn || 0; });
    const floats = ()=>{
      const out = {};
      Object.keys(tankDefs).forEach(id=>{ out[id] = tankFloat(tankDefs[id].tankL, drawn[id]); });
      return out;
    };
    const idx = powerIndex(net, appliances);
    let prev = options.running ? powerLook(idx, power, rules, grid(start), start, null, seed, floats()) : NOTHING_DREW;
    const script = options.script || {};
    const steps = [];
    for(let t = 0; t < minutes; t++){
      (script[t] || []).forEach(c=>{
        if("switch" in c){
          const l = net.loads[c.switch];
          setSwitchIn(power, seed, c.switch, l && appliances[l.appliance], !!c.on);
        }
        else if("breaker" in c) switchBreakerIn(power, c.breaker, !!c.on);
        else if("reset" in c) resetBreakerIn(power, c.reset);
        else if("rewire" in c) rewireFuseIn(power, c.rewire);
      });
      const m = start + t + 1;
      const r = powerStep(idx, power, rules, grid(m), m, 1, prev, seed, floats());
      power = r.power;
      prev = r;
      const flat = powerFlat(r);
      Object.keys(tankDefs).forEach(id=>{
        const a = net.loads[id] && appliances[net.loads[id].appliance];
        if(flat.drawing[id] && mains(m) && a) drawn[id] = refilledDrawn(drawn[id], a.flowLph, 1);
      });
      const held = {};
      Object.keys(tankDefs).forEach(id=>{ held[id] = tankDefs[id].tankL - drawn[id]; });
      steps.push({ minute:t + 1, running:flat.running, momentary:flat.momentary, heat:Object.assign({}, power.heat),
        trips:r.trips.map(x=> ({ id:x.id, cause:x.cause })), powered:flat.powered, drawing:Object.keys(flat.drawing),
        starting:Object.keys(flat.starting), tanks:held });
    }
    return { problems:net.problems, steps, power, tanks:drawn };
  }
  // The benchmark (#371): a fixed, busy late-game town built by code, and
  // the costs a player feels, timed on it. It runs only on a page opened
  // with `?bench` (benchMode), after the boot's first paint, and leaves its
  // result on window.ashfallBenchResults, where the Performance job in CI
  // reads it (.github/scripts/perf_check.py, which holds the budgets). It
  // writes game state throughout, which is why it is not on the dev seam.
  //   The scenario's figures are judgment calls, retunable. BENCH_DAY puts
  // the clock on a morning before the grid fails, with no clock event inside
  // the timed windows. BENCH_SLEEP_MIN is the sleep BENCH_ENERGY and
  // BENCH_FATIGUE are chosen to give at SLEEP_ENERGY_RATE, and every timed
  // sleep is checked against it (benchCheckSleep()), so a retune that
  // changes the sleep stops the benchmark rather than timing another one.
  const BENCH_SEED = 371;
  const BENCH_DAY = 20;
  const BENCH_BUILDINGS = 200;
  const BENCH_STOVES = 2;
  const BENCH_STOVE_TIMER_MIN = 600;
  const BENCH_RADIOS = 3;
  const BENCH_ENERGY = 20;
  const BENCH_FATIGUE = 0;
  const BENCH_SLEEP_MIN = 480;
  const BENCH_ACTION_MIN = 10;
  const BENCH_WARMUP_RUNS = 1;
  const BENCH_RUNS = 5;
  // The boot's cost, read once, right after its first render() (end of the
  // script); null outside bench mode.
  let benchBootMs = null;
  // Builds the scenario on a fresh restart and returns its counts, {
  // buildings, rowsRolled }. Each building touched gets one switch flipped
  // from its rolled default, so the power run resolves it every step (POWER
  // RUNS), and is marked entered. Every container in it is rolled as
  // doOpenContainer() rolls one, but by its own room's id rather than the
  // player's. Two stoves burn with long timers, and radios play in the
  // inventory and on two floors. The player stays in the start room.
  function benchScenario(){
    doRestart(BENCH_SEED);
    state.electricalRules = "detailed";
    state.totalMinutes = (BENCH_DAY - START_DAYS_AFTER_COLLAPSE) * MINUTES_PER_DAY;
    const touched = POWER_INDEX.buildings.slice(0, BENCH_BUILDINGS);
    touched.forEach(b=>{
      const load = Object.values(POWER_INDEX.sub[b].loads).find(l=> !APPLIANCES[l.appliance].switchless);
      if(load){
        const a = APPLIANCES[load.appliance];
        setSwitchIn(state.power, state.seed, load.id, a, !switchOnIn(state.power, state.seed, load.id, a));
      }
      if(!state.enteredBuildings.includes(b)) state.enteredBuildings.push(b);
    });
    const inTouched = new Set(touched);
    const rooms = roomIds().filter(id=> inTouched.has(world[id].buildingId));
    let rowsRolled = 0;
    rooms.forEach(roomId=>{
      const room = world[roomId];
      (room.containers || []).concat(room.carContainers || []).forEach(c=>{
        if(!c.spawnPools || c.spawnRolled) return;
        rolledLootFor(state.seed, roomId, c).forEach(it=>{ stampAges(it, c, roomId); addToList(c.items, it); rowsRolled += 1; });
        c.spawnRolled = true;
        c.lastRolledMinute = state.totalMinutes;
      });
    });
    rooms.filter(id=> roomStove(world[id])).slice(0, BENCH_STOVES).forEach(id=>{
      world[id].heatActive = true;
      roomStove(world[id]).timerMinutes = BENCH_STOVE_TIMER_MIN;
    });
    const floors = [state.inventory.items].concat(rooms.slice(0, BENCH_RADIOS - 1).map(id=> world[id].floor));
    floors.forEach(list=>{
      const radio = itemFromRegistry({ id:"portable_radio", qty:1 });
      radio.on = true;
      addToList(list, radio);
    });
    state.vitals.energy = BENCH_ENERGY;
    state.vitals.fatigue = BENCH_FATIGUE;
    refreshPower();
    return { buildings:touched.length, rowsRolled };
  }
  // One timing: BENCH_WARMUP_RUNS runs, discarded, then BENCH_RUNS measured,
  // in milliseconds, with their median. `prepare` runs before each, untimed,
  // and what it returns is handed to `check`, which runs after each, untimed
  // too, and throws if the run was not what it should have been.
  function benchTiming(prepare, timed, check){
    const runs = [];
    for(let i = 0; i < BENCH_WARMUP_RUNS + BENCH_RUNS; i++){
      const before = prepare ? prepare() : null;
      const t0 = performance.now();
      timed();
      const ms = performance.now() - t0;
      if(check) check(before);
      if(i >= BENCH_WARMUP_RUNS) runs.push(ms);
    }
    const sorted = runs.slice().sort((x, y)=> x - y), mid = sorted.length >> 1;
    const median = sorted.length % 2 ? sorted[mid] : (sorted[mid - 1] + sorted[mid]) / 2;
    return { median, runs };
  }
  // A sleep that fell short must not pass as a fast one: one that never
  // started, one a waking event cut off (a complete sleep sets
  // lastWakeMinute), and one of any other length each stop the benchmark.
  function benchCheckSleep(startMinute){
    const ran = state.totalMinutes - startMinute;
    if(!(ran > 0)) throw new Error("the sleep never started: Sleep wasn't available");
    if(state.lastWakeMinute !== state.totalMinutes) throw new Error(`the sleep was woken after ${ran} min, by a clock event inside its window`);
    if(Math.abs(ran - BENCH_SLEEP_MIN) > TICK_EPSILON) throw new Error(`the sleep ran ${ran} min, not ${BENCH_SLEEP_MIN}`);
  }
  // Runs every timing, logs one line each, and sets
  // window.ashfallBenchResults, once: the result's shape is perf_check.py's
  // to read. A throw sets { error } instead, and logs it. The sleep and the
  // action each get a fresh scenario per run; render() and serializeGame()
  // share one. The lines are functional, retunable.
  function runBenchmark(){
    try{
      const sleep = benchTiming(()=>{ benchScenario(); return state.totalMinutes; }, doSleep, benchCheckSleep);
      const action = benchTiming(benchScenario, ()=>{ advanceTime(BENCH_ACTION_MIN); render(); });
      const scenario = benchScenario();
      const drawn = benchTiming(null, render);
      const save = benchTiming(null, ()=>{ serializeGame(); });
      const ms = (t)=> `median ${t.median.toFixed(1)} ms (${t.runs.length} runs)`;
      log(`Benchmark, seed ${BENCH_SEED}: ${scenario.buildings} buildings touched, ${scenario.rowsRolled} item rows rolled.`, "sys");
      log(`Boot: ${benchBootMs.toFixed(1)} ms.`, "sys");
      log(`Sleep ${BENCH_SLEEP_MIN} min: ${ms(sleep)}`, "sys");
      log(`Action ${BENCH_ACTION_MIN} min and redraw: ${ms(action)}`, "sys");
      log(`render(): ${ms(drawn)}`, "sys");
      log(`serializeGame(): ${ms(save)}`, "sys");
      window.ashfallBenchResults = { version:GAME_CONFIG.VERSION, seed:BENCH_SEED, scenario, boot:benchBootMs,
        sleep, action, render:drawn, save };
    }catch(e){
      window.ashfallBenchResults = { error: String(e && e.message || e) };
      log("The benchmark failed: " + window.ashfallBenchResults.error, "warn");
    }
  }
  // `seed` is optional: undefined starts a fresh world, a uint32 replays that
  // one (see seedFromInput()). Callers wired straight to a click must wrap
  // this in an arrow — a bare doRestart handler would receive the click event
  // as its seed.
  function doRestart(seed){
    gameOver = false;
    // The rules Options chose for this run, read before the old run goes.
    const rules = nextElectricalRules();
    state = makeDefaultState(seed);
    state.electricalRules = rules;
    nextRulesChoice = null;
    world = makeDefaultWorld();
    doors = buildDoors(null);
    windows = buildWindows(null);
    refreshPower();
    stampMissingAges();
    detailItem = null;
    deviceTarget = null;
    invTab = "inventory";
    worldTab = "floor";
    _uidCounter = 1;
    document.getElementById("log").innerHTML = "";
    log("You wake up at home. Everything's exactly where you left it — for now.");
    render();
  }

  // The Electrical view's preference (ELECTRICAL_VIEW_KEY). Every read and
  // write is guarded: storage can be missing, blocked or full, and then the
  // view is off and stays in memory only.
  function readElectricalViewPref(){
    try{ return localStorage.getItem(ELECTRICAL_VIEW_KEY) === "on"; }catch(e){ return false; }
  }
  function writeElectricalViewPref(on){
    try{ localStorage.setItem(ELECTRICAL_VIEW_KEY, on ? "on" : "off"); }catch(e){ /* kept in memory only */ }
  }
  function doSaveLocal(){
    if(benchMode){ log("The benchmark page doesn't save.", "warn"); return; }
    try{ localStorage.setItem(SAVE_KEY, serializeGame()); log("Progress saved to this browser.", "sys", "save"); }
    catch(e){ log("Couldn't save to browser storage here — use Export instead.", "warn"); }
  }
  function doLoadLocal(){
    try{
      const raw = localStorage.getItem(SAVE_KEY);
      if(!raw){ log("No saved game found in this browser.", "warn"); return; }
      if(applyLoadedData(JSON.parse(raw))) log("Progress loaded from this browser.", "sys", "load");
    }catch(e){ log("Couldn't read a save from this browser.", "warn"); }
  }
  function doExportSave(){
    const blob = new Blob([serializeGame()], { type:"application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = "ashfall-save.json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
    log("Save file exported.", "sys", "export");
  }
  function doImportSave(file){
    const reader = new FileReader();
    reader.onload = ()=>{
      try{ if(applyLoadedData(JSON.parse(reader.result))) log("Save file imported.", "sys", "import"); }
      catch(e){ log("That file couldn't be read as a save.", "warn"); }
    };
    reader.onerror = ()=> log("That file couldn't be read.", "warn");
    reader.readAsText(file);
  }
  document.getElementById("saveLocalBtn").addEventListener("click", doSaveLocal);
  document.getElementById("loadLocalBtn").addEventListener("click", doLoadLocal);
  document.getElementById("exportBtn").addEventListener("click", doExportSave);
  document.getElementById("importBtn").addEventListener("click", ()=> document.getElementById("importInput").click());
  document.getElementById("importInput").addEventListener("change", (e)=>{
    const file = e.target.files[0];
    if(file) doImportSave(file);
    e.target.value = "";
  });
  const sideMenu = document.getElementById("sideMenu");
  const menuBackdrop = document.getElementById("menuBackdrop");
  // ==================================================
  // EVENTS / UI HELPERS
  // ==================================================
  // MENU LAYERS. Three kinds stack: a pop-up (the item pop-up or the device
  // pop-up), the drawer, and a full-screen panel over the drawer. layerStack
  // holds the open ones bottom to top, each as { el, hide, back }: the
  // layer's root element, what closing it does, and where focus goes when it
  // closes. Esc closes the top one only. Nothing here knows which layers
  // exist: the device pop-up is one more openLayer() call (see
  // renderDevicePop()).
  function layerOpen(el){ return layerStack.some(l => l.el === el); }
  // The enabled, rendered controls in a layer, in document order.
  function focusablesIn(el){
    return Array.from(el.querySelectorAll("button, input, select, textarea, a[href], [tabindex]:not([tabindex='-1'])"))
      .filter(x => !x.disabled && x.getClientRects().length > 0);
  }
  // The .itemname control for an item. Rows are rebuilt on every render(),
  // so this is how anything that pointed at one row finds its replacement:
  // by the item's _uid, never by index and never by a kept DOM node.
  function itemNameButton(uid){
    return Array.from(document.querySelectorAll(".itemname")).find(b => b.dataset.uid === uid) || null;
  }
  // Where focus goes back to: the element focused when the layer opened, and
  // if that is an item's name, the item's uid, so a rebuilt row still counts.
  function focusReturnPoint(){
    const el = document.activeElement && document.activeElement !== document.body ? document.activeElement : null;
    return { el, uid: el && el.classList.contains("itemname") ? el.dataset.uid : null };
  }
  // Opening moves focus to the layer's first control. `back` defaults to
  // whatever is focused now; a caller that has already lost that element to
  // a render passes its own.
  function openLayer(el, show, hide, back){
    if(layerOpen(el)) return;
    layerStack.push({ el, hide, back: back || focusReturnPoint() });
    show();
    (focusablesIn(el)[0] || el).focus({ preventScroll:true });
  }
  // Closing hands focus back, but only if focus was in the layer or had
  // nowhere else to be. Focus the player has moved elsewhere is left alone,
  // and so is focus in a layer above one that closes underneath it, as the
  // pop-up does when a Load from the drawer clears detailItem.
  function closeLayer(el){
    const i = layerStack.findIndex(l => l.el === el);
    if(i < 0) return;
    const layer = layerStack.splice(i, 1)[0];
    const wasTop = i === layerStack.length;
    const active = document.activeElement;
    const lost = !active || active === document.body;
    layer.hide();
    if(el.contains(active) || (wasTop && lost)) restoreFocus(layer.back);
  }
  function closeAllLayers(){
    while(layerStack.length) closeLayer(layerStack[layerStack.length - 1].el);
  }
  // The same element if it is still there; otherwise the rebuilt .itemname
  // for the same item; otherwise whatever `back.find()` finds, for a return
  // point that is neither (a pop-up button rebuilt while a layer covered it);
  // otherwise nowhere, without error.
  function restoreFocus(back){
    let target = back.el && back.el.isConnected && !back.el.disabled ? back.el : null;
    if(!target && back.uid) target = itemNameButton(back.uid);
    if(!target && back.find) target = back.find();
    if(target) target.focus({ preventScroll:true });
    else if(document.activeElement && document.activeElement !== document.body) document.activeElement.blur();
  }
  // A render() that rebuilds a layer's contents would drop focus out of it:
  // the focused button is removed and focus falls to <body>. This puts it
  // back inside, on the control with the same label if the rebuild made one,
  // else on the one at the same position, else on the layer itself.
  // `isLayer` is false for a root that is not a layer, the two panels' tab
  // strips: the open-layer guard is a layer's alone, since a strip is never
  // opened or closed, and a strip that ends up empty takes no focus.
  function rebuildKeepingFocus(root, rebuild, isLayer = true){
    const had = root.contains(document.activeElement) ? document.activeElement : null;
    const index = had ? focusablesIn(root).indexOf(had) : -1;
    const label = had && had.textContent;
    rebuild();
    if(!had || (isLayer && !layerOpen(root)) || (had.isConnected && document.activeElement === had)) return;
    const after = focusablesIn(root);
    (after.find(x => x.textContent === label) || after[Math.min(index, after.length - 1)] || root).focus({ preventScroll:true });
  }
  document.addEventListener("keydown", e=>{
    if(e.key !== "Escape" || !layerStack.length) return;
    e.preventDefault();
    closeLayer(layerStack[layerStack.length - 1].el);
  });

  // The item pop-up (see renderItemPop()). Its backdrop is transparent and
  // does one thing: an outside tap closes the pop-up and goes no further.
  // So a tap on another item's name closes this pop-up, and a second tap
  // opens that item's.
  const itemPop = document.getElementById("itemPop");
  const itemPopBackdrop = document.getElementById("itemPopBackdrop");
  function showItemPop(){ itemPop.classList.add("open"); itemPopBackdrop.classList.add("show"); }
  // Closing the pop-up is clearing detailItem, so the two never disagree.
  function hideItemPop(){ detailItem = null; itemPop.classList.remove("open"); itemPopBackdrop.classList.remove("show"); }
  itemPopBackdrop.addEventListener("click", ()=> closeLayer(itemPop));
  // The device pop-up (see renderDevicePop()): a room fixture's controls,
  // opened by Device Options in the strip under the Here panel's tabs. Its
  // backdrop works as the item pop-up's does. Closing it is clearing
  // deviceTarget, as closing the item pop-up is clearing detailItem.
  const DEVICE_OPTIONS_LABEL = "Device Options";
  const devicePop = document.getElementById("devicePop");
  const devicePopBackdrop = document.getElementById("devicePopBackdrop");
  const deviceOptionsBtn = document.getElementById("deviceOptionsBtn");
  deviceOptionsBtn.textContent = DEVICE_OPTIONS_LABEL;
  function showDevicePop(){ devicePop.classList.add("open"); devicePopBackdrop.classList.add("show"); }
  function hideDevicePop(){ deviceTarget = null; devicePop.classList.remove("open"); devicePopBackdrop.classList.remove("show"); }
  devicePopBackdrop.addEventListener("click", ()=> closeLayer(devicePop));
  function positionPops(){ positionItemPop(); positionDevicePop(); positionWalkPop(); positionMapCard(); }
  window.addEventListener("resize", positionPops);
  // Capture phase, because scroll doesn't bubble and a scroll inside
  // #sidebar moves the anchor as surely as a page scroll does. A scroll
  // inside a pop-up itself isn't its anchor moving.
  window.addEventListener("scroll", e=>{
    const inside = (pop)=> e.target instanceof Node && pop.contains(e.target);
    if(!inside(itemPop)) positionItemPop();
    if(!inside(devicePop)) positionDevicePop();
    if(!inside(walkPop)) positionWalkPop();
    if(!inside(mapCardEl)) positionMapCard();
  }, true);

  // The drawer.
  function openMenu(){
    openLayer(sideMenu,
      ()=>{ sideMenu.classList.add("open"); menuBackdrop.classList.add("show"); },
      ()=>{ sideMenu.classList.remove("open"); menuBackdrop.classList.remove("show"); });
  }
  function closeMenu(){ closeLayer(sideMenu); }
  document.getElementById("menuToggle").addEventListener("click", openMenu);
  document.getElementById("closeMenu").addEventListener("click", closeMenu);
  menuBackdrop.addEventListener("click", closeMenu);

  // The full-screen panels, by id. One element each, sharing .full-panel;
  // each stacks over the drawer, and closing one returns to the drawer.
  // `onClose` is what the panel forgets when it goes.
  const FULL_PANELS = {
    crafting: { el: document.getElementById("craftingPanel"), onClose(){
      craftResult = [];
      craftFilter = defaultCraftFilter();
      renderCraftingPanel();
    } },
    options:  { el: document.getElementById("optionsPanel") }
  };
  function openPanel(id){
    const p = FULL_PANELS[id];
    openLayer(p.el, ()=> p.el.classList.add("open"), ()=>{
      p.el.classList.remove("open");
      if(p.onClose) p.onClose();
    });
  }
  // The Crafting panel's filter controls, built once. Each change redraws
  // the panel only: filtering is a view, and changes nothing in the game.
  // The group buttons, in order: "all", one per RECIPES `group`, then
  // "dishes", the DISH_TEMPLATES rows.
  const CRAFT_GROUPS = [
    { id:"all", label:"All" },
    { id:"craft", label:"Crafting" },
    { id:"prep", label:"Preparation" },
    { id:"dishes", label:"Dishes" }
  ];
  CRAFT_GROUPS.forEach(g=>{
    const btn = document.createElement("button");
    btn.textContent = g.label;
    btn.dataset.group = g.id;
    btn.addEventListener("click", ()=>{ craftFilter.group = g.id; renderCraftingPanel(); });
    document.getElementById("craftGroups").appendChild(btn);
  });
  document.getElementById("craftSearch").addEventListener("input", e=>{ craftFilter.query = e.target.value; renderCraftingPanel(); });
  document.getElementById("craftCanMake").addEventListener("change", e=>{ craftFilter.canMakeOnly = e.target.checked; renderCraftingPanel(); });
  document.querySelectorAll(".full-panel .panel-close").forEach(btn=>{
    btn.addEventListener("click", ()=> closeLayer(btn.closest(".full-panel")));
  });
  // Create dish: the Crafting panel opened from a vessel's pop-up, on the
  // Dishes group with that vessel as its context. It opens from the play
  // area rather than from the drawer, so it opens the drawer first if that
  // is not open, and closing the panel closes the drawer it opened, landing
  // the player back on the pop-up's Create dish.
  function openCraftingForVessel(uid){
    const el = FULL_PANELS.crafting.el;
    if(layerOpen(el)) return;
    const back = { el:null, uid:null, find: ()=> layerOpen(itemPop)
      && Array.from(itemPop.querySelectorAll("button")).find(b=> b.textContent === "Create dish") || null };
    craftFilter = defaultCraftFilter();
    craftFilter.group = "dishes";
    craftFilter.vesselUid = uid;
    craftResult = [];
    // Drawn before it opens, so openLayer() has a first control to focus.
    renderCraftingPanel();
    const openedDrawer = !layerOpen(sideMenu);
    if(openedDrawer) openMenu();
    openLayer(el, ()=> el.classList.add("open"), ()=>{
      el.classList.remove("open");
      FULL_PANELS.crafting.onClose();
      if(openedDrawer) closeMenu();
    }, back);
  }
  // The drawer's hub row, in order: one entry per button, giving its label
  // and either the FULL_PANELS id it opens or the HUB_TOGGLES id it flips.
  // An entry that does neither is a placeholder, disabled and carrying
  // HUB_PLACEHOLDER_HINT, so whether a button is enabled is whether it does
  // something, and enabling Health (#163) or Clothing (#164) is filling in
  // `opens`. A new sub-menu is one line. The order and the hint's wording are
  // retunable; so is Electrical's place in the row.
  const HUB_BUTTONS = [
    { label:"Crafting",   opens:"crafting" },
    { label:"Health",     opens:null },
    { label:"Clothing",   opens:null },
    { label:"Electrical", toggles:"electrical" },
    { label:"Options",    opens:"options" }
  ];
  const HUB_PLACEHOLDER_HINT = "Not yet";
  // The hub row's toggles, by id: what each reads and what flipping it does.
  // A toggle opens nothing; it shows its state on its second line
  // (HUB_TOGGLE_HINTS) and is lit while on. Functional UI text, retunable.
  const HUB_TOGGLE_HINTS = { on:"On", off:"Off" };
  const HUB_TOGGLES = {
    // The Electrical view. Turning it off drops a Here tab it showed, so the
    // panel opens on Floor again, as it does after a move.
    electrical: {
      on: ()=> electricalView,
      flip(){
        electricalView = !electricalView;
        writeElectricalViewPref(electricalView);
        if(!electricalView) worldTab = "floor";
        render();
      }
    }
  };
  // Each enabled hub button, keyed by the FULL_PANELS id it opens or the
  // HUB_TOGGLES id it flips, so render() can reach one by what it does
  // rather than by its label.
  const hubButtonFor = {};
  HUB_BUTTONS.forEach(b=>{
    const btn = document.createElement("button");
    btn.textContent = b.label;
    if(b.opens){
      hubButtonFor[b.opens] = btn;
      btn.addEventListener("click", ()=> openPanel(b.opens));
    } else if(b.toggles){
      hubButtonFor[b.toggles] = btn;
      const hint = document.createElement("span");
      hint.className = "hint";
      btn.appendChild(hint);
      btn.addEventListener("click", ()=> HUB_TOGGLES[b.toggles].flip());
    } else {
      btn.disabled = true;
      const hint = document.createElement("span");
      hint.className = "hint";
      hint.textContent = HUB_PLACEHOLDER_HINT;
      btn.appendChild(hint);
    }
    document.getElementById("hubRow").appendChild(btn);
  });
  // A toggle's state, drawn on every render(): lit while on, its second line
  // saying which, and aria-pressed for a screen reader.
  function renderHubToggles(){
    Object.keys(HUB_TOGGLES).forEach(id=>{
      const btn = hubButtonFor[id], on = HUB_TOGGLES[id].on();
      btn.classList.toggle("active", on);
      btn.setAttribute("aria-pressed", on ? "true" : "false");
      btn.querySelector(".hint").textContent = on ? HUB_TOGGLE_HINTS.on : HUB_TOGGLE_HINTS.off;
    });
  }

  // Options. The prompt's Cancel is the destructive-action guard the old
  // confirm() was, so the protection is kept rather than dropped. Blank is a
  // fresh world, the old behaviour; anything typed becomes a seed. A
  // confirmed restart closes every layer, so the new run opens on the play
  // area. Cancel closes nothing.
  document.getElementById("restartMenuBtn").addEventListener("click", ()=>{
    const answer = prompt(
      "Restart the game? This throws away all current progress.\n\n"
      + "Leave blank for a new world, or enter a seed to replay a specific one.", "");
    if(answer === null) return;                       // cancelled
    const s = answer.trim();
    closeAllLayers();
    doRestart(s === "" ? undefined : seedFromInput(s));
  });
  // Copy puts the seed's number on the clipboard. It uses the async clipboard
  // where the page has one, and otherwise selects the number and runs
  // execCommand("copy"), since a page opened from file:// may have no async
  // clipboard. The fallback leaves the number selected, so a copy that fails
  // can still be finished by hand. Feedback goes on the button, never to #log,
  // which this panel covers. The wording and COPY_FEEDBACK_MS are functional
  // choices and retunable.
  const COPY_FEEDBACK_MS = 1500;
  const copySeedBtn = document.getElementById("copySeedBtn");
  const copySeedLabel = copySeedBtn.textContent;
  let copyFeedbackTimer = null;
  function copySeed(){
    const say = (text)=>{
      copySeedBtn.textContent = text;
      clearTimeout(copyFeedbackTimer);
      copyFeedbackTimer = setTimeout(()=>{ copySeedBtn.textContent = copySeedLabel; }, COPY_FEEDBACK_MS);
    };
    const fallback = ()=>{
      const range = document.createRange();
      range.selectNodeContents(document.getElementById("seedValue"));
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      let ok = false;
      try{ ok = document.execCommand("copy"); }catch(e){ ok = false; }
      say(ok ? "Copied" : "Couldn't copy");
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(String(state.seed)).then(()=> say("Copied"), fallback);
    } else fallback();
  }
  copySeedBtn.addEventListener("click", copySeed);
  // The next run's electrical rules, a two-way choice built once. Choosing
  // changes nothing in this run; Restart game applies it. The labels are
  // functional UI text; the choice moves to a New Game screen with #166.
  const ELECTRICAL_RULES_LABELS = { detailed:"Detailed", simplified:"Simplified" };
  ELECTRICAL_RULES.forEach(rules=>{
    const btn = document.createElement("button");
    btn.textContent = ELECTRICAL_RULES_LABELS[rules];
    btn.dataset.rules = rules;
    btn.addEventListener("click", ()=>{ nextRulesChoice = rules; renderOptionsPanel(); });
    document.getElementById("rulesNext").appendChild(btn);
  });
  document.querySelectorAll("#gaitBar button[data-gait]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(gaitLocked() && btn.dataset.gait !== "sneak") return;
      // The only write to state.gait in the file: the player's preference,
      // set by the player. Which button is lit is renderStatsPanel()'s to
      // decide, from effectiveGait() — render() runs on the next line.
      state.gait = btn.dataset.gait;
      render();
    });
  });
  document.querySelectorAll("#mapZoomToggle button[data-zoom]").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      if(mapZoomMode === btn.dataset.zoom) return;
      mapZoomMode = btn.dataset.zoom;
      // Snap to the nearest step the new mode allows rather than resetting to
      // its base: where the two ladders share a span, the box is unchanged
      // and only the content switches.
      mapSetZoomSpan(mapZoomSpan);
      document.querySelectorAll("#mapZoomToggle button[data-zoom]").forEach(b=>{
        b.classList.toggle("active", b.dataset.zoom === mapZoomMode);
      });
      render();
    });
  });
  // + zooms in, which is a smaller span: the next step down the mode's ladder
  // (MAP_ZOOM_RANGE). A step re-aims the existing viewBox and never rebuilds
  // the SVG — content is keyed on the mode, not the step — and the animation
  // already interpolates the box's width and height, so the street names
  // re-place themselves as it runs.
  [["mapZoomIn", -1], ["mapZoomOut", 1]].forEach(pair=>{
    document.getElementById(pair[0]).addEventListener("click", ()=>{
      const steps = MAP_ZOOM_RANGE[mapZoomMode].steps;
      mapSetZoomSpan(steps[Math.max(0, Math.min(steps.length - 1, steps.indexOf(mapZoomSpan) + pair[1]))]);
      if(mapLastNode) mapUpdateViewBox(mapLastNode, false);
    });
  });
  // ==================================================
  // RENDERING
  // ==================================================

  // ==================================================
  // MAP (In-Game Viewing Map)
  // ==================================================
  // SVG user units per 100 m, and so per metre. The map's scale: every
  // coordinate it draws is a LOCATIONS metre times MAP_UNITS_PER_M.
  const MAP_SPACING = 130;
  const MAP_UNITS_PER_M = MAP_SPACING / 100;
  const MAP_MARGIN = 55;
  // The map's origin, from the extent of LOCATIONS as it stands once the
  // world is built: the westmost Location lands on the left margin and the
  // northmost on the top one, whatever the coordinates' sign.
  const MAP_EXTENT = (function(){
    const all = Object.values(LOCATIONS);
    return { minX: Math.min.apply(null, all.map(l=> l.x)), maxY: Math.max.apply(null, all.map(l=> l.y)) };
  })();
  // The zoom ladder, in metres of span: each mode's steps, closest first, and
  // the one it opens at. Both modes are a player-centred square window of
  // that span. The two share 300 m, so switching mode there changes the
  // content without changing the box. Close's widest step is where its
  // 10-unit building labels still read at ~10 CSS px on the ~420px map.
  // Retunable, with no prior convention behind the figures.
  const MAP_ZOOM_RANGE = {
    close: { steps: [100, 200, 300], base: 200 },
    wide:  { steps: [300, 600, 1200, 2400], base: 1200 }
  };
  const MAP_PLAYER_R_WIDE = 12;
  // Past this span, in user units (600 m, the widest Wide view the invented
  // town had), Wide scales its street names, its line widths and the player
  // marker up with the span (mapScale()), so they keep the size on screen
  // they have there; at or below it they are drawn as they always were. A
  // judgment call, retunable.
  const MAP_SCALE_FROM_SPAN = 600 * MAP_UNITS_PER_M;

  // Street runs — each path a street takes, as a chain of stop ids, `name`
  // null for a street with none, `rail` for the track. Derived from the
  // street links at startup (limaMapStreets()).
  const MAP_STREETS = limaMapStreets();
  // Every street stop id, derived from MAP_STREETS above (every such id
  // appears in some chain) rather than hand-duplicated — used by
  // renderMapClose() to draw the node dots.
  const MAP_STREET_NODE_IDS = Array.from(new Set(MAP_STREETS.flatMap(s => s.chain)));
  // Building markers (Close view only) — the label's offset from its
  // building's anchor, in metres, keyed by BUILDINGS id. Membership is
  // the point as much as the numbers: a BUILDINGS entry with no offsets
  // here is a building the map does not name, and renderMapClose() never
  // reaches it. Where two sit close enough that only one can carry a label,
  // this is where that is said, and the offset, not a second coordinate,
  // is what keeps two markers on one anchor legible as two.
  // Most sit just south of their stop; the pairs that share a stop (the
  // home and its neighbour, the bank and the school, the station and its
  // goods shed) are pulled apart. Judgment calls, retunable.
  const MAP_BUILDING_OFFSETS = {
    home:          { dx:-18, dy:-22 },
    row_neighbour: { dx: 18, dy: 22 },
    pharmacy:      { dx: 0,  dy:-22 },
    comisaria:     { dx: 0,  dy:-22 },
    corralon:      { dx: 0,  dy:-22 },
    almacen:       { dx: 0,  dy:-22 },
    mechanic:      { dx: 0,  dy:-22 },
    goods_shed:    { dx: 0,  dy:-22 },
    paper_mill:    { dx: 0,  dy:-22 },
    hospital:      { dx: 0,  dy:-22 },
    banco_nacion:  { dx:-22, dy:-22 },
    school_ep9:    { dx: 22, dy: 22 },
    correo:        { dx: 0,  dy:-22 },
    parroquia:     { dx: 0,  dy:-22 },
    delegacion:    { dx: 0,  dy:-22 },
    bomberos:      { dx: 0,  dy:-22 },
    club:          { dx: 0,  dy:-22 },
    petrol:        { dx: 0,  dy:-22 },
    estacion:      { dx: 0,  dy: 22 }
  };

  let mapZoomMode = "close";
  let mapZoomSpan = MAP_ZOOM_RANGE.close.base; // metres across; like mapZoomMode, deliberately outside `state`
  let mapRenderedZoom = null;   // zoom mode the current SVG content was built for
  let mapLastNode = null;       // last resolved player map node
  let mapCurrentViewBox = null; // {x,y,w,h} of the viewBox, animated toward its target
  let mapStreetLabels = [];     // Wide's label pool: one entry per straight run of a named street
  let mapBuildingLabels = [];   // Close's label pool: one entry per marked building

  // The one way this file measures rendered text. Both label pools bind by
  // measuring rather than by consulting a table, so both read through here
  // and both degrade the same way: a node with no layout, or a browser that
  // refuses the call, reads as zero and the caller decides what zero means.
  // A measurement failure must never throw out of a bind — a bind that
  // throws leaves the map half-placed, which is worse than a map placed on
  // stale numbers. With `from` given it measures that substring instead of
  // the whole string, which is how a name is split without text thrash.
  function mapTextWidth(el, from, count){
    try {
      return from === undefined ? el.getComputedTextLength() : el.getSubStringLength(from, count);
    } catch(e){ return 0; }
  }

  // A point in LOCATIONS metres (the grid frame: +x along the grid's east,
  // +y along its "up", GRID_BEARING_DEG east of true north) to SVG user units.
  function mapToSvg(x, y){
    return { x: MAP_MARGIN + (x - MAP_EXTENT.minX) * MAP_UNITS_PER_M, y: MAP_MARGIN + (MAP_EXTENT.maxY - y) * MAP_UNITS_PER_M };
  }
  function mapNodeSvg(id){ const l = LOCATIONS[id]; return mapToSvg(l.x, l.y); }
  function mapPathD(chain){
    return chain.map((id,i)=>{
      const p = mapNodeSvg(id);
      return (i===0 ? "M " : "L ") + p.x + " " + p.y;
    }).join(" ");
  }
  function mapPolylineD(points){
    return points.map(([x, y], i)=>{
      const p = mapToSvg(x, y);
      return (i===0 ? "M " : "L ") + p.x + " " + p.y;
    }).join(" ");
  }
  // How much Wide draws its names, lines and player marker up at a span, in
  // user units: 1 up to MAP_SCALE_FROM_SPAN, then in proportion.
  function mapScale(span){ return mapZoomMode === "wide" ? Math.max(1, span / MAP_SCALE_FROM_SPAN) : 1; }
  // Street names (Wide view). They are placed against the portion of each
  // run currently on screen rather than once per block: the view moves,
  // so a build-time position would stop meaning anything.
  // A street's path is cut into straight runs (MAP_STREET_RUNS), and each run
  // owns a fixed pool of MAP_LABELS_PER_STREET <text> nodes, created once by
  // renderMapWide() and thereafter only moved, shown or hidden — never
  // created or destroyed during a pan.
  // MAP_LABEL_OFFSET nudges a name off its own street line; the label is
  // rotated onto its run's heading, folded into (-90, 90] so no name reads
  // upside down, and sits on the side that fold puts above it: above a
  // horizontal street, right of a vertical one.
  const MAP_LABEL_OFFSET = 5;
  const MAP_LABELS_PER_STREET = 3;
  // Consecutive segments of a path belong to one straight run while their
  // heading turns by less than this. Retunable.
  const MAP_RUN_TURN_DEG = 10;
  // The rendered size of a street name at the 15px .map-street-name face, in
  // user units: a name's width, and the cap height. Every name is upper case
  // with no descender, so the cap height is the whole ink band. The inset,
  // the label tiers and the crossing clearance all derive from them, so
  // retuning the face or the names retunes the three together.
  //
  // Each street's width is measured at bind time off its own pooled node
  // rather than written down here: `system-ui` is not one font, so a literal
  // is only correct on the machine it was measured on — it resolves to Segoe
  // UI, SF Pro, Roboto or Cantarell depending on where the page is opened,
  // and those differ by more than the placement arithmetic tolerates. The
  // constant below is a last known good Chromium measurement of a long
  // name, kept only as what a street falls back to if its own measurement
  // fails. It is not any street's live width; street.metrics.w is.
  const MAP_LABEL_W_FALLBACK = 99.1;
  // The cap height is deliberately *not* measured. getComputedTextLength()
  // gives width only, and getBBox().height reports the em box — 17.83 at this
  // face, against a cap band nearer 11 — so there is no cheap correct reading
  // to take. This stays a chosen number until there is one.
  const MAP_LABEL_CAP = 12;
  // How far a name's ink reaches off its own street line: MAP_LABEL_OFFSET
  // to its near edge, a cap height more to its far one. A run is named
  // only where this much of the view lies on the name's side of its line
  // (mapPositionStreetLabels()), and it is the band a crossing's name
  // occupies (clearance, below).
  const MAP_LABEL_DEPTH = MAP_LABEL_OFFSET + MAP_LABEL_CAP;
  // Breathing room between a name and the end of the stretch it is inset
  // from. Retunable.
  const MAP_LABEL_EDGE_GAP = 5;
  // One width and the three values derived from it, as a plain object per
  // street, at scale `k` (mapScale()). Every street is measured at bind time
  // and keeps its own width: a single map-wide width reserves the longest
  // name's room for the shortest too, and costs the shorter streets names
  // they had room for. Returns null on a measurement that cannot be trusted
  // — a detached node, a pool that never got layout, a browser that throws —
  // so the caller falls back rather than taking a zero. Zero collapses every
  // tier to `hi - lo >= 0`, which is always true, so the street would
  // silently jump to three names.
  function mapLabelMetrics(w, k = 1){
    if(!Number.isFinite(w) || w <= 0) return null;
    w = w * k;
    return {
      w, k,
      offset: MAP_LABEL_OFFSET * k,
      cap: MAP_LABEL_CAP * k,
      depth: MAP_LABEL_DEPTH * k,
      inset: w / 2 + MAP_LABEL_EDGE_GAP * k,
      // How many names one run gets, by the length of it currently visible,
      // in multiples of its own name's width — longest tier first. Under a
      // single width the run gets none, since a name wider than its visible
      // stretch would read as floating loose. This is a crowding rule, not a
      // legibility one. The multipliers are retunable.
      tiers: [
        { minVisible: 6 * w, count: 3 },
        { minVisible: 3 * w, count: 2 },
        { minVisible: 1 * w, count: 1 }
      ],
      // How close to a crossing a name may sit before it can touch that
      // crossing's own name: a name reaches its own w/2 along its street, and
      // the crossing's name occupies a band out to MAP_LABEL_DEPTH off the
      // crossing line.
      clearance: w / 2 + MAP_LABEL_DEPTH * k
    };
  }
  // Positions along a run's visible stretch [lo, hi], measured along the run
  // from its start, against that street's metrics `m`. Two or three labels
  // sit m.inset in from each end; one sits at the midpoint. Whatever the
  // tier, a position that would land on a crossing is slid clear of it
  // before it is returned.
  function mapLabelPositions(lo, hi, m, run){
    const tier = m.tiers.find(t => hi - lo >= t.minVisible);
    if(!tier) return [];
    if(tier.count === 1) return mapClearCrossings([(lo + hi) / 2], lo, hi, m, run);
    if(tier.count === 2) return mapClearCrossings([lo + m.inset, hi - m.inset], lo, hi, m, run);
    return mapClearCrossings([lo + m.inset, (lo + hi) / 2, hi - m.inset], lo, hi, m, run);
  }
  // A position within m.clearance of a crossing (another street meeting this
  // run, run.crossings) slides to the middle of the block beside it, toward
  // the centre of the visible stretch: sliding outward risks leaving the
  // stretch. A name with no block middle left inside the stretch is dropped
  // rather than slid again — a second slide can cascade, and a street that
  // loses one of its two or three names still reads. Two names converging on
  // one block is the same case: the one nearer the centre of the stretch
  // keeps it.
  function mapClearCrossings(positions, lo, hi, m, run){
    const mid = (lo + hi) / 2;
    const room = m.w / 2;  // a slid name still has to fit inside the stretch
    const xs = run.crossings;
    const cleared = [];
    positions.forEach(p=>{
      if(!xs.length){ cleared.push(p); return; }
      let ci = 0;
      xs.forEach((c, i)=>{ if(Math.abs(c - p) < Math.abs(xs[ci] - p)) ci = i; });
      const cross = xs[ci];
      if(Math.abs(p - cross) >= m.clearance){ cleared.push(p); return; }
      const inward = p <= mid ? 1 : -1;
      const beside = (dir)=>{
        const next = dir > 0 ? (ci + 1 < xs.length ? xs[ci + 1] : run.len) : (ci > 0 ? xs[ci - 1] : 0);
        return (cross + next) / 2;
      };
      const slid = [beside(inward), beside(-inward)].find(q => q >= lo + room && q <= hi - room);
      if(slid !== undefined) cleared.push(slid);
    });
    const kept = [];
    cleared.slice().sort((q, r) => Math.abs(q - mid) - Math.abs(r - mid)).forEach(p=>{
      if(kept.every(q => Math.abs(p - q) >= m.w)) kept.push(p);
    });
    return kept.sort((q, r) => q - r);
  }
  // Every named street's paths cut into straight runs, fixed geometry built
  // once: { name, a, len, angle, u, n, crossings }. `a` is the run's start in
  // user units, `len` its length, `angle` its heading folded into (-90, 90],
  // `u` the unit vector along it in that folded direction and `n` the one
  // its names sit toward, and `crossings` the distances along it, sorted,
  // of every stop on it where another named street meets it. A run's start
  // is its folded start, so distances grow along `u`.
  const MAP_STREET_RUNS = (function(){
    const namesAt = {};
    MAP_STREETS.forEach(s=>{ if(s.name) s.chain.forEach(id=>{ (namesAt[id] = namesAt[id] || new Set()).add(s.name); }); });
    const runs = [];
    MAP_STREETS.forEach(s=>{
      if(!s.name || s.chain.length < 2) return;
      const pts = s.chain.map(id=> ({ id, p: mapNodeSvg(id) }));
      const heading = (i)=> Math.atan2(pts[i + 1].p.y - pts[i].p.y, pts[i + 1].p.x - pts[i].p.x) * 180 / Math.PI;
      let start = 0;
      for(let i = 1; i <= pts.length - 1; i++){
        let turn = i < pts.length - 1 ? Math.abs(heading(i) - heading(i - 1)) % 360 : 360;
        if(turn > 180) turn = 360 - turn;
        if(i < pts.length - 1 && turn < MAP_RUN_TURN_DEG) continue;
        let seg = pts.slice(start, i + 1);
        start = i;
        let a = seg[0].p, b = seg[seg.length - 1].p;
        let angle = Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI;
        if(angle > 90 || angle <= -90){ seg = seg.slice().reverse(); [a, b] = [b, a]; angle += angle > 90 ? -180 : 180; }
        const len = Math.hypot(b.x - a.x, b.y - a.y);
        if(!(len > 0)) continue;
        const r = angle * Math.PI / 180;
        const u = { x: Math.cos(r), y: Math.sin(r) };
        const n = { x: Math.sin(r), y: -Math.cos(r) };
        const crossings = seg.filter(q=> namesAt[q.id] && namesAt[q.id].size > 1)
          .map(q=> (q.p.x - a.x) * u.x + (q.p.y - a.y) * u.y).sort((x, y)=> x - y);
        runs.push({ name: s.name, a, len, angle, u, n, crossings });
      }
    });
    return runs;
  })();
  // Caches the Wide label pool as element references plus each run's
  // fixed geometry, so a pan touches no DOM queries — mirrors how
  // mapPositionPlayer() resolves #mapPlayer. Cleared for Close, which emits
  // no street names at all.
  //
  // This is also where each street's name is measured, for the same
  // reason the widths in mapBindBuildingLabels() are: bind is the one moment
  // the names are in the DOM and are about to be placed. One reading per
  // name, shared by every run of that street.
  function mapBindStreetLabels(){
    mapStreetLabels = [];
    if(mapZoomMode !== "wide") return;
    const svg = document.getElementById("mapSvg");
    const widths = {};
    MAP_STREET_RUNS.forEach((run, i)=>{
      const els = Array.prototype.slice.call(svg.querySelectorAll(`text.map-street-name[data-run="${i}"]`));
      els.forEach(el=> el.textContent = run.name);
      // The pool ships hidden and a hidden node has no layout, so it would
      // measure zero. Show the one node being read and leave it shown: the
      // snap that follows this bind sets `display` on every pooled node
      // anyway, and shipping the whole pool visible instead would paint
      // every name at the origin first — the flash Close's build-order
      // comment exists to avoid.
      if(!(run.name in widths) && els.length){
        els[0].style.display = "";
        widths[run.name] = mapTextWidth(els[0]);
      }
      mapStreetLabels.push({ run, els, w: widths[run.name] });
    });
  }
  // A street's metrics at the scale `k`: its own measured width, or the
  // fallback when the measurement failed.
  function mapStreetMetrics(street, k){
    return mapLabelMetrics(street.w, k) || mapLabelMetrics(MAP_LABEL_W_FALLBACK, k);
  }
  // Where a name at distance `t` along its run sits: its anchor on the line,
  // and the centre of the box it occupies — its width along the run and a
  // cap height across, MAP_LABEL_OFFSET off the line on the run's `n` side,
  // which is where the rotation in mapPositionStreetLabels() puts it.
  function mapLabelAnchor(run, t){ return { x: run.a.x + run.u.x * t, y: run.a.y + run.u.y * t }; }
  function mapLabelCentre(run, t, m){
    const p = mapLabelAnchor(run, t), band = m.offset + m.cap / 2;
    return { x: p.x + run.n.x * band, y: p.y + run.n.y * band };
  }
  // The player marker is drawn over the same streets and nothing else in the
  // placement knows it is there, so a name that would sit under it is dropped
  // — suppressed rather than slid, since a slide can cascade. Where it was
  // the street's only name, #locBar already says where the player is. The
  // test is in the box's own frame, so it reads the same at any heading.
  function mapLabelHitsPlayer(run, t, m, player){
    const c = mapLabelCentre(run, t, m);
    const reach = MAP_PLAYER_R_WIDE * m.k + m.clearance;
    const vx = player.x - c.x, vy = player.y - c.y;
    const dx = Math.max(Math.abs(vx * run.u.x + vy * run.u.y) - m.w / 2, 0);
    const dy = Math.max(Math.abs(vx * run.n.x + vy * run.n.y) - m.cap / 2, 0);
    return dx * dx + dy * dy < reach * reach;
  }
  // The distances along `run` at which its line lies inside `box`, shrunk
  // by `depth` on every side its names reach toward (run.n): [lo, hi], or
  // null when none of it does. A name drawn anywhere in that stretch stays
  // inside the view (#37). Liang–Barsky, against the run as a segment.
  function mapRunVisible(run, box, depth){
    const x0 = box.x + (run.n.x < 0 ? -run.n.x * depth : 0), x1 = box.x + box.w - (run.n.x > 0 ? run.n.x * depth : 0);
    const y0 = box.y + (run.n.y < 0 ? -run.n.y * depth : 0), y1 = box.y + box.h - (run.n.y > 0 ? run.n.y * depth : 0);
    let lo = 0, hi = run.len;
    const clip = (p, q)=>{
      if(Math.abs(p) < 1e-12) return q >= 0;
      const r = q / p;
      if(p < 0){ if(r > hi) return false; if(r > lo) lo = r; }
      else { if(r < lo) return false; if(r < hi) hi = r; }
      return true;
    };
    const ok = clip(-run.u.x, run.a.x - x0) && clip(run.u.x, x1 - run.a.x)
      && clip(-run.u.y, run.a.y - y0) && clip(run.u.y, y1 - run.a.y);
    return ok && hi > lo ? [lo, hi] : null;
  }
  // Moves every pooled label to match the viewBox `box`. Called wherever the
  // viewBox is set — the snap branch and every animation frame — since the
  // placement is relative to the window, not to the street. `node` is the map
  // node the player is on, passed in rather than read from mapLastNode, which
  // renderMap() has not updated yet when the snap branch runs.
  // Names of different streets can meet where runs cross at a slant, which
  // the crossing clearance (a street's own crossings) doesn't see. So the
  // names are placed longest run first, and one whose box would overlap a
  // name already placed is dropped, as a name under the player is.

  // A pop-up hangs from its anchor: the item pop-up from its item's row,
  // the device pop-up from the strip under the Here tabs. It opens directly
  // below the anchor and flips above when below would run off the bottom of

  // side of the viewport. If neither side has room for all of it, it takes
  // the roomier side and scrolls inside. `r` is the anchor's client rect,
  // read fresh by the caller: each pop-up re-runs this on every render,
  // scroll and resize, so it stays attached. POP_MARGIN is how close it may
  // come to a viewport edge, and is retunable.
  const POP_MARGIN = 8;
  function placePop(pop, r){
    const vw = document.documentElement.clientWidth, vh = document.documentElement.clientHeight;

    pop.style.width = width + "px";
    pop.style.left = Math.min(Math.max(r.left, POP_MARGIN), vw - POP_MARGIN - width) + "px";
    pop.style.maxHeight = "";
    const h = pop.offsetHeight;
    const below = vh - POP_MARGIN - r.bottom, above = r.top - POP_MARGIN;
    let top;
    if(h <= below) top = r.bottom;
    else if(h <= above) top = r.top - h;
    else if(below >= above){ top = r.bottom; pop.style.maxHeight = below + "px"; }
    else { top = POP_MARGIN; pop.style.maxHeight = above + "px"; }
    pop.style.top = top + "px";
  }

  // The Crafting panel. Unavailable recipes stay visible and disabled, with

  // undiscoverable, so that is a toggle the player turns on, never the
  // default. The rule that an unperformable action is hidden (see
  // getItemActions()) governs actions on a specific item, not this. Drawn by

  // current the moment it opens and after every craft.

  // and the group buttons (CRAFT_GROUPS) and the toggle narrow it further.

  // What a recipe asks for, in words: each input with its cook state when it
  // names one, the tool as the thing it is ("a blade"), and heat. Functional
  // UI text; retunable.
  function recipeNeeds(r){
    const parts = r.inputs.map(inp=> ITEM_REGISTRY[inp.id].name

  // already holds toward it, what is missing, and whether it is ready to
  // cook, with Add ingredients where something within reach can fill the
  // gap. The panel never chooses the dish: the contents do, when heated.
  // All of it is functional UI text, held to clarity; retunable.
  const VESSEL_KIND_WORDS = { pot:"pot", saucepan:"saucepan", frying_pan:"frying pan", roasting_pan:"roasting pan" };
  const ROLE_WORDS = { meat:{ one:"meat", many:"meat" }, vegetable:{ one:"vegetable", many:"vegetables" },
    grain:{ one:"grain", many:"grains" } };

  function ingredientWords(set, n){
    if(set.ids) return set.ids.map(id=> ITEM_REGISTRY[id].ingredient.label.toLowerCase()).join(" or ");
    if(set.roles.length === Object.keys(ROLE_WORDS).length) return n === 1 ? "ingredient" : "ingredients";
    return set.roles.map((r, i)=> i === set.roles.length - 1 && n !== 1 ? ROLE_WORDS[r].many : ROLE_WORDS[r].one).join(" or ");
  }
  // "A pot or saucepan with water, and two or more meat or vegetables".
  function dishNeedsText(t){
    const set = t.counts || t.allowed;
    const vessel = "A " + t.vessels.map(k=> VESSEL_KIND_WORDS[k]).join(" or ") + (t.water ? " with water" : "");
    const what = set.ids ? ingredientWords(set, t.min)

      : numberWord(t.min) + " or more " + ingredientWords(set, 2);

  }
  // "holds 1 of 2 · needs one more meat or vegetable, and water", or

  function dishProgressText(t, st, water){
    if(st.blocked) return "holds something that doesn't belong in it";
    if(st.ready) return "ready to cook";
    if(st.need === 0 && st.waterBoils) return "ready once the water boils";
    const needs = [];
    if(st.need > 0) needs.push((t.counts || t.allowed).ids
      ? ingredientWords(t.counts || t.allowed, st.need)
      : numberWord(st.need) + " more " + ingredientWords(t.counts || t.allowed, st.need));
    if(t.water && !water) needs.push("water");
    if(!t.water && water) needs.push("the water poured out");

  // The vessel Create dish opened the panel on, still there and still

  function craftVessel(){

    return found && vesselDefOf(found.item) && !dishIn(found.item) ? found.item : null;
  }
  function dishShown(t, ok){
    if(craftFilter.group !== "all" && craftFilter.group !== "dishes") return false;
    if(craftFilter.canMakeOnly && !ok) return false;

  // Add ingredients from the panel, showing what it wrote in the result area

  function renderCraftingPanel(){

  // What an action wrote to #log. The actions a panel runs (doCraft(), Add
  // ingredients) don't report what they wrote, so this reads #log on
  // either side of one. What it wrote is every <p> that wasn't there before,
  // plus the last one if its text changed: log() updates the last entry in
  // place rather than appending when its key repeats, as a second identical
  // craft does with its ×2. The Crafting panel captures its result area
  // through here.
  function logWrittenBy(action){
    const logDiv = document.getElementById("log");
    const before = new Set(logDiv.children);
    const last = logDiv.lastElementChild;
    const lastText = last ? last.textContent : null;
    action();
    return Array.from(logDiv.children).filter(p => !before.has(p) || (p === last && p.textContent !== lastText));
  }

  // updated form, and one #log has since dropped isn't shown. Replaced by the
  // panel's next action; cleared when the panel closes.
  function renderLogResult(box, entries){

  function renderCraftResult(){ renderLogResult(document.getElementById("craftResult"), craftResult); }
  // Whether a room container has a device pop-up, and so the Here strip

  // wiring ties to a load with a switch of its own (switchableLoad(): a
  // fridge or freezer). The strip and resolveDeviceTarget() both ask this,
  // so the two can't disagree.
  function hasDevicePop(roomId, container){
    return hasTag(container, "device") || !!switchableLoad(roomId, container);
  }
  // What deviceTarget points at now, looked up again by identity: a
  // container by its id, among the current room's containers, which must
  // still have a device pop-up (hasDevicePop()); or a panel or board by its
  // node id, among the devices hanging in the current room
  // (POWER_NET.devices). Either way the
  // Here panel's selected tab must still be its, since the pop-up hangs from
  // that tab's strip. null when the target no longer resolves, which closes
  // the pop-up: leaving the room, switching the Here tab, a load or a
  // restart.
  function resolveDeviceTarget(){
    if(!deviceTarget) return null;

    if(deviceTarget.kind === "container"){
      if(worldTab !== deviceTarget.id) return null;
      const container = room.containers.find(c=> c.id === deviceTarget.id);
      return container && hasDevicePop(state.currentRoom, container) ? { room, container } : null;
    }
    if(worldTab !== powerTab(deviceTarget.id)) return null;

  }
  // The panels and boards hanging in a room, in wiring order, as

  // from room.containers, and hold no items.
  function powerDevicesIn(roomId){ return POWER_NET.devices[roomId] || []; }

  // authored container id, the way a floor bag's is.
  function powerTab(nodeId){ return "power:" + nodeId; }
  function powerNode(device){ return device.kind === "board" ? POWER_NET.boards[device.id] : POWER_NET.panels[device.id]; }
  // A device's breakers, in the order its pop-up lists them: MAIN (or a

  // feeders, one per panel it feeds, and none on a direct board.
  function deviceBreakers(device){
    const node = powerNode(device);

  // What the Here panel calls each panel and board hanging in a room: its

  function deviceNamesFor(roomId){

      if(devices.filter(d=> powerNode(d).name === node.name).length < 2) return node.name;

  // A breaker's state as its row reads it, and whether power reaches the

  function breakerStateText(id){
    const b = breakerStateIn(state.power, id);
    if(POWER_NET.breakers[id].fuse) return b.tripped ? "Blown" : "Intact";
    return b.tripped ? "Tripped" : b.on ? "On" : "Off";
  }

  }
  // What the Here strip reads while a device's tab is selected: under

  function deviceStripText(device){

  function meterButtons(target, make){

  function loadStatusText(loadId){

  // The stove's pop-up, below its name: the room's heatActive as On/Off and

  // A panel's or board's pop-up, drawn into the device pop-up. Watts never

  // What picks a room's text when its `desc` is state variants (ROOM SCHEMA),
  // keyed by `reads.kind`: each entry's `states` are the variant keys it
  // returns, and `read(reads)` which one holds now. Render-safe: each reads a
  // predicate and writes nothing. A cycling fridge between runs is powered,
  // not drawing, so the kitchen still hums then (a simplification,
  // retunable).
  const DESC_READERS = {
    load:     { states:["on", "off"], read:(r)=> loadPoweredNow(r.id) ? "on" : "off" },
    grid:     { states:["on", "off"], read:()=> gridUp() ? "on" : "off" }
  };
  // A room's description as it reads now.
  function roomDescText(room){
    const d = room.desc;
    if(!d || typeof d !== "object") return d;
    const reader = DESC_READERS[d.reads && d.reads.kind];
    return reader ? d.variants[reader.read(d.reads)] : "";
  }
  function renderLocationPanel(){
    const room = world[state.currentRoom];
    document.getElementById("locLabel").textContent = roomLabel(room);

      heatNote = room.fireMinutesLeft != null
        ? ` A fire is burning here — roughly ${fmtDuration(room.fireMinutesLeft).replace(/[()]/g,"")} of fuel left.`
        : " A fire is burning here.";
    }
    document.getElementById("roomDesc").textContent = roomDescText(room) + heatNote;
    document.getElementById("clockLabel").textContent = hasWatch() ? getClockText() : getVagueClockText();
  }
  function renderStatsPanel(){
    document.getElementById("statsBox").innerHTML =
      "Hunger: " + Math.round(state.vitals.hunger) + "<br>" +
      "Thirst: " + Math.round(state.vitals.thirst) + "<br>" +
      "Energy: " + Math.round(state.vitals.energy) + "<br>" +
      "Stamina: " + Math.round(state.vitals.stamina) + "<br>" +
      "Health: " + Math.round(state.vitals.health);
    // The Fatigue gait lock restricts movement to Sneaking — Fatigue itself
    // stays hidden from normal UI; there's no debug panel in this build to
    // expose it through. Both lines below read a predicate and write nothing:
    // the rule lives in STAMINA / FATIGUE, and this only shows its answer.
    const locked = gaitLocked();
    document.querySelectorAll("#gaitBar button[data-gait]").forEach(btn=>{
      btn.classList.toggle("active", effectiveGait() === btn.dataset.gait);

  // Compass order for the Move panel. An unknown direction ranks
  // after south rather than resolving to `undefined` — no street node can
  // currently produce up/down (every one of them is z:0), but the sort must
  // not depend on that staying true.
  const MOVE_DIRECTION_RANK = { north:0, east:1, west:2, south:3 };
  function moveDirectionRank(fromId, toId){
    const rank = MOVE_DIRECTION_RANK[computeDirection(world[fromId].locationId, world[toId].locationId)];
    return rank == null ? 4 : rank;
  }
  function renderMoveActionsPanel(){
    const room = world[state.currentRoom];
    const moveGroup = document.getElementById("moveGroup");
    const moveBox = document.getElementById("moveActions");
    moveBox.innerHTML = "";
    // Sorting by direction rank alone is enough: Array.prototype.sort is
    // stable, so two exits pointing the same way keep their authoring order
    // without a secondary key.
    getExitsForRoom(room, state.currentRoom)
      .filter(exit => isGridTravel(state.currentRoom, exit.to))
      .sort((a,b) => moveDirectionRank(state.currentRoom, a.to) - moveDirectionRank(state.currentRoom, b.to))
      .forEach(exit=>{
        const minutes = exitMinutes(exit);
        moveBox.appendChild(actionButton(exit.label, ()=> doMove(exit), { cost: fmtDuration(minutes) }));
      });

    // sit above an empty row — mirrors hereGroup's own hiding rule.
    moveGroup.style.display = moveBox.children.length ? "" : "none";

  // What the Here panel calls each door a room touches: "<label> door", and
  // where two of them would read the same (two row houses' front doors on
  // one courtyard), each followed by its building's name. Functional UI
  // text, retunable.
  function doorNamesFor(roomId){
    const ids = doorsTouchingRoom(roomId);
    const plain = id=> doorLabel(id, roomId) + " door";
    return (doorId)=>{
      const name = plain(doorId);
      if(ids.filter(id=> plain(id) === name).length < 2) return name;
      const b = world[doors[doorId].sides.find(r=> r !== roomId)];
      return b && b.building ? `${name} (${b.building})` : name;
    };
  }
  function renderHereActionsPanel(){
    const room = world[state.currentRoom];
    const hereGroup = document.getElementById("hereGroup");
    const hereBox = document.getElementById("hereActions");
    hereBox.innerHTML = "";
    // Everything that isn't street travel — stairs, building doors, window
    // climbs — renders here, first and in authoring order.
    getExitsForRoom(room, state.currentRoom)
      .filter(exit => !isGridTravel(state.currentRoom, exit.to))
      .forEach(exit=>{
        hereBox.appendChild(actionButton(exit.label, ()=> doMove(exit), { cost: fmtDuration(exitMinutes(exit)) }));
      });
    // A locked door: from inside a latch or a bolt, its hand action; from
    // outside a bolt, the note that says why; otherwise Unlock with a key,
    // or the locked note, and Force while a `prying` tool is carried
    // (canForceDoor()). Functional UI text, retunable.
    const doorName = doorNamesFor(state.currentRoom);
    gatedExitsForRoom(state.currentRoom).forEach(({doorId})=>{
      const d = doors[doorId];
      if(!d.locked) return;
      const label = doorName(doorId);
      if(locksByHandHere(d)){
        hereBox.appendChild(actionButton(doorLockKind(d) === "bolt" ? `Draw the bolt on the ${label}` : `Unlock the ${label}`, ()=> doToggleLock(doorId)));

      } else if(findKeyForDoor(doorId)){

      } else {
        hereBox.appendChild(hereNote(`The ${label} is locked.`));
      }
      if(canForceDoor(d)) hereBox.appendChild(actionButton(`Force the ${label}`, ()=> doForceDoor(doorId), { cls:"locked", cost:fmtDuration(FORCE_DOOR_MIN) }));
    });
    // Open / Close on every door the room touches, as its key actions are
    // offered. A locked door offers neither: it has to be unlocked first.
    // From inside, an unlocked latch or bolt offers its hand lock; a forced
    // one says so instead.
    doorsTouchingRoom(state.currentRoom).forEach(doorId=>{
      const d = doors[doorId];
      if(d.locked) return;
      const label = doorName(doorId);
      hereBox.appendChild(d.open
        ? actionButton(`Close the ${label}`, ()=> doCloseDoor(doorId))
        : actionButton(`Open the ${label}`, ()=> doOpenDoor(doorId)));

      else if(locksByHandHere(d)) hereBox.appendChild(actionButton(doorLockKind(d) === "bolt" ? `Bolt the ${label}` : `Lock the ${label}`, ()=> doToggleLock(doorId)));

    getWindowsInRoom(state.currentRoom).forEach(w=>{

      } else if(w.state === "open"){

      }

    // Forcing a vehicle asks for leverage, not one specific tool: any `blunt`
    // item qualifies, and the log line is worded to match. Deliberately not
    // gated on `prying`, which is carried by the crowbar alone and would make
    // early vehicle access depend on a single item.
    // A parked car's stop text doesn't mention it (a stop reads its type's
    // text), so a locked one says it is there. Functional UI text, retunable.
    if(room.carContainers && room.carLocked){
      hereBox.appendChild(hereNote("A car is parked here. It's locked."));
      if(hasTool("blunt")) hereBox.appendChild(actionButton("Force the vehicle open", doBreakCar, "locked"));
    }
    if(room.fishable && hasTool("fishing") && hasTool("tackle")){
      hereBox.appendChild(actionButton("Go fishing " + fmtDuration(FISH_DURATION_MIN), doFish));
    }
    // The note says the one thing that is missing, so a spent last
    // fire-starter reads as a cause rather than as the action quietly
    // disappearing. It is gated on canBuildFire() on purpose: a player with
    // no kit and no firewood is not being denied a fire by the missing match,
    // and saying so would be wrong. Functional UI text, held to clarity rather
    // than to the game's descriptive tone; retunable.
    // The stove is not here: lighting it and turning it off are its device
    // pop-up's (renderDevicePop()). Every room roomStove() finds a stove in
    // also carries cannotHaveFire today, so a stove and a campfire never share

    const stove = roomStove(room);
    if(!room.cannotHaveFire && !room.heatActive && hasMatchUses() && canBuildFire(room)){
      const label = !room.campfireBuilt ? "Set up the campfire kit"
        : (room.fireMinutesLeft > 0 ? "Relight the fire" : "Build a campfire");
      hereBox.appendChild(actionButton(label + " " + fmtDuration(BUILD_FIRE_MIN), doBuildFire));
    } else if(!room.cannotHaveFire && !room.heatActive && canBuildFire(room)){

    }

      if(room.fireMinutesLeft != null && countInPools("firewood") >= 1

        }

  // A tab strip scrolls sideways (see .tabs), and a rebuild keeps its old
  // scroll offset, clamped to the new row: move from a room whose Here strip
  // was scrolled to its last tab, and the next room's Floor can start off the
  // strip's left edge. So after each rebuild the selected tab is scrolled
  // fully into view, by the least distance that does it: a tab already in
  // view leaves the strip where it is. Only the strip scrolls, never the
  // page, which is why this is not scrollIntoView().
  function revealActiveTab(strip){
    const tab = strip.querySelector(".active");
    if(!tab) return;
    const s = strip.getBoundingClientRect(), t = tab.getBoundingClientRect();
    const left = t.left - s.left + strip.scrollLeft, right = t.right - s.left + strip.scrollLeft;
    strip.scrollLeft = Math.min(Math.max(strip.scrollLeft, Math.ceil(right) - strip.clientWidth), Math.floor(left));
  }
  function renderInventoryPanel(){

    // (keychain, then ITEM_REGISTRY order), so a new equippable bag shows up
    // here with no RENDERING edit at all.
    const invTabDefs = [["inventory","Inventory"]];
    CONTAINER_SLOTS.forEach(slot=>{
      if(state[slot]) invTabDefs.push([slot, SLOT_LABELS[slot]]);
    });
    if(invTab !== "inventory" && !state[invTab]) invTab = "inventory";
    // Rebuilt keeping focus, so Enter on a tab leaves focus on that tab.
    rebuildKeepingFocus(invTabsEl, ()=>{
      invTabsEl.innerHTML = "";
      invTabDefs.forEach(([key,label])=>{
        const btn = document.createElement("button");
        btn.textContent = label;
        if(invTab === key) btn.classList.add("active");
        btn.addEventListener("click", ()=>{ invTab = key; render(); });
        invTabsEl.appendChild(btn);
      });
    }, false);
    revealActiveTab(invTabsEl);
    const currentInv = invSlot(invTab);
    const invWeight = document.getElementById("invWeight");
    // The Inventory tab reads the player's whole load against the carry
    // limit, coloured by what moving costs at it: warn once over the limit,
