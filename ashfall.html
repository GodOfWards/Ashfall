<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ashfall Prototype</title>
<style>
  :root{
    --bg:#111315; --panel:#1b1e22; --panel-2:#20242a; --line:#33383f;
    --ink:#e5e5e0; --ink-dim:#9a9fa6; --ink-faint:#666b72;
    --accent:#3b82f6; --accent-dim:#25508f; --warn:#d97b3f; --danger:#b3503f; --good:#7a9463;
  }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:Georgia,'Times New Roman',serif; display:flex; flex-direction:column; }
  header{ display:flex; align-items:center; gap:14px; padding:12px 24px; border-bottom:1px solid var(--line); font-family:system-ui,sans-serif; }
  header h1{ font-size:15px; margin:0; letter-spacing:.04em; }
  #menuToggle{ background:var(--panel-2); border:1px solid var(--line); color:var(--ink); font-size:13px; padding:7px 11px; border-radius:3px; cursor:pointer; }
  #menuToggle:hover{ border-color:var(--accent-dim); }
  #menuBackdrop{ position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:15; display:none; }
  #menuBackdrop.show{ display:block; }
  #sideMenu{ position:fixed; top:0; left:0; height:100%; width:460px; max-width:92vw; background:var(--panel);
    border-right:1px solid var(--line); transform:translateX(-100%); transition:transform .22s ease;
    z-index:20; padding:20px 18px; display:flex; flex-direction:column; gap:16px; font-family:system-ui,sans-serif; overflow-y:auto; }
  #sideMenu.open{ transform:translateX(0); }
  #sideMenu h2{ font-size:14px; margin:0; display:flex; justify-content:space-between; align-items:center; }
  #closeMenu{ background:none; border:none; color:var(--ink-dim); font-size:16px; cursor:pointer; }
  .menu-section h3{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint); margin:0 0 8px; }
  .menu-actions{ display:flex; flex-direction:column; gap:6px; }
  .menu-actions button{ background:var(--panel-2); border:1px solid var(--line); color:var(--ink);
    font-size:13px; padding:8px 10px; border-radius:3px; cursor:pointer; text-align:left; }
  .menu-actions button:hover{ border-color:var(--accent-dim); }
  .menu-placeholder{ font-size:12px; color:var(--ink-faint); font-style:italic; }
  #statsBox{ font-size:13px; color:var(--ink-dim); line-height:1.9; }
  .map-heading{ display:flex; justify-content:space-between; align-items:center; }
  #mapZoomToggle{ display:flex; gap:5px; }
  #mapZoomToggle button{ font-family:system-ui,sans-serif; font-size:10.5px; background:var(--panel-2);
    border:1px solid var(--line); color:var(--ink-dim); padding:4px 9px; border-radius:3px; cursor:pointer; }
  #mapZoomToggle button.active{ border-color:var(--accent); color:var(--accent); }
  #mapZoomToggle button:disabled{ opacity:.4; cursor:not-allowed; }
  #mapSvg{ width:100%; height:auto; display:block; background:var(--panel-2); border-radius:3px; margin-top:8px; }
  .map-street{ stroke:var(--line); stroke-width:3; fill:none; }
  .map-street-thin{ stroke:var(--line); stroke-width:1.5; opacity:.6; fill:none; }
  .map-node-dot{ fill:var(--ink-faint); }
  .map-street-name{ fill:var(--ink-dim); font-size:15px; font-family:system-ui,sans-serif; letter-spacing:.5px; font-weight:600; }
  .map-bldg-dot{ fill:var(--panel-2); stroke:var(--accent-dim); stroke-width:1.5; }
  .map-bldg-label{ fill:var(--ink); font-size:10px; font-weight:600; font-family:system-ui,sans-serif; }
  .map-river{ fill:none; stroke:#2a4a5c; stroke-width:10; stroke-linecap:round; opacity:.5; }
  #mapPlayer{ fill:var(--accent); }
  #locBar{ padding:10px 24px; border-bottom:1px solid var(--line); font-family:system-ui,sans-serif;
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
  #locLabel{ font-size:14px; color:var(--accent); }
  #rightBar{ display:flex; gap:16px; align-items:center; }
  #clockLabel{ font-size:12px; color:var(--ink-dim); }
  #gaitBar{ display:flex; gap:6px; align-items:center; }
  #gaitBar span{ font-size:11px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em; }
  #gaitBar button{ font-family:system-ui,sans-serif; font-size:12px; background:var(--panel-2);
    border:1px solid var(--line); color:var(--ink-dim); padding:5px 9px; border-radius:3px; cursor:pointer; }
  #gaitBar button.active{ border-color:var(--accent); color:var(--accent); }
  #gaitBar button:disabled{ opacity:.4; cursor:not-allowed; }
  main{ flex:1; display:grid; grid-template-columns:1fr 320px; }
  #left{ padding:18px 26px; border-right:1px solid var(--line); display:flex; flex-direction:column; gap:14px; }
  #roomDesc{ color:var(--ink-dim); line-height:1.6; margin:0; font-size:15px; }
  #log{ display:flex; flex-direction:column; gap:5px; max-height:110px; overflow-y:auto; }
  #log p{ margin:0; font-size:13.5px; line-height:1.5; color:var(--ink-dim); }
  #log p.fresh{ color:var(--ink); }
  #log p.sys{ font-style:italic; color:var(--accent); font-family:system-ui,sans-serif; font-size:12px; }
  #log p.warn{ color:var(--warn); font-family:system-ui,sans-serif; font-size:12px; }
  #log p.good{ color:var(--good); font-family:system-ui,sans-serif; font-size:12px; }
  .logcount{ color:var(--ink-faint); font-size:11.5px; margin-left:5px; }
  .actions-group h2{ font-family:system-ui,sans-serif; font-size:11px; text-transform:uppercase;
    letter-spacing:.08em; color:var(--ink-faint); margin:0 0 8px; }
  .actions{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  button.action{ font-family:system-ui,sans-serif; font-size:13.5px; background:var(--panel-2);
    border:1px solid var(--line); color:var(--ink); padding:8px 13px; border-radius:3px; cursor:pointer; }
  button.action:hover{ border-color:var(--accent-dim); background:#232a33; }
  button.action .cost{ color:var(--ink-faint); font-size:12px; margin-left:4px; }
  button.action.locked{ border-color:var(--danger); color:var(--danger); }
  button.action.blocked{ border-color:var(--danger); color:var(--danger); opacity:.45; cursor:not-allowed; }
  .itemname{ cursor:pointer; text-decoration:underline dotted; text-underline-offset:2px; }
  .detailBox{ font-size:12.5px; color:var(--ink-dim); margin-bottom:10px; line-height:1.7; }
  .detailBox b{ color:var(--ink); }
  #sidebar{ padding:16px 18px; display:flex; flex-direction:column; gap:16px; font-family:system-ui,sans-serif; overflow-y:auto; }
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:11px 13px; }
  .tabs{ display:flex; gap:5px; margin-bottom:9px; flex-wrap:wrap; }
  .tabs button{ font-size:11.5px; background:var(--panel-2); border:1px solid var(--line); color:var(--ink-dim);
    padding:5px 9px; border-radius:3px; cursor:pointer; }
  .tabs button.active{ border-color:var(--accent); color:var(--accent); }
  .panel h2{ font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint);
    margin:0 0 8px; display:flex; justify-content:space-between; align-items:center; }
  .panel h2 .sub{ color:var(--ink-dim); text-transform:none; letter-spacing:0; font-size:11px; display:flex; align-items:center; gap:6px; }
  ul.itemlist{ list-style:none; margin:0; padding:0; }
  ul.itemlist li{ display:flex; justify-content:space-between; align-items:center; gap:6px;
    padding:6px 0; border-bottom:1px solid rgba(51,56,63,.6); font-size:12.5px; }
  ul.itemlist li:last-child{ border-bottom:none; }
  ul.itemlist .meta{ color:var(--ink-dim); flex:1; }
  ul.itemlist .meta b{ color:var(--ink); font-weight:600; }
  ul.itemlist .cat{ color:var(--ink-faint); font-size:10.5px; }
  ul.itemlist .empty{ color:var(--ink-faint); font-style:italic; }
  .btnrow{ display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
  button.mini{ background:#262a30; border:1px solid var(--line); color:var(--ink); font-size:11px;
    padding:4px 7px; border-radius:3px; cursor:pointer; white-space:nowrap; }
  button.mini:hover{ border-color:var(--accent-dim); }
  button.mini.equip{ border-color:var(--good); color:var(--good); }
  button.mini.step{ padding:4px 6px; }
  button.mini.blocked{ border-color:var(--danger); color:var(--danger); opacity:.45; cursor:not-allowed; }
  /* The two-column grid has a 476px floor — 320px of sidebar plus the room
     description's own minimum — so below that the page scrolls sideways.
     It stops being usable well before that: at 375px the description reads
     three words wide. One column from 760px down, then. The breakpoint is a
     judgment call and retunable: anything from 480 up removes the overflow,
     760 is where the layout starts being cramped rather than broken.
     #left's border-right would read as a stray rule down the page once it
     spans the full width, so it becomes the seam between the two stacked
     columns instead. */
  @media (max-width:760px){
    main{ grid-template-columns:1fr; }
    #left{ border-right:none; border-bottom:1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <button id="menuToggle">☰ Menu</button>
  <h1 id="pageTitle">ASHFALL</h1>
</header>
<div id="menuBackdrop"></div>
<aside id="sideMenu">
  <h2>Menu <button id="closeMenu">✕</button></h2>
  <div class="menu-section">
    <h3>Save / Load</h3>
    <div class="menu-actions">
      <button id="saveLocalBtn">Save to this browser</button>
      <button id="loadLocalBtn">Load from this browser</button>
      <button id="exportBtn">Export save file</button>
      <button id="importBtn">Import save file</button>
      <input type="file" id="importInput" accept="application/json" style="display:none;">
      <button id="restartMenuBtn">Restart game</button>
    </div>
  </div>
  <div class="menu-section"><h3>Stats</h3><div id="statsBox"></div></div>
  <div class="menu-section">
    <h3 class="map-heading">Map <div id="mapZoomToggle">
      <button data-zoom="close" class="active">Close</button>
      <button data-zoom="wide">Wide</button>
      <button id="mapZoomIn">+</button>
      <button id="mapZoomOut">&minus;</button>
    </div></h3>
    <svg id="mapSvg" viewBox="0 0 260 260" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
</aside>
<div id="locBar">
  <div id="locLabel"></div>
  <div id="rightBar">
    <span id="clockLabel"></span>
    <div id="gaitBar">
      <span>Pace</span>
      <button data-gait="sneak">Sneak</button>
      <button data-gait="walk" class="active">Walk</button>
      <button data-gait="fast">Jog</button>
    </div>
  </div>
</div>
<main>
  <div id="left">
    <p id="roomDesc"></p>
    <div id="log"></div>
    <div class="actions-group" id="moveGroup"><h2>Move</h2><div class="actions" id="moveActions"></div></div>
    <div class="actions-group" id="hereGroup" style="display:none;"><h2>Here</h2><div class="actions" id="hereActions"></div></div>
  </div>
  <div id="sidebar">
    <div class="panel">
      <h2>Inventory <span class="sub"><span id="invWeight"></span><button id="unequipBtn" class="mini" style="display:none;">Unequip</button></span></h2>
      <div class="tabs" id="invTabs"></div>
      <ul class="itemlist" id="invList"></ul>
    </div>
    <div class="panel">
      <h2>Here <span class="sub" id="worldWeight"></span></h2>
      <div class="tabs" id="worldTabs"></div>
      <ul class="itemlist" id="worldList"></ul>
    </div>
    <div class="panel">
      <h2>Craft <button id="craftBackBtn" class="mini" style="display:none;">&larr; Back</button></h2>
      <div id="craftBody"></div>
    </div>
  </div>
</main>
<script>
(function(){
  "use strict";
  // ==================================================
  // ARCHITECTURE
  // ==================================================
  // Ashfall is data-driven. Content (rooms/items) and mechanics (rules that
  // act on that content) are kept apart on purpose so future passes can
  // touch one without reading the other.
  //
  //   WORLD DATA   defines rooms, room properties, containers, items,
  //                exits, doors/windows, and environmental interactions.
  //   PLAYER STATE defines player position, inventory, equipment, vitals,
  //                time, and progression.
  //   UTILITIES    provide small reusable operations (formatting, lookup).
  //   SIMULATION   owns time-dependent consequences (decay, fire burn-down,
  //                collapse from exhaustion, game-over checks). STAMINA/FATIGUE
  //                is a sub-section living inside SURVIVAL/TIME SIMULATION, not
  //                a separate top-level section.
  //   ACTIONS      perform gameplay operations (move, take, craft, etc.)
  //                and are grouped by the system they belong to:
  //                INVENTORY/ITEM SYSTEM, WORLD INTERACTION, CRAFTING,
  //                FIRE/COOKING.
  //   PERSISTENCE  serializes/restores game state.
  //   UI/RENDERING displays current state; it should never contain rules.
  //
  // IMPORTANT RULE: content additions should normally modify WORLD DATA
  // only. Mechanics additions should touch ACTIONS/SIMULATION only when a
  // genuinely new mechanic is required. Do not duplicate mechanics inside
  // world/item definitions — prefer tags/capabilities (see ITEM DATA SCHEMA
  // below) over hard-coded name checks like `it.name === "Something"`.
  //
  // CONTENT vs MECHANICS, for future passes (including AI-driven ones):
  //   CONTENT PASS (new rooms/items/containers/exits/doors/descriptions):
  //     modify makeDefaultWorld(), item definitions, room definitions,
  //     containers, exits, doors/windows, descriptions. Do not touch
  //     movement/inventory/simulation code unless the content genuinely
  //     introduces a new mechanic.
  //   MECHANICS PASS: modify the smallest relevant function/section —
  //     survival/time -> advanceTime()/runAwakeStep()/recoveryStep(); inventory transfer ->
  //     the INVENTORY/ITEM SYSTEM section (doTake/doStore/getItemAt/etc.);
  //     tools -> hasTool()/tags; fire -> FIRE/COOKING; crafting ->
  //     CRAFTING; persistence -> PERSISTENCE. UI changes are separate from
  //     both — see RENDERING.
  //   Do not read the entire file unless the requested feature requires a
  //   mechanics change. _uid is the stable identity of an item; array
  //   indexes are temporary and must never be treated as stable identity.
  //   doRestart lives in PERSISTENCE, not SIMULATION, since it performs a
  //   full state reset rather than a time-driven update.
  //
  // WORLD DATA also carries LOCATIONS — real integer (x,y,z) coordinates
  // (meters) for every street/mid-block node and building floor, keyed by
  // `locationId` on every room. LOCATIONS is read by both MAP rendering
  // and movement: exitMinutes()/locationDistance() compute
  // cross-Location travel distance, and applyComputedDirections() (run once
  // at world-build time) derives compass words for cross-Location exit
  // labels via computeDirection(). See the LOCATIONS comment below for the
  // coordinate convention.
  //
  // Item identity: every item that can appear in a UI detail view gets a
  // stable `_uid` (see ensureUid/findItemByUid below). Array indexes are
  // NOT stable identity — a list can be mutated (splice/merge) between the
  // moment a UI element is built and the moment its handler runs. Any code
  // that resolves "the item the user clicked on" must do so by _uid, not
  // by a previously-captured index. Indexes are fine only as a short-lived
  // lookup within a single already-validated operation.
  // ==================================================

  // ==================================================
  // CONFIG / CONSTANTS
  // ==================================================
  const GAME_CONFIG = { VERSION: "0.4.12" };
  function versionCompat(v){ const p = v.split("."); return p[0] + "." + p[1]; }
  const STACKABLE = new Set(["Food","Medical","Ammunition","Materials"]);
  const SAVE_KEY = "ashfall_save_v" + versionCompat(GAME_CONFIG.VERSION);
  const MIN_MOVE_MIN = 1;
  const GAITS = { sneak:{speed:0.6}, walk:{speed:1.2}, fast:{speed:2.0} };
  // Points per game minute: hunger empties over 72 game hours, thirst and
  // energy over 24.
  const DECAY = { hunger:100/4320, thirst:100/1440, energy:100/1440 };
  const CAMPFIRE_KIT_COST = 3;
  // ==================================================
  // STAMINA / FATIGUE SYSTEM CONSTANTS
  // ==================================================
  // See the v0.2.1 entry in CHANGELOG.md for the full rules.
  // Tasks declare Exertion; this system alone decides how Exertion affects
  // Stamina/Fatigue. Do not duplicate this logic inside tasks.
  const STAMINA_RECOVERY_DELAY_MIN = 1;    // game minutes of non-exertion before recovery starts
  const BASELINE_STAMINA_RATE = 1;         // Stamina/minute, awake baseline
  const REST_STAMINA_RATE = 0.5;           // Stamina/minute during Rest
  const FATIGUE_RECOVERY_RATE = 0.5;       // Fatigue/minute
  const REST_DURATION_MIN = 60;
  const SLEEP_ENERGY_RATE = 10/60;         // Energy/minute (10/hour)
  const SLEEP_COOLDOWN_MIN = 8*60;         // must stay awake 8 game hours after waking
  // 30 is an initial balance value with no prior convention behind it —
  // retunable, and deliberately one knob per vital.
  const LOW_HUNGER_THRESHOLD = 30;
  const LOW_THIRST_THRESHOLD = 30;
  const JOG_EXERTION_PER_MIN = 0.5;
  const CHOP_TREE_EXERTION = 30;
  const FISH_EXERTION = 8;
  const RECIPES = [
    { id:"bandage", label:"Craft a bandage",
      inputs:[ {id:"cloth",qty:2}, {id:"duct_tape",qty:1} ], minutes:5,
      output:{ id:"bandage" } },
    { id:"campfire_kit", label:"Craft a campfire kit",
      inputs:[ {id:"firewood",qty:CAMPFIRE_KIT_COST} ], minutes:15,
      output:{ id:"campfire_kit" } }
  ];
  const HEAT_RECIPES = [
    { id:"cook_fish", input:"raw_fish",
      output:{ id:"cooked_fish" },
      minutes:15 }
  ];
  function clamp(v){ return Math.max(0, Math.min(100, v)); }

  // ==================================================
  // WORLD DATA
  // ==================================================
  // ROOM SCHEMA (one entry per key in the object returned by
  // makeDefaultWorld()):
  //   id            (the object key itself) room identifier
  //   address       the street or intersection the room is at, as a display
  //                 string, e.g. "Poplar St" / "Dock St & 6th St". Required on
  //                 every room, never empty. THE ADDRESS RULE: a room's address
  //                 is the street it is on, and a building fronts a street,
  //                 never a corner. A street/mid-block node's address is its own
  //                 location — including an intersection node, which genuinely
  //                 is at a corner and keeps its "<Street> St & <N>th St"
  //                 string. A room *inside* a building takes the named street
  //                 that building fronts, even when the building sits on an
  //                 intersection node: the Police Station is entered from
  //                 maple3rd but its address is "Maple St", not
  //                 "Maple St & 3rd St".
  //   building      the NAME of the building this room is inside, e.g.
  //                 "Acorn Apartments". Absent when the room is not inside a
  //                 named building (every street/mid-block node, the alley, and
  //                 the three flats above the Main St shops — a flat over a shop
  //                 is not inside the shop). It holds a building's name and
  //                 nothing else, ever: not a street, not an address. Note that
  //                 doors[].building and master_key.building are a DIFFERENT
  //                 field holding a building *id* ("acorn"), unrelated to this.
  //   area          floor/apartment/street grouping, e.g. "2A"
  //   room          room type/name, e.g. "Kitchen"
  //   shelter       "none" | "full" — whether the room is under cover.
  //                 Required on every room. "partial" is a reserved third value
  //                 (a covered porch, an open garage, a doorway); no room uses
  //                 it yet, because classifying which rooms are genuinely
  //                 partial is content for the pass that gives shelter its first
  //                 consumer. Nothing reads shelter today — it is laid down
  //                 ahead of its consumers (#58 weather, #6 rooftops) the same
  //                 way LOCATIONS' z is, so those passes need no retrofit across
  //                 every room. An unused field here is not a dead one. It is
  //                 also NOT cannotHaveFire and must never be derived from it:
  //                 the two happen to be coextensive in the current content, but
  //                 they are different facts (a fire rule vs. being under cover)
  //                 and content that breaks the correlation is already specced.
  //                 The pass that adds the first consumer also inherits shelter's
  //                 save backfill — backfillRoomAddresses() deliberately does not
  //                 restore it, since nothing reads it.
  //   desc          description shown to the player
  //   floor         array of loose item objects (see ITEM DATA SCHEMA)
  //   floorCap      maximum loose-item capacity in kg
  //   containers    array of container objects (see CONTAINER SCHEMA)
  //   carContainers optional array of vehicle container objects
  //   exits         array of movement definitions (see EXIT SCHEMA)
  //   locationId    key into LOCATIONS (see below) — real (x,y,z) position.
  //                 Street/mid-block rooms use their own room id as their
  //                 locationId; every room on one building floor shares
  //                 that floor's locationId. Required on every room.
  // Optional environmental properties:
  //   sleepSpot      e.g. "couch"/"bed" — enables the Sleep action
  //   hasStove       room has a working stove (heat source, no fire needed)
  //   cannotHaveFire room may not host a campfire
  //   fishable       room supports the Go Fishing action
  //   hasTree        room has a choppable tree
  //   searched       whether the room's hidden search has been performed
  //   searchLabel    action label shown before searching
  //   searchMinutes  time cost of searching
  //   carLocked      whether a vehicle in the room is locked
  //   heatActive     a fire/stove is currently burning here
  //   fireMinutesLeft remaining fuel minutes for an active fire
  //   campfireBuilt  a campfire structure has been assembled here
  //
  // CONTAINER SCHEMA:
  //   { id, name, capacityKg, items: [] }
  //   Optional: locked, breakTag (tag required to force it open)
  //   Optional (spawn pools — see SPAWN_POOLS below):
  //     spawnPools       string[] of SPAWN_POOLS ids this container draws
  //                      from. Absence means the container is never
  //                      touched by the spawn system (purely hand-authored).
  //     spawnRolled      whether the initial roll has happened. Set true
  //                      at authoring time on any container that already
  //                      ships with hand-placed contents, so
  //                      doOpenContainer() never overwrites them.
  //     lastRolledMinute state.totalMinutes at the last roll. Not consumed
  //                      by any mechanic yet — reserved for a future
  //                      respawn cycle (#15).
  //
  // EXIT SCHEMA (one of):
  //   Same-Location:  { to, label, distanceM } — distanceM is hand-authored.
  //   Cross-Location: { to, label } — no distanceM/block/blockHalf; travel
  //                   time is computed from the two rooms' LOCATIONS entries
  //                   by exitMinutes()/locationDistance() (see WORLD
  //                   INTERACTION). Compass words inside `label`, if any,
  //                   are substituted at build time by computeDirection()
  //                   from the same LOCATIONS data.
  //   Optional (either kind): doorId (exit is gated by a door in `doors`)
  //
  // ITEM DATA SCHEMA:
  //   Shared item properties (name, category, unitWeight, tags, etc.) are
  //   defined ONCE per item in ITEM_REGISTRY below, keyed by a stable id.
  //   Rooms/containers place instances by reference — { id, qty } — via
  //   itemsFromRegistry(), never by repeating the full item definition.
  //   `overrides` on a placement ref is for genuine per-instance state only
  //   (e.g. a specific unit's current durability), never for properties
  //   that should be shared — those belong in the registry entry itself,
  //   so an item's definition is never duplicated across placements.
  //   Basic item: { name, category, qty, unitWeight }
  //   Optional properties:
  //     tags          capability tags used by mechanics instead of name

  // itemFromRegistry/itemsFromRegistry expand a { id, qty, overrides? }
  // placement reference into a full runtime item object, deep-cloned from
  // ITEM_REGISTRY so no two placements ever share mutable state (tags
  // arrays, durability objects). `overrides` is for genuine per-instance
  // state only (e.g. a specific unit's current durability) — shared
  // properties belong in the registry, never repeated at the call site.
  function itemFromRegistry(ref){
    const def = ITEM_REGISTRY[ref.id];
    if(!def) throw new Error("Unknown item id: " + ref.id);
    const item = JSON.parse(JSON.stringify(def));
    item.itemId = ref.id;
    item.qty = ref.qty;
    if(ref.overrides) Object.assign(item, JSON.parse(JSON.stringify(ref.overrides)));
    return item;
  }
  function itemsFromRegistry(refs){
    return refs.map(itemFromRegistry);
  }

  // CONTAINER_SLOTS / SLOT_LABELS: the equipment slots the player can
  // carry things in, derived from ITEM_REGISTRY rather than listed by hand,
  // so adding an equippable bag is a registry edit and nothing else —
  // PLAYER STATE, the inventory pools and RENDERING all read these instead
  // of naming slots individually. `keychain` is named explicitly because it
  // is the one slot
  // that isn't a found item: makeDefaultState() ships it populated, and
  // keychainAllows() restricts it to Key items. That restriction is specific
  // to the keychain and is deliberately not inherited by any other slot.
  const CONTAINER_SLOTS = ["keychain"].concat(
    Object.values(ITEM_REGISTRY).filter(d => d.slotType).map(d => d.slotType)
      .filter((s, i, all) => all.indexOf(s) === i));
  const SLOT_LABELS = (function(){
    const out = { keychain:"Keychain" };
    Object.values(ITEM_REGISTRY).forEach(d=>{
      if(d.slotType && !out[d.slotType]) {
        out[d.slotType] = d.slotLabel || d.slotType.charAt(0).toUpperCase() + d.slotType.slice(1);
      }
    });
    return out;
  })();

  // street/mid-block node and building floor. Origin
  // (0,0,0) = maple4th (town SW corner), street level. +X = east, +Y =
  // north, +Z = up. Block size 100m; floor height 3m (no basements/roofs
  // yet — this is the convention for when they're added). Every room
  // carries a `locationId` key into this table (see ROOM SCHEMA above).
  //   Street/mid-block Locations: id = the room id itself, z:0, (x,y) =
  //   the former MAP_NODES {col,row} * 100 (same grid, just scaled to
  //   real meters). The grid:
  //     col -1..6 = 6th, 4th, 2nd, 1st(center), 3rd, 5th, 7th, 9th St
  //     (west->east; the centered even/odd scheme — evens west of 1st,
  //     odds east, magnitude growing with distance from center).

  //     grew *away* from the water, so Elm/Cedar/Mill/Dock all sit south
  //     of Maple: Elm/Cedar continue the residential tree-name ring,
  //     Mill/Dock are the industrial and rail-freight edge. Origin
  //     (0,0,0) is maple4th, which is why the grid has negative x and y.

  // Straight-line distance between two Locations, rounded to the nearest
  // whole meter. Computed on demand, never cached — LOCATIONS is the
  // single source of truth.
  function locationDistance(a, b){
    const A = LOCATIONS[a], B = LOCATIONS[b];
    return Math.round(Math.sqrt((B.x-A.x)**2 + (B.y-A.y)**2 + (B.z-A.z)**2));
  }
  // Compass direction from Location `a` to Location `b`, derived from real
  // coordinates. Pure vertical movement resolves to up/down; otherwise the
  // larger of |dx|/|dy| wins. A true diagonal tie (not expected on the
  // current rectilinear grid) defaults to the north/south axis.
  function computeDirection(a, b){
    const A = LOCATIONS[a], B = LOCATIONS[b];
    const dx = B.x - A.x, dy = B.y - A.y, dz = B.z - A.z;
    if(dx === 0 && dy === 0) return dz > 0 ? "up" : "down";
    if(Math.abs(dx) === Math.abs(dy)) return dy > 0 ? "north" : "south";
    if(Math.abs(dx) > Math.abs(dy)) return dx > 0 ? "east" : "west";
    return dy > 0 ? "north" : "south";
  }
  // Build-time pass: for every exit that crosses between two different
  // Locations and whose label already contains an explicit compass word,
  // replace that word with the one computed from real coordinates. Runs
  // once, right after the world is assembled.
  // Labels with no compass word (building entrances, floor transitions,
  // etc.) are left exactly as authored.
  const COMPASS_WORD_RE = /\b(north|south|east|west)\b/i;
  function applyComputedDirections(world){
    for(const roomId in world){
      const room = world[roomId];
      if(!room.exits) continue;
      for(const exit of room.exits){
        const toRoom = world[exit.to];
        if(!toRoom || toRoom.locationId === room.locationId) continue;
        const match = exit.label.match(COMPASS_WORD_RE);
        if(!match) continue;
        const dir = computeDirection(room.locationId, toRoom.locationId);
        exit.label = exit.label.slice(0, match.index) + dir + exit.label.slice(match.index + match[0].length);
      }
    }
    return world;
  }

  // ==================================================
  // PLAYER STATE
  // ==================================================
  function makeDefaultState(){
    const s = {
      currentRoom:"living", gait:"walk", invTab:"inventory", worldTab:"floor",
      totalMinutes:0, collapseCount:0, illnessMinutesLeft:0,
      // lastExertionMinute/lastWakeMinute start far in the past so recovery

      vitals:{ hunger:75, thirst:75, energy:85, health:100, stamina:100, fatigue:0 },
      inventory:{ name:"Inventory", unitWeight:0, capacityKg:3, items:[] },
      keychain:{ name:"Keychain", unitWeight:0.05, capacityKg:null, items:itemsFromRegistry([
        { id:"acorn_apt_2a_key", qty:1 } ])}
    };
    // Every equippable container slot starts empty. Derived from
    // CONTAINER_SLOTS so a new bag type needs only its ITEM_REGISTRY
    // entry. Keychain is skipped
    // because it's set above: it's the one slot the player starts carrying.
    CONTAINER_SLOTS.forEach(slot=>{ if(!(slot in s)) s[slot] = null; });
    return s;
  }
  let state = makeDefaultState();
  let gameOver = false; // UI-only: never saved — a loaded save always resumes alive
  let detailItem = null; // UI-only: { uid, side } — resolved fresh via findItemByUid(), safe against list mutation

  // ==================================================
  // CORE UTILITIES
  // ==================================================
  // Stable item identity: _uid is the ONLY safe way to refer to "the item
  // the user is looking at" across a render. Array indexes change whenever
  // a list is spliced/merged, so they must never be cached across a click.
  let _uidCounter = 1;
  function ensureUid(it){
    if(!it._uid) it._uid = "u" + (_uidCounter++);
    return it._uid;
  }
  // getItemAt: defensive lookup used by anything that still needs a plain
  // index (e.g. a button handler bound during the current render). Returns
  // null instead of throwing when the list/index no longer point at a real
  // item, so callers can bail out cleanly instead of crashing on
  // `undefined.qty`.
  function getItemAt(list, index){
    if(!list || index == null || index < 0 || index >= list.length) return null;
    const it = list[index];
    return it || null;
  }
  function findItemByUid(uid){
    for(const list of invPools()){
      const idx = list.findIndex(it=>it._uid===uid);
      if(idx>=0) return { list, index:idx, item:list[idx] };
    }
    for(const roomId of Object.keys(world)){
      const room = world[roomId];
      const floorIdx = room.floor.findIndex(it=>it._uid===uid);
      if(floorIdx>=0) return { list:room.floor, index:floorIdx, item:room.floor[floorIdx] };
      for(const c of room.containers){
        const cIdx = c.items.findIndex(it=>it._uid===uid);
        if(cIdx>=0) return { list:c.items, index:cIdx, item:c.items[cIdx] };
      }
      if(room.carContainers){
        for(const c of room.carContainers){
          const cIdx = c.items.findIndex(it=>it._uid===uid);
          if(cIdx>=0) return { list:c.items, index:cIdx, item:c.items[cIdx] };
        }
      }
    }
    return null;
  }

  // randInt/weightedPick: small RNG helpers backing SPAWN_POOLS —
  // see doOpenContainer() in WORLD INTERACTION.
  function randInt(min, max){ return min + Math.floor(Math.random() * (max - min + 1)); }
  function weightedPick(entries){
    const totalWeight = entries.reduce((s,e)=> s + e.weight, 0);
    let roll = Math.random() * totalWeight;
    for(const entry of entries){
      roll -= entry.weight;
      if(roll <= 0) return entry;
    }
    return entries[entries.length - 1];
  }

  // INVENTORY / ITEM SYSTEM — quantity-changing transfers

  function doOpenContainer(room, container){
    state.worldTab = container.id;
    if(container.spawnPools && !container.spawnRolled){
      container.spawnPools.forEach(poolId=>{
        const pool = SPAWN_POOLS[poolId];
        if(!pool) return; // defensive — an unknown pool id contributes nothing
        if(Math.random() < pool.emptyChance) return;
        const rollCount = randInt(pool.rollCount[0], pool.rollCount[1]);
        for(let i=0; i<rollCount; i++){
          const entry = weightedPick(pool.entries);
          const qty = randInt(entry.qtyMin, entry.qtyMax);
          addToList(container.items, itemFromRegistry({ id:entry.itemId, qty }));
        }
      });
      container.spawnRolled = true;
      container.lastRolledMinute = state.totalMinutes;
    }
    render();
  }
  // ==================================================
  // SURVIVAL / TIME SIMULATION
  // ==================================================
  // Health drain while a vital sits at zero or an illness is running: game
  // minutes per point of Health lost. Balance values, all retunable.
  const STARVATION_MINUTES_PER_HEALTH = 30;
  const DEHYDRATION_MINUTES_PER_HEALTH = 15;
  const ILLNESS_MINUTES_PER_HEALTH = 20;
  const ILLNESS_DURATION_MIN = 180;
  // applyHungerThirst/applyWorldTicking/applyEnergyBaseline are the pieces
  // applyDecay used to do in one shot. They're split out so Sleep (which
  // suspends the awake Energy/Stamina/Fatigue system) can run Hunger/Thirst
  // and world ticking without the awake Energy baseline, and so the
  // Stamina/Fatigue system can drive Energy's *recovery* multiplier without
  // duplicating the baseline-depletion math.
  function applyHungerThirst(min){
    state.vitals.hunger = clamp(state.vitals.hunger - DECAY.hunger*min);
    state.vitals.thirst = clamp(state.vitals.thirst - DECAY.thirst*min);
    if(state.vitals.hunger <= 0) state.vitals.health = clamp(state.vitals.health - min/STARVATION_MINUTES_PER_HEALTH);
    if(state.vitals.thirst <= 0) state.vitals.health = clamp(state.vitals.health - min/DEHYDRATION_MINUTES_PER_HEALTH);
    if(state.illnessMinutesLeft > 0){
      const tick = Math.min(min, state.illnessMinutesLeft);
      state.vitals.health = clamp(state.vitals.health - tick/ILLNESS_MINUTES_PER_HEALTH);
      state.illnessMinutesLeft -= tick;
    }
  }
  function applyWorldTicking(min){
    invPools().forEach(list=>{
      list.forEach(it=>{
        if(it.on && it.durability){
          it.durability.current = Math.max(0, it.durability.current - it.drainRate*min);
          if(it.durability.current <= 0){
            it.on = false;
            log(`Your ${it.name.toLowerCase()} runs out of battery and shuts off.`, "warn");
          }
        }
      });
    });
    Object.keys(world).forEach(id=>{
      const r = world[id];
      if(r.heatActive && r.fireMinutesLeft != null){
        r.fireMinutesLeft -= min;
        if(r.fireMinutesLeft <= 0){
          r.heatActive = false;
          r.fireMinutesLeft = null;
          if(id === state.currentRoom) log("The fire burns down and goes out.", "warn");
        }
      }
    });
  }
  function applyEnergyBaseline(min, multiplier){
    state.vitals.energy = clamp(state.vitals.energy - DECAY.energy*min*multiplier);
  }
  function checkGameOver(){
    if(!gameOver && state.vitals.health <= 0){
      gameOver = true;
      log("Your body finally gives out. This is where it ends.", "warn");
    }
  }
  // ==================================================
  // STAMINA / FATIGUE SYSTEM
  // ==================================================
  // Tasks own their duration/execution/success; they only ever *declare*
  // Exertion. This module owns every rule about
  // what Exertion does to Stamina/Fatigue, and how Energy modifies or is
  // spent by recovery — keeping Stamina out of the task layer entirely.
  function applyExertion(exertion){
    if(exertion <= 0) return;
    const v = state.vitals;
    const staminaUsed = Math.min(v.stamina, exertion);
    v.stamina = Math.max(0, v.stamina - staminaUsed);
    const remainingExertion = exertion - staminaUsed;
    v.fatigue = Math.min(100, v.fatigue + remainingExertion);
    state.lastExertionMinute = state.totalMinutes;
  }
  function isExertionDelayActive(){
    return (state.totalMinutes - state.lastExertionMinute) < STAMINA_RECOVERY_DELAY_MIN;
  }
  function energyRecoveryMultiplier(){
    const e = state.vitals.energy;
    if(e >= 80) return 1.00;
    if(e >= 60) return 0.90;
    if(e >= 40) return 0.75;
    if(e >= 20) return 0.50;
    return 0.25;
  }
  function staminaMaxForEnergy(){
    const e = state.vitals.energy;
    if(e >= 40) return 100;
    if(e >= 20) return 80;
    return 50;
  }
  function hungerThirstRecoveryPenalty(){
    // Additive 15%-each penalty — never compounded multiplicatively.
    let penalty = 0;
    if(state.vitals.hunger < LOW_HUNGER_THRESHOLD) penalty += 0.15;
    if(state.vitals.thirst < LOW_THIRST_THRESHOLD) penalty += 0.15;
    return penalty;
  }
  function fatigueRecoveryAllowed(){
    // Fatigue only recovers once Stamina has reached its *current* cap —
    // this is deliberately staminaMaxForEnergy(), not a flat 100, so a
    // low-Energy Stamina cap can't be worked around.
    return state.vitals.fatigue > 0 && state.vitals.stamina >= staminaMaxForEnergy();
  }
  // One game-minute (or smaller remainder) of awake Stamina/Fatigue
  // recovery. mode "rest" uses Rest's flat rate and never adds the
  // recovery Energy surcharge; mode "normal" is the ordinary awake state.
  function recoveryStep(dt, mode){
    if(isExertionDelayActive()){ applyEnergyBaseline(dt, 1); return; }
    const cap = staminaMaxForEnergy();
    if(state.vitals.stamina < cap){
      const rate = mode === "rest"
        ? REST_STAMINA_RATE
        : BASELINE_STAMINA_RATE * energyRecoveryMultiplier() * (1 - hungerThirstRecoveryPenalty());
      state.vitals.stamina = Math.min(cap, state.vitals.stamina + rate*dt);
      applyEnergyBaseline(dt, mode === "rest" ? 1 : 2);
    } else if(fatigueRecoveryAllowed()){
      state.vitals.fatigue = Math.max(0, state.vitals.fatigue - FATIGUE_RECOVERY_RATE*dt);
      applyEnergyBaseline(dt, mode === "rest" ? 1 : 4);
    } else {
      applyEnergyBaseline(dt, 1);
    }
  }
  // The Energy ceiling this Sleep can reach: Fatigue caps how much rest is
  // worth. Read by doSleep(), estimateSleepMinutes() and sleepRestoresEnergy().
  function sleepEnergyCeiling(){ return clamp(100 - state.vitals.fatigue); }
  // Sleep is unavailable for two separate reasons, kept separate so
  // RENDERING can say which one applies. sleepRestoresEnergy() is false
  // whenever the Sleep would restore nothing — including at Fatigue 100,
  // where the ceiling is 0 and no Energy is ever below it. That state is
  // worked off through recoveryStep() instead, which is the intended price
  // of never handing out a free Fatigue wipe for a zero-length Sleep.
  function sleepOffCooldown(){ return state.totalMinutes >= state.lastWakeMinute + SLEEP_COOLDOWN_MIN; }
  function sleepRestoresEnergy(){ return state.vitals.energy < sleepEnergyCeiling(); }
  function sleepAvailable(){ return sleepOffCooldown() && sleepRestoresEnergy(); }
  function estimateSleepMinutes(){
    const missing = Math.max(0, sleepEnergyCeiling() - state.vitals.energy);
    return missing / SLEEP_ENERGY_RATE;
  }
  // Advances awake game time in <=1-minute steps so the Stamina/Fatigue
  // recovery delay (exactly 1 game minute) and the Energy-driven recovery
  // bands are evaluated at natural resolution instead
  // of being approximated over an arbitrarily long jump.
  function runAwakeStep(min){
    let remaining = min;
    while(remaining > 1e-9){
      const dt = Math.min(1, remaining);
      state.totalMinutes += dt;
      applyHungerThirst(dt);
      applyWorldTicking(dt);
      recoveryStep(dt, "normal");
      remaining -= dt;
    }
  }
  // Collapsing at zero Energy. Every COLLAPSE_BLACKOUT_EVERY-th collapse is
  // the long one; the others are a stumble. Balance values, retunable.
  const COLLAPSE_BLACKOUT_EVERY = 3;
  const COLLAPSE_BLACKOUT_MIN = 300;
  const COLLAPSE_BLACKOUT_ENERGY = 90;    // Energy set to, not added
  const COLLAPSE_STUMBLE_MIN = 20;
  const COLLAPSE_STUMBLE_ENERGY = 30;     // Energy added, not set
  function advanceTime(min){
    runAwakeStep(min);
    if(state.vitals.energy <= 0){
      state.collapseCount += 1;
      if(state.collapseCount % COLLAPSE_BLACKOUT_EVERY === 0){
        log("Your body gives out completely. You black out — hours pass before you come to, disoriented and vulnerable.", "warn");
        runAwakeStep(COLLAPSE_BLACKOUT_MIN); state.vitals.energy = clamp(COLLAPSE_BLACKOUT_ENERGY);
      } else {
        log("Exhaustion drops you where you stand. A few minutes pass before you can get up.", "warn");
        runAwakeStep(COLLAPSE_STUMBLE_MIN); state.vitals.energy = clamp(state.vitals.energy + COLLAPSE_STUMBLE_ENERGY);
      }
    }
    checkGameOver();
  }
  // ==================================================
  // CRAFTING
  // ==================================================
  function canCraft(recipe){
    const hasAll = recipe.inputs.every(inp => countInPools(inp.id) >= inp.qty);
    if(!hasAll) return false;
    if(recipe.tool && !hasTool(recipe.tool)) return false;
    if(recipe.needsHeat && !roomHasHeat(world[state.currentRoom])) return false;
    return true;
  }
  function doCraft(recipeId){
    const recipe = RECIPES.find(r=>r.id===recipeId);
    if(!recipe || !canCraft(recipe)) return;
    recipe.inputs.forEach(inp=> consumeFromPools(inp.id, inp.qty));
    advanceTime(recipe.minutes);
    const crafted = itemFromRegistry({ id: recipe.output.id, qty:1 });
    giveItem(crafted);
    log(`You craft a ${crafted.name.toLowerCase()}.`, "good", "craft:" + recipe.output.id);
    render();
  }
  // ==================================================
  // FIRE / COOKING
  // ==================================================
  // Action durations in game minutes. ACTIONS spends these and RENDERING
  // prints them on the buttons, so the two cannot drift apart.
  const FISH_DURATION_MIN = 20;
  const LIGHT_STOVE_MIN = 5;
  const BUILD_FIRE_MIN = 10;
  const DISMANTLE_CAMPFIRE_MIN = 10;      // shares a value with BUILD_FIRE_MIN; a separate fact
  const CHOP_TREE_MIN = 30;
  // Fire fuel. A burn is its wood spent at the per-piece rate, so the two
  // stay in step when either is retuned. A first fire comes out of the
  // campfire kit and burns CAMPFIRE_KIT_COST pieces' worth, since that is
  // the wood the kit was crafted from; a rebuild in an already-built
  // campfire costs FIRE_BUILD_WOOD loose firewood. FIRE_MAX_MIN is its own
  // fact — a cap on banked burn time, not a wood count.
  const FIRE_BUILD_WOOD = 3;
  const FIRE_MINUTES_PER_WOOD = 60;
  const FIRE_MAX_MIN = 360;
  const HEAT_CONTAINER_CAPACITY_KG = 8;   // stove and campfire alike
  const CHOP_TREE_FIREWOOD = 6;
  const FISH_BITE_CHANCE = 0.55;          // balance value, retunable
  function doFish(){
    advanceTime(FISH_DURATION_MIN);
    applyExertion(FISH_EXERTION);
    if(Math.random() < FISH_BITE_CHANCE){
      giveItem(itemFromRegistry({ id:"raw_fish", qty:1 }));
      log("Something bites. You reel in a fish.", "good", "fish", "bite");
    } else {
      log("Nothing bites this time.", null, "fish", "miss");
    }
    render();
  }
  function ensureHeatContainer(room, id, name, capacityKg){
    let c = room.containers.find(x=>x.id===id);
    if(!c){ c = { id, name, capacityKg, items:[] }; room.containers.push(c); }
    return c;
  }
  function doLightStove(){
    if(!consumeMatchUse()) return;
    const room = world[state.currentRoom];
    ensureHeatContainer(room, "stove", "Stove", HEAT_CONTAINER_CAPACITY_KG);
    room.heatActive = true;
    advanceTime(LIGHT_STOVE_MIN);
    log("You light the stove.", "good");
    render();
  }
  function canBuildFire(room){
    if(room.campfireBuilt) return room.fireMinutesLeft > 0 || countInPools("firewood") >= FIRE_BUILD_WOOD;
    // A kit carries its own first load of wood, so a first fire needs nothing else.
    return countInPools("campfire_kit") >= 1;
  }
  function doBuildFire(){
    const room = world[state.currentRoom];
    if(!canBuildFire(room)) return;
    if(!consumeMatchUse()) return;
    const firstTime = !room.campfireBuilt;
    // banked is hoisted above the branch because the log ternary below
    // reads it. Same value as before: on a first build fireMinutesLeft is
    // undefined, and `undefined > 0` was already false.
    const banked = !firstTime && room.fireMinutesLeft > 0;
    if(firstTime){
      consumeFromPools("campfire_kit", 1);
      room.campfireBuilt = true;
      // The kit was crafted from CAMPFIRE_KIT_COST firewood and burns that
      // wood — it costs no loose firewood on top.
      room.fireMinutesLeft = CAMPFIRE_KIT_COST * FIRE_MINUTES_PER_WOOD;
    } else if(!banked){
      consumeFromPools("firewood", FIRE_BUILD_WOOD);
      room.fireMinutesLeft = FIRE_BUILD_WOOD * FIRE_MINUTES_PER_WOOD;
    }
    ensureHeatContainer(room, "campfire", "Campfire", HEAT_CONTAINER_CAPACITY_KG);
    room.heatActive = true;
    advanceTime(BUILD_FIRE_MIN);
    log(firstTime ? "You set up the campfire kit and get a fire going."
      : (banked ? "You relight the fire from what's left of the wood." : "You get a fire going."), "good");
    render();
  }
  function doAddFuel(){
    if(countInPools("firewood") < 1) return;
    const room = world[state.currentRoom];
    consumeFromPools("firewood", 1);
    room.fireMinutesLeft = Math.min((room.fireMinutesLeft || 0) + FIRE_MINUTES_PER_WOOD, FIRE_MAX_MIN);
    log("You feed the fire more wood.", "good", "fuel");
    render();
  }
  function doExtinguish(){
    const room = world[state.currentRoom];
    room.heatActive = false;
    log("You put it out.");
    render();
  }
  function doDismantleCampfire(){
    const room = world[state.currentRoom];
    if(!room.campfireBuilt || room.heatActive) return;
    const container = room.containers.find(c=>c.id==="campfire");
    if(container){
      container.items.forEach(it=> addToList(room.floor, it));
      room.containers = room.containers.filter(c=>c.id!=="campfire");
    }
    const refund = Math.ceil(CAMPFIRE_KIT_COST/2);
    giveItem(itemFromRegistry({ id:"firewood", qty:refund }));
    room.campfireBuilt = false;
    room.fireMinutesLeft = null;
    advanceTime(DISMANTLE_CAMPFIRE_MIN);
    log(`You break down the campfire, salvaging ${refund} firewood from it.`, "good");
    render();
  }
  function getHeatContainer(room){
    return room.containers.find(c=> c.id==="stove" || c.id==="campfire");
  }
  function doCookInContainer(containerId, recipeId){
    const room = world[state.currentRoom];
    const container = room.containers.find(c=>c.id===containerId);
    if(!container) return;
    const recipe = HEAT_RECIPES.find(r=>r.id===recipeId);
    if(!recipe) return;
    const idx = container.items.findIndex(it=>it.itemId===recipe.input);
    if(idx < 0) return;
    container.items[idx].qty -= 1;
    if(container.items[idx].qty <= 0) container.items.splice(idx,1);
    addToList(container.items, itemFromRegistry({ id: recipe.output.id, qty:1 }));
    advanceTime(recipe.minutes);
    log(`The ${ITEM_REGISTRY[recipe.input].name.toLowerCase()} finishes cooking.`, "good", "cook:" + recipe.id);
    render();
  }
  function doChopTree(){
    if(!hasTool("chopping")) return;
    const room = world[state.currentRoom];
    advanceTime(CHOP_TREE_MIN);
    applyExertion(CHOP_TREE_EXERTION);
    room.hasTree = false;
    giveItem(itemFromRegistry({ id:"firewood", qty:CHOP_TREE_FIREWOOD }));
    log("You chop the tree down. It splits into a good stock of firewood.", "good", "chop");
    render();
  }
  // ==================================================
  // PERSISTENCE
  // ==================================================
  // Save format: { version, state, world, doors, windows }. _uid is not
  // persisted specially — resyncUidCounter() scans
  // every item location after a load so newly-created items during the next
  // session keep getting unique ids, and ensureUid() lazily assigns one to
  // any loaded item that predates the uid system.
  function serializeGame(){ return JSON.stringify({ version: GAME_CONFIG.VERSION, state, world, doors, windows }, null, 2); }
  function resyncUidCounter(){
    let maxSeen = 0;
    const scanList = (list)=> (list || []).forEach(it=>{
      if(it && it._uid){
        const n = parseInt(String(it._uid).replace(/^u/, ""), 10);
        if(!isNaN(n) && n > maxSeen) maxSeen = n;
      }
    });
    invPools().forEach(scanList);
    Object.keys(world).forEach(roomId=>{
      const room = world[roomId];
      scanList(room.floor);
      (room.containers || []).forEach(c=>scanList(c.items));
      (room.carContainers || []).forEach(c=>scanList(c.items));
    });
    _uidCounter = maxSeen + 1;
  }
  // backfillItemIds(): companion to resyncUidCounter(), run alongside it on
  // every load. Older saves predate ITEM_REGISTRY's itemId field — this
  // assigns itemId to any loaded item missing it, by reverse name match
  // against ITEM_REGISTRY (current registry names are unique, so this is
  // unambiguous). Items with no registry match are left without itemId and
  // keep working exactly as before via _uid/list position.
  function backfillItemIds(){
    const nameToId = {};
    Object.keys(ITEM_REGISTRY).forEach(id=>{ nameToId[ITEM_REGISTRY[id].name] = id; });
    const scanList = (list)=> (list || []).forEach(it=>{
      if(it && !it.itemId && nameToId[it.name]) it.itemId = nameToId[it.name];
    });
    invPools().forEach(scanList);
    Object.keys(world).forEach(roomId=>{
      const room = world[roomId];
      scanList(room.floor);
      (room.containers || []).forEach(c=>scanList(c.items));
      (room.carContainers || []).forEach(c=>scanList(c.items));
    });
  }
  // backfillLocationIds(): companion to backfillItemIds(), run alongside it
  // on every load. Older saves (pre-v0.2.9) predate the locationId field —
  // this assigns it to any loaded room missing it, by direct room-id lookup
  // against a freshly-built default world. Unlike backfillItemIds()'s name
  // matching, room ids are stable, so this is an unambiguous key lookup.
  function backfillLocationIds(){
    const defaults = makeDefaultWorld();
    Object.keys(world).forEach(roomId=>{
      const room = world[roomId];
      if(room && !room.locationId && defaults[roomId]){
        room.locationId = defaults[roomId].locationId;
      }
    });
  }
  // backfillContainerFields(): companion to backfillLocationIds(), run
  // alongside it on every load. Older saves (pre-v0.4.0) predate both
  // spawnPools and spawnRolled entirely — for any loaded container whose
  // matching default-world container has spawnPools, this copies
  // spawnPools (if missing) the same way backfillLocationIds() copies a
  // missing locationId, then copies spawnRolled (if missing) to match the
  // default. That ordering matters: without spawnPools also being
  // restored, doOpenContainer()'s `container.spawnPools && ...` guard
  // could never fire for anything loaded from an old save, silently
  // defeating the roll entirely rather than just mistiming it. The net
  // effect: an old save's already-populated container doesn't become
  // eligible for an auto-roll it was never meant to get, and a still-empty
  // one does get a chance to roll on next open.
  function backfillContainerFields(){
    const defaults = makeDefaultWorld();
    Object.keys(world).forEach(roomId=>{
      const room = world[roomId];
      const defaultRoom = defaults[roomId];
      if(!room || !defaultRoom) return;
      const scan = (containers, defaultContainers)=>{
        (containers || []).forEach(c=>{
          const dc = (defaultContainers || []).find(x=>x.id===c.id);
          if(!dc || !dc.spawnPools) return;
          if(c.spawnPools === undefined) c.spawnPools = dc.spawnPools;
          if(c.spawnRolled === undefined) c.spawnRolled = dc.spawnRolled;

      scan(room.containers, defaultRoom.containers);
      scan(room.carContainers, defaultRoom.carContainers);
    });
  }
  // validateLoadedWorld(): the shape check a load must pass before anything
  // is committed. Unlike validateItemRegistry()/validateLocations() below,
  // which are dev-only console helpers, this is wired into a real code path
  // and runs on every load — hence its place here in PERSISTENCE beside the
  // backfills rather than in the dev-helper block.
  //
  // It covers exactly the shapes that make resyncUidCounter(), the three
  // backfills or render() throw, and no more. This is a shape check, not a
  // schema validator: a save that is merely out of date is the backfills'
  // problem, and they run only once this has passed. Returns an array of
  // problem strings, empty on success — the shape its two siblings use.
  function validateLoadedWorld(nextWorld, nextState){
    const problems = [];
    Object.keys(nextWorld).forEach(roomId=>{
      const room = nextWorld[roomId];
      if(!room){ problems.push(`${roomId}: room is missing`); return; }
      if(!Array.isArray(room.floor)) problems.push(`${roomId}: floor is not an array`);
      if(!Array.isArray(room.exits)) problems.push(`${roomId}: exits is not an array`);
      if(!Array.isArray(room.containers)) problems.push(`${roomId}: containers is not an array`);
      // carContainers is optional on a room and stays optional — only a
      // present one is checked.
      if(room.carContainers !== undefined && !Array.isArray(room.carContainers)){
        problems.push(`${roomId}: carContainers is present but not an array`);
      }
    });
    if(!nextState.inventory || !Array.isArray(nextState.inventory.items)){
      problems.push("state.inventory: no items array");
    }
    CONTAINER_SLOTS.forEach(slot=>{
      const bag = nextState[slot];
      if(bag && !Array.isArray(bag.items)) problems.push(`state.${slot}: no items array`);
    });
    return problems;
  }
  // A load is all-or-nothing: the four module bindings are assigned only
  // once the incoming data has passed validateLoadedWorld(). A save that
  // fails leaves the running session exactly as it was, so the player can
  // keep playing — the old order committed `world` first and a throw in a
  // backfill left a half-loaded world on screen with no way back but
  // Restart.
  // backfillRoomAddresses(): third companion to backfillLocationIds(), run
  // alongside it on every load. roomLabel() now composes from `address`, a
  // field no save made before it shipped carries — without this, every room in
  // such a save renders "undefined, ...". It keys off `address === undefined`
  // rather than falsiness: an address is never empty, and `undefined` is what
  // distinguishes "this save predates the field" from any other state. It
  // copies all four label fields rather than just `address`, because this is
  // not a pure field addition — `building`'s meaning narrowed, and six rooms
  // moved their name out of `room`, so restoring `address` alone would leave
  // cornerstore reading "Main St, Corner Store, Corner Store". All four are
  // static content that nothing mutates at runtime (roomLabel() is their only
  // reader), so taking them wholesale from the defaults is both safe and the
  // only version that produces a correct label. `shelter` gets no backfill:
  // nothing reads it, so an old save's rooms lacking it changes nothing.
  function backfillRoomAddresses(){
    const defaults = makeDefaultWorld();
    Object.keys(world).forEach(roomId=>{
      const room = world[roomId];
      if(room && room.address === undefined && defaults[roomId]){
        room.address  = defaults[roomId].address;
        room.building = defaults[roomId].building;
        room.area     = defaults[roomId].area;
        room.room     = defaults[roomId].room;
      }
    });
  }
  function applyLoadedData(data){
    if(!data || !data.state || !data.world || !data.world[data.state.currentRoom]){
      log("That save doesn't look valid — nothing was loaded.", "warn");
      return false;
    }
    if(!data.version){
      log("This save has no version tag (from an older build) — it may not load correctly.", "warn");
    } else if(versionCompat(data.version) !== versionCompat(GAME_CONFIG.VERSION)){
      log(`This save is from v${data.version}, this build is v${GAME_CONFIG.VERSION} — it may not load correctly.`, "warn");
    }
    const base = makeDefaultState();
    const nextState = { ...base, ...data.state, vitals: { ...base.vitals, ...(data.state.vitals || {}) } };
    const nextWorld = data.world;

  function validateItemRegistry(){

    }
    if(room.hasStove && !room.heatActive && hasMatchUses()){
      hereBox.appendChild(actionButton("Light the stove " + fmtDuration(LIGHT_STOVE_MIN), doLightStove));
    }
    if(!room.cannotHaveFire && !room.heatActive && hasMatchUses() && canBuildFire(room)){
      const label = !room.campfireBuilt ? "Set up the campfire kit"
        : (room.fireMinutesLeft > 0 ? "Relight the fire" : "Build a campfire");
      hereBox.appendChild(actionButton(label + " " + fmtDuration(BUILD_FIRE_MIN), doBuildFire));
    }
    if(room.campfireBuilt && !room.heatActive){
      hereBox.appendChild(actionButton("Dismantle the campfire " + fmtDuration(DISMANTLE_CAMPFIRE_MIN), doDismantleCampfire, "locked"));
    }
    if(room.heatActive){
      hereBox.appendChild(actionButton(room.hasStove ? "Turn off the stove" : "Put out the fire", doExtinguish));
      // Offered only while a firewood buys its full FIRE_MINUTES_PER_WOOD:
      // within one piece of the cap, doAddFuel()'s Math.min would clip the
      // surplus and the wood would be spent for less than it is worth.
      if(room.fireMinutesLeft != null && countInPools("firewood") >= 1
         && room.fireMinutesLeft <= FIRE_MAX_MIN - FIRE_MINUTES_PER_WOOD){
        hereBox.appendChild(actionButton("Add fuel to the fire", doAddFuel));
      }
      const heatContainer = getHeatContainer(room);
      if(heatContainer){
        HEAT_RECIPES.forEach(recipe=>{
          if(heatContainer.items.some(it=>it.itemId===recipe.input)){
            hereBox.appendChild(actionButton(`Cook the ${ITEM_REGISTRY[recipe.input].name.toLowerCase()} ` + fmtDuration(recipe.minutes),
              ()=> doCookInContainer(heatContainer.id, recipe.id)));
          }
        });
      }
    }
    if(room.hasTree && hasTool("chopping")){
      hereBox.appendChild(actionButton("Chop down the tree " + fmtDuration(CHOP_TREE_MIN), doChopTree));
    }
    if(!room.searchLabel || room.searched){
      room.containers.forEach(c=>{
        if(c.locked && hasTool(c.breakTag)){
          hereBox.appendChild(actionButton("Cut the lock on " + c.name, ()=> doUnlockContainer(c.id), "locked"));
        }
      });
    }
    hereGroup.style.display = hereBox.children.length ? "" : "none";
  }
  function renderInventoryPanel(){
    const invTabsEl = document.getElementById("invTabs");
    invTabsEl.innerHTML = "";
    // One tab per populated container slot, in CONTAINER_SLOTS order
    // (keychain, then ITEM_REGISTRY order), so a new equippable bag shows up
    // here with no RENDERING edit at all.
    const invTabDefs = [["inventory","Inventory"]];
    CONTAINER_SLOTS.forEach(slot=>{
      if(state[slot]) invTabDefs.push([slot, SLOT_LABELS[slot]]);
    });
    if(state.invTab !== "inventory" && !state[state.invTab]) state.invTab = "inventory";
    invTabDefs.forEach(([key,label])=>{
      const btn = document.createElement("button");
      btn.textContent = label;
      if(state.invTab === key) btn.classList.add("active");
      btn.addEventListener("click", ()=>{ state.invTab = key; render(); });
      invTabsEl.appendChild(btn);
    });
    const currentInv = invSlot(state.invTab);
    document.getElementById("invWeight").textContent =
      totalWeight(currentInv.items).toFixed(2) + (currentInv.capacityKg ? " / " + currentInv.capacityKg + " kg" : " kg");
    const unequipBtn = document.getElementById("unequipBtn");
    if(CONTAINER_SLOTS.indexOf(state.invTab) >= 0){
      unequipBtn.style.display = "";
      unequipBtn.onclick = ()=> doUnequip(state.invTab);
    } else { unequipBtn.style.display = "none"; }
    renderItemList(document.getElementById("invList"), currentInv.items, [
      { label: state.worldTab === "floor" ? "Place" : "Store", onClick:(i)=> doStore(i) }
    ], "inv");
  }
  function renderWorldItemsPanel(){
    const room = world[state.currentRoom];
    const worldTabsEl = document.getElementById("worldTabs");
    worldTabsEl.innerHTML = "";
    const worldTabDefs = [["floor","Floor"]];
    if(!room.searchLabel || room.searched){
      room.containers.forEach(c=>{ if(!c.locked) worldTabDefs.push([c.id, c.name]); });
    }
    if(room.carContainers && !room.carLocked) room.carContainers.forEach(c=> worldTabDefs.push([c.id, c.name]));
    worldTabDefs.forEach(([key,label])=>{
      const btn = document.createElement("button");
      btn.textContent = label;
      if(state.worldTab === key) btn.classList.add("active");
      btn.addEventListener("click", ()=>{
        const c = room.containers.find(x=>x.id===key) || (room.carContainers && room.carContainers.find(x=>x.id===key));
        if(c) doOpenContainer(room, c);
        else { state.worldTab = key; render(); }
      });
      worldTabsEl.appendChild(btn);
    });
    if(!worldTabDefs.find(d=>d[0]===state.worldTab)) state.worldTab = "floor";
    const currentWorld = worldSlot(room, state.worldTab);
    document.getElementById("worldWeight").textContent =
      totalWeight(currentWorld.items).toFixed(2) + " / " + currentWorld.capacityKg + " kg";
    renderItemList(document.getElementById("worldList"), currentWorld.items, [
      { label:"Take", disabled:(it)=> state.invTab === "keychain" && !keychainAllows(it), onClick:(i)=> doTake(i) }
    ], "world");
  }
  function render(){
    if(gameOver){
      document.getElementById("locLabel").textContent = "";
      document.getElementById("clockLabel").textContent = "";
      document.getElementById("roomDesc").textContent = "You did not survive.";
      document.getElementById("statsBox").innerHTML = "Hunger: —<br>Thirst: —<br>Energy: —<br>Health: 0";
      const moveBox = document.getElementById("moveActions");
      moveBox.innerHTML = "";
      moveBox.appendChild(actionButton("Restart", doRestart));
      document.getElementById("moveGroup").style.display = "";
      document.getElementById("hereGroup").style.display = "none";
      document.getElementById("invTabs").innerHTML = "";
      document.getElementById("invList").innerHTML = "";
      document.getElementById("invWeight").textContent = "";
      document.getElementById("unequipBtn").style.display = "none";
      document.getElementById("worldTabs").innerHTML = "";
      document.getElementById("worldList").innerHTML = "";
      document.getElementById("worldWeight").textContent = "";
      document.getElementById("craftBackBtn").style.display = "none";
      document.getElementById("craftBody").innerHTML = "";
      return;
    }
    renderLocationPanel();
    renderStatsPanel();
    renderMoveActionsPanel();
    renderHereActionsPanel();
    renderInventoryPanel();
    renderWorldItemsPanel();
    renderCraftPanel();
    renderMap();
  }

  document.title = "Ashfall — v" + GAME_CONFIG.VERSION;
  document.getElementById("pageTitle").textContent = "ASHFALL — v" + GAME_CONFIG.VERSION;
  log("You wake up in your apartment. Everything's exactly where you left it — for now.");
  mapSetZoomStep(mapZoomStep);
  render();
})();
</script>
</body>
