<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ashfall Prototype</title>
<style>
  :root{
    --bg:#111315; --panel:#1b1e22; --panel-2:#20242a; --line:#33383f;
    --ink:#e5e5e0; --ink-dim:#9a9fa6; --ink-faint:#888e97;
    --accent:#3b82f6; --accent-dim:#25508f; --warn:#d97b3f; --danger:#c76552; --good:#7a9463;
  }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
    font-family:Georgia,'Times New Roman',serif; display:flex; flex-direction:column; }
  header{ display:flex; align-items:center; gap:14px; padding:12px 24px; border-bottom:1px solid var(--line); font-family:system-ui,sans-serif; }
  header h1{ font-size:15px; margin:0; letter-spacing:.04em; }
  #menuToggle{ background:var(--panel-2); border:1px solid var(--line); color:var(--ink); font-size:13px; padding:7px 11px; border-radius:3px; cursor:pointer; }
  #menuToggle:hover{ border-color:var(--accent-dim); }
  #menuBackdrop{ position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:15; display:none; }
  #menuBackdrop.show{ display:block; }
  #sideMenu{ position:fixed; top:0; left:0; height:100%; width:460px; max-width:92vw; background:var(--panel);
    border-right:1px solid var(--line); transform:translateX(-100%); transition:transform .22s ease;
    z-index:20; padding:20px 18px; display:flex; flex-direction:column; gap:16px; font-family:system-ui,sans-serif; overflow-y:auto; }
  #sideMenu.open{ transform:translateX(0); }
  #sideMenu h2{ font-size:14px; margin:0; display:flex; justify-content:space-between; align-items:center; }
  #closeMenu{ background:none; border:none; color:var(--ink-dim); font-size:16px; cursor:pointer; }
  .menu-section h3{ font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint); margin:0 0 8px; }
  .menu-actions{ display:flex; flex-direction:column; gap:6px; }
  .menu-actions button{ background:var(--panel-2); border:1px solid var(--line); color:var(--ink);
    font-size:13px; padding:8px 10px; border-radius:3px; cursor:pointer; text-align:left; }
  .menu-actions button:hover{ border-color:var(--accent-dim); }
  .menu-placeholder{ font-size:12px; color:var(--ink-faint); font-style:italic; }
  #statsBox, #runBox{ font-size:13px; color:var(--ink-dim); line-height:1.9; }
  /* The heading row, not the heading: #mapZoomToggle is a <div> and is not
     legal inside an <h3>, so the flex row is a wrapper around both. The
     8px below the heading moves here with it — inside a flex row the h3's
     own margin no longer reaches the map. */
  .map-heading{ display:flex; justify-content:space-between; align-items:center; margin:0 0 8px; }
  .map-heading h3{ margin:0; }
  #mapZoomToggle{ display:flex; gap:5px; }
  #mapZoomToggle button{ font-family:system-ui,sans-serif; font-size:12px; background:var(--panel-2);
    border:1px solid var(--line); color:var(--ink-dim); padding:4px 9px; border-radius:3px; cursor:pointer; }
  #mapZoomToggle button.active{ border-color:var(--accent); color:var(--accent); }
  #mapZoomToggle button:disabled{ opacity:.4; cursor:not-allowed; }
  #mapSvg{ width:100%; height:auto; display:block; background:var(--panel-2); border-radius:3px; margin-top:8px; }
  .map-street{ stroke:var(--line); stroke-width:3; fill:none; }
  .map-street-thin{ stroke:var(--line); stroke-width:1.5; opacity:.6; fill:none; }
  .map-node-dot{ fill:var(--ink-faint); }
  .map-street-name{ fill:var(--ink-dim); font-size:15px; font-family:system-ui,sans-serif; letter-spacing:.5px; font-weight:600; }
  .map-bldg-dot{ fill:var(--panel-2); stroke:var(--accent-dim); stroke-width:1.5; }
  .map-bldg-label{ fill:var(--ink); font-size:10px; font-weight:600; font-family:system-ui,sans-serif; }
  .map-river{ fill:none; stroke:#2a4a5c; stroke-width:10; stroke-linecap:round; opacity:.5; }
  #mapPlayer{ fill:var(--accent); }
  #locBar{ padding:10px 24px; border-bottom:1px solid var(--line); font-family:system-ui,sans-serif;
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
  #locLabel{ font-size:14px; color:var(--accent); }
  #rightBar{ display:flex; gap:16px; align-items:center; }
  #clockLabel{ font-size:12px; color:var(--ink-dim); }
  #gaitBar{ display:flex; gap:6px; align-items:center; }
  #gaitBar span{ font-size:12px; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.06em; }
  #gaitBar button{ font-family:system-ui,sans-serif; font-size:12px; background:var(--panel-2);
    border:1px solid var(--line); color:var(--ink-dim); padding:5px 9px; border-radius:3px; cursor:pointer; }
  #gaitBar button.active{ border-color:var(--accent); color:var(--accent); }
  #gaitBar button:disabled{ opacity:.4; cursor:not-allowed; }
  main{ flex:1; display:grid; grid-template-columns:1fr 320px; }
  #left{ padding:18px 26px; border-right:1px solid var(--line); display:flex; flex-direction:column; gap:14px; }
  #roomDesc{ color:var(--ink-dim); line-height:1.6; margin:0; font-size:15px; }
  #log{ display:flex; flex-direction:column; gap:5px; max-height:110px; overflow-y:auto; }
  #log p{ margin:0; font-size:13.5px; line-height:1.5; color:var(--ink-dim); }
  #log p.fresh{ color:var(--ink); }
  #log p.sys{ font-style:italic; color:var(--accent); font-family:system-ui,sans-serif; font-size:12px; }
  #log p.warn{ color:var(--warn); font-family:system-ui,sans-serif; font-size:12px; }
  #log p.good{ color:var(--good); font-family:system-ui,sans-serif; font-size:12px; }
  .logcount{ color:var(--ink-faint); font-size:12px; margin-left:5px; }
  .actions-group h2{ font-family:system-ui,sans-serif; font-size:12px; text-transform:uppercase;
    letter-spacing:.08em; color:var(--ink-faint); margin:0 0 8px; }
  .actions{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; }
  button.action{ font-family:system-ui,sans-serif; font-size:13.5px; background:var(--panel-2);
    border:1px solid var(--line); color:var(--ink); padding:8px 13px; border-radius:3px; cursor:pointer; }
  button.action:hover{ border-color:var(--accent-dim); background:#232a33; }
  button.action .cost{ color:var(--ink-faint); font-size:12px; margin-left:4px; }
  button.action.locked{ border-color:var(--danger); color:var(--danger); }
  button.action.blocked{ border-color:var(--danger); color:var(--danger); cursor:not-allowed; }
  /* The control that opens item detail. It is a <button> because that is what
     it does; the weight and colour it used to inherit from
     `ul.itemlist .meta b` live here now, along with the reset a button needs
     to sit inline in a sentence. The padding/negative-margin pair is the tap
     target: the padded box overlaps the row's own padding instead of adding
     to it, so the row height is unchanged. Both it and the :active colour are
     judgment calls, retunable. */
  .itemname{ background:none; border:none; font:inherit; color:var(--ink); font-weight:600;
    padding:6px 2px; margin:-6px -2px; cursor:pointer; text-align:left;
    text-decoration:underline dotted; text-underline-offset:2px; }
  .itemname:active{ color:var(--accent); }
  .detailBox{ font-size:12.5px; color:var(--ink-dim); margin-bottom:10px; line-height:1.7; }
  .detailBox b{ color:var(--ink); }
  #sidebar{ padding:16px 18px; display:flex; flex-direction:column; gap:16px; font-family:system-ui,sans-serif; overflow-y:auto; }
  .panel{ background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:11px 13px; }
  .tabs{ display:flex; gap:5px; margin-bottom:9px; flex-wrap:wrap; }
  .tabs button{ font-size:12px; background:var(--panel-2); border:1px solid var(--line); color:var(--ink-dim);
    padding:5px 9px; border-radius:3px; cursor:pointer; }
  .tabs button.active{ border-color:var(--accent); color:var(--accent); }
  .panel h2{ font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-faint);
    margin:0 0 8px; display:flex; justify-content:space-between; align-items:center; }
  .panel h2 .sub{ color:var(--ink-dim); text-transform:none; letter-spacing:0; font-size:12px; display:flex; align-items:center; gap:6px; }
  ul.itemlist{ list-style:none; margin:0; padding:0; }
  ul.itemlist li{ display:flex; justify-content:space-between; align-items:center; gap:6px;
    padding:6px 0; border-bottom:1px solid rgba(51,56,63,.6); font-size:12.5px; }
  ul.itemlist li:last-child{ border-bottom:none; }
  ul.itemlist .meta{ color:var(--ink-dim); flex:1; }
  ul.itemlist .cat{ color:var(--ink-faint); font-size:12px; }
  ul.itemlist .state{ color:var(--ink-dim); }
  ul.itemlist .empty{ color:var(--ink-faint); font-style:italic; }
  .btnrow{ display:flex; gap:4px; flex-wrap:wrap; justify-content:flex-end; }
  button.mini{ background:#262a30; border:1px solid var(--line); color:var(--ink); font-size:12px;
    padding:4px 7px; border-radius:3px; cursor:pointer; white-space:nowrap; }
  button.mini:hover{ border-color:var(--accent-dim); }
  button.mini.equip{ border-color:var(--good); color:var(--good); }
  button.mini.blocked{ border-color:var(--danger); color:var(--danger); cursor:not-allowed; }
  /* The two-column grid has a 476px floor — 320px of sidebar plus the room
     description's own minimum — so below that the page scrolls sideways.
     It stops being usable well before that: at 375px the description reads
     three words wide. One column from 760px down, then. The breakpoint is a
     judgment call and retunable: anything from 480 up removes the overflow,
     760 is where the layout starts being cramped rather than broken.
     #left's border-right would read as a stray rule down the page once it
     spans the full width, so it becomes the seam between the two stacked
     columns instead. */
  @media (max-width:760px){
    main{ grid-template-columns:1fr; }
    #left{ border-right:none; border-bottom:1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <button id="menuToggle">☰ Menu</button>
  <h1 id="pageTitle">ASHFALL</h1>
</header>
<div id="menuBackdrop"></div>
<aside id="sideMenu">
  <h2>Menu <button id="closeMenu">✕</button></h2>
  <div class="menu-section">
    <h3>Save / Load</h3>
    <div class="menu-actions">
      <button id="saveLocalBtn">Save to this browser</button>
      <button id="loadLocalBtn">Load from this browser</button>
      <button id="exportBtn">Export save file</button>
      <button id="importBtn">Import save file</button>
      <input type="file" id="importInput" accept="application/json" style="display:none;">
      <button id="restartMenuBtn">Restart game</button>
    </div>
  </div>
  <div class="menu-section"><h3>Stats</h3><div id="statsBox"></div></div>
  <div class="menu-section"><h3>Run</h3><div id="runBox"></div></div>
  <div class="menu-section">
    <div class="map-heading">
      <h3>Map</h3>
      <div id="mapZoomToggle">
        <button data-zoom="close" class="active">Close</button>
        <button data-zoom="wide">Wide</button>
        <button id="mapZoomIn">+</button>
        <button id="mapZoomOut">&minus;</button>
      </div>
    </div>
    <svg id="mapSvg" xmlns="http://www.w3.org/2000/svg"></svg>
  </div>
</aside>
<div id="locBar">
  <div id="locLabel"></div>
  <div id="rightBar">
    <span id="clockLabel"></span>
    <div id="gaitBar">
      <span>Pace</span>
      <button data-gait="sneak">Sneak</button>
      <button data-gait="walk" class="active">Walk</button>
      <button data-gait="fast">Jog</button>
    </div>
  </div>
</div>
<main>
  <div id="left">
    <p id="roomDesc"></p>
    <div id="log"></div>
    <div class="actions-group" id="moveGroup"><h2>Move</h2><div class="actions" id="moveActions"></div></div>
    <div class="actions-group" id="hereGroup" style="display:none;"><h2>Here</h2><div class="actions" id="hereActions"></div></div>
  </div>
  <div id="sidebar">
    <div class="panel">
      <h2>Inventory <span class="sub"><span id="invWeight"></span><button id="unequipBtn" class="mini" style="display:none;">Unequip</button></span></h2>
      <div class="tabs" id="invTabs"></div>
      <ul class="itemlist" id="invList"></ul>
    </div>
    <div class="panel">
      <h2>Here <span class="sub" id="worldWeight"></span></h2>
      <div class="tabs" id="worldTabs"></div>
      <ul class="itemlist" id="worldList"></ul>
    </div>
    <div class="panel">
      <h2>Craft <button id="craftBackBtn" class="mini" style="display:none;">&larr; Back</button></h2>
      <div id="craftBody"></div>
    </div>
  </div>
</main>
<script>
(function(){
  "use strict";
  // ==================================================
  // ARCHITECTURE
  // ==================================================
  // Ashfall is data-driven. Content (rooms/items) and mechanics (rules that
  // act on that content) are kept apart on purpose so future passes can
  // touch one without reading the other.
  //
  //   WORLD DATA   defines rooms, room properties, containers, items,
  //                exits, doors/windows, and environmental interactions.
  //   PLAYER STATE defines player position, inventory, equipment, vitals,
  //                time, and progression.
  //   UTILITIES    provide small reusable operations (formatting, lookup).
  //   SIMULATION   owns time-dependent consequences (decay, fire burn-down,
  //                collapse from exhaustion, game-over checks). STAMINA/FATIGUE
  //                is a sub-section living inside SURVIVAL/TIME SIMULATION, not
  //                a separate top-level section.
  //   ACTIONS      perform gameplay operations (move, take, craft, etc.)
  //                and are grouped by the system they belong to:
  //                INVENTORY/ITEM SYSTEM, WORLD INTERACTION, CRAFTING,
  //                FIRE/COOKING.
  //   PERSISTENCE  serializes/restores game state.
  //   UI/RENDERING displays current state; it should never contain rules.
  //
  // IMPORTANT RULE: content additions should normally modify WORLD DATA
  // only. Mechanics additions should touch ACTIONS/SIMULATION only when a
  // genuinely new mechanic is required. Do not duplicate mechanics inside
  // world/item definitions — prefer tags/capabilities (see ITEM DATA SCHEMA
  // below) over hard-coded name checks like `it.name === "Something"`.
  //
  // CONTENT vs MECHANICS, for future passes (including AI-driven ones):
  //   CONTENT PASS (new rooms/items/containers/exits/doors/descriptions):
  //     modify makeDefaultWorld(), item definitions, room definitions,
  //     containers, exits, doors/windows, descriptions. Do not touch
  //     movement/inventory/simulation code unless the content genuinely
  //     introduces a new mechanic.
  //   MECHANICS PASS: modify the smallest relevant function/section —
  //     survival/time -> advanceTime()/runAwakeStep()/recoveryStep(); inventory transfer ->
  //     the INVENTORY/ITEM SYSTEM section (doTake/doStore/getItemAt/etc.);
  //     tools -> hasTool()/tags; fire -> FIRE/COOKING; crafting ->
  //     CRAFTING; persistence -> PERSISTENCE. UI changes are separate from
  //     both — see RENDERING.
  //   Do not read the entire file unless the requested feature requires a
  //   mechanics change. _uid is the stable identity of an item; array
  //   indexes are temporary and must never be treated as stable identity.
  //   doRestart lives in PERSISTENCE, not SIMULATION, since it performs a
  //   full state reset rather than a time-driven update.
  //
  // WORLD DATA also carries LOCATIONS — real integer (x,y,z) coordinates
  // (meters) for every street/mid-block node and building floor, keyed by
  // `locationId` on every room. LOCATIONS is read by both MAP rendering
  // and movement: exitMinutes()/locationDistance() compute
  // cross-Location travel distance, and applyComputedDirections() (run once
  // at world-build time) derives compass words for cross-Location exit
  // labels via computeDirection(). See the LOCATIONS comment below for the
  // coordinate convention.
  //
  // Item identity: every item that can appear in a UI detail view gets a
  // stable `_uid` (see ensureUid/findItemByUid below). Array indexes are
  // NOT stable identity — a list can be mutated (splice/merge) between the
  // moment a UI element is built and the moment its handler runs. Any code
  // that resolves "the item the user clicked on" must do so by _uid, not
  // by a previously-captured index. Indexes are fine only as a short-lived
  // lookup within a single already-validated operation.
  // ==================================================

  // ==================================================
  // CONFIG / CONSTANTS
  // ==================================================
  const GAME_CONFIG = { VERSION: "0.6.1" };
  function versionCompat(v){ const p = v.split("."); return p[0] + "." + p[1]; }
  const STACKABLE = new Set(["Food","Medical","Materials"]);
  const SAVE_KEY = "ashfall_save_v" + versionCompat(GAME_CONFIG.VERSION);
  // Floor on the cost of one movement, in game minutes — applied two ways,
  // and the two branches are not a redundancy to be tidied away.
  //
  // Grid travel (street/mid-block nodes, what isGridTravel() marks) is
  // floored in proportion to distance: MIN_MOVE_MIN per BLOCK_M. A flat
  // per-move floor priced the two routes across one block differently —
  // stopping at the mid-block node cost +44% at Walk and +100% at Jog against
  // the single 100 m move with the same endpoints — and the mid-block nodes
  // are where the trees, the parked cars, the building entrances and the
  // loose floor items hang, so the toll fell on looking around. The
  // proportional form was chosen, not stumbled into: both routes now cost the
  // same at every gait.
  //
  // Everything else keeps the flat floor, and that branch is load-bearing:
  // 22 of the 774 exits are building entrances whose two Locations sit at
  // identical coordinates, so their computed distance is 0. A proportional
  // floor would floor them at zero and make them free. They are non-grid
  // exits, so isGridTravel() already routes them to the flat branch.
  //
  // The floor also settles the pace question: pace is a journey-scale choice,
  // not a per-block one. With the floor at 1 minute per block, one 100 m
  // block costs 1.00 minute at Jog against Walk's 1.39 — a 28% saving, not
  // the 40% that Jog's 67%-higher speed implies. That is the intended
  // behaviour: the gait selector is meant to pay off over a route, not over
  // one step, which is why the floor is not lowered further.
  const MIN_MOVE_MIN = 1;
  // The grid pitch in metres, which moveMinutes() divides by to scale the
  // grid floor. A second statement of the figure the LOCATIONS comment gives
  // as "Block size 100m" and that every street coordinate embodies; it earns
  // a name because a formula, not a table, now depends on it.
  const BLOCK_M = 100;
  // Floor on any duration the UI prints, in game minutes. Equal to
  // MIN_MOVE_MIN today and a separate constant on purpose: retuning the
  // movement floor must not silently re-round Rest, Sleep, Search, fishing,
  // craft times and the fire's fuel readout along with it.
  //
  // The floor stays, and the gap it opens between the printed and the charged
  // time is accepted rounding rather than an oversight. It became visible
  // when grid travel's floor was made proportional to distance (see
  // MIN_MOVE_MIN): a 50 m half-move costs 0.694 min at Walk and 0.500 at Jog
  // and prints (0:01) for both, so two half-moves through a mid-block display
  // 2 minutes against ~1.39 actually spent at Walk. A button that printed
  // (0:00), or one that printed a fraction, would both be worse than being a
  // little generous about a figure the clock already shows to the minute.
  // Three callers can go sub-minute: the Move and Here exit buttons via
  // exitMinutes(), estimateSleepMinutes() — sleepAvailable() only requires
  // Energy below the ceiling, so the gap can be arbitrarily small — and
  // fmtDuration(room.fireMinutesLeft) in renderLocationPanel(), which
  // decrements continuously toward zero. Every other caller is fed a fixed
  // constant of 5 minutes or more and can never reach the floor.
  const MIN_DISPLAY_MIN = 1;
  const GAITS = { sneak:{speed:0.6}, walk:{speed:1.2}, fast:{speed:2.0} };
  // The length of a game day, in minutes. The clock, the day number and the
  // vital decay rates all derive from this one figure.
  const MINUTES_PER_DAY = 1440;
  // Points per game minute: hunger empties over three game days, thirst and
  // energy over one.
  const DECAY = { hunger:100/(3*MINUTES_PER_DAY), thirst:100/MINUTES_PER_DAY, energy:100/MINUTES_PER_DAY };
  const CAMPFIRE_KIT_COST = 3;
  // The roll source's constants (see chance() in CORE UTILITIES). FNV-1a's
  // published 32-bit offset basis and prime — fixed by the algorithm, not
  // tunable. KEY_SEP joins a roll's key parts: the unit separator, a character
  // that cannot occur in a room, container, pool or item id, so ("a","bc")
  // and ("ab","c") can never produce the same key. Any such character would
  // do; the point is that one exists.
  const FNV_OFFSET_BASIS = 2166136261;
  const FNV_PRIME = 16777619;
  const KEY_SEP = "\u001F";
  // ==================================================
  // STAMINA / FATIGUE SYSTEM CONSTANTS
  // ==================================================
  // See the v0.2.1 entry in CHANGELOG.md for the full rules.
  // Tasks declare Exertion; this system alone decides how Exertion affects
  // Stamina/Fatigue. Do not duplicate this logic inside tasks.
  // Each task's own Exertion figure is declared beside that task, not here —
  // chopping and fishing in FIRE / COOKING, jogging above doMove(). This
  // block owns only what Exertion *does*, which is why no task constant is
  // left in it.
  const STAMINA_RECOVERY_DELAY_MIN = 1;    // game minutes of non-exertion before recovery starts
  const BASELINE_STAMINA_RATE = 1;         // Stamina/minute, awake baseline
  const REST_STAMINA_RATE = 0.5;           // Stamina/minute during Rest
  const FATIGUE_RECOVERY_RATE = 0.5;       // Fatigue/minute
  const REST_DURATION_MIN = 60;
  const SLEEP_ENERGY_RATE = 10/60;         // Energy/minute (10/hour)
  const SLEEP_COOLDOWN_MIN = 8*60;         // must stay awake 8 game hours after waking
  // 30 is an initial balance value with no prior convention behind it —
  // retunable, and deliberately one knob per vital.
  const LOW_HUNGER_THRESHOLD = 30;
  const LOW_THIRST_THRESHOLD = 30;
  // The Fatigue at which the pace bar locks to Sneak. Not a balance knob in
  // the way the two above are — it is the top of the Fatigue scale, and
  // gaitLocked() is its only reader. Named here because the rule it states
  // was previously a bare 100 written at two call sites, neither of which
  // owns Fatigue.
  const FATIGUE_GAIT_LOCK = 100;
  const RECIPES = [
    { id:"bandage", label:"Craft a bandage",
      inputs:[ {id:"cloth",qty:2}, {id:"duct_tape",qty:1} ], minutes:5,
      output:{ id:"bandage" } },
    { id:"campfire_kit", label:"Craft a campfire kit",
      inputs:[ {id:"firewood",qty:CAMPFIRE_KIT_COST} ], minutes:15,
      output:{ id:"campfire_kit" } }
  ];
  const HEAT_RECIPES = [
    { id:"cook_fish", input:"raw_fish",
      output:{ id:"cooked_fish" },
      minutes:15 }
  ];
  function clamp(v){ return Math.max(0, Math.min(100, v)); }

  // ==================================================
  // WORLD DATA
  // ==================================================
  // ROOM SCHEMA (one entry per key in the object returned by
  // makeDefaultWorld()):
  //   id            (the object key itself) room identifier
  //   address       the street or intersection the room is at, as a display
  //                 string, e.g. "Poplar St" / "Dock St & 6th St". Required on
  //                 every room, never empty. THE ADDRESS RULE: a room's address
  //                 is the street it is on, and a building fronts a street,
  //                 never a corner. A street/mid-block node's address is its own
  //                 location — including an intersection node, which genuinely
  //                 is at a corner and keeps its "<Street> St & <N>th St"
  //                 string. A room *inside* a building takes the named street
  //                 that building fronts, even when the building sits on an
  //                 intersection node: the Police Station is entered from
  //                 maple3rd but its address is "Maple St", not
  //                 "Maple St & 3rd St".
  //   building      the NAME of the building this room is inside, e.g.
  //                 "Acorn Apartments". Absent when the room is not inside a
  //                 named building (every street/mid-block node, the alley, and
  //                 the three flats above the Main St shops — a flat over a shop
  //                 is not inside the shop). It holds a building's name and
  //                 nothing else, ever: not a street, not an address. Note that
  //                 doors[].building and master_key.building are a DIFFERENT
  //                 field holding a building *id* ("acorn"), unrelated to this.
  //   area          floor/apartment/street grouping, e.g. "2A"
  //   room          room type/name, e.g. "Kitchen"
  //   shelter       "none" | "partial" | "full" — whether the room is under
  //                 cover. Required on every room. "partial" is cover without
  //                 enclosure: a balcony under the building's roof overhang, a
  //                 street node under a conveyor bridge, a block with a bus
  //                 shelter in it. Nothing reads shelter today — it is laid
  //                 down ahead of its consumers (#58 weather, #6 rooftops) the
  //                 same way LOCATIONS' z is, so those passes need no retrofit
  //                 across every room. An unused field here is not a dead one.
  //                 It is also NOT cannotHaveFire and must never be derived
  //                 from it: the two are not coextensive, and the divergence
  //                 runs both ways — the two balconies and the 1A patio carry
  //                 cannotHaveFire without being fully under cover, and the two
  //                 partial street nodes are covered and can still host a fire.
  //                 They are different facts (a fire rule vs. being under
  //                 cover). The pass that adds the first consumer also inherits
  //                 shelter's save backfill — backfillRoomAddresses()
  //                 deliberately does not restore it, since nothing reads it.
  //   desc          description shown to the player
  //   floor         array of loose item objects (see ITEM DATA SCHEMA)
  //   floorCap      maximum loose-item capacity in kg
  //   containers    array of container objects (see CONTAINER SCHEMA)
  //   carContainers optional array of vehicle container objects
  //   exits         array of movement definitions (see EXIT SCHEMA)
  //   locationId    key into LOCATIONS (see below) — real (x,y,z) position.
  //                 Street/mid-block rooms use their own room id as their
  //                 locationId; every room on one building floor shares
  //                 that floor's locationId. Required on every room.
  // Optional environmental properties:
  //   sleepSpot      e.g. "couch"/"bed" — enables the Sleep action
  //   hasStove       room has a working stove (heat source, no fire needed)
  //   cannotHaveFire room may not host a campfire
  //   fishable       room supports the Go Fishing action
  //   hasTree        room has a choppable tree
  //   searched       whether the room's hidden search has been performed
  //   searchLabel    action label shown before searching
  //   searchMinutes  time cost of searching
  //   carLocked      whether a vehicle in the room is locked
  //   heatActive     a fire/stove is currently burning here
  //   fireMinutesLeft remaining fuel minutes for an active fire
  //   campfireBuilt  a campfire structure has been assembled here
  //
  // CONTAINER SCHEMA:
  //   { id, name, capacityKg, items: [] }
  //   Optional: locked, breakTag (tag required to force it open)
  //   Optional (spawn pools — see SPAWN_POOLS below):
  //     spawnPools       string[] of SPAWN_POOLS ids this container draws
  //                      from. Absence means the container is never
  //                      touched by the spawn system (purely hand-authored).
  //     spawnRolled      whether the initial roll has happened. Set true
  //                      at authoring time on any container that already
  //                      ships with hand-placed contents. The roll appends
  //                      (addToList), so it would never overwrite them —
  //                      what the flag prevents is hand-placed contents
  //                      being topped up with rolled loot.
  //     lastRolledMinute state.totalMinutes at the last roll. Not consumed
  //                      by any mechanic yet — reserved for a future
  //                      respawn cycle (#15).
  //
  // EXIT SCHEMA (one of):
  //   Same-Location:  { to, label, distanceM } — distanceM is hand-authored.
  //   Cross-Location: { to, label } — no distanceM/block/blockHalf; travel
  //                   time is computed from the two rooms' LOCATIONS entries
  //                   by exitMinutes()/locationDistance() (see WORLD
  //                   INTERACTION). Compass words inside `label`, if any,
  //                   are substituted at build time by computeDirection()
  //                   from the same LOCATIONS data.
  //   Optional (either kind): doorId (exit is gated by a door in `doors`)
  //
  // ITEM DATA SCHEMA:
  //   Shared item properties (name, category, unitWeight, tags, etc.) are
  //   defined ONCE per item in ITEM_REGISTRY below, keyed by a stable id.
  //   Rooms/containers place instances by reference — { id, qty } — via
  //   itemsFromRegistry(), never by repeating the full item definition.
  //   `overrides` on a placement ref is for genuine per-instance state only
  //   (e.g. a specific unit's current durability), never for properties
  //   that should be shared — those belong in the registry entry itself,
  //   so an item's definition is never duplicated across placements.
  //   Basic item: { name, category, qty, unitWeight }
  //   Optional properties:
  //     tags          capability tags used by mechanics instead of name
  //                   checks. Read by a mechanic today: blunt, cutting,
  //                   chopping, fishing, tackle, fire-starter, battery,
  //                   can-opening. `can-opening` means "can get a can
  //                   open", not "is a can opener" — doOpen() asks
  //                   hasTool() for it, so every item that could work a lid
  //                   off carries it, not just the dedicated tool.
  //                   Declared, with no consumer yet: blade, prying, heat
  //                   — an item carrying one of these makes a claim nothing
  //                   currently acts on, which is correct to write and not
  //                   yet load-bearing. `heat`
  //                   sits in that second group despite having a reader:
  //                   roomHasHeat() exists, but its only caller is
  //                   canCraft()'s needsHeat branch, which no recipe sets.
  //     durability    { current, max, mode } — mode is "uses" or "time"
  //     restores      { hunger, thirst } — consumable effect
  //     verb          display/use verb, e.g. "Eat", "Drink"
  //     sealed        packaged-item state. `true` on a registry entry means
  //                   every instance starts sealed; doOpen() flips it to
  //                   false on the one instance it opens. Absence is the
  //                   common case and means the item is not a packaged
  //                   thing at all, so all three states — undefined, true,
  //                   false — are distinguishable and meaningful. A sealed
  //                   item is not food yet: Eat is withheld until it is
  //                   opened, and addToList() will not merge a sealed stack
  //                   with an opened one.
  //     opensWith     capability tag required to open a sealed item (see
  //                   `tags`). Absent on a sealed item means it opens by
  //                   hand.
  //     slotType      equipment/container slot key, e.g. "backpack"
  //     slotLabel     inventory-tab label for that slot, when capitalizing
  //                   the slot key isn't good enough (e.g. "Fanny Pack")
  //     capacityKg    capacity of an equippable container item
  //     contents      stored contents when an equipped container is
  //                   unequipped back into a stowable item
  //     on            powered-equipment on/off state
  //     hasBatteries  powered-equipment battery-installed state
  //     drainRate     durability loss per minute while `on`
  //     illnessChance chance that eating this item causes illness, as a
  //                   fraction in [0,1] — the file's one probability
  //                   convention (see chance()). Pre-0.6 saves carry it as
  //                   a percent; backfillIllnessScale() repairs them.
  //     masterKey     key unlocks every door in `building`
  //     building      building association for a masterKey
  //     doorId        specific door a (non-master) key unlocks
  //     isWatch       grants access to the clock display
  //   Prefer data/capabilities (tags, `use` strings) over hard-coded item
  //   names in mechanics code; the existing tag system is the primary
  //   mechanism for tool checks (see hasTool()).
  // ==================================================

  // itemFromRegistry/itemsFromRegistry expand a { id, qty, overrides? }
  // placement reference into a full runtime item object, deep-cloned from
  // ITEM_REGISTRY so no two placements ever share mutable state (tags
  // arrays, durability objects). `overrides` is for genuine per-instance
  // state only (e.g. a specific unit's current durability) — shared
  // properties belong in the registry, never repeated at the call site.
  function itemFromRegistry(ref){
    const def = ITEM_REGISTRY[ref.id];
    if(!def) throw new Error("Unknown item id: " + ref.id);
    const item = JSON.parse(JSON.stringify(def));
    item.itemId = ref.id;
    item.qty = ref.qty;
    if(ref.overrides) Object.assign(item, JSON.parse(JSON.stringify(ref.overrides)));
    return item;
  }
  function itemsFromRegistry(refs){
    return refs.map(itemFromRegistry);
  }

  // CONTAINER_SLOTS / SLOT_LABELS: the equipment slots the player can
  // carry things in, derived from ITEM_REGISTRY rather than listed by hand,
  // so adding an equippable bag is a registry edit and nothing else —
  // PLAYER STATE, the inventory pools and RENDERING all read these instead
  // of naming slots individually. `keychain` is named explicitly because it
  // is the one slot
  // that isn't a found item: makeDefaultState() ships it populated, and
  // keychainAllows() restricts it to Key items. That restriction is specific
  // to the keychain and is deliberately not inherited by any other slot.
  const CONTAINER_SLOTS = ["keychain"].concat(
    Object.values(ITEM_REGISTRY).filter(d => d.slotType).map(d => d.slotType)
      .filter((s, i, all) => all.indexOf(s) === i));
  const SLOT_LABELS = (function(){
    const out = { keychain:"Keychain" };
    Object.values(ITEM_REGISTRY).forEach(d=>{
      if(d.slotType && !out[d.slotType]) {
        out[d.slotType] = d.slotLabel || d.slotType.charAt(0).toUpperCase() + d.slotType.slice(1);
      }
    });
    return out;
  })();

  // SPAWN_POOLS: per-entry-chance loot tables, sibling registry to
  // ITEM_REGISTRY. A container opts in via its `spawnPools` field (see
  // CONTAINER SCHEMA above); doOpenContainer() (WORLD INTERACTION) rolls
  // each pool independently the first time such a container is opened, via
  // rolledLootFor(), keyed on the run's seed and the container's identity —
  // so what a container holds is fixed by the world, not by when it is opened.
  //   emptyChance  0-1 chance the whole pool produces nothing. Rolled once,
  //                ahead of the entries, and gates all of them.
  //   entries    [{ itemId, chance, qtyMin, qtyMax }] — every entry is
  //              rolled once, independently of every other, in declaration
  //              order, so an entry contributes at most one stack per roll
  //              and items land in the order the pool lists them. A pool
  //              must not list one itemId twice, nor a container one pool id
  //              twice: the roll is keyed by those ids, so a repeat would
  //              roll identically (validateReachability() reports both).
  //              `chance` is a number in (0,1] and is CONDITIONAL: it is
  //              the probability this entry appears given the pool did not
  //              come up empty. The unconditional probability of the item
  //              being in the container is therefore
  //                  P(appears) = (1 - emptyChance) * chance
  //              so `chance:0.55` in a pool with `emptyChance:0.25` means
  //              41% of containers, not 55%. `qtyMin`/`qtyMax` decides how
  //              many of that item spawn once the entry hits.
  // Every `chance` below is derived, not chosen, with two exceptions. The
  // v0.5.1 conversion computed each one from the weight/rollCount lottery it
  // replaced, so that P(appears) carried across entry by entry; that is why
  // they read 0.245069 rather than 0.25. An ugly six-decimal number here is
  // still the signal that nobody has picked it — it is a derived figure, not a
  // judgment. See the v0.5.1 entry in CHANGELOG.md for the model and the
  // formula.

  //   (0.20) and `hardware_store` (0.23). The screwdriver postdates the
  //   conversion and has no lottery weight to carry across, so both were

  // LOCATIONS: real integer (x,y,z) coordinates in meters for every

  // (0,0,0) = maple4th (town SW corner), street level. +X = east, +Y =
  // north, +Z = up. Block size 100m; floor height 3m (no basements/roofs
  // yet — this is the convention for when they're added). Every room
  // carries a `locationId` key into this table (see ROOM SCHEMA above).
  //   Street/mid-block Locations: id = the room id itself, z:0, (x,y) =
  //   the former MAP_NODES {col,row} * 100 (same grid, just scaled to
  //   real meters). The grid:
  //     col -1..6 = 6th, 4th, 2nd, 1st(center), 3rd, 5th, 7th, 9th St
  //     (west->east; the centered even/odd scheme — evens west of 1st,
  //     odds east, magnitude growing with distance from center).

  //     grew *away* from the water, so Elm/Cedar/Mill/Dock all sit south
  //     of Maple: Elm/Cedar continue the residential tree-name ring,
  //     Mill/Dock are the industrial and rail-freight edge. Origin
  //     (0,0,0) is maple4th, which is why the grid has negative x and y.

  // Straight-line distance between two Locations, rounded to the nearest
  // whole meter. Computed on demand, never cached — LOCATIONS is the
  // single source of truth.
  function locationDistance(a, b){
    const A = LOCATIONS[a], B = LOCATIONS[b];
    return Math.round(Math.sqrt((B.x-A.x)**2 + (B.y-A.y)**2 + (B.z-A.z)**2));
  }
  // Compass direction from Location `a` to Location `b`, derived from real
  // coordinates. Two Locations at the same point have no direction between
  // them and resolve to `null` — that is a different case from pure vertical
  // movement, which resolves to up/down, and the two must not be collapsed:
  // a building floor shares its street node's (x,y) *and* its z, while a
  // rooftop or an upper floor differs in z and is genuinely above. Otherwise
  // the larger of |dx|/|dy| wins, and a true diagonal tie (not expected on
  // the current rectilinear grid) defaults to the north/south axis.
  function computeDirection(a, b){
    const A = LOCATIONS[a], B = LOCATIONS[b];
    const dx = B.x - A.x, dy = B.y - A.y, dz = B.z - A.z;
    if(dx === 0 && dy === 0 && dz === 0) return null;
    if(dx === 0 && dy === 0) return dz > 0 ? "up" : "down";
    if(Math.abs(dx) === Math.abs(dy)) return dy > 0 ? "north" : "south";
    if(Math.abs(dx) > Math.abs(dy)) return dx > 0 ? "east" : "west";
    return dy > 0 ? "north" : "south";
  }
  // Build-time pass: for every exit that crosses between two different
  // Locations and whose label already contains an explicit compass word,
  // replace that word with the one computed from real coordinates. Runs
  // once, right after the world is assembled.
  // Labels with no compass word (building entrances, floor transitions,
  // etc.) are left exactly as authored.
  // When the two Locations sit at the same point there is no direction to
  // substitute, so the label is left as authored there too — and because a
  // compass word on such an exit is an authoring mistake that reads as
  // perfectly good English ("Head east into the pharmacy"), that one case
  // warns. A same-point exit with no compass word is the ordinary building
  // entrance and stays silent.
  const COMPASS_WORD_RE = /\b(north|south|east|west)\b/i;
  function applyComputedDirections(world){
    for(const roomId in world){
      const room = world[roomId];
      if(!room.exits) continue;
      for(const exit of room.exits){
        const toRoom = world[exit.to];
        if(!toRoom || toRoom.locationId === room.locationId) continue;
        const match = exit.label.match(COMPASS_WORD_RE);
        if(!match) continue;
        const dir = computeDirection(room.locationId, toRoom.locationId);
        if(dir === null){
          console.warn(`applyComputedDirections: ${roomId} -> ${exit.to} label "${exit.label}" contains a compass word, but Locations ${room.locationId} and ${toRoom.locationId} are the same point — there is no direction between them. Label left as authored; rewrite it without the compass word.`);
          continue;
        }
        exit.label = exit.label.slice(0, match.index) + dir + exit.label.slice(match.index + match[0].length);
      }
    }
    return world;
  }

  // The roll core. There is no PRNG cursor: a roll is a pure function of the

      // one that has been opened both stack as "not sealed". Without this

    // shallow copy of a source item (see doTake/doStore/giveItem) made with

    if(invTab === "keychain" && !keychainAllows(item)) return { ok:false, reason:"keychain" };
    const weight = item.qty * item.unitWeight;
    if(dst.capacityKg && totalWeight(dst.items) + weight > dst.capacityKg) return { ok:false, reason:"capacity" };
    addToList(dst.items, item);
    return { ok:true };
  }
  function giveItem(item){
    const room = world[state.currentRoom];

    const floorFull = room.floorCap && totalWeight(room.floor) + weight > room.floorCap;
    addToList(room.floor, item);
    if(result.reason === "keychain"){
      log(`Your keychain can't hold that — the ${item.name.toLowerCase()} drops to the floor instead.`, "warn");
    } else if(floorFull){
      log(`No room anywhere — the ${item.name.toLowerCase()} ends up in a heap on the already-cluttered floor.`, "warn");
    } else {
      log(`No room for the ${item.name.toLowerCase()} — it drops to the floor instead.`, "warn");

    if(tab === "inventory") return state.inventory;

    if(tab === "floor") return { items:room.floor, capacityKg:room.floorCap };

    if(!c && room.carContainers) c = room.carContainers.find(x=>x.id===tab);

  }

    return invPools().some(list => list.some(it => it.tags && it.tags.includes(tag)));

  function hasWatch(){
    return invPools().some(list => list.some(it => it.isWatch));

  // ==================================================
  // INVENTORY / ITEM SYSTEM — quantity-changing transfers
  // ==================================================
  // Safety rules for every function below:
  //  1. Resolve the source item defensively (getItemAt) — never trust that
  //     `index` still points at something.
  //  2. Normalize the requested quantity explicitly: `qty == null ? it.qty
  //     : qty`, NOT `qty || it.qty` (0 is a legitimate — if useless —
  //     input, and must not silently become "the whole stack").
  //  3. Validate 1 <= moveQty <= it.qty before touching anything.
  //  4. Check destination capacity BEFORE mutating the source, so a failed
  //     transfer changes nothing (atomic).
  //  5. Only remove the source stack once its qty reaches exactly zero.
  //  6. Re-render, which re-resolves detailItem by _uid — never leave a
  //     stale index/reference hanging around after this returns.
  function normalizeQty(requested, available){
    const q = requested == null ? available : requested;
    if(!Number.isFinite(q)) return null;
    const rounded = Math.floor(q);
    if(rounded < 1 || rounded > available) return null;
    return rounded;
  }
  function doTake(index, qty){
    const room = world[state.currentRoom];
    const src = worldSlot(room, worldTab);
    const it = getItemAt(src && src.items, index);
    if(!it) return; // stale reference — nothing to take, fail silently and let render() resync
    const moveQty = normalizeQty(qty, it.qty);
    if(moveQty == null) return;
    const result = addToDestination({ ...it, qty:moveQty });
    if(!result.ok){
      if(result.reason === "capacity") log("That won't fit — not enough room there.", "warn");
      return; // no-destination and keychain-restricted stay silent, matching the disabled/hidden button state
    }
    it.qty -= moveQty;
    if(it.qty <= 0) src.items.splice(index,1);
    // No log line: the item visibly moves between the Here and Inventory
    // panels, so the line only repeated what the screen already showed.
    // The capacity warning above still speaks.
    render();
  }
  function doStore(index, qty){
    const room = world[state.currentRoom];
    const dst = worldSlot(room, worldTab);
    const src = invSlot(invTab);
    const it = getItemAt(src && src.items, index);
    if(!it || !dst) return;
    const moveQty = normalizeQty(qty, it.qty);
    if(moveQty == null) return;
    if(dst.capacityKg && totalWeight(dst.items) + moveQty*it.unitWeight > dst.capacityKg){
      log("That won't fit there.", "warn");
      return;
    }
    addToList(dst.items, { ...it, qty:moveQty });
    it.qty -= moveQty;

    // The capacity warning above still speaks.
    render();

  function doConsume(sourceKind, index){
    const room = world[state.currentRoom];

    const it = getItemAt(src && src.items, index);
    if(!it || !it.restores || it.sealed) return;

    if(it.restores.thirst) state.vitals.thirst = clamp(state.vitals.thirst + it.restores.thirst);

    // share every time-based key; rollSeq tells them apart. The roll and the
    // advance happen whenever the item can cause illness, even if the player

    // short-circuit consumed draws in. Hoisting the already-ill test into

    if(it.illnessChance){

  // Opening is a transformation, not a gate on eating: a sealed can is not

  function doOpen(sourceKind, index){
    const room = world[state.currentRoom];
    const src = sourceKind === "world" ? worldSlot(room, worldTab) : invSlot(invTab);
    const it = getItemAt(src && src.items, index);
    if(!it || !it.sealed) return;
    if(it.opensWith && !hasTool(it.opensWith)) return;
    it.qty -= 1;
    if(it.qty <= 0) src.items.splice(index, 1);

    const opened = addToList(src.items, { ...it, qty:1, sealed:false });

  }
  function doEquip(sourceKind, index){

    if(!it || !it.slotType) return;
    if(state[it.slotType]){ log("You're already carrying something in that slot.", "warn"); return; }

    state[it.slotType] = { itemId: it.itemId, name:it.name, unitWeight:it.unitWeight,

  }
  function doUnequip(slotKey){
    const slot = state[slotKey];

    // The fallback is reached by exactly two things and is not dead code:

    const item = slot.itemId

  // ==================================================
  // INVENTORY / ITEM SYSTEM — item-detail action list

  function getItemActions(list, index, side){

      const keychainBlocked = invTab==="keychain" && !keychainAllows(it);

      if(splittable && it.qty>=3)
        actions.push({ label:"Take Half", disabled: keychainBlocked, onClick:()=>doTake(index, Math.ceil(it.qty/2)) });
      if(splittable && it.qty>1)
        actions.push({ label:"Take 1", disabled: keychainBlocked, onClick:()=>doTake(index,1) });
    } else {
      const verb = worldTab==="floor" ? "Place" : "Store";
      actions.push({ label: verb + " All", onClick:()=>doStore(index) });
      if(splittable && it.qty>=3)
        actions.push({ label: verb + " Half", onClick:()=>doStore(index, Math.ceil(it.qty/2)) });
      if(splittable && it.qty>1)

    if(it.restores && !it.sealed) actions.push({ label: it.verb || "Use", onClick:()=>doConsume(side, index) });

  // ==================================================
  // WORLD INTERACTION
  // ==================================================
  function doorsForRoom(roomId){
    return Object.keys(doors).filter(id => doors[id].sides.includes(roomId));
  }
  // The exits a room loses when a door is shut. `doors[].sides` names the two
  // rooms a door physically separates; `doorId` on an exit names the exits that
  // door actually blocks, and the two are not the same set — 2B's kitchen,
  // bathroom and bedroom each leave through the "2b" door without being one of
  // its sides. Anything the player is told about a shut door is driven from
  // here, so the rooms that lose an exit are the rooms that explain it. Reads
  // raw `room.exits` on purpose: `getExitsForRoom()` is what drops a locked
  // exit, which is exactly what has to be reported. Deduped by door, so a
  // future room with two exits through one door says it once.
  function gatedExitsForRoom(roomId){
    const room = world[roomId];
    if(!room || !room.exits) return [];
    const seen = [];
    const gated = [];
    room.exits.forEach(e=>{
      if(!e.doorId || !doors[e.doorId] || seen.includes(e.doorId)) return;
      seen.push(e.doorId);
      gated.push({ doorId:e.doorId, to:e.to });
    });
    return gated;
  }
  // Every door a room touches: the ones it adjoins as a `sides` member, then
  // the ones only its exits pass through. The union, not either half — 2B's
  // kitchen leaves through the "2b" door without being one of its sides, and a
  // room a door adjoins keeps its key actions even if one of its exits
  // through that door is authored without a doorId, as 2A's four were until
  // v0.6.1. `doorsForRoom()` first keeps every key panel's existing label
  // order intact.
  function doorsTouchingRoom(roomId){
    const ids = doorsForRoom(roomId);
    gatedExitsForRoom(roomId).forEach(e=>{ if(!ids.includes(e.doorId)) ids.push(e.doorId); });
    return ids;
  }

  // naming by area would call it "1A" from inside 1A; and `hallway2` carries

  function absoluteMinute(){ return Math.round(DAY_START_MIN + state.totalMinutes); }
  function dayNumber(){ return 1 + Math.floor(absoluteMinute()/MINUTES_PER_DAY); }

  // duplicated fact this table exists to prevent.
  const TIME_OF_DAY_BANDS = [
    { from: 0,     label:"late night" },
    { from: 5*60,  label:"dawn" },
    { from: 7*60,  label:"morning" },
    { from: 12*60, label:"midday" },

  function isGridTravel(fromId, toId){
    const from = world[fromId], to = world[toId];

  // ==================================================
  // WORLD INTERACTION (continued) — movement, doors, windows, containers

  const JOG_EXERTION_PER_MIN = 0.5;
  function doMove(exit){
    const minutes = exitMinutes(exit);

  function doRest(){
    // Rest recovers Stamina/Fatigue without the recovery Energy surcharge,
    // but baseline awake Energy consumption still applies and Rest does not
    // restore Energy itself.
    let remaining = REST_DURATION_MIN;
    while(remaining > 1e-9){
      const dt = Math.min(1, remaining);
      state.totalMinutes += dt;
      applyHungerThirst(dt);
      applyWorldTicking(dt);
      recoveryStep(dt, "rest");
      remaining -= dt;

    // player wakes. `ceiling` is that snapshot — read once, before the
    // loop, and the loop measures against it rather than re-deriving it.
    const ceiling = sleepEnergyCeiling();
    const missingEnergy = Math.max(0, ceiling - state.vitals.energy);
    let remaining = missingEnergy / SLEEP_ENERGY_RATE;
    while(remaining > 1e-9){
      const dt = Math.min(1, remaining);

  // The items a container's pools yield, as a pure function of the run's seed
  // and the container's identity. No mutation, no state read but state.seed —
  // so the same container yields the same contents whether it is opened first
  // or fiftieth, and whether it is opened at all. That last property is what
  // lets a seed be evaluated without playing it (#150).
  //
  // Within a pool, emptyChance gates the whole pool and then every entry is
  // rolled once against its own `chance` — no entry can be drawn twice, so a
  // roll yields at most one stack per entry. Entries are walked in
  // declaration order, which is the order they land in the container. Keys
  // name the pool and the item by id, never by array index, so reordering a
  // container's spawnPools or a pool's entries during authoring does not

  function rolledLootFor(roomId, container){
    const out = [];
    (container.spawnPools || []).forEach(poolId=>{
      const pool = SPAWN_POOLS[poolId];
      if(!pool) return; // defensive — an unknown pool id contributes nothing
      if(chance(pool.emptyChance, "loot", roomId, container.id, poolId, "empty")) return;

  function doOpenContainer(room, container){

  // ==================================================
  // SURVIVAL / TIME SIMULATION

  // Health drain while a vital sits at zero or an illness is running: game
  // minutes per point of Health lost. Balance values, all retunable.
  const STARVATION_MINUTES_PER_HEALTH = 30;
  const DEHYDRATION_MINUTES_PER_HEALTH = 15;
  const ILLNESS_MINUTES_PER_HEALTH = 20;
  const ILLNESS_DURATION_MIN = 180;

  // applyDecay used to do in one shot. They're split out so Sleep (which
  // suspends the awake Energy/Stamina/Fatigue system) can run Hunger/Thirst
  // and world ticking without the awake Energy baseline, and so the
  // Stamina/Fatigue system can drive Energy's *recovery* multiplier without
  // duplicating the baseline-depletion math.
  function applyHungerThirst(min){
    state.vitals.hunger = clamp(state.vitals.hunger - DECAY.hunger*min);
    state.vitals.thirst = clamp(state.vitals.thirst - DECAY.thirst*min);
    if(state.vitals.hunger <= 0) state.vitals.health = clamp(state.vitals.health - min/STARVATION_MINUTES_PER_HEALTH);
    if(state.vitals.thirst <= 0) state.vitals.health = clamp(state.vitals.health - min/DEHYDRATION_MINUTES_PER_HEALTH);
    if(state.illnessMinutesLeft > 0){
      const tick = Math.min(min, state.illnessMinutesLeft);
      state.vitals.health = clamp(state.vitals.health - tick/ILLNESS_MINUTES_PER_HEALTH);
      state.illnessMinutesLeft -= tick;
    }
  }
  function applyWorldTicking(min){
    invPools().forEach(list=>{
      list.forEach(it=>{
        if(it.on && it.durability){
          it.durability.current = Math.max(0, it.durability.current - it.drainRate*min);
          if(it.durability.current <= 0){
            it.on = false;
            log(`Your ${it.name.toLowerCase()} runs out of battery and shuts off.`, "warn");
          }
        }
      });
    });

      const r = world[id];

  // Tasks own their duration/execution/success; they only ever *declare*

  // what Exertion does to Stamina/Fatigue, and how Energy modifies or is
  // spent by recovery — keeping Stamina out of the task layer entirely.
  function applyExertion(exertion){
    if(exertion <= 0) return;

    const staminaUsed = Math.min(v.stamina, exertion);
    v.stamina = Math.max(0, v.stamina - staminaUsed);

    const e = state.vitals.energy;

    if(e >= 40) return 0.75;
    if(e >= 20) return 0.50;
    return 0.25;
  }
  function staminaMaxForEnergy(){
    const e = state.vitals.energy;
    if(e >= 40) return 100;
    if(e >= 20) return 80;
    return 50;
  }

    let penalty = 0;

    if(state.vitals.thirst < LOW_THIRST_THRESHOLD) penalty += 0.15;

    return state.vitals.fatigue > 0 && state.vitals.stamina >= staminaMaxForEnergy();

  // coerced: at FATIGUE_GAIT_LOCK the lock supplies an *effective* gait

  // itself once Fatigue falls. Two predicates rather than one because they
  // answer different questions: gaitLocked() is what the click guard and the
  // button-disabling want, effectiveGait() is what movement pricing wants.
  // Everything that prices or charges movement must read effectiveGait() —
  // moveMinutes() and doMove()'s jog surcharge both do, which is what keeps

  function gaitLocked(){ return state.vitals.fatigue >= FATIGUE_GAIT_LOCK; }

  // recovery Energy surcharge; mode "normal" is the ordinary awake state.
  function recoveryStep(dt, mode){
    if(isExertionDelayActive()){ applyEnergyBaseline(dt, 1); return; }
    const cap = staminaMaxForEnergy();
    if(state.vitals.stamina < cap){
      const rate = mode === "rest"
        ? REST_STAMINA_RATE
        : BASELINE_STAMINA_RATE * energyRecoveryMultiplier() * (1 - hungerThirstRecoveryPenalty());
      state.vitals.stamina = Math.min(cap, state.vitals.stamina + rate*dt);
      applyEnergyBaseline(dt, mode === "rest" ? 1 : 2);
    } else if(fatigueRecoveryAllowed()){
      state.vitals.fatigue = Math.max(0, state.vitals.fatigue - FATIGUE_RECOVERY_RATE*dt);
      applyEnergyBaseline(dt, mode === "rest" ? 1 : 4);

    }

  // The Energy ceiling this Sleep can reach: Fatigue caps how much rest is
  // worth. Read by doSleep(), estimateSleepMinutes() and sleepRestoresEnergy().
  function sleepEnergyCeiling(){ return clamp(100 - state.vitals.fatigue); }
  // Sleep is unavailable for two separate reasons, kept separate so
  // RENDERING can say which one applies. sleepRestoresEnergy() is false
  // whenever the Sleep would restore nothing — including at Fatigue 100,
  // where the ceiling is 0 and no Energy is ever below it. That state is
  // worked off through recoveryStep() instead, which is the intended price
  // of never handing out a free Fatigue wipe for a zero-length Sleep.
  function sleepOffCooldown(){ return state.totalMinutes >= state.lastWakeMinute + SLEEP_COOLDOWN_MIN; }
  function sleepRestoresEnergy(){ return state.vitals.energy < sleepEnergyCeiling(); }
  function sleepAvailable(){ return sleepOffCooldown() && sleepRestoresEnergy(); }
  function estimateSleepMinutes(){
    const missing = Math.max(0, sleepEnergyCeiling() - state.vitals.energy);
    return missing / SLEEP_ENERGY_RATE;
  }
  // Advances awake game time in <=1-minute steps so the Stamina/Fatigue
  // recovery delay (exactly 1 game minute) and the Energy-driven recovery
  // bands are evaluated at natural resolution instead
  // of being approximated over an arbitrarily long jump.
  function runAwakeStep(min){
    let remaining = min;
    while(remaining > 1e-9){
      const dt = Math.min(1, remaining);

  // Collapsing at zero Energy. Every COLLAPSE_BLACKOUT_EVERY-th collapse is

  const COLLAPSE_BLACKOUT_EVERY = 3;
  const COLLAPSE_BLACKOUT_MIN = 300;
  const COLLAPSE_BLACKOUT_ENERGY = 90;    // Energy set to, not added

  function ensureHeatContainer(room, id, name, capacityKg){

  // ==================================================
  // PERSISTENCE
  // ==================================================
  // Save format: { version, state, world, doors, windows }. _uid is not

  // every item location after a load so newly-created items during the next
  // session keep getting unique ids, and ensureUid() lazily assigns one to

  function serializeGame(){ return JSON.stringify({ version: GAME_CONFIG.VERSION, state, world, doors, windows }, null, 2); }
  function resyncUidCounter(){
    let maxSeen = 0;
    const scanList = (list)=> (list || []).forEach(it=>{
      if(it && it._uid){
        const n = parseInt(String(it._uid).replace(/^u/, ""), 10);
        if(!isNaN(n) && n > maxSeen) maxSeen = n;

    });

      const room = world[roomId];
      scanList(room.floor);

  function backfillItemIds(){
    const nameToId = {};
    Object.keys(ITEM_REGISTRY).forEach(id=>{ nameToId[ITEM_REGISTRY[id].name] = id; });

      if(it && !it.itemId && nameToId[it.name]) it.itemId = nameToId[it.name];

  function backfillLocationIds(){
    const defaults = makeDefaultWorld();

  // defeating the roll entirely rather than just mistiming it. The net
  // effect: an old save's already-populated container doesn't become
  // eligible for an auto-roll it was never meant to get, and a still-empty
  // one does get a chance to roll on next open.
  function backfillContainerFields(){
    const defaults = makeDefaultWorld();
    Object.keys(world).forEach(roomId=>{
      const room = world[roomId];
      const defaultRoom = defaults[roomId];
      if(!room || !defaultRoom) return;
      const scan = (containers, defaultContainers)=>{
        (containers || []).forEach(c=>{
          const dc = (defaultContainers || []).find(x=>x.id===c.id);
          if(!dc || !dc.spawnPools) return;
          if(c.spawnPools === undefined) c.spawnPools = dc.spawnPools;
          if(c.spawnRolled === undefined) c.spawnRolled = dc.spawnRolled;
        });
      };
      scan(room.containers, defaultRoom.containers);
      // No car container carries spawnPools today, so this second scan
      // can copy nothing — kept for a car container that gains one later,
      // since scan() already returns early when there is nothing to copy.
      scan(room.carContainers, defaultRoom.carContainers);

  // validateLoadedWorld(): the shape check a load must pass before anything
  // is committed. Unlike validateItemRegistry()/validateLocations() below,
  // which are dev-only console helpers, this is wired into a real code path
  // and runs on every load — hence its place here in PERSISTENCE beside the
  // backfills rather than in the dev-helper block.
  //
  // It covers exactly the shapes that make resyncUidCounter(), the three
  // backfills or render() throw, and no more. This is a shape check, not a
  // schema validator: a save that is merely out of date is the backfills'
  // problem, and they run only once this has passed. Returns an array of
  // problem strings, empty on success — the shape its two siblings use.
  function validateLoadedWorld(nextWorld, nextState){
    const problems = [];
    Object.keys(nextWorld).forEach(roomId=>{
      const room = nextWorld[roomId];
      if(!room){ problems.push(`${roomId}: room is missing`); return; }
      if(!Array.isArray(room.floor)) problems.push(`${roomId}: floor is not an array`);
      if(!Array.isArray(room.exits)) problems.push(`${roomId}: exits is not an array`);
      if(!Array.isArray(room.containers)) problems.push(`${roomId}: containers is not an array`);
      // carContainers is optional on a room and stays optional — only a
      // present one is checked.
      if(room.carContainers !== undefined && !Array.isArray(room.carContainers)){

      }

    }

      const bag = nextState[slot];
      if(bag && !Array.isArray(bag.items)) problems.push(`state.${slot}: no items array`);
    });
    return problems;
  }
  // A load is all-or-nothing: the four module bindings are assigned only
  // once the incoming data has passed validateLoadedWorld(). A save that
  // fails leaves the running session exactly as it was, so the player can
  // keep playing — the old order committed `world` first and a throw in a
  // backfill left a half-loaded world on screen with no way back but
  // Restart.
  // backfillRoomAddresses(): third companion to backfillLocationIds(), run
  // alongside it on every load. roomLabel() now composes from `address`, a
  // field no save made before it shipped carries — without this, every room in
  // such a save renders "undefined, ...". It keys off `address === undefined`
  // rather than falsiness: an address is never empty, and `undefined` is what
  // distinguishes "this save predates the field" from any other state. It
  // copies all four label fields rather than just `address`, because this is
  // not a pure field addition — `building`'s meaning narrowed, and six rooms
  // moved their name out of `room`, so restoring `address` alone would leave
  // cornerstore reading "Main St, Corner Store, Corner Store". All four are
  // static content that nothing mutates at runtime (roomLabel() is their only
  // reader), so taking them wholesale from the defaults is both safe and the
  // only version that produces a correct label. `shelter` gets no backfill:
  // nothing reads it, so an old save's rooms lacking it changes nothing.
  function backfillRoomAddresses(){
    const defaults = makeDefaultWorld();
    Object.keys(world).forEach(roomId=>{
      const room = world[roomId];
      if(room && room.address === undefined && defaults[roomId]){
        room.address  = defaults[roomId].address;
        room.building = defaults[roomId].building;
        room.area     = defaults[roomId].area;
        room.room     = defaults[roomId].room;
      }
    });
  }
  // backfillSlotItemIds(): fourth companion to backfillItemIds(), run
  // alongside it on every load. Saves written before equipment slots carried
  // itemId hold a slot object built by hand from an item's fields — so
  // countInPools() cannot see the equipped bag by id, and unequipping it
  // would take doUnequip()'s fallback branch and rebuild it by hand again.
  // This assigns itemId by reverse name match against ITEM_REGISTRY, the way
  // backfillItemIds() does for items and sound for the same reason: current
  // registry names are unique. The keychain matches nothing and is left
  // alone, which is correct — it is not a found item and has no registry
  // entry to point at.
  function backfillSlotItemIds(){
    const nameToId = {};
    Object.keys(ITEM_REGISTRY).forEach(id=>{ nameToId[ITEM_REGISTRY[id].name] = id; });
    CONTAINER_SLOTS.forEach(slotKey=>{
      const slot = state[slotKey];
      if(slot && !slot.itemId && nameToId[slot.name]) slot.itemId = nameToId[slot.name];
    });
  }
  // backfillIllnessScale(): sixth companion to backfillItemIds(), run
  // alongside it on every load. Instances written before illnessChance became
  // a fraction carry it as a percent (raw_fish shipped 35). A value above 1 is
  // a percent by construction — a legal fraction can never exceed 1 — so the
  // test is unambiguous and dividing by 100 is exact. Without this, every raw
  // fish in an imported pre-0.6 save would be a guaranteed illness, since 35
  // exceeds every value rollValue() can return. It descends into `contents`,
  // which the other backfills do not: an unequipped bag carries its items
  // there, and a fish stowed in one would otherwise surface unrepaired the
  // moment the bag is equipped again.
  function backfillIllnessScale(){
    const scan = (list)=> (list || []).forEach(it=>{
      if(!it) return;
      if(typeof it.illnessChance === "number" && it.illnessChance > 1){
        it.illnessChance /= 100;
      }
      if(Array.isArray(it.contents)) scan(it.contents);
    });
    invPools().forEach(scan);
    Object.keys(world).forEach(roomId=>{
      const room = world[roomId];
      scan(room.floor);
      (room.containers || []).forEach(c=>scan(c.items));
      (room.carContainers || []).forEach(c=>scan(c.items));
    });
  }
  function applyLoadedData(data){
    if(!data || !data.state || !data.world || !data.world[data.state.currentRoom]){
      log("That save doesn't look valid — nothing was loaded.", "warn");
      return false;
    }
    if(!data.version){
      log("This save has no version tag (from an older build) — it may not load correctly.", "warn");
    } else if(versionCompat(data.version) !== versionCompat(GAME_CONFIG.VERSION)){
      log(`This save is from v${data.version}, this build is v${GAME_CONFIG.VERSION} — it may not load correctly.`, "warn");
    }
    // A save predating a state field inherits its default here — which is
    // how a pre-0.6 save gets `seed` (a fresh one: its unopened containers
    // roll from it) and `rollSeq`.
    const base = makeDefaultState();
    const nextState = { ...base, ...data.state, vitals: { ...base.vitals, ...(data.state.vitals || {}) } };
    const nextWorld = data.world;
    const nextDoors = data.doors || doors;
    const nextWindows = data.windows || windows;
    const problems = validateLoadedWorld(nextWorld, nextState);
    if(problems.length){
      console.warn("applyLoadedData: save rejected", problems);
      log("That save doesn't look valid — nothing was loaded.", "warn");
      return false;
    }

    world = nextWorld;
    doors = nextDoors; windows = nextWindows;

    gameOver = false;

    worldTab = "floor";

    // above and are left there: nothing reads them, and deleting two named
    // keys would imply a schema check this load path deliberately does not
    // perform — validateLoadedWorld() validates only the shapes that would
    // throw.
    // The backfills are repair passes for old-but-well-formed saves. They
    // run after validation, never before: they are not what makes a
    // malformed save safe.
    resyncUidCounter();

    backfillSlotItemIds();
    backfillLocationIds();
    backfillContainerFields();
    backfillRoomAddresses();
    backfillIllnessScale();

  // validateItemRegistry(): dev-only console helper (not wired to any
  // button or UI, runs nothing automatically). Walks RECIPES/HEAT_RECIPES
  // inputs/outputs and confirms every id they reference resolves in
  // ITEM_REGISTRY, logging any that don't. Call it as
  // `ashfallDev.validateItemRegistry()` from the browser console when
  // auditing recipe/registry consistency (see the dev seam at the foot of
  // this file).
  //
  // It also flags any ITEM_REGISTRY entry whose `illnessChance` is not a
  // fraction in [0,1] — a registry fact, so the registry's validator checks
  // it. chance() would clamp such a value at runtime, loudly; this catches it
  // before anyone eats one.
  function validateItemRegistry(){
    const missing = [];
    Object.keys(ITEM_REGISTRY).forEach(id=>{
      const p = ITEM_REGISTRY[id].illnessChance;
      if(p !== undefined && !(Number.isFinite(p) && p >= 0 && p <= 1))
        missing.push(`ITEM_REGISTRY.${id}.illnessChance: ${p} is not a number in [0,1]`);
    });

      r.inputs.forEach(inp=>{ if(!ITEM_REGISTRY[inp.id]) missing.push(`RECIPES[${r.id}].inputs: ${inp.id}`); });
      if(!ITEM_REGISTRY[r.output.id]) missing.push(`RECIPES[${r.id}].output: ${r.output.id}`);
    });
    HEAT_RECIPES.forEach(r=>{
      if(!ITEM_REGISTRY[r.input]) missing.push(`HEAT_RECIPES[${r.id}].input: ${r.input}`);
      if(!ITEM_REGISTRY[r.output.id]) missing.push(`HEAT_RECIPES[${r.id}].output: ${r.output.id}`);
    });
    if(missing.length) console.warn("validateItemRegistry: problems", missing);
    else console.log("validateItemRegistry: all recipe ids resolve in ITEM_REGISTRY, every illnessChance is in [0,1]");

  // validateLocations(): dev-only console helper (not wired to any button
  // or UI, runs nothing automatically), modeled on validateItemRegistry().

  // LOCATIONS. Call it as `ashfallDev.validateLocations()` from the browser
  // console when auditing.
  function validateLocations(){
    const missing = [];
    Object.keys(world).forEach(roomId=>{
      const room = world[roomId];
      if(!room.locationId) missing.push(`${roomId}: no locationId set`);
      else if(!LOCATIONS[room.locationId]) missing.push(`${roomId}: locationId "${room.locationId}" does not resolve in LOCATIONS`);
    });
    if(missing.length) console.warn("validateLocations: unresolved rooms", missing);
    else console.log("validateLocations: every room resolves a locationId");
    return missing;
  }
  // validateRoomSchema(): dev-only console helper (not wired to any button or
  // UI, runs nothing automatically), sibling to validateLocations(). Walks
  // every room in world and reports a missing `address`, a missing `shelter`,
  // or a `shelter` outside the three legal values. A helper is enough here
  // because both failures are loud: a missing address renders "undefined" in
  // the location bar of the room you are standing in, on the first frame.
  // Call it as `ashfallDev.validateRoomSchema()` from the browser console
  // when auditing.
  function validateRoomSchema(){
    const legalShelter = ["none", "partial", "full"];
    const problems = [];
    Object.keys(world).forEach(roomId=>{
      const room = world[roomId];
      if(!room.address) problems.push(`${roomId}: no address set`);
      if(room.shelter === undefined) problems.push(`${roomId}: no shelter set`);
      else if(!legalShelter.includes(room.shelter)) problems.push(`${roomId}: shelter "${room.shelter}" is not one of ${legalShelter.join("/")}`);
    });
    if(problems.length) console.warn("validateRoomSchema: rooms with schema problems", problems);
    else console.log("validateRoomSchema: every room has an address and a legal shelter");
